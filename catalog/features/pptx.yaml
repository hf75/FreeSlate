# PowerPoint (PPTX) feature catalog, level 2.
#
# Curated by hand. `dotnet run --project tools/SpecTools -- features` checks every element reference against the
# format catalog (level 1), measures coverage and writes pptx.md and pptx.json next to this file.
#
# Per feature:
#   id          area id + "." + name; stable, used by code, tests and status tracking
#   title       short name
#   description what the feature is (optional)
#   elements    qualified element names from the format catalog; * and ? are wildcards in the local name
#   namespaces  namespace prefixes whose elements all belong to the feature
#   priority    P0 needed for typical decks, P1 common, P2 occasional, P3 rare or editor-only
#   difficulty  1 direct mapping to HTML/CSS/SVG ... 5 research project
#   status      todo | partial | done
#   strategy    how the engine renders it
#   office      what PowerPoint actually does, where that matters for fidelity (only verified facts)

document: pptx
title: PowerPoint (PPTX)
description: >-
  Rendering target: one HTML document per presentation with fixed-size, absolutely positioned slides. Shapes with
  their geometry, fills, lines and effects become SVG; text is measured and broken into lines by our own layout
  engine and emitted as positioned glyph runs; slide shows (transitions, animations, media) run in a small JS player.

universe:
  roots: [p:presentation, p:sld, p:sldLayout, p:sldMaster, p:notesMaster, p:notes, p:handoutMaster,
          p:cmLst, p:cmAuthorLst, p:tagLst, p:presentationPr, p:viewPr, p:sldSyncPr, p:oleObj,
          a:theme, a:themeOverride, a:tblStyleLst, a:tbl, lc:lockedCanvas,
          c:chartSpace, c:userShapes, c:chart, cx:chartSpace, cx:chart, cs:chartStyle, cs:colorStyle,
          dgm:dataModel, dgm:layoutDef, dgm:styleDef, dgm:colorsDef, dgm:relIds, dsp:drawing,
          p188:cmLst, p188:authorLst, m:oMathPara, m:oMath,
          ap:Properties, op:Properties, cp:coreProperties, ct:Types, pr:Relationships, ds:datastoreItem]
  namespaces: [p14, p15, p1510, p159, p16, p166, p1710, p173, p184, p188, p202, p223, p228, p232, pc, pc2, pc226,
               psez, pslz, psuz, iact,
               a14, a15, a16, a1611, a3danim, aanim, aclsh, adec, ahyp, aif, alf, am3d, ask, asl, asvg, msink, oac,
               pic14, thm15,
               c14, c15, c16, c16ac, c16r2, c16r3, cdr14, cs, cx, dgm14, dgm1611, dgm1612, dsp,
               v, o, pvml]
  exclude: [w, wp, w10, w14, w15, x, xvml, xdr]

areas:

  - id: package
    title: Package and compatibility
    description: ZIP container, relationships, markup compatibility and metadata.
    features:
      - id: package.opc
        title: Package, content types and relationships
        elements: [ct:Types, ct:Default, ct:Override, pr:Relationships, pr:Relationship]
        priority: P0
        difficulty: 1
        status: done
        strategy: >-
          Open XML SDK on System.IO.Packaging. Parts are found through relationships, never by path; tolerate unusual
          part names, missing optional parts and external (linked) targets.
        office: >-
          Verified: every corpus deck opens through its relationships, the password-protected ones too
          (generated/encrypted-agile and encrypted-standard 98.3 %).

      - id: package.mce
        title: Markup compatibility and extension lists
        description: mc:AlternateContent, mc:Ignorable and the extLst/ext mechanism every newer feature uses.
        elements: [a:extLst, a:ext, p:extLst, p:ext, c:extLst, c:ext, cx:extLst, cx:ext, cs:extLst, dgm:extLst,
                   dsp:extLst, a14:extLst, a3danim:extLst, aanim:extLst, alf:extLst, am3d:extLst, ask:extLst,
                   asl:extLst, oac:extLst, p14:extLst, p15:extLst, p1510:extLst, p188:extLst, p202:extLst,
                   p223:extLst, p228:extLst, pc:extLst, pc226:extLst, pic14:extLst, psez:extLst, pslz:extLst,
                   psuz:extLst, thm15:extLst, cdr14:extLst]
        priority: P0
        difficulty: 2
        status: done
        strategy: >-
          Take the first mc:Choice whose Requires prefixes we implement, else mc:Fallback; honour mc:Ignorable.
          Dispatch a:ext and p:ext on their uri (a GUID) to the handler of the extension; skip unknown ones.
        office: >-
          PowerPoint writes newer features twice: the new markup in mc:Choice (e.g. Requires="p14") and an
          older equivalent in mc:Fallback, e.g. p14 transitions fall back to p:fade, 3D models and zoom
          objects to a picture. Verified with the p14 transitions, a14 equations, cx charts and zoom objects
          of the corpus (generated/slideshow, charts-more, presentation).

      - id: package.compatibility
        title: Compatibility leftovers
        description: Properties Office keeps for older versions or for converted VML content.
        elements: [a14:hiddenFill, a14:hiddenLine, a14:hiddenEffects, a14:hiddenScene3d, a14:hiddenSp3d,
                   a14:compatExt, a14:shadowObscured, a14:useLocalDpi, a14:cameraTool]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered; preserved for round-trips in the editor.

      - id: package.encryption
        title: Encrypted and write-protected files
        elements: [p:modifyVerifier, p1710:readonlyRecommended]
        priority: P2
        difficulty: 3
        status: done
        strategy: >-
          Password-protected files are OLE compound files with an EncryptedPackage stream ([MS-OFFCRYPTO], agile
          encryption): ask for the password and decrypt before parsing. Write protection only matters to an editor.
        office: >-
          A password-protected presentation is a compound file ([MS-CFB]) with an EncryptedPackage stream that
          EncryptionInfo describes ([MS-OFFCRYPTO]). Agile encryption (version 4.4: spun SHA-1 to SHA-512
          password hash, a package key sealed with it, AES-CBC in 4096-byte segments) and standard encryption
          (version x.2: AES-128/192/256 keyed by 50 000 SHA-1 spins, ECB) are decrypted with the password
          given to the converter; without one, Office's default password VelvetSweatshop is tried, and
          PasswordException tells a missing password from a wrong one. Write protection (p:modifyVerifier) and
          the read-only recommendation (p1710:readonlyRecommended) do not change how the presentation shows
          and only matter to an editor. Checked with generated/encrypted-agile (encrypted by PowerPoint) and
          generated/encrypted-standard (written by the fidelity tool, opened by PowerPoint).

      - id: package.properties
        title: Document properties
        namespaces: [ap, op, cp, vt]
        priority: P3
        difficulty: 1
        status: done
        strategy: Metadata only; title, author and language go into the HTML head.

      - id: package.customXml
        title: Custom XML parts
        namespaces: [ds]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered; preserved for round-trips.

      - id: package.ids
        title: Object ids and co-authoring revisions
        elements: [a16:creationId, a16:predDERef, a16:cxnDERefs, a16:colId, a16:rowId, p14:creationId, p14:modId]
        namespaces: [p1510, oac, pc, pc2, pc226]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered. Stable creation ids help to match objects between slides (Morph) and in the editor.

  - id: presentation
    title: Presentation and slide structure
    description: Slides, masters and layouts, placeholders, backgrounds, settings.
    features:
      - id: presentation.slides
        title: Slide list and slide size
        elements: [p:presentation, p:sldIdLst, p:sldId, p:sldMasterIdLst, p:sldMasterId, p:notesMasterIdLst,
                   p:notesMasterId, p:handoutMasterIdLst, p:handoutMasterId, p:sldSz, p:notesSz]
        priority: P0
        difficulty: 1
        status: done
        strategy: >-
          Slides in p:sldIdLst order. Sizes are in EMU (914400 per inch) and are rendered at 96 dpi, so the
          widescreen default 12192000 × 6858000 EMU becomes 1280 × 720 px; the viewer scales the slides to fit.

      - id: presentation.hiddenSlides
        title: Hidden slides
        description: p:sld/@show="0".
        priority: P1
        difficulty: 1
        status: done
        strategy: Skipped in the slide show, shown dimmed in the overview.

      - id: presentation.masters
        title: Slide masters, layouts and slides
        elements: [p:sld, p:sldLayout, p:sldMaster, p:sldLayoutIdLst, p:sldLayoutId, p:cSld, p:spTree]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Draw the master's and the layout's non-placeholder shapes behind the slide's own shapes unless showMasterSp
          is off on the layout or slide; then the slide's shapes in document order.
        office: >-
          Placeholders on layouts and masters are prompts for the editor and are never drawn on slides; only
          the slide's own placeholders are. Verified with generated/presentation (98.0 %); collapse,
          matchingName, preserve, userDrawn and showMasterPhAnim are editing state.

      - id: presentation.placeholders
        title: Placeholders and inheritance
        elements: [p:ph, p:nvPr]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Match a slide placeholder to the layout placeholder by idx alone (0 when missing), a layout placeholder to
          the master placeholder by type. Position, geometry, fill, line, body properties and list styles are
          inherited along that chain, property by property; the master's text style follows the type of the layout
          placeholder matched.
        office: >-
          Measured with the object model on a Title and Content layout (placeholders of 24 type and idx
          combinations without positions of their own): slide placeholders match layout placeholders by idx
          alone, 0 when it is missing, whatever their types. p:ph without idx and with type body, dt, ftr,
          sldNum, pic or subTitle takes the title's place and title style; type title with idx 1 takes the
          content placeholder's place, size and bullets. A placeholder whose idx the layout lacks inherits from
          no placeholder at all, not even the master's of its type: it has no position, and only the master's
          text style of its own type applies (dt and sldNum at 18 pt, black and left-aligned instead of the
          master placeholders' 12 pt gray). The idx 4294967295 (-1) stands for none: such placeholders match
          by type (sldNum, ftr and dt take their layout placeholders' places at 12 pt gray, body the object
          placeholder's), and without a layout placeholder of their type the master's (on a blank layout,
          title and body take the master's places, while a title without idx or with idx 20 takes none). Among
          several layout placeholders of the same idx the slide placeholder takes the first in the layout's
          tree, whatever the types (LibreOffice writes titles and subtitles without idx: its tdf160487's subtitle
          takes the layout title's place and title style, and the subtitle's where the layout lists the subtitle
          first). Verified with generated/presentation and text-basic; hasCustomPrompt, isPhoto and userDrawn are
          editing state.

      - id: presentation.colorMap
        title: Color mapping
        elements: [p:clrMap, p:clrMapOvr, a:masterClrMapping, a:overrideClrMapping]
        priority: P0
        difficulty: 2
        status: done
        strategy: bg1/tx1/bg2/tx2 map to dk1/lt1/dk2/lt2 through the master's clrMap or a layout or slide override.
        office: >-
          The master's p:clrMap maps all twelve names (accents and hyperlink colors too), a layout's or
          slide's overrideClrMapping replaces it; a chart keeps its own c:clrMapOvr against the slide's
          mapping, for its text as well (measured with generated/colormap: dark mapping with swapped accents).

      - id: presentation.background
        title: Slide background
        elements: [p:bg, p:bgPr, p:bgRef, a15:backgroundPr]
        priority: P0
        difficulty: 2
        status: done
        strategy: >-
          The slide's background, else the layout's, else the master's. bgRef idx 1001 and above index the theme's
          bgFillStyleLst, lower values its fillStyleLst; the reference color replaces phClr.
        office: >-
          Verified with generated/fills, colormap and presentation; bwMode, shadeToTitle and a15:backgroundPr
          only matter for black and white or legacy printing.
          Without a background on slide, layout and master the slide shows the color bg1 maps to
          (LibreOffice's layout-clrmap-override: a layout mapping bg1 to dk1 gives its slides a black
          background). A bgRef's picture fill names a picture of the theme part (Apache POI's themes deck).

      - id: presentation.headerFooter
        title: Header, footer, date and slide number
        elements: [p:hf]
        priority: P1
        difficulty: 2
        status: done
        strategy: p:hf flags on master, layout and slide decide whether the dt, ftr and sldNum placeholders are shown.
        office: >-
          Only footer placeholders that exist on the slide itself are drawn; their slide number and date fields are
          recomputed when the slide is shown.

      - id: presentation.sections
        title: Sections
        elements: [p14:sectionLst, p14:section, p14:sldIdLst, p14:sldId]
        priority: P2
        difficulty: 1
        status: done
        strategy: Group slides in the viewer's navigation; sections are not drawn.

      - id: presentation.customShows
        title: Custom shows
        elements: [p:custShowLst, p:custShow, p:sldLst]
        priority: P3
        difficulty: 2
        status: done
        strategy: Alternative slide sequences, selectable in the player and reachable through action links.
        office: >-
          The player lists the custom shows and runs them from ppaction://customshow links
          (generated/slideshow).

      - id: presentation.notes
        title: Notes pages and speaker notes
        elements: [p:notes, p:notesMaster, p:notesStyle]
        priority: P2
        difficulty: 2
        status: done
        strategy: Speaker notes text for the presenter view; full notes pages only for printing.
        office: >-
          Speaker notes show in the presenter view with their levels, bold, italic, underline and links; notes
          pages (p:notesMaster, p:notesStyle) are a print layout and not rendered.

      - id: presentation.handouts
        title: Handout master
        elements: [p:handoutMaster]
        priority: P3
        difficulty: 2
        status: done
        strategy: Print layout only; not rendered.

      - id: presentation.showSettings
        title: Slide show settings
        elements: [p:presentationPr, p:showPr, p:present, p:browse, p:kiosk, p:sldAll, p:sldRg, p:penClr, p:prnPr,
                   p:htmlPubPr, p:webPr, p:clrMru, p14:browseMode, p14:showMediaCtrls, p14:defaultImageDpi,
                   p14:discardImageEditData]
        priority: P3
        difficulty: 1
        status: done
        strategy: Loop, kiosk mode, slide range and pen color configure the player; print and web settings are ignored.

      - id: presentation.viewSettings
        title: Editor view settings
        elements: [p:viewPr, p:normalViewPr, p:restoredLeft, p:restoredTop, p:slideViewPr, p:cSldViewPr, p:cViewPr,
                   p:origin, p:scale, p:guideLst, p:guide, p:outlineViewPr, p:notesTextViewPr, p:sorterViewPr,
                   p:notesViewPr, p:gridSpacing, p15:sldGuideLst, p15:notesGuideLst, p15:guide, p15:clr,
                   p15:chartTrackingRefBased, a:sx, a:sy]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered; zoom, guides and grid settings for the editor.

      - id: presentation.tags
        title: Tags and customer data
        elements: [p:tags, p:tagLst, p:tag, p:custDataLst, p:custData, p:smartTags]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered; preserved for round-trips (add-ins store their data here).

      - id: presentation.misc
        title: Photo album, slide library and Designer metadata
        elements: [p:photoAlbum, p:sldSyncPr, p16:designElem, p202:designPr, p202:designTag, p202:designTagLst,
                   asl:scriptLink]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered.

  - id: theme
    title: Themes and styles
    features:
      - id: theme.colors
        title: Theme color scheme
        elements: [a:theme, a:themeElements, a:clrScheme, a:dk1, a:lt1, a:dk2, a:lt2, a:accent?, a:hlink, a:folHlink]
        priority: P0
        difficulty: 1
        status: done
        strategy: Twelve named colors; scheme colors in shapes resolve through the color map to these.

      - id: theme.fonts
        title: Theme fonts
        elements: [a:fontScheme, a:majorFont, a:minorFont, a:font]
        priority: P0
        difficulty: 2
        status: done
        strategy: >-
          +mj-lt, +mn-lt, +mj-ea, +mn-ea, +mj-cs and +mn-cs resolve to the major/minor fonts; the a:font entries
          choose fonts per script (Jpan, Hans, Arab, Hebr …) when the language of the run needs them.
        office: >-
          Verified with generated/text-basic, text-eastasian and text-rtl.

      - id: theme.formatScheme
        title: Theme formats (style matrix)
        elements: [a:fmtScheme, a:fillStyleLst, a:lnStyleLst, a:effectStyleLst, a:effectStyle, a:bgFillStyleLst]
        priority: P0
        difficulty: 2
        status: done
        strategy: Three fills, lines and effects (plus background fills) per theme, used through style references.
        office: >-
          Verified with generated/fills, outlines and effects (style matrix references).
          Picture fills of the style matrix (textures in bgFillStyleLst) name pictures of the theme part or of
          a theme override, not of the slide (Apache POI's themes deck).

      - id: theme.styleRefs
        title: Shape style references
        elements: [p:style, a:style, a:lnRef, a:fillRef, a:effectRef, a:fontRef, pic14:style]
        priority: P0
        difficulty: 2
        status: done
        strategy: >-
          Resolve idx into the theme lists; the reference's color replaces phClr in the referenced style. fontRef
          supplies the default text color and theme font of the shape.
        office: >-
          Shapes inserted in PowerPoint usually carry no direct fill or line but a p:style, so without style
          resolution they come out invisible or black. Verified with generated/geometry-presets, fills and
          outlines (inserted shapes carry only p:style).
          Fills and lines resolve level by level from the shape up through its layout and master placeholders,
          each level's own spPr before its own p:style: a slide title's style fill and line beat the master
          title's explicit noFill (Apache POI's customGeo deck).

      - id: theme.override
        title: Theme overrides
        elements: [a:themeOverride]
        priority: P2
        difficulty: 1
        status: done
        strategy: A layout or slide can override parts of the theme (usually the color scheme).

      - id: theme.editorData
        title: Object defaults, extra and custom colors
        elements: [a:objectDefaults, a:spDef, a:lnDef, a:txDef, a:extraClrSchemeLst, a:extraClrScheme, a:custClrLst,
                   a:custClr, a:clrMap, thm15:themeFamily]
        priority: P3
        difficulty: 1
        status: done
        strategy: Defaults for new objects and color picker entries; only relevant to an editor.

  - id: color
    title: Colors
    features:
      - id: color.models
        title: Color models
        elements: [a:srgbClr, a:schemeClr, a:sysClr, a:prstClr, a:hslClr, a:scrgbClr]
        priority: P0
        difficulty: 1
        status: done
        strategy: >-
          Resolve to sRGB plus alpha. sysClr uses its lastClr, prstClr the named colors, scrgbClr is linear RGB.
        office: >-
          Verified with generated/fills and colormap (99.7 %).

      - id: color.transforms
        title: Color transforms
        elements: [a:alpha, a:alphaMod, a:alphaOff, a:lum, a:lumMod, a:lumOff, a:tint, a:shade, a:sat, a:satMod,
                   a:satOff, a:hue, a:hueMod, a:hueOff, a:red, a:redMod, a:redOff, a:green, a:greenMod, a:greenOff,
                   a:blue, a:blueMod, a:blueOff, a:gray, a:inv, a:comp, a:gamma, a:invGamma]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Apply in document order. lumMod/lumOff work in HSL, tint and shade most likely in linear RGB; every
          transform is to be checked against PowerPoint renderings.
        office: >-
          Verified with generated/fills, colormap and smartart (theme color variations). gamma applies the sRGB
          gamma shift (encodes) and invGamma its inverse, so the gamma, shade, invGamma that converted PowerPoint
          97 decks write shades in sRGB: 0066CC at 46.275 % is 002F5E (Apache POI's 45541 decks).

  - id: shape
    title: Shapes and geometry
    features:
      - id: shape.basic
        title: Shapes
        elements: [p:sp, p:nvSpPr, p:cNvSpPr, p:spPr, a:sp, a:nvSpPr, a:cNvSpPr, a:spPr]
        priority: P0
        difficulty: 2
        status: done
        strategy: Each shape is an absolutely positioned element with an SVG for geometry, fill, line and effects plus a text layer.
        office: >-
          Axis-aligned rectangles and lines are drawn without antialiasing: every edge goes to the nearest
          pixel (fills and outlines at fractional positions), which crispEdges reproduces. p:sp/@useBgFill
          fills the shape with the slide's background, aligned to the slide (generated/colormap). bwMode only
          matters for grayscale printing. Verified across the corpus.

      - id: shape.accessibility
        title: Names, alt text, hidden and decorative shapes
        elements: [p:cNvPr, a:cNvPr, adec:decorative]
        priority: P1
        difficulty: 1
        status: done
        strategy: hidden="1" shapes are not drawn; descr and title become aria-label/title; decorative shapes get aria-hidden.

      - id: shape.transform
        title: Position, size, rotation and flip
        elements: [a:xfrm, p:xfrm, a:off, a:ext, a:chOff, a:chExt]
        priority: P0
        difficulty: 2
        status: done
        strategy: One CSS/SVG matrix per shape; rotation is in 60000ths of a degree, flips mirror around the center.
        office: flipH does not mirror the text, flipV turns it by 180°.

      - id: shape.group
        title: Groups
        elements: [p:grpSp, p:nvGrpSpPr, p:cNvGrpSpPr, p:grpSpPr, a:grpSp, a:nvGrpSpPr, a:cNvGrpSpPr, a:grpSpPr,
                   a15:nonVisualGroupProps, a14:isCanvas, lc:lockedCanvas]
        priority: P0
        difficulty: 2
        status: done
        strategy: >-
          Map child coordinates (chOff/chExt) to the group box and compose the rotations and flips of all ancestors
          into one matrix per leaf shape.
        office: >-
          A child turned by 45 to 135 degrees (or 225 to 315) lies across a squeezed group: its width scales with the
          group's height and its height with the width, about its center (LibreOffice's tdf141463_GroupTransform:
          a child turned by 80 degrees in a group squeezed to two thirds of its height).
          A group's own effects (its p:grpSpPr's a:effectLst) PowerPoint does not draw (external/poi/60810 slide 22: a
          group's 18 pt glow and its shadow; drawn, 90.0 → 89.5 %), where Word draws them on the whole group (docx
          drawing.groups). A locked canvas (lc:lockedCanvas in a graphic frame) is drawn like a picture of its DrawingML
          shapes: the box around them stretched over the frame together with their lines and text, shapes in groups
          counting by their own boxes mapped through their groups (docx/external/libreoffice/extras-ooxmlimport/
          fdo43641: a group reaching past its rectangle and connector, 5.4 → 91.9 %), a turned shape by its
          geometry as turned, flipped first (measured in Word with docx/local/lcv-*, lcw-*: two shapes stretched
          over frames of other sizes and shapes, offset, in a stretching group; a rectangle turned by 30, 60, 90 and
          308 degrees by its turned corners, an ellipse turned by 45 by its curve, a text box's text not counted;
          tdf143476_lockedCanvas_position: a text box turned by 308 degrees, 74.4 → 93.7 %), its own group transform
          unused, text without a font in Arial (generated/objects-more). a14:isCanvas and
          a15:nonVisualGroupProps only mark groups for editing. Verified with generated/transforms (99.3 %)
          and objects-more.

      - id: shape.presetGeometry
        title: Preset geometries
        description: 187 preset shapes (rect, roundRect, arrows, callouts, flowchart symbols, stars …).
        elements: [a:prstGeom, a:avLst, a:gd]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          One formula engine evaluates presetShapeDefinitions.xml (adjust values, guides, paths) into SVG paths, so
          every preset comes from data instead of hand-written code.
        office: >-
          The ECMA data file has no upArrow and lists upDownArrow twice (see the format catalog); upArrow has
          to be added and checked against PowerPoint. The pie's text rectangle is il, it, ir, ib in PowerPoint,
          where the data file swaps its top and right (LibreOffice's tdf149918_pie_textarea). All 187 presets
          verified with generated/geometry-presets (99.3 %), upArrow from presetShapeSupplement.xml.

      - id: shape.customGeometry
        title: Custom geometry (freeforms)
        elements: [a:custGeom, a:gdLst, a:ahLst, a:ahXY, a:ahPolar, a:cxnLst, a:cxn, a:pos, a:rect, a:pathLst, a:path,
                   a:moveTo, a:lnTo, a:arcTo, a:quadBezTo, a:cubicBezTo, a:close, a:pt]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          The same formula engine. arcTo angles have to be converted to SVG arcs; path fill modes darken/lighten
          shade the fill; paths with their own w/h are scaled to the shape. Handles and connection sites are editor-only.
        office: >-
          PowerPoint fills all paths of a geometry before it strokes any of them (measured with overlapping
          paths: the outline of the first path lies on the fill of the second, also for an outline-only path
          saved before a fill-only one); the document does the same where the order matters (presets
          chartPlus, chartStar, chartX, sketched shapes). In paths with their own w/h, arcTo angles are visual
          angles in the path's coordinates, before it is stretched to the shape (measured: clouds of other
          proportions than the 43200-unit square). Subpaths of a path fill alternately, a hole where two overlap
          (LibreOffice's custgeom-overlapping-contours); an arcTo sweep goes round at most once (tdf122323: 400
          degrees end where they start). Verified with generated/geometry-presets and sketched; adjust handles
          (a:ahXY, a:ahPolar) and connection sites are editor-only.

      - id: shape.connectors
        title: Connectors
        elements: [p:cxnSp, p:nvCxnSpPr, p:cNvCxnSpPr, a:cxnSp, a:nvCxnSpPr, a:cNvCxnSpPr, a:stCxn, a:endCxn]
        priority: P1
        difficulty: 2
        status: done
        strategy: >-
          Draw the stored geometry (straight, bent and curved connector presets with their adjust values); the
          editor recomputes routes only when connected shapes move.
        office: >-
          Verified with generated/objects; a:stCxn and a:endCxn only matter when the editor reroutes.

      - id: shape.graphicFrame
        title: Graphic frames
        elements: [p:graphicFrame, p:nvGraphicFramePr, p:cNvGraphicFramePr, a:graphicFrame, a:nvGraphicFramePr,
                   a:cNvGraphicFramePr, a:graphic, a:graphicData]
        priority: P0
        difficulty: 1
        status: done
        strategy: Container for tables, charts, SmartArt and OLE objects; dispatch on graphicData/@uri.
        office: >-
          Verified with tables, charts, SmartArt, OLE objects and locked canvases in the corpus.

      - id: shape.locks
        title: Locks
        elements: [a:spLocks, a:grpSpLocks, a:picLocks, a:cxnSpLocks, a:graphicFrameLocks, a14:cpLocks]
        priority: P3
        difficulty: 1
        status: done
        strategy: Editor-only.

      - id: shape.sketched
        title: Sketched outlines
        namespaces: [ask]
        priority: P2
        difficulty: 4
        status: done
        strategy: >-
          The hand-drawn outline styles (curved, freehand, scribble) perturb the geometry with a seeded random
          function; matching PowerPoint needs its exact algorithm, a close look-alike is easy.
        office: >-
          PowerPoint saves a sketched shape as the hand-drawn paths it derives from the original geometry and
          the seed: a custom geometry with an outline-only path (fill=none) followed by a fill-only path
          (stroke=0), and keeps the original geometry, the style and the seed (sd) in ask:lineSketchStyleProps
          in the outline's extension list. Opening a file it draws the sketch anew from those, which gives the
          saved paths again (checked through PowerPoint's own saved and re-exported decks), so the document
          draws the saved paths, fills before outlines, and lays out the text in the text rectangle of the
          original geometry (triangles and ellipses keep their inset text). A sketch on a preset geometry is
          dropped by PowerPoint, which then draws the sketch's original geometry (nothing if it has none); a
          sketch of the style none or without an original geometry leaves the custom geometry. Paths of a
          custom geometry that a third party saved with sketch properties but other than PowerPoint's are
          drawn as saved, while PowerPoint replaces them with its own (unpublished, seeded) sketch. Checked
          with generated/sketched (curved, freehand and scribble on five presets with text, without fill, with
          gradient fill, dashes, shadow, rotation and flips).

      - id: shape.classification
        title: Sensitivity label markings
        elements: [aclsh:classification, p184:classification]
        priority: P3
        difficulty: 1
        status: done
        strategy: Shapes added by sensitivity labels; drawn like normal shapes, the marker itself is metadata.

  - id: fill
    title: Fills
    features:
      - id: fill.solid
        title: No fill and solid fill
        elements: [a:noFill, a:solidFill]
        priority: P0
        difficulty: 1
        status: done
        strategy: SVG fill color and opacity.

      - id: fill.gradient
        title: Gradient fills
        elements: [a:gradFill, a:gsLst, a:gs, a:lin, a:path, a:tileRect, a:fillToRect]
        priority: P1
        difficulty: 3
        status: done
        strategy: >-
          SVG linear and radial gradients in the bounds of the geometry's filled paths (lin angle with scaled,
          rotWithShape); circle paths map to radial gradients, rect paths to four trapezoids, path="shape" to
          bands of the outline. Browsers interpolate in sRGB, so the engine adds intermediate stops computed in
          linear light.
        office: >-
          Measured with gradient strips and PowerPoint's own EMF export: a two-color gradient (stops at 0 and
          1) and a symmetric three-color gradient (A, B, A) use a GDI+ sigma bell blend (normal distribution
          CDF, sigma 0.25, normalized to 0 to 1) mixed in linear light; all other gradients interpolate
          linearly in sRGB. Rectangular path gradients are concentric rectangles from fillToRect to tileRect.
          Path gradients that follow the shape (path=shape) repeat the shape's filled outline in bands scaled
          from the tile rectangle to the focus rectangle, mixed in sRGB (measured with local/pathgrad:
          concentric ellipses, stars, triangles, hearts, parallelograms). 64 presets (block arrows, callouts
          with tails, ribbons, scrolls, waves, donut, moon, smiley face, sun …) draw such a gradient exactly as
          a circle gradient (measured: all 187 presets filled both ways; the binary format's
          fFillShadeShapeOK flag); custom geometries follow their outline. Every gradient spans the bounds of
          the geometry's filled paths rather than the shape's box (a block arc's band shows the whole
          gradient), and darkened or lightened paths shade the gradient's colors like a solid fill's (the
          faces of cans, cubes and bevels; local/pathgrad3: 99.2 %, local/pathgrad_all: 98.6 %).
          A gradFill without gsLst takes the stops of the style's gradient (fillRef) in its own direction
          (Apache POI bug 63200). A gradient that does not turn with its shape (rotWithShape 0) keeps the
          slide's directions through its groups' turns and flips too (openxml-sdk's o09_Performance_typical). A
          slide background shaded to the title (p:bgPr shadeToTitle) has its path gradient's focus on the title
          placeholder's box, as the slide, its layout or its master places it (LibreOffice's sd/tdf114848 slide 5:
          white under the master's title, D1C39F at the slide's edges; the deck 86.9 → 90.4 %). A rectangular path
          gradient with translucent stops lets through what lies under it, also between its sides (LibreOffice's
          oox/tdf139618_ImportWordArtGradient: WordArt from transparent accent1 at a corner to opaque, 87.1 → 98.8
          %).

      - id: fill.pattern
        title: Pattern fills
        elements: [a:pattFill, a:fgClr, a:bgClr]
        priority: P2
        difficulty: 2
        status: done
        strategy: The preset patterns as small SVG patterns in foreground and background color.
        office: >-
          The tiles lie on the slide's pixels whatever the shape's turn, also in an outline (LibreOffice's
          tdf107608).

      - id: fill.picture
        title: Picture and texture fills
        elements: [a:blipFill, a:blip, a:srcRect, a:stretch, a:fillRect, a:tile, p:blipFill, pic:blipFill]
        priority: P1
        difficulty: 2
        status: done
        strategy: >-
          SVG image clipped to the geometry: stretched into the fillRect insets, or repeated through an SVG pattern
          for tiles (offset, scale, alignment, flip).
        office: >-
          Tiles are sized from the picture's own resolution; PowerPoint ignores blipFill dpi (measured).
          Verified with generated/pictures and fills; a:blip cstate (compression) does not change the picture.
          A shape's blipFill without stretch or tile is tiled at the picture's own size (LibreOffice
          tdf128596); pictures keep stretching. Slide backgrounds, group fills and table cells tile at the
          picture's own size too (LibreOffice tdf152070: a 300 dpi tile at 60 x 70 %).

      - id: fill.group
        title: Group fill
        elements: [a:grpFill]
        priority: P2
        difficulty: 1
        status: done
        strategy: Use the fill of the parent group.
        office: >-
          Verified with generated/fills.

  - id: line
    title: Lines and outlines
    features:
      - id: line.basic
        title: Outline width and color
        elements: [a:ln]
        priority: P0
        difficulty: 2
        status: done
        strategy: SVG stroke; widths are in EMU (12700 per point); inset alignment clips a doubled stroke.
        office: >-
          PowerPoint draws an outline in whole pixels, at least one (round(W px); measured with local/lw-probe and
          local/cap-probe, outlines of 0.25 to 6 pt at quarter- and eighth-pixel offsets). On a shape that is not
          turned, an axis-aligned outline's every edge is rounded to the nearest pixel boundary on its own (half
          up), the stroke covering floor(n / 2) pixels before it and the rest after; any other path is stretched
          with its box, whose edges are rounded so, and only moved along a side that would round to nothing
          (LibreOffice's fdo47434: connectors sloping by 0.02 px keep their slope). A curved path's outline of two
          pixels or more misses one of PowerPoint's antialiasing samples on its left and top sides: the first
          pixel there is 7/8 covered along a row and 3/4 down a column, also on round-capped lines (sd-data/theme
          88.9 → 98.6 %). Nearly level or upright straight lines are antialiased where PowerPoint's samples see
          them, as table borders are (table.cells). Word's drawings keep their exact widths and places. Verified
          with generated/lines and outlines (99.0 %).

      - id: line.dash
        title: Dash styles
        elements: [a:prstDash, a:custDash, a:ds]
        priority: P1
        difficulty: 2
        status: done
        strategy: stroke-dasharray in multiples of the line width.
        office: >-
          Preset dashes and custom patterns (a:custDash, a:ds: dash and space in thousandths of a percent of
          the line width) repeat in units of the line's width in whole pixels (measured: a 4 pt line, 5.33 px,
          repeats a 3:1 pattern every 20 px; a 1.5 pt line every 8 px). On a closed figure the pattern starts
          where the closing segment starts, the figure's last point, and runs through the closing segment
          first: a rectangle starts at its bottom left corner and runs up, a triangle at its bottom right
          corner, an ellipse at its left (measured with probe decks of one long dash on 24 presets and on
          freeforms); open figures start at their first point. Round caps lie within the dashes, and a round
          dash is at least one width long (a 0.5:2 pattern repeats every 3 widths); on closed figures the
          dashes cover [0, d) of the pattern, on open lines they lie half a width earlier, where the line's
          cap begins. Square caps do not cap the dashes, which end flat at their full length: only an open
          line's start gets the cap, and its end when it lies within a dash. Measured with
          generated/lines-dash (five custom patterns at 1.5, 4 and 8 pt on lines, rectangles and ellipses
          with flat, round and square caps): 89.7 %, the rest a pixel at the ends of the dashes and the drift
          of PowerPoint's curves along ellipses. Word starts the pattern elsewhere in its documents' drawings: on a
          rectangle that is not turned, which it writes as a PDF rectangle, at the bottom left corner along the
          bottom, on every other figure at its first point (measured by agent BK on Word's PDFs; LibreOffice's
          extras-ooxmlexport/fdo73247, a rectangle turned 33 degrees, from its top left corner to the right, 89.2 →
          97.1 %; textbox_picturefill 91.4 → 96.5 %, LineStyle_DashType 98.0 → 99.5 %, shape-theme-preservation
          96.7 → 100 %).

      - id: line.joinCap
        title: Joins and caps
        elements: [a:round, a:bevel, a:miter]
        priority: P1
        difficulty: 1
        status: done
        strategy: stroke-linejoin, stroke-miterlimit and stroke-linecap.
        office: >-
          Verified with generated/lines and outlines.

      - id: line.ends
        title: Arrowheads
        elements: [a:headEnd, a:tailEnd]
        priority: P1
        difficulty: 3
        status: done
        strategy: >-
          Triangle, stealth, diamond, oval and open arrow heads as paths sized relative to the line width, with the
          line shortened under the head.
        office: >-
          Heads are multiples of the line width but never smaller than a 2 pt line's (measured: medium heads 6 pt
          wide on lines of 0.25 to 2 pt, three widths beyond; LibreOffice's fdo47434). A head points along the
          nearest leg that has a length; on an arc along its tangent, the arc pulled back along itself
          (LibreOffice's tdf113187_arcTo_withoutReferences 57.7 → 90.1 %). Verified with generated/lines
          (arrowhead types, widths and lengths).

      - id: line.compound
        title: Compound lines
        description: a:ln/@cmpd (double, thick-thin, thin-thick, triple).
        priority: P2
        difficulty: 3
        status: done
        strategy: Several parallel strokes or a stroke with a mask.

      - id: line.fill
        title: Gradient and pattern outlines
        description: gradFill and pattFill inside a:ln.
        priority: P2
        difficulty: 3
        status: done
        strategy: SVG gradient or pattern as stroke paint.
        office: >-
          Gradient outlines take the gradient over the shape's box like fills (arrowheads too); pattern
          outlines draw the pattern itself, its 8 px tiles aligned to the slide like pattern fills
          (generated/outlines).

  - id: effect
    title: Effects
    features:
      - id: effect.list
        title: Effect lists
        elements: [a:effectLst]
        priority: P1
        difficulty: 2
        status: done
        strategy: The effects of a list are applied in a fixed order; build one SVG filter chain per shape.
        office: >-
          Verified with generated/effects (99.1 %) and effects-dag.

      - id: effect.outerShadow
        title: Outer shadow
        elements: [a:outerShdw]
        priority: P1
        difficulty: 3
        status: done
        strategy: SVG filter with blur (blurRad), offset (dist, dir), scaling, skew and alignment; CSS drop-shadow where it suffices.
        office: >-
          A shadow is the shape scaled and skewed about its alignment point (algn, bottom center by default)
          with [sx, tan kx; tan ky, sy], the skew not scaled, then moved by dist along dir and blurred (σ =
          0.35 blurRad). With rotWithShape 0, as PowerPoint writes its shadows, the offset and the transform
          stay on the slide, about the box around the turned shape (measured with generated/effects). Verified
          with generated/effects and probe/shadow, probe/rotshadow. The outline's outer half casts its shadow too
          (docx/external/libreoffice/extras-ooxmlexport/n705956-2: a 3 pt outline's shadow was cut at the box), and so
          does geometry beyond the shape's box (docx/external/libreoffice/extras-ooxmlexport/
          tdf41466_testVmlShapeWithTextbox: a callout's tail 40 pt beside its box, 85.4 → 94.2 %).

      - id: effect.innerShadow
        title: Inner shadow
        elements: [a:innerShdw]
        priority: P2
        difficulty: 3
        status: done
        strategy: SVG filter inside the shape's alpha.
        office: >-
          The shape's outside, blurred (σ = 0.35 blurRad) and moved against dir, colored and kept inside the
          shape; the filter region reaches beyond the shape by the distance and the blur so that the outside
          exists to cast it. Verified with generated/effects and local/innershadow (offsets 3 to 12 pt, blur 0
          to 8 pt: 100 %).

      - id: effect.presetShadow
        title: Preset shadows
        elements: [a:prstShdw]
        priority: P3
        difficulty: 3
        status: done
        strategy: The 20 preset shadows as parameter sets of the shadow filters.
        office: >-
          Verified with generated/effects.

      - id: effect.glow
        title: Glow
        elements: [a:glow]
        priority: P2
        difficulty: 3
        status: done
        strategy: Dilate and blur the shape's alpha, colored.
        office: >-
          Verified with generated/effects. The glow grows from the shape's whole silhouette, also where its fill is
          mostly transparent (Word's PDF of LibreOffice's extras-ooxmlexport/fdo66688: a 5 pt glow around a white fill
          of 20 % alpha as strong as around an opaque one, 86.7 → 99.9 %). It grows round, as a disc dilates: corners
          and slanted edges no further out than straight ones (measured in Word's PDFs, docx effect.glow; local/textfx5
          99.3 → 99.9 %, generated/objects 98.8 → 99.3 %, generated/effects 99.2 → 99.5 %, generated/text-effects 96.1
          → 96.4 %); SVG dilates by rectangles only, so the union of four whose corners lie on the circle.

      - id: effect.softEdge
        title: Soft edges
        elements: [a:softEdge]
        priority: P2
        difficulty: 3
        status: done
        strategy: Erode and blur the alpha mask.
        office: >-
          Verified with generated/effects.

      - id: effect.reflection
        title: Reflection
        elements: [a:reflection]
        priority: P2
        difficulty: 4
        status: done
        strategy: Mirrored copy with distance, blur and a gradient alpha mask.
        office: >-
          The copy is scaled and skewed like a shadow about algn, moved by dist along dir, faded along fadeDir
          (90° by default) across the copy from stA at stPos to endA at endPos and blurred; with rotWithShape
          0 the turned shape is mirrored on the slide (measured with generated/effects). Verified with
          generated/effects and probe/refl.

      - id: effect.blur
        title: Blur and fill overlay
        elements: [a:blur, a:fillOverlay]
        priority: P3
        difficulty: 2
        status: done
        strategy: SVG Gaussian blur; fill overlay blends a fill over the shape.
        office: >-
          Blur: a Gaussian blur with sigma = rad / 3 (measured); without grow the result is cut at the
          outline's outer edge, with grow it spreads beyond. Fill overlay: the overlay fill is blended over
          the shape's fill only, not its outline (over, mult, screen, darken, lighten as CSS blend modes in an
          isolated group).

      - id: effect.dag
        title: Effect containers (effect DAG)
        elements: [a:effectDag, a:cont, a:effect, a:alphaOutset, a:blend, a:relOff, a:fill]
        priority: P3
        difficulty: 4
        status: done
        strategy: Effect graphs with containers and blends; rare outside themes from Office 2007.
        office: >-
          PowerPoint draws an effect graph instead of the shape (measured with generated/effects-dag, 97.2 %):
          its input is the whole shape with its text; a container of type sib draws its children's outputs
          over each other, type tree feeds each child the previous output; an empty container draws nothing,
          while a graph without any effect leaves the shape as it is. a:effect ref brings in the fill, the
          line, fill and line with the text (fillLine), or a named container's output. Every effect outputs
          only its own result: an outer shadow or glow without the shape, a reflection without the original,
          alphaOutset grows the alpha with black, fill paints the input's alpha (gradients through a mask),
          relOff and xfrm move it, the color effects work as on pictures. blend draws its container's output
          over the input in a blend mode, over being overlay (measured to two levels), mult multiply and so
          on; fillOverlay likewise with a fill. Drawn as nested SVG groups, filters, masks and mix-blend-mode.

      - id: effect.scene3d
        title: 3D scene (camera and light)
        elements: [a:scene3d, a:camera, a:lightRig, a:rot, a:backdrop, a:anchor, a:norm, a:up]
        priority: P2
        difficulty: 5
        status: done
        strategy: >-
          The camera turns and projects the shape: a CSS matrix3d for the front face with its text, SVG polygons for
          the body. The light rig lights every face with Lambert diffuse and Phong highlights, fitted per rig.
        office: >-
          Measured on generated/three-d: the presets' angles and fields of view (30 cameras, corners within
          0.4 pt; the eye stands 907.5 pt / 2 / tan(fov / 2) in front of the shape); oblique presets shear by
          0.3 of the depth (legacy ones 0.5), legacy perspective presets by 0.133 per axis. Legacy oblique
          cameras with a rotation of their own turn the scene before they shear it, their light rig staying with
          the viewer under the turns about the horizontal and vertical axes and turning along in the picture
          plane (LibreOffice's Scene3d_legacyObliqueBottomRight 51.5 to 97.3 %, Scene3d_lightRig_legacyCamera
          41.2 to 98.4 %); how modern oblique cameras turn is not measured yet (Scene3d_obliqueTopRight). All 27 light rigs
          were fitted on extruded cubes, cylinders and tilted bevels rendered in two base colors (rms below
          0.03, brightRoom 0.05); dir turns a rig in 45° steps clockwise, a:rot turns it further. sp3d z moves
          the shape along its own axis (perspective enlarges it, turned cameras shift it). Shadows and glow of
          3D shapes come from the body's back as the camera sees it (the glow half as wide), soft edges do not
          apply. A backdrop (a:backdrop) takes the shadow and glow instead: the flat shape's picture lies in
          that plane with its x along up × normal and its y along the up vector, its corner at the anchor less
          half the shape's size (scene coordinates as DrawingML's: y down, z towards the viewer), the shadow
          moved by its distance along the scene's x and y, behind the body when the plane lies behind it, else
          over its sides (fitted to glow and shadows on walls and floors of both orientations with perspective
          and isometric cameras within 3 px; local/backdrop, backdrop2, backdrop3: 98.3 to 98.6 %). The
          shape's text casts its shadow there too, over the shape's own and darker where they overlap, as its
          plain glyphs without effects of their own (local/bdtext: a floor plane shows the text in the
          shadow). Oblique cameras turn the scene by their rotation (a:rot) before they shift it; the shape's own
          rotation turns the projected picture, its depths' shift along, the faces lit as unturned, where the other
          cameras turn the shape in its plane (local/oblique-rot: an extruded box under obliqueTopRight turned by
          lat, lon and rev alone and together, every variant 99.7 to 100 %; LibreOffice's
          oox/Scene3d_obliqueTopRight 36.0 → 99.9 %). A light rig's rotation turns its lights about the horizontal
          axis by lat first, then the vertical axis by lon, then the view axis by rev (LibreOffice's
          oox/Scene3d_lightRig_rot_rotation, a harsh rig turned by lat 315° and lon 330°: 81.0 % the other way
          round, 98.8 %).

      - id: effect.shape3d
        title: 3D shape (bevel, extrusion, material)
        elements: [a:sp3d, a:bevelT, a:bevelB, a:bevel, a:extrusionClr, a:contourClr]
        priority: P2
        difficulty: 5
        status: done
        strategy: >-
          Bevels (top and bottom, measured profiles), extrusion, back face and contour are built as SVG polygons,
          sorted back to front and lit with the rig and the material; the front face is drawn by the camera.
        office: >-
          Measured on generated/three-d: bevel profiles from edge-on silhouettes (they scale with width and
          height independently; a bevel is at most half the smaller side wide), relaxedInset with the groove its
          shading shows behind its crest, 0.4 of the height lower from 0.8 of the width on (found by an agent in
          Word's pictures of 3D text; generated/three-d, tables-more and the backdrop decks a little closer); the front face lies in the
          shape's plane, the top bevel's outline its height behind it, then the extrusion and the bottom
          bevel. The shape's line is part of the body: the body reaches to the line's outer edge, the sides
          take the line's color unless extrusionClr is set, and so do the outer band of the bevels and of the
          back. The contour is an unlit tube of contourW (black by default) around the rims, creases and
          silhouettes; a face coming towards the eye covers all but r·cos α of its inner half, and the body
          moves back so that the tube does not reach in front of the shape's plane. Materials were fitted
          against threePt, the latest on cubes from 25 sides on black and gray slides (local/cubes-*, within
          1 to 3.5 levels rms): matte without highlights, plastic and metal with stronger and tighter ones,
          metals partly tinted, the legacy materials' and the powders' from the half vector; metals, dkEdge,
          softEdge and the powders fade towards the silhouette, metals, softEdge and the powders whiten there
          ((1 − n·v)^3.8 for metal and softEdge), powder mixes half white into the surface color; flat ignores
          the light's direction; legacyWireframe draws every mesh edge, hidden ones included. clear and
          translucentPowder are translucent, the same in every channel: clear most transparent facing the eye
          (opacity 1 − 0.9 n·v), translucentPowder towards the silhouette (0.7 n·v); only faces towards the
          eye are drawn, the highlights add in full (the color brightens by highlight / opacity and saturates
          at white) and text on the front face stays opaque (local/clear, clearA-C). Without a body (no
          extrusion, bevel or contour) the powders show warmMatte's light with their broad highlights only, no
          pastel look and nothing towards the silhouette (local/powder, matflat1-2). Pictures and gradients
          keep their texture on the bevel. An extruded frame (a shape with a hole) shows the walls of its hole
          (LibreOffice's Scene3d_lightRig_*), and PowerPoint draws a wireframe in the line's color and width
          (Scene3d_material_wireframe). A body without fill has no faces of its own: no bevels and no back, its
          sides only in the extrusion's or the line's color (seen from within too where the front is open), and its
          line and text cast its shadow and glow as on a flat shape; without either it shows nothing
          (local/nofill3d; LibreOffice's sd-data/n819614, a SmartArt shape with noFill, no line, a bevel and a
          shadow, 89.9 → 93.5 %). The back of a body seen from behind shows its fill, the line's color only on its
          outer band (the band and the fill sorted together); under twoPt it takes the ambient light alone, 0.25 of
          its fill, under threePt and balanced the rigs' lights (local/backlight: donuts seen from behind under six
          rigs and turns; LibreOffice's oox/Scene3d_material_highlight 64.3 → 95.8 %).

  - id: picture
    title: Pictures and media
    features:
      - id: picture.basic
        title: Pictures
        elements: [p:pic, p:nvPicPr, p:cNvPicPr, a:pic, a:nvPicPr, a:cNvPicPr, pic:pic, pic:nvPicPr, pic:cNvPr,
                   pic:cNvPicPr, pic:spPr]
        priority: P0
        difficulty: 2
        status: done
        strategy: SVG image with crop (srcRect; negative values pad) and the shape's geometry as clip path.
        office: >-
          Verified with generated/pictures (99.5 %). A picture without its picture (an a:blip naming none, or
          a part the package lacks) shows PowerPoint's sign: a 1-pixel #6D6D6D frame on its edge, the
          broken-picture icon 6 pixels in and "The picture can't be displayed." in Office's language ("Das
          Bild kann nicht angezeigt werden."; Apache POI's missing-blip-fill, LibreOffice's tdf147586); the
          player words it in the viewer's language.

      - id: picture.formats
        title: Raster image formats
        description: The content type behind a:blip/@r:embed.
        priority: P1
        difficulty: 3
        status: done
        strategy: >-
          PNG, JPEG, GIF, BMP, SVG and WebP natively (also when the package names another content type); TIFF
          decoded (strips or tiles; uncompressed, PackBits, LZW, Deflate with prediction, CCITT group 3/4,
          JPEG; bilevel, gray, palette, RGB(A), CMYK; 1-16 bit) and converted to PNG, JPEG-compressed TIFF
          merged into one JPEG (Huffman re-coding where strips use different tables); color profiles carried
          along; JPEG XR decoded by our own decoder after ITU-T T.832 (spatial and frequency order, tiles, all
          overlap modes, 4:2:0, 4:2:2 and 4:4:4, gray, CMYK, n-channel, 1 to 32-bit integer, fixed and
          floating point, RGBE, interleaved and separate alpha, orientation) and converted to PNG.
        office: >-
          PowerPoint keeps TIFF pictures as inserted (also CCITT and JPEG compressed ones) and honors embedded
          ICC profiles (PNG, JPEG, TIFF; verified with a swapped-primaries profile); profile-less CMYK shows
          through a 9^4 table measured from PowerPoint's rendering (harvest-cmyk). Pattern tiles of stretched
          pictures reach a margin with the edge pixels repeated, so edges no longer blend with the opposite
          edge. Inserted .jxr/.wdp pictures stay JPEG XR, but PowerPoint names .jxr parts image/png (the
          extension's default), so pictures are told apart by their bytes. The JPEG XR decoder matches
          Windows' own (WIC) sample for sample on 44 files of its encoder in all its options (frequency and
          spatial order, tiles, overlap 0-2, subsampling, quality, without flexbits, highpass or lowpass,
          separate and interleaved alpha, rotations; gray, bilevel, 565, 555, 101010, 16-bit, float, CMYK):
          the highpass prediction direction comes from the lowpass coefficients before dequantization (the
          order of steps in 9.4 would take them after), centred chroma is upsampled with the taps (-2, 9, 28,
          -3) / 32 (4:2:0 in both directions before one rounding), packed formats swap red and blue unless
          RED_BLUE_NOT_SWAPPED. Only WIC's own 8-bit conversion of 10-bit, 16-bit and floating point samples
          differs by 1 at most. hdphoto parts of artistic effects (a14:imgLayer) are originals; the blip holds
          the rendered result. Deck: picture-formats 99.9 % (slide 2: ten JPEG XR pictures).
          The bytes count, not the name: a PNG stored as .emf (image/x-emf) shows as the PNG (LibreOffice's
          graphic-stroke).

      - id: picture.metafiles
        title: EMF and WMF pictures
        priority: P1
        difficulty: 5
        status: done
        strategy: Our own EMF/EMF+/WMF interpreter that emits SVG ([MS-EMF], [MS-EMFPLUS], [MS-WMF]).
        office: >-
          EMF and WMF are frequent in real decks (icons, content pasted from Excel or Visio, older charts). The
          interpreter draws the GDI records (lines, curves, PolyDraw, shapes, paths, regions, clipping with
          OffsetClipRgn and meta regions, world and page transforms, text, BitBlt, StretchBlt, MaskBlt, PlgBlt,
          DIB transfers, AlphaBlend, TransparentBlt, gradient fills, hatch and pattern brushes in output
          pixels) and the EMF+ records of dual and EMF+ only files (fills and outlines with solid, hatch,
          texture, linear and path gradient brushes, paths, regions, images, strings, driver strings,
          containers, transforms, clips). Logical palettes are played: CreatePalette, SelectPalette,
          SetPaletteEntries, ResizePalette and AnimatePalette, PALETTEINDEX colors and DIB_PAL_COLORS bitmaps
          against the selected palette (the default one has the 20 static colors), PALETTERGB as its own color
          (local/palette, EMF and WMF). Monochrome pattern brushes (EMF CreateMonoBrush, WMF
          DIBCREATEPATTERNBRUSH with BS_PATTERN) paint in the text and background colors as GDI does, not in their
          palette's black and white (measured with the previews of ActiveX toggle buttons and scroll bars, whose
          dithers PowerPoint draws in the control's colors). A bitmap's negative width or height reaches from
          its origin the other way, its first column or row at the origin, as in GDI's StretchBlt (LibreOffice's
          tdf149206: an EMF named .wmf whose screenshot sits 750 x -600 under a window turned upside down, 29.2 to
          83.5 %). EMF text aligned by its top or bottom (TA_TOP, TA_BOTTOM) stands by GDI's ascent and descent of
          the font realized in whole pixels of the metafile's device (lfHeight -ppem): the VDMX record of the size
          for the Windows ANSI character set, else usWinAscent and usWinDescent scaled and rounded (measured with
          GDI's GetTextMetrics: Arial, Times New Roman, Courier New, Segoe UI and Verdana by their VDMX, Calibri and
          Cambria rounded, Tahoma's VDMX for all glyphs not used; Word's PDFs: Arial at 13 px 13 px below the
          reference point, Calibri at 15 px 14 px, LibreOffice's tdf99631 in Word 89.4 → 98.8 %; PowerPoint:
          poi/at.ecodesign.www_downloads_Vertiefungsvortrag_elektronik slides 21 and 25 0.4 and 1.6 points better).
          WMF text keeps the unrounded ascent (not measured). 8-bit text reads in its font's character set: Cyrillic
          (204) as Windows-1251, Central European (238) as 1250 and so on, symbol fonts byte by byte, the rest as
          Windows-1252 (Word's PDF of LibreOffice's fdo58949: Equation.3 previews with lfCharSet 204 print "НВВ",
          83.9 → 95.8 %). Flood fills are not drawn, as PowerPoint draws none (measured); escapes
          draw nothing, color management records leave the colors as they are, and OpenGL records are not
          drawn. Verified
          with generated/metafiles (PowerPoint's EMF and WMF exports, GDI+ dual and GDI-only recordings, GDI
          records: 96.2 %; hatches come out smoothed in Chromium where GDI sets whole pixels). In WMF too an icon's
          monochrome mask ANDed (SRCAND) and its image XORed at the same place (SRCINVERT) make one image, opaque
          where the mask is black, as in EMF (tika's testWPSAttachment: nine OLE icons were black boxes, 72.9 → 90.6
          %; poi/bug64693 92.4 → 94.5 %).

      - id: picture.svg
        title: SVG pictures
        elements: [asvg:svgBlip]
        priority: P0
        difficulty: 1
        status: done
        strategy: Use the SVG part; the surrounding a:blip holds a PNG fallback.
        office: >-
          Verified with generated/pictures.

      - id: picture.effects
        title: Picture color effects
        elements: [a:alphaBiLevel, a:alphaCeiling, a:alphaFloor, a:alphaInv, a:alphaMod, a:alphaModFix, a:alphaRepl,
                   a:biLevel, a:blur, a:clrChange, a:clrFrom, a:clrTo, a:clrRepl, a:duotone, a:grayscl, a:hsl, a:lum,
                   a:tint]
        priority: P1
        difficulty: 3
        status: done
        strategy: >-
          SVG filters (feColorMatrix, feComponentTransfer) or pre-processing in C#. Recolor presets (grayscale,
          washout, duotone with theme colors) and transparency (alphaModFix) are the common ones.
        office: >-
          clrChange matches the alpha too unless useA is 0. Verified with generated/pictures.

      - id: picture.artistic
        title: Artistic effects and picture corrections
        elements: [a14:imgProps, a14:imgLayer, a14:imgEffect, a14:artistic*, a14:brightnessContrast,
                   a14:colorTemperature, a14:saturation, a14:sharpenSoften, a14:backgroundRemoval, a14:backgroundMark,
                   a14:foregroundMark]
        priority: P1
        difficulty: 1
        status: done
        strategy: Draw the main blip.
        office: >-
          PowerPoint saves the processed picture as the main blip and keeps the original in a14:imgLayer, so the
          effect is already baked in.

      - id: picture.media
        title: Audio and video
        elements: [p14:media, p14:trim, p14:fade, p14:bmkLst, p14:bmk, a:videoFile, a:audioFile, a:wavAudioFile,
                   a:quickTimeFile, a:audioCd, a:st, a:end, p173:tracksInfo, p173:trackLst, p173:track,
                   p15:isNarration]
        priority: P1
        difficulty: 3
        status: done
        strategy: >-
          HTML5 video/audio with the picture's blip as poster image; trimming and fades in the player; caption tracks
          as WebVTT.
        office: >-
          Bookmarks (p14:bmkLst) travel with the media element and start the trigger sequences that wait for
          them (p14:bmkTgt, evt onMediaBookmark); caption and subtitle tracks (p173:tracksInfo) become WebVTT
          text tracks of the video; a file's declared media type (contentType) is kept. CD audio (a:audioCd
          with its a:st and a:end track times) cannot play from a document. Online videos (a:videoFile linked
          to a web player such as YouTube's embed page) play in a frame that loads the player only when it
          plays; YouTube refuses to play in a page opened from a file (error 153), so the presenter app
          serves the document over localhost. Verified with generated/media (99.4 %).

      - id: picture.ole
        title: OLE objects, ActiveX controls and signature lines
        elements: [p:oleObj, p:embed, p:link, p:controls, p:control, a15:objectPr, a15:signatureLine]
        priority: P1
        difficulty: 1
        status: done
        strategy: Draw the fallback picture stored with the object.

      - id: picture.ink
        title: Ink
        elements: [p:contentPart, p14:nvContentPartPr, p14:cNvContentPartPr, p14:cNvPr, p14:nvPr,
                   p14:xfrm, a14:contentPart, a14:nvContentPartPr, a14:cNvContentPartPr, a14:cNvPr, a14:xfrm,
                   cdr14:contentPart, cdr14:nvContentPartPr, cdr14:cNvContentPartPr, cdr14:cNvPr, cdr14:nvPr,
                   cdr14:xfrm]
        namespaces: [msink, iact]
        priority: P2
        difficulty: 3
        status: done
        strategy: Use the mc:Fallback picture first; later draw the InkML traces as SVG paths with pressure-dependent width.
        office: >-
          Ink (p:contentPart, Office 2010 markup chosen over the fallback picture) is drawn from its InkML or
          InkActionML part (strokes an action removed left out): the smallest trace coordinates go to the
          part's top left corner; a part as large as its points plus the last brush's width (its natural size,
          as PowerPoint writes it) keeps the ink's scale, any other size stretches the points to fill it;
          stroke widths never scale; a part with a highlighter (rasterOp maskPen) is half transparent as a
          whole. With a pressure channel (F) the width follows the pen: (0.25 + 1.5 F/max) times the brush
          width, tapering smoothly between points, ignorePressure keeps the brush width (measured with
          generated/ink). fitToCurve: PowerPoint draws such a stroke as cubic Beziers fitted to its points,
          one piece for up to five points, with corners where the fit breaks (a stroke following the pen's
          pressure as a polyline through the points moved onto that curve). It is drawn here as the uniform
          cubic B-spline of the points with its ends held: approximating like PowerPoint's fit, corners cut
          inwards, no loops or overshoots; reversals stay corners. Along dense ink both stay within half a
          pixel of the polyline; on sparse points PowerPoint's fit reaches further (a three-point V keeps its
          depth, a zigzag of five becomes one U; local/inkfit, inkfit2-4). Verified with generated/ink (98.8 %)
          and probe/ink.

      - id: picture.model3d
        title: 3D models
        namespaces: [am3d, a3danim]
        priority: P2
        difficulty: 1
        status: done
        strategy: >-
          Show PowerPoint's picture of the model (mc:Fallback); while the slide show animates the model, our own
          glTF 2.0 reader and WebGL2 renderer (model3d.js, only in documents with models) draws it on a canvas
          over the picture, lit and tone mapped like PowerPoint.
        office: >-
          PowerPoint stores the model as GLB (am3d:model3d r:embed) with a rendered picture of it (am3d:raster,
          Office3DRenderer, 2 px per point, also the mc:Fallback picture). The camera (pos, up, lookAt in EMU,
          36,000,000 EMU to the meter) looks at the model; a perspective's fov spans the square objViewport
          (viewportSz) about the frame's center, of which the frame shows its middle, and nothing is drawn
          outside that square. The model's transform: model units to meters (meterPerModelUnit), preTrans,
          scale, rotation about x, then y, then z (60000ths of a degree), postTrans. Lighting, measured with
          generated spheres and mirror balls: a studio environment (a room with windows, reconstructed from the
          mirror balls) for diffuse light and reflections (split sum, GGX), the slide's point lights (candela,
          inverse square, linear scRGB colors) and its ambient light; emissive counts half; base color factors
          are kept in 8 bits; the result goes through PowerPoint's tone curve (s = 1 - exp(-(2.358 u^0.666 +
          1.886 u)) per channel, u in the units in which an unlit material shows its base color). Our renders of
          calibration spheres and boxes are within 1 to 5 of 255 on average; contact shadows (ambient
          occlusion) are not drawn.

      - id: picture.liveFeed
        title: Cameo and live camera feeds
        namespaces: [alf, p232]
        priority: P3
        difficulty: 2
        status: done
        strategy: Show the stored picture; a live camera (getUserMedia) only in the player.

      - id: picture.sources
        title: Picture sources and formulas
        elements: [a1611:picAttrSrcUrl, aif:imageFormula]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered; the picture itself is stored as usual.

  - id: text
    title: Text
    description: >-
      Text decides the fidelity of most slides. The engine measures glyphs with the real fonts and breaks lines
      itself; the browser only draws positioned runs.
    features:
      - id: text.body
        title: Text body and text box
        elements: [p:txBody, a:txBody, a:bodyPr, a:txSp, a:useSpRect, dsp:txXfrm]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          The text box is the geometry's text rectangle minus the insets (default 91440 EMU left/right, 45720
          top/bottom); anchoring top, middle or bottom, anchorCtr, wrap or no wrap, rotation and overflow.
        office: >-
          anchorCtr centers the smallest box around the text, the paragraphs keep their alignment within it;
          vertOverflow ellipsis and clip drop the lines that do not fit whole (ellipsis ends the last line
          kept with …, whole words removed) and the rest is anchored as usual; horzOverflow clip cuts at the
          text rectangle, not at the insets; spcFirstLastPara keeps the space before the first and after the
          last paragraph; compatLnSpc shows no difference (measured with generated/text-body). Compatible line
          spacing (compatLnSpc) leaves PowerPoint's lines where they are (measured: 150 % spacing unchanged);
          forceAA only asks for anti-aliasing. A text area narrower or lower than its insets collapses to its
          middle, x + (w + lIns - rIns) / 2 (measured with the object model: a box 5 pt wide with insets of 10
          and 2 pt sets every line at 6.5 pt whatever its alignment; a box 1 pt high 0.5 pt below its top). A
          placeholder 0 wide does not wrap (one line in footer, body and title placeholders), while text
          boxes, shapes and placeholders 1 pt wide wrap every character (LibreOffice's 0-width-text-wrap).
          Verified with generated/text-body (97.7 %), text-more and objects-more. With anchorCtr a text block wider
          than its area (no wrap, long words) is centered too, reaching out on both sides.

      - id: text.autofit
        title: Autofit
        elements: [a:noAutofit, a:normAutofit, a:spAutoFit]
        priority: P0
        difficulty: 4
        status: done
        strategy: Apply the stored fontScale and lnSpcReduction; with spAutoFit the stored shape size already fits the text.
        office: >-
          PowerPoint saves the shrink factors it computed when the slide was last edited; recomputing them
          yields different line breaks than PowerPoint shows. Without stored factors it does not shrink at
          all, even when normAutofit is inherited and the text overflows (verified with generated/text-basic,
          slide 5). The scaled sizes are whole points, halves rounded up: 26 pt at 90 % is laid out at 23 pt
          and 25 pt at 23 pt, 18 pt at 62.5 % at 11 pt (the object model reports these sizes; generated/text-more,
          slide 5). Verified with generated/text-basic, text-body and text-more.

      - id: text.paragraph
        title: Paragraphs
        elements: [a:p, a:pPr, a:endParaRPr]
        priority: P0
        difficulty: 3
        status: done
        strategy: Alignment (left, center, right, justified, distributed), margins, first-line or hanging indent, levels 0–8.
        office: >-
          fontAlgn t, ctr and b line up the tops, middles or bottoms of runs of different sizes (base and
          auto: the baselines; measured with generated/text-body). A word longer than the line breaks between
          characters, and its trailing spaces hang at the end of its last piece as after any word (measured:
          "縦書き 2024年 AB" in mongolianVert columns one character long takes no column for its spaces,
          generated/text-more slide 3). Verified with generated/text-body, text-rtl and text-eastasian.

      - id: text.spacing
        title: Line and paragraph spacing
        elements: [a:lnSpc, a:spcBef, a:spcAft, a:spcPct, a:spcPts]
        priority: P0
        difficulty: 3
        status: done
        strategy: Line spacing as a percentage of the line height or in points; space before and after.
        office: >-
          Measured with the text-metrics calibration deck (9 fonts, multiples, exact spacing, sizes): single
          line height is 1.2 × the font size for every font, multiples scale it, exact spacing is rounded to
          whole points. At single spacing the baseline sits at 1.2 × size × ascent/(ascent+descent) (typo
          metrics if USE_TYPO_METRICS, else Windows metrics); above single spacing at H × min(0.75, ratio);
          below at max(S × ratio − (S − H), H × min(0.75, ratio)). Lines in fonts of one ratio take the largest
          ascent and descent of their runs. Where the ratios differ, a line is as high as the line of its
          largest font, and its baseline divides that height as the largest ascent and descent of its fonts at
          single spacing divide theirs, among them the line break ending it, or on the paragraph's last line its
          mark (a:endParaRPr, the theme's font where it names none; without a:endParaRPr the last run's Latin
          font), each in its own font at the size of the run before it, its own size counting for nothing
          (measured in PowerPoint's PDF of local/mixfonts-a to -d: two and three fonts at one size and at two,
          at 80, 100 and 150 % and exactly 36 pt, breaks and marks of fonts and sizes of their own, Chinese and
          Latin text, all within 0.1 pt; on screen 307 of 322 lines on PowerPoint's pixel rows, the rest one
          or two rows off; the 37 decks it changes 95.86 -> 95.99 %, LibreOffice's tdf129686 79.0 -> 97.4 %
          and tdf98603 89.1 -> 96.4 %).
          Bullets do not count. Space before is ignored for the first paragraph; percentages of
          space before/after refer to 1.2 × font size. Glyph origins are snapped to device pixels. Verified
          with generated/text-metrics (98.9 %).

      - id: text.tabs
        title: Tab stops
        elements: [a:tabLst, a:tab]
        priority: P1
        difficulty: 2
        status: done
        strategy: Left, center, right and decimal tabs, default tab size from defTabSz.
        office: >-
          Tab stops (a:tabLst, inherited through the list styles like the other paragraph properties) are
          measured from the text area's left edge, the origin of marL: left stops put the text there, center
          stops center it, right stops end it there and decimal stops put its decimal point there (text
          without one ends at the stop); text never moves left of where it already is; past the last custom
          stop the default stops continue at multiples of defTabSz; a hanging first line (negative indent)
          stops at the margin first. Measured with generated/text-tabs (default spacings, every stop kind,
          margins and indents, bullets, centered and right-aligned paragraphs). A tab binds to the word after
          it: a word that does not fit after the tab's stop takes the tab to the next line, and a tab that
          starts a line keeps what fits of the word after its stop, possibly nothing (measured with the object
          model's lines in a 385 pt line of 20 pt Arial: "Text⇥after" with a stop at 380 pt gives "Text", a
          line with only the tab and "after …"; with a stop at 350 pt "Text", "⇥afte", "r …"; a stop past the
          line's end leaves the tab alone on its line; a second tab moves to the next line with its word and
          stops at the first stop there).

      - id: text.bullets
        title: Bullets and numbering
        elements: [a:buAutoNum, a:buBlip, a:buChar, a:buClr, a:buClrTx, a:buFont, a:buFontTx, a:buNone, a:buSzPct,
                   a:buSzPts, a:buSzTx]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Bullet glyph in its own font (Wingdings and Symbol mapped to Unicode or embedded), color and size;
          automatic numbering in 40 schemes (arabic, roman, alphabetic, circled, East Asian, Hebrew, Arabic, Thai …)
          with startAt; picture bullets.
        office: >-
          A hanging indent reaching left of the text area moves the paragraph right (marL 0, indent -27 pt:
          bullet at 0, text at 27 pt). With a first line indented further than the margin the bullet stays at
          the margin and the text starts at the indent (object model: marL 0 and indent 27 pt start the text at
          27 pt; marL 36 and indent 0 right after the bullet; LibreOffice's bullet-indent). Numbering continues
          while the paragraphs before at the level count in the same scheme from the same start, and begins
          anew with another scheme or start (LibreOffice's n90255: 3 4, II III, C D, iv v, f) g) for pairs of
          paragraphs with five schemes). Latin letters repeat after z (aa, bb); Arabic schemes count in hijā'ī
          (arabic1) and abjad (arabic2) order followed by a hyphen-minus; Thai letters skip ฃ ฅ ฆ. Picture
          bullets are 0.7 of the text's size high in any font, as wide as their proportions make them, and sit on
          the baseline; text after one wider than the indent starts right after it (PowerPoint's PDF of LibreOffice's
          tdf114913 in Calibri, Arial and Times New Roman at 14 to 44 pt). A bullet character is the first character
          of buChar/@char (LibreOffice's bnc862510_5 and tdf93830 write two). Verified with generated/lists (all 41
          numbering schemes, picture and character bullets).

      - id: text.styles
        title: List styles and the text style cascade
        elements: [a:lstStyle, a:defPPr, a:lvl?pPr, a:defRPr, p:txStyles, p:titleStyle, p:bodyStyle, p:otherStyle,
                   p:defaultTextStyle]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Run → paragraph → the shape's lstStyle → layout placeholder → master placeholder → the master's title
          or body style for title and body placeholders, the presentation's defaultTextStyle for all other text;
          the shape's fontRef adds color and font. Text outside title and body placeholders skips the master's
          other style except for its color.
        office: >-
          Measured with the object model, otherStyle level 1 at 10 pt bold red Courier New right-aligned with
          150 % spacing and defaultTextStyle at 30 pt italic blue Georgia centered with 80 %: text boxes,
          shapes and dt, ftr and sldNum placeholders without a layout placeholder take size, italics, font,
          spacing, alignment, indent and line spacing from defaultTextStyle and only the color from
          otherStyle (not its bold); table cells take otherStyle. LibreOffice's TextOnCircle (otherStyle 15.12
          pt, defaultTextStyle 18 pt) rises from 43 to 93 %. Title and body placeholders take nothing from
          defaultTextStyle (POI's sample and alterman_security: titles whose style has no kern are not kerned,
          which the default style's kern="1200" would do; 30 such decks agree). A master without p:txStyles, or
          without its title or body style, has PowerPoint's own, Office's default ones: titles at 44 pt in the
          theme's heading font, the levels below the first unset; body text at 28, 24, 20 and 18 pt with bullets
          (• in Arial), indents of 18 pt plus 36 pt a level, 10 and 5 pt before; all kerned from 12 pt at 90 % line
          spacing (measured with the object model and PowerPoint's PDF on variants of LibreOffice's tdf160487);
          an empty style the master has is used as it is (tdf165341: 18 pt). Verified with generated/text-basic,
          text-body and presentation.

      - id: text.runs
        title: Runs and character formatting
        elements: [a:r, a:rPr, a:t, a:br, a:highlight]
        priority: P0
        difficulty: 2
        status: done
        strategy: >-
          Size (hundredths of a point), bold, italic, all caps and small caps, single and double strikethrough,
          superscript and subscript (baseline %), character spacing, kerning threshold, highlight.
        office: >-
          Superscripts and subscripts are drawn at two thirds of the size, raised or lowered by the baseline
          percentage of the full size (measured). Equalized character height (normalizeH) stretches every
          glyph's ink from the baseline to the font's ascent (OS/2 usWinAscent; measured: all letters of 32 pt
          Calibri 40 px tall, descenders lifted); kumimoji keeps digits upright in vertical text. A line break's
          own size (a:br a:rPr) sizes its line only when the line has no other text: a 60 pt break after 20 pt
          text leaves the line 24 pt high, alone it makes it 72 pt (generated/text-more, slide 4). A
          paragraph's own default run properties (a:pPr/a:defRPr) format its runs before the list styles do
          (POI's bug63290: a run without properties in the paragraph's red 40 pt). altLang,
          bmk, dirty, err, noProof, smtClean and smtId are editing state. Verified with generated/text-basic,
          text-underline and text-more. A newline written in a run's text (a:t) breaks the line as a:br does but
          sizes it like the line's other characters (LibreOffice's n828390_2: "Linux" at 20 pt ended by a 24 pt
          run of a newline is a 24 pt line). Underlines and strikethroughs run on through the spaces between words,
          not through spaces ending a line (POI's aascu deck: 'Math Problem Solving' in one piece). A
          strikethrough's top lies the OS/2 strikeout position above the baseline's row of the slide's pixels,
          at least a pixel thick, both taken at the font's size in whole pixels and each rounded; a double one
          is two such lines a thickness above and below the single one's place; each run keeps its own,
          whatever runs beside it (measured with local/ulmix-a and -c: Aptos,
          Calibri, Arial and Times New Roman from 8 to 36 pt, 72 pt beside 12 pt text). A
          presentation without p:defaultTextStyle (as other programs write them) takes PowerPoint's own, Office's
          default: the theme's fonts, kerning from 12 pt and half an inch more indent at every level (LibreOffice
          decks with Calibri text: kerned without any kern attribute; a text box's levels 36 pt apart).

      - id: text.fonts
        title: Fonts per script
        elements: [a:latin, a:ea, a:cs, a:sym]
        priority: P0
        difficulty: 4
        status: done
        strategy: Choose the latin, East Asian or complex-script font per character; resolve theme fonts; see engine.fonts.
        office: >-
          PowerPoint draws every missing font in Calibri, whatever its panose, pitch family or charset say
          (measured with serif, monospaced, script and decorative hints in generated/text-body). Some names
          that are no family's still find one (160 names measured against the installed fonts, in this
          order): a style word run on is dropped (TahomaBold: Tahoma, regular); a name beginning with Arial,
          Helv, Times, Courier, Segoe, Palatino or Lucida Console takes Arial, Arial, Times New Roman, Courier
          New, Segoe UI, Palatino Linotype or Consolas whatever follows (ArialMT, TimesNewRomanPSMT, SegoeUI);
          a trailing " Bold" or " Italic" sets the style (Cambria Bold); a hyphen ends the name (Georgia-Bold:
          Georgia, regular). The free families Liberation Sans, Liberation Serif and DejaVu Sans (also DejaVu
          Sans Mono) take Arial, Times New Roman and Verdana when they are not installed; Liberation Mono,
          DejaVu Serif, Arimo, Tinos, Carlito and Caladea do not (measured by line widths; LibreOffice's
          3d_rotated_text). Other names, also PostScript names such as CambriaMath, become Calibri
          (generated/text-more, slide 7). Characters
          inserted from symbol fonts (stored at U+F000 to U+F0FF) take the run's symbol font (a:sym):
          Wingdings 1 to 3, Symbol and Webdings render with their own glyphs (generated/text-more). A Latin
          font naming the theme's East Asian font (+mn-ea, +mj-ea) where the theme has none stands for the
          theme's font of the East Asian script of the run's language, else of its alternative language
          (local/mixfonts-d: Latin letters with altLang zh-CN drawn in 等线). Text that no style names a font for
          is set in Arial, not in the theme's font (PowerPoint's PDF of LibreOffice's tdf165341, whose master has
          empty title and body styles: its title in Arial 18 pt; so are a text box under a defaultTextStyle without
          fonts and the levels an empty style leaves); chart text in the theme's body font. charset,
          panose and pitchFamily only help find substitutes; fonts are resolved by name. Verified with
          generated/text-basic, text-eastasian, text-rtl and text-more.

      - id: text.embeddedFonts
        title: Embedded fonts
        elements: [p:embeddedFontLst, p:embeddedFont, p:font, p:regular, p:bold, p:italic, p:boldItalic]
        priority: P1
        difficulty: 4
        status: done
        strategy: >-
          Decode the font parts back to TrueType with our own Embedded OpenType and MicroType Express decoder (EOT
          header, LZCOMP with its adaptive Huffman trees, Compact Table Format to glyf, loca, cvt, hdmx and VDMX); lay
          text out with them where the family is not installed and carry them in the HTML as @font-face.
        office: >-
          PowerPoint stores every style of an embedded family (p:regular, p:bold, p:italic and p:boldItalic, also
          styles the presentation does not use) as a part of type application/x-fontdata: Embedded OpenType version
          0x00020002 with the subset and compressed flags, without XOR. The subset keeps the glyph ids and holds the
          glyphs of the characters the presentation uses and of printable ASCII; the other glyphs are empty. A family
          that is installed is taken from the system. Decoded, the kept glyphs' outlines and programs, hmtx, cmap and
          hdmx equal the installed fonts and VDMX is byte for byte the same (14 faces of Georgia, Comic Sans MS,
          Consolas and Segoe Script); Chromium's font sanitizer accepts the rebuilt fonts. generated/text-fonts,
          converted with its embedded fonts in place of the installed ones, renders pixel for pixel like with the
          installed fonts (95.0 %, the usual gap of small text). A variable font is embedded as the same file for
          every style (seen with Wix Madefor Display, wght 400 to 800): the slide show draws bold at the Bold
          instance (wght 700) and kerns it from GPOS (see engine.textLayout), while Slide.Export draws such text in
          Arial, so slide exports of decks with embedded variable fonts are no references.

      - id: text.fillOutline
        title: Text fill and outline
        description: gradFill, blipFill, pattFill and a:ln inside run properties.
        priority: P1
        difficulty: 3
        status: done
        strategy: SVG text paint or glyph outlines from our layout engine for gradient, picture and outlined text.
        office: >-
          Gradient and pattern fills span each line separately (from the line's start to its end and from its
          ascent to its descent); the outline is centered on the glyph edge and drawn over the fill. Verified
          with generated/text-effects.

      - id: text.underline
        title: Underlines
        elements: [a:uLn, a:uLnTx, a:uFill, a:uFillTx]
        priority: P1
        difficulty: 2
        status: done
        strategy: >-
          The 18 underline styles drawn by our layout engine as rectangles on the slide's pixels, with position
          and thickness from the font, shared by the runs side by side in a line.
        office: >-
          All 18 underline styles on whole pixels: the baseline rounded to its row of the slide's pixels, the
          post table's underline position (the line's top) and thickness taken at the font's size in whole
          pixels and each rounded, the thickness at least a pixel (measured with local/ulmix-a and -b: 144
          lines of Aptos, Calibri, Arial and Times New Roman from 8 to 22 pt, their baselines at every fraction
          of a pixel, all on PowerPoint's rows); dashed styles repeat in units of that thickness (dotted 1:1,
          dash 3:2, long dash 7:4, dot dash 3:2:1:2, dot dot dash 3:2:1:2:1:2); a double one is two lines of
          half the thickness (rounded up) from the thickness above the plain one's top to its bottom, a heavy
          one reaches from there to half the thickness below the top, with the same pattern (measured with
          local/ulmix-c: Arial and Aptos from 8 to 36 pt, one to four pixels thick); wavy ones are waves four
          thicknesses long. Underlined runs side by side in a line share one underline, each in its own style
          and color: at the mean of their positions and thicknesses (in whole pixels) weighted by their widths,
          rounded, its dashes running on from the first run's start through the words; raised runs underline
          on the line's baseline with the runs beside them, without counting, lowered ones on their own
          (measured with local/ulmix-c and -d: 72 pt beside 12 pt text, long or short, either first, three
          sizes and two fonts in a line, single beside double, two colors, dotted lines, raised and lowered
          runs, in Arial, Calibri and Aptos). An underline line of its own (a:uLn) outlines the plain
          underline, which is filled with a:uFill (or the text's color): the line lies half inside and half
          outside the edges, at least a pixel, with its own dash (measured with Arial 40 pt and uLn of 0.25 to
          6 pt: 0.25 pt adds a row of line above and below a fill of three rows, 2 pt leaves one row of fill
          between three rows of line, from 3 pt the line covers the fill); uLnTx and uFillTx follow the text.
          Measured with generated/text-underline (every style in the text color and in a color of its own,
          lines of their own, runs of different sizes): 76.1 -> 90.7 %, the rest one-pixel rounding of the
          line's position.

      - id: text.effects
        title: Text effects
        description: effectLst on runs (shadow, glow, reflection, soft edges).
        priority: P2
        difficulty: 4
        status: done
        strategy: >-
          The shape effect filters on the glyph layer, sized with the line's largest font; scaled and skewed
          shadows as transformed copies about the shape's box; reflections mirrored line by line; warped
          WordArt text gets the same filters.
        office: >-
          PowerPoint sizes text effects with the largest font of each line, unlike a shape's (measured with
          probe decks of 8 to 240 pt lines in several fonts, in exported slides and in the slide show alike):
          outer shadows (distance and blur) and glow grow with (size / 78 pt)^0.695, inner shadows with
          size / 117 pt, a reflection's blur with size / 79 pt and its distance with size / 14.5 pt. A
          reflection mirrors each line about its baseline: the distance extends the mirrored box below the
          baseline by half the scaled distance and the fade runs over that box. Text glow is dilated by 0.46 r
          and blurred by r / 6 at the outer scale. Verified with generated/text-effects.

      - id: text.fields
        title: Fields
        elements: [a:fld]
        priority: P1
        difficulty: 2
        status: done
        strategy: slidenum and datetime1–13 are computed when rendering; other field types keep their stored text.

      - id: text.columns
        title: Text columns
        description: a:bodyPr/@numCol and @spcCol.
        priority: P2
        difficulty: 3
        status: done
        strategy: The text is laid out at the column width and its lines are shared out over the columns.
        office: >-
          A column takes the lines that fit the text area's height, but at least an even share of all lines,
          and the last column the rest (measured with the object model, nine boxes of 4 to 12 lines in 2 and 3
          columns: 7 lines in 2 columns 5 lines high are 5 and 2, 3 lines high 4 and 3; 12 lines in 3 columns 5
          lines high 5, 5 and 2, 3 lines high 4, 4 and 4; 33 lines in three columns overflowing 11, 11 and 11).
          So an auto-sized box keeps all its text in the first column (LibreOffice's
          auto-height-multi-col-shape). Verified with generated/text-body.

      - id: text.vertical
        title: Vertical and rotated text
        description: a:bodyPr/@vert (vert, vert270, eaVert, mongolianVert, wordArtVert), @upright and @rot.
        priority: P2
        difficulty: 3
        status: done
        strategy: Rotate the line layout, or lay out top to bottom for East Asian and WordArt vertical text.
        office: >-
          vert and vert270 lay the text out along the shape's height and turn it by 90 or 270 degrees; the
          insets stay with the shape's sides and the anchor works across the turned lines (the text's top
          faces right for vert, left for vert270). eaVert keeps ideographs, kana and full-width forms upright
          (turned back about the middle of their em box) and stacks lines right to left; mongolianVert stacks
          them left to right. wordArtVert stacks upright characters in columns from the left (wordArtVertRtl
          from the right): characters and columns 1.41 x the size apart, the baseline 1.12 x the size into
          each cell, words that do not fit break between characters, trailing spaces take no room (measured).
          rot turns the laid-out text, vertical text too, about the middle of the text rectangle (LibreOffice's
          tdf149551: 12 degrees, 60 -> 70 %). upright keeps the text level in rotated shapes, laid out with width
          and height swapped between 45
          and 135 (225 and 315) degrees. Table cells (tcPr vert) wrap at the row height (generated/text-
          vertical). anchorCtr centers turned text along the shape's height as it centers lines across a text area,
          also where the text is longer than the height (LibreOffice's oox/tdf151008_eaVertAnchor: columns of East
          Asian vertical text centered on their box, 82.2 → 94.5 %; tdf149551_vert270AndTextRot 88.5 → 97.4 %).

      - id: text.warp
        title: WordArt transforms
        elements: [a:prstTxWarp]
        priority: P2
        difficulty: 5
        status: done
        strategy: Glyph outlines from the font, bent along the warp's guide paths (41 presets) into SVG paths.
        office: >-
          The text's ink box fills the envelope between each pair of guide paths (glyph tops on the upper
          path, baselines on the lower one), measured in arc length. Lines are shared out among the envelopes
          in order (textButtonPour: two lines take the upper and the middle one, four lines two, one and one;
          empty paragraphs count), and all envelopes share one scale each way (measured with probe decks of H
          strokes, residuals under 0.5 px): along, the envelope whose ink is longest for the middle of its
          envelope (the mean of its two paths' lengths) fills it and sets the scale, the others' ink taking its
          part where the alignment puts it; across, the tallest ink fills its envelope and the others' is
          centered at that scale, a line without ink counting with its line box (a line of A's before an empty
          paragraph keeps 0.56 of its envelope's height)
          (local/warp-buttons 61.5 to 88.8 %; LibreOffice's tdf139618_WordArtBitmapFill, textDeflateInflate,
          65.6 to 80.7 %). Presets with one or three paths put every glyph rigid on the path at its middle,
          at the glyph's size and placed by the line's alignment; the lines are shared out among the paths
          alike (textButton: one line on the upper arc, two on the arc and the middle line, three on all
          three, four with two on the upper arc; empty paragraphs count), and such text is not wrapped (a
          line longer than the text box stays whole on the lower arc). Text from old WordArt (fromWordArt) is
          scaled evenly to the path's length (measured with textArchUp in generated/text-body). Verified
          with generated/text-effects (WordArt transforms). Every line follows a parallel of the path, a line
          pitch apart, on the side away from the box's center: on a circle or an arch up the last line lies
          on the path and the others outside it, under an arch down the first line lies on the path and the
          others below. Glyphs are spaced by arc length on their line's parallel, from the parallel's start
          or as aligned (insets do not count), and then lowered: the line on the path has its baseline 0.79
          em under the top of its line box below the path (eight fonts, 12 to 72 pt, within 0.01 em; 4.8 px
          under textButton's middle line in 24 pt Aptos). Other text shrinks when it is longer than
          PowerPoint measures the path: an arc counts its width radius times its sweep, as if it were a
          circle (textArchUp with eight H's: 177.6 px a radian on arches of 10 to 40 degrees with a width
          radius of 180 px, 91 px with one of 90 px), so that text runs on along the ellipse past the ends of
          an arch flatter than that circle; a line longer than its parallel is centered on it (LibreOffice's
          tdf116350-texteffects 69.1 to 73.5 %). Known deviations: old WordArt with several lines on part of
          an elliptic arc comes out larger than in PowerPoint (LibreOffice's tdf125573); on an arch down of
          an ellipse PowerPoint places the glyphs closer to the path's start, by a factor of its arc length
          that depends on the ellipse (0.98 at 360 x 267 px, 0.977 at 360 x 133, 1.007 at 180 x 267, none on
          a circle), and textCircle on a circle at some start angles (0.982 at the default 180 degrees and at
          210, none at 181, 195, 240 and 270; at 12 and 24 pt, radii of 67 and 133 px alike), for which no rule
          is found. Envelopes stretch the spaces at a line's start and end with its ink, not the space a wrapped
          line breaks at: "HH " in textPlain or textInflate leaves 0.2 of the envelope to the space and the H's side
          bearing, " HH" as much at the start, "HH" fills it from ink to ink (local/warpspace, every line within 2
          px; LibreOffice's oox/tdf139618_ThemeColorTransparency 64.9 → 95.7 %, sd/tdf114848's slide of waves, cans
          and rings 53.7 → 91.9 %). Along arches, circles and buttons text follows the ellipse from the parameter of
          the arc's start angle through that of its sweep: PowerPoint takes the preset's angles as the ellipse's
          parameter, not as the visual angles its path is drawn by; both agree where the arc's ends lie on the axes
          (local/archwa-*: under a textArchDown of 322.76° in a 2:1 box text starts 217° round the ellipse, not
          237°; LibreOffice's sd/tdf116350-texteffects 73.5 → 84.0 %, tdf125573_FontWorkScaleX 51.5 → 66.3 %).

      - id: text.threeD
        title: 3D text
        elements: [a:flatTx]
        priority: P3
        difficulty: 5
        status: done
        strategy: scene3d/sp3d on the text body; same approach as 3D shapes.
        office: >-
          A scene of the text body's own (a:bodyPr/a:scene3d, a:sp3d; Format Shape, Text Options) gives the
          glyphs a body while the shape stays flat: the glyph outlines are extruded, beveled, backed and
          contoured like a 3D shape's (extrusion in the text's color unless extrusionClr), the text itself is
          the front face inside the top bevel, lit like it, and the scene turns about the center of the
          glyphs, not of the shape (measured). A bevel wider than half a glyph stroke runs across it to a crest
          along its middle, every point of it stopping there at the height the profile has, no flat front face
          left (found by an agent in Word's pictures of 3D text: LibreOffice's extras-ooxmlexport/
          TextEffects_Props3d_Ligatures_NumForm_NumSpacing 86.1 → 96.4 %, docx/local/text-3d 77.7 → 79.4 %;
          generated/text-3d 98.2 → 98.4 %); text filled with a gradient or a picture keeps its bevel within the
          strokes' mean thickness, its height in proportion (not measured yet). Text in a 3D-turned shape turns with the shape's front face; a:flatTx keeps it
          out of the scene, facing the viewer at the shape's place (measured). Small 3D text is drawn from its
          outlines too (LibreOffice's 3d_rotated_text: 18 pt text turned a quarter, 41.6 to 91.4 %). Checked
          with generated/text-3d
          (97.1 %): extruded and beveled under a legacy perspective, turned only, beveled in a shape, extruded
          in a color of its own, flat text. The text's own shadow and glow fall from its whole glyphs, not from the
          front face its bevels leave: they lie behind the body (tika's testWordArt: red text with an artDeco bevel,
          a light contour and a soft shadow, 66.9 → 95.3 %).

      - id: text.math
        title: Equations
        elements: [a14:m]
        namespaces: [m]
        priority: P2
        difficulty: 4
        status: done
        strategy: >-
          OMML laid out with the OpenType MATH table of Cambria Math (another installed math font otherwise, the
          mc:Fallback picture when there is none): runs in the math alphabets (m:sty, m:scr), fractions (bar,
          skewed, linear, stacked), scripts and pre-scripts, radicals, n-ary operators, stretchy delimiters with
          separators, matrices, equation arrays, accents, bars, group characters, limits, functions, boxes,
          border boxes and phantoms, spaced by TeX's atom classes. An equation is an inline object of the text
          layout, drawn as glyph outlines under transparent selectable text.
        office: >-
          Measured against PowerPoint with probe decks at 18, 20 and 40 pt: display equations reach at least the
          math font's ascent and descent and stand MathLeading below the top of their line; display operators
          take the first size at least 1.5 x DisplayOperatorMinHeight tall; fractions keep their size in display
          equations (text style below the top level) and shrink inline; delimiters take the smallest size at
          least twice the content's reach from the axis less 630 units (between 613 and 645 by the sizes chosen),
          and a delimiter with separators sets its parts in text style; skewed fractions put the fraction slash
          (U+2044) in the largest size within their ink; accents keep their size over one character and grow to
          the largest size within a wider base; an n-ary operand follows a thin space less what the display size
          adds to the italic correction, at least SpaceAfterScript after limits beside it; hidden limits keep
          their baselines; empty arguments keep a 0.9 em placeholder; m:vertJc of a group character picks the
          part on the baseline (top when missing). PowerPoint's exports cut off accents stretched over several
          characters and narrow stretched group characters; that is not imitated. Verified with generated/math.

      - id: text.rtl
        title: Right-to-left and complex scripts
        elements: [a:rtl]
        priority: P2
        difficulty: 4
        status: done
        strategy: Bidi algorithm (UAX 9) in our layout engine, complex-script fonts, rtl paragraphs and columns.
        office: >-
          Measured with generated/text-rtl: paragraph levels follow pPr rtl, not the text (UAX #9 weak,
          neutral and implicit rules); a neutral between text of two directions takes the direction of its
          run's language (a:rtl, else lang) — PowerPoint keeps the space of a de-DE run 'PowerPoint ' with it
          in an Arabic paragraph and mirrors a bracket of a Hebrew run. Right-to-left paragraphs start on the
          right: left margin, indent and bullet are measured from the right edge, the bullet reads right to
          left ('1.' shows as '.1'), alignment l and r stay absolute; justified lines stretch their spaces.
          Right-to-left runs are shaped right to left (HarfBuzz mirrors brackets) and drawn whole by the
          browser below 30 pixels per em. Tabs in lines with right-to-left text count their width only; right-
          to-left tables and columns see table.structure and text.columns.

      - id: text.eastAsian
        title: East Asian typography
        elements: [p:kinsoku]
        priority: P2
        difficulty: 4
        status: done
        strategy: Kinsoku line breaking rules, East Asian line breaking and hanging punctuation, ea fonts, vertical text.
        office: >-
          Measured with generated/text-eastasian: with the kinsoku rules (pPr eaLnBrk, on by default) a line
          does not start with closing punctuation or small kana and does not end with an opening bracket;
          hangingPunct (on in PowerPoint's default text styles) lets 、。，． hang past the end of the line
          instead of pushing the character before them down (Latin punctuation never hangs: a line whose
          closing period would pass the end moves down with its word, external/libreoffice/sd-data/
          TextFittingComparisonWithMSO_1 and _2); eaLnBrk 0 turns the rules off, lines then break
          between any East Asian characters, punctuation included, and nothing hangs; latinLnBrk breaks Latin
          words anywhere to fill a line. PowerPoint ignores the presentation's own kinsoku characters
          (p:kinsoku). Korean breaks at spaces.

  - id: table
    title: Tables
    features:
      - id: table.structure
        title: Table grid and merged cells
        elements: [a:tbl, a:tblPr, a:tblGrid, a:gridCol, a:tr, a:tc, a:headers, a:header]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Lay out the grid ourselves (column widths from gridCol, merged cells from gridSpan, rowSpan, hMerge,
          vMerge) and position the cells absolutely; an HTML table would compute its own sizes.
        office: >-
          Row heights (a:tr/@h) are minimums; PowerPoint grows rows to fit their text. A right-to-left table
          (tblPr rtl) mirrors its cells with their left and right borders, not the text in them
          (generated/tables). Verified with generated/tables (97.7 %); a:headers and a:header only name cells
          for accessibility. The table's effects (a:tblPr/a:effectLst) are cast by the cells' fills and borders,
          not the text; translucent fills show the shadow through (LibreOffice's table-shadow-blur); a scaled
          shadow is scaled about its alignment point like a shape's (tdf150020-shadow-alignment: 130 % about
          the center).

      - id: table.cells
        title: Cell formatting
        elements: [a:tcPr, a:lnL, a:lnR, a:lnT, a:lnB, a:lnTlToBr, a:lnBlToTr, a:cell3D]
        priority: P0
        difficulty: 3
        status: done
        strategy: Margins, anchoring, vertical text, fills and borders including diagonals; shared borders resolved like PowerPoint.
        office: >-
          tcPr anchorCtr centers the cell's text block; bodyPr wrap none and horzOverflow have no effect in
          cells, the text always wraps (measured with generated/tables). Beveled cells (a:cell3D, also from
          the style's tcStyle) are drawn as shapes with a top bevel seen from the front: the bevel's strips
          and the face lit by the cell's light rig (three-point from the top by default) and material
          (plastic), the fill on the face inside the bevel (generated/tables-more: circle, angle and relaxed
          inset bevels, faces lighter under the three-point rig). Borders are antialiased where they lie, not
          snapped as shape outlines are: below 1.5 px one pixel wide, else their own width, their edges moved on to
          the next of PowerPoint's antialiasing samples, a quarter's top down a column and an eighth's left along a
          row (local/lw-probe: one-cell tables with borders of 0.25 to 6 pt at quarter-pixel offsets, 76 of 88
          edges exact, the rest a position PowerPoint rounds to 1/576 inch). Verified with generated/tables and
          tables-more.

      - id: table.styles
        title: Table styles
        elements: [a:tblStyleLst, a:tblStyle, a:tableStyle, a:tableStyleId, a:tblBg, a:wholeTbl, a:band1H, a:band2H,
                   a:band1V, a:band2V, a:firstRow, a:lastRow, a:firstCol, a:lastCol, a:neCell, a:nwCell, a:seCell,
                   a:swCell, a:tcStyle, a:tcTxStyle, a:tcBdr, a:left, a:right, a:top, a:bottom, a:insideH, a:insideV,
                   a:tl2br, a:tr2bl, a:fill]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Combine whole table, banding, first/last row and column and corner cells in PowerPoint's order for the flags
          set in tblPr. PowerPoint draws only its 74 built-in styles, so we need their definitions, harvested from
          PowerPoint itself.
        office: >-
          PowerPoint draws tables only in its 74 built-in styles, looked up by a:tableStyleId; the definitions
          in ppt/tableStyles.xml are not used for drawing (measured with patched decks): a built-in id draws the
          built-in style whatever the file defines under it (Apache POI's table-with-different-font-colors,
          93.1 to 98.6 %), and a style of the file's own, even an exact copy of a built-in one under another id,
          or an inline a:tableStyle draws No Style, Table Grid (POI's bug68703, a Google Slides style, 61.2 to
          97.5 %). The 74 styles as PowerPoint writes them into ppt/tableStyles.xml are kept as a resource
          (generated/tables-more slide 2: six styles with an empty style list, 98.4 %). Verified with
          generated/tables and tables-more.
          A table without tableStyleId is drawn in No Style, Table Grid, not in the presentation's default
          style (measured with a patched deck; Apache POI's table-with-no-theme).

  - id: chart
    title: Charts
    description: >-
      Charts are rendered from the values cached in the chart part; the embedded workbook is not needed. Axis
      scaling, number formats and automatic layout follow Excel's algorithms.
    features:
      - id: chart.part
        title: Chart part and settings
        elements: [c:chartSpace, c:chart, c:date1904, c:lang, c:roundedCorners, c:style, c:clrMapOvr, c:protection,
                   c:chartObject, c:data, c:formatting, c:selection, c:userInterface, c:externalData, c:autoUpdate,
                   c:printSettings, c:headerFooter, c:oddHeader, c:oddFooter, c:evenHeader, c:evenFooter,
                   c:firstHeader, c:firstFooter, c:pageMargins, c:pageSetup, c:legacyDrawingHF, c:plotVisOnly,
                   c:dispBlanksAs, c:showDLblsOverMax, c:autoTitleDeleted, c:fmtId, c16r3:dataDisplayOptions16,
                   c16r3:dispNaAsBlank]
        priority: P1
        difficulty: 2
        status: done
        strategy: Read chart settings and render from cached data; print settings are ignored.
        office: >-
          A chart's c:clrMapOvr replaces the slide's color mapping for the chart, text included
          (generated/colormap). The chart area's corners are rounded unless c:roundedCorners says otherwise;
          PowerPoint rounds them where the element is missing too, by 9.8 pt whatever the chart's size
          (measured with local/rounded: 200 x 150 to 300 x 450 pt). Blank cells (c:dispBlanksAs) show as gaps
          where the element is missing, as zero where it says so or names nothing, or spanned by the line
          without a marker (generated/charts-data). Labels of values beyond the axis are hidden as PowerPoint
          writes c:showDLblsOverMax 0 (8 and 11 on an axis up to 6 go unlabelled). Dates of the 1904 system
          (c:date1904) are moved to the 1900 one. Print settings (c:printSettings, header and footer, page
          setup) and editing state (c:protection, c:userInterface, c:externalData) do not change the picture.
          Verified with generated/charts, charts-more, charts-details and charts-data.

      - id: chart.data
        title: Series and data caches
        elements: [c:ser, c:idx, c:order, c:tx, c:cat, c:val, c:xVal, c:yVal, c:bubbleSize, c:numRef, c:numCache,
                   c:numLit, c:strRef, c:strCache, c:strLit, c:multiLvlStrRef, c:multiLvlStrCache, c:lvl, c:pt,
                   c:ptCount, c:v, c:f, c:formatCode, c:name, c16:numCache, c16:strCache, c16:multiLvlStrCache,
                   c16ac:multiLvlStrLit, c16r2:formatcode2, c15:filtered*, c15:fullRef, c15:formulaRef, c15:levelRef,
                   c15:sqref, c15:xForSave, c15:ser, c15:tx, c15:cat, c15:f, c15:autoCat, c15:categoryFilterException*,
                   c16:categoryFilterException*, c16:uniqueId, c16:uniqueID, c16:ptentry, c16:ptidx,
                   c16:datapointuniqueidmap]
        priority: P1
        difficulty: 2
        status: done
        strategy: Series values, categories (multi-level), number format codes; filtered series stay hidden.
        office: >-
          Verified with generated/charts-data (multi-level categories, blanks, hidden rows; filtered series,
          kept in c15:filtered* outside the series list, stay hidden).

      - id: chart.barColumn
        title: Bar and column charts
        elements: [c:barChart, c:bar3DChart, c:barDir, c:grouping, c:gapWidth, c:overlap, c:shape, c:varyColors,
                   c:invertIfNegative, c15:invertIfNegative, c16:invertIfNegative, c14:invertSolidFillFmt]
        priority: P1
        difficulty: 3
        status: done
        strategy: Clustered, stacked and 100 % stacked bars as SVG rectangles.
        office: >-
          Negative bars of a series that inverts them (c:invertIfNegative) take the fill of
          c14:invertSolidFillFmt, else white, with a black hairline where the series has no line of its own
          (measured with generated/charts-details). Verified with generated/charts, charts-details and charts-
          data.

      - id: chart.line
        title: Line charts
        elements: [c:lineChart, c:line3DChart, c:marker, c:symbol, c:size, c:smooth, c:dropLines, c:hiLowLines,
                   c:upDownBars, c:upBars, c:downBars, c15:marker, c16:marker]
        priority: P1
        difficulty: 3
        status: done
        strategy: Polylines with markers; smoothed lines need Office's Bézier construction.
        office: >-
          Verified with generated/charts and charts-data (smoothed lines: interior segments as PowerPoint's,
          the end segments a little off). A line chart without the c:marker flag shows markers on series without
          a marker of their own (LibreOffice's tdf105517).

      - id: chart.pie
        title: Pie and doughnut charts
        elements: [c:pieChart, c:pie3DChart, c:doughnutChart, c:ofPieChart, c:ofPieType, c:firstSliceAng, c:holeSize,
                   c:explosion, c:splitType, c:splitPos, c:custSplit, c:secondPiePt, c:secondPieSize, c:serLines,
                   c15:explosion, c16:explosion]
        priority: P1
        difficulty: 3
        status: done
        strategy: Arcs as SVG paths; pie-of-pie and bar-of-pie with series lines.
        office: >-
          Pie of pie and bar of pie (c:ofPieChart): the split (splitType pos with splitPos, 2 by default; val,
          percent, cust with c:secondPiePt) moves points to a second pie or a stacked bar beside the main pie,
          which shows them as one slice formatted by the extra data point and centered towards the second
          plot; the second plot is secondPieSize % of the main pie high, a bar half as wide as high; the gap
          at gapWidth 100 is 0.514 (pie) or 0.259 (bar) of the main pie's diameter; the second pie's slices
          start (clockwise) where the combined slice ends, the bar's first point on top; series lines
          (c:serLines) join the combined slice's edges to the second plot's top and bottom. Measured with
          generated/charts- details: 0.06 -> 0.97 on that slide. Verified with generated/charts, charts-
          details and local/pielabels. A fill of the series' own colors the points without one even where
          the colors vary by point (LibreOffice's tdf150176 and tdf146756: the first slice in bg2). The room
          for outside labels follows the series' label position, not single points' (centered labels with some
          at bestFit keep the pie at full size: tdf125444, percentage-number-formats); with them the pie is 0.876
          of half the plot's smaller side less 0.163 of the labels' size across (Word's PDFs of LibreOffice's
          extras-layout/tdf137116: 53.71 pt of 63.0 at 10 pt, outside_long_data_label 59.0 of 69.0, tdf134866 99.25
          of 115; local/pielabels slide 4: 142.5 of 163.5; tdf137116 79.2 → 94.3 %, outside_long_data_label 81.9 →
          99.6 %, pielabels 98.9 → 99.2 %). Word keeps that room wherever a series has data labels at all, even
          ones that show nothing (c:dLbls of every show* 0; scratch/WordProbes/probe_pielabels.py on LibreOffice's
          extras-ooxmlexport/tdf123873: 64.7 pt in radius with the flags alone or with text properties, a separator
          or point entries, as with values shown, 75.5 pt without c:dLbls; tdf123873 84.4 → 97.0 %). A plot area
          placed by hand around the pie (layoutTarget inner) holds the pie with its series' explosion; single
          exploded slices reach beyond it (tdf146756_bestFit, tdf146487).

      - id: chart.area
        title: Area charts
        elements: [c:areaChart, c:area3DChart]
        priority: P1
        difficulty: 3
        status: done
        strategy: Filled SVG polygons, stacked or 100 % stacked.
        office: >-
          Verified with generated/charts and charts-more.

      - id: chart.scatterBubble
        title: Scatter and bubble charts
        elements: [c:scatterChart, c:scatterStyle, c:bubbleChart, c:bubble3D, c:bubbleScale, c:showNegBubbles,
                   c:sizeRepresents, c15:bubble3D, c16:bubble3D]
        priority: P1
        difficulty: 3
        status: done
        strategy: Value axes on both sides; bubble size by area or width.
        office: >-
          The largest bubble takes 0.3 s of the length it measures against less itself, D = 0.3 s (L - D), s =
          bubbleScale / 100 and L the smaller side of the plot area before the axis labels plus 11.49 pt (at 100 %
          0.2307 m + 2.65 pt, measured through COM; Word's docx/local/bubble-* 28.17, 49.82, 67.01 and 80.96 pt at 50,
          100, 150 and 200 %, within 0.003 pt); sizes by area or width. Every drawn bubble's value grows into a span
          of 0.1824 s / (1 + 0.3 s) of the final axis range on either side, whatever its own size, and the axes take
          their automatic bounds of that without the 5 % headroom, until they settle (Word's 29 bubble-* and 9 bax-*
          probes, x and y, of other chart and plot sizes; PowerPoint's charts-more and charts-details alike); bubble
          legend keys are round. bubble3D is drawn flat.

      - id: chart.radar
        title: Radar charts
        elements: [c:radarChart, c:radarStyle]
        priority: P2
        difficulty: 3
        status: done
        strategy: Polar axes as SVG.
        office: >-
          One spoke per category clockwise from 12 o'clock; the value gridlines are polygons, the value axis
          line is drawn as every spoke and its labels stand along the first spoke (1.14 s - 1.25 pt left of
          it); the category axis draws neither line nor gridlines. The radar is centered in the plot area with
          radius min(W/2 - (widest label + 0.3056 s - 3.005), H/2 - (L + 0.3127 s - 5.248)), measured through
          COM with 25 layouts. Category labels stand 6 pt beyond their spoke, left- or right-aligned at the
          sides and centered above and below. The value axis ends at the first major unit from the largest
          value, without the 5 % headroom of other charts (measured: 7.9 on 0 … 8, 9.6 on 0 … 10); charts
          without style part draw spokes only where the axis has a line of its own. The category axis' major
          gridlines also make the spokes, but in the value axis' line, not in their own (local/radarspk-*: red
          gridlines draw gray spokes, a blue value axis line blue ones; poi/radar-chart 85.9 → 89.5 %).

      - id: chart.stock
        title: Stock charts
        elements: [c:stockChart]
        priority: P2
        difficulty: 3
        status: done
        strategy: High-low lines and up/down bars over line series.
        office: >-
          High-low lines join each category's lowest and highest point, up/down bars run from the first to the
          last series (category width / (1 + gap width)) and cover the lines; the series lines are usually
          invisible. A dot marker is a circle half the marker size. Legend entries of series without a line
          keep the narrow square-key width and show only their marker.

      - id: chart.surface
        title: Surface charts
        elements: [c:surfaceChart, c:surface3DChart, c:wireframe, c:bandFmts, c:bandFmt]
        priority: P3
        difficulty: 4
        status: done
        strategy: Contour bands in 2D; 3D surfaces with chart.threeD.
        office: >-
          Contour (top view) charts: the band scale is the value axis without headroom; the surface is a top
          view of a 3D box whose sides are proportional to the category and series counts, 97.3 % of the inner
          plot area. Each grid cell splits along the diagonal with the larger value sum; facets are lit with
          0.52 + 0.595 n·l (light from the upper right at 31 degrees; facets turned away keep darkening) plus
          a specular highlight; the top view's box is 0.6 × its base high, scaled by the inner plot area's
          height over its width (measured with tilted planes in square, wide and tall charts, local/contour:
          within 2 levels). 3D surfaces (meshes cut
          into the value bands, drawn back to front by their grid cells) and wireframes (band-colored grid and
          contour lines) are drawn with chart.threeD. Contour charts verified with generated/charts-more; 3D
          surfaces see chart.threeD.

      - id: chart.axes
        title: Axes, gridlines and number formats
        elements: [c:catAx, c:valAx, c:dateAx, c:serAx, c:axId, c:axPos, c:scaling, c:orientation, c:max, c:min,
                   c:logBase, c:delete, c:majorGridlines, c:minorGridlines, c:majorTickMark, c:minorTickMark,
                   c:tickLblPos, c:crossAx, c:crosses, c:crossesAt, c:crossBetween, c:majorUnit, c:minorUnit,
                   c:dispUnits, c:builtInUnit, c:custUnit, c:dispUnitsLbl, c:auto, c:lblAlgn, c:lblOffset,
                   c:noMultiLvlLbl, c:tickLblSkip, c:tickMarkSkip, c:baseTimeUnit, c:majorTimeUnit, c:minorTimeUnit,
                   c:numFmt, c15:numFmt]
        priority: P1
        difficulty: 4
        status: done
        strategy: >-
          Reproduce Office's automatic minimum, maximum and major unit; number formats need an Excel number-format
          engine; date axes, logarithmic and reversed scales.
        office: >-
          Measured: zero is included unless all values lie in the top sixth of their maximum; the maximum gets
          5 % headroom; with a fixed maximum and an automatic minimum the ticks count down from the maximum
          (700000 over data down to -479325: -700000 … 700000); the major unit is the smallest 1-2-5 step giving at
          most ten intervals: on a vertical axis as many as leave room for two labels more in the plot area's outer
          box (the chart less its title, legend and 11 pt edges, before the axis labels, less 0.2 pt), each label a
          single line of its font high (measured in Word, docx chart.axes; local/catwrap-horizontal 95.6 → 96.5 %), in
          a plot area placed by hand each at least 1.1 line heights tall; 100 % stacked axes are exactly 0 to 100 %. Built-in format 14 ("m/d/yyyy")
          shows the locale's short date. Numbers and dates take the system's regional format, not the chart's
          language (c:lang; measured: an en-US chart shows 2,5 on a German system); the converter takes it as an
          option, the current culture by default. Category labels that do not fit their slots wrap at the slot's
          width where every word fits it, else all rotate by -45 degrees (local/catwrap-horizontal: two- to
          six-word labels wrap, also in a chart 200 pt short; one word wider than its slot turns all labels); date
          axes that label as many dates as fit show all of them, wrapped, where their words fit (LibreOffice's
          bnc889755), and built-in format 17 (mmm-yy) reads "Okt 12" on a German system. Rotated labels sit with the end
          of their middle line at the category; in Word's charts labels turned up by -45 degrees are boxes whose top
          right corner sits on the category, the first category their width across from the outer edge, the last
          their line's height up from the right one (agent AK in Word's PDFs: powertools/CU004-Chart-Cached-Data-04
          87.8 → 98.0 %, libreoffice/extras-ooxmlimport/tdf82824 90.1 → 98.8 %); labels of an axis crossing inside the plot area stay at the
          axis. Display units (c:dispUnits: built-in or custom) divide the value labels, and their label
          (c:dispUnitsLbl) shows its own text or the unit's name in the chart's language (German Office:
          Millionen, x 10000), turned a quarter beside the labels with its end at the top of the plot area, in
          a column of its own. Category axes label every tickLblSkip-th category and mark every tickMarkSkip-
          th, their labels keep lblOffset % of the default distance; numeric categories (dates on a date axis)
          take the axis's number format, months abbreviated as Office does (German: Mrz, Jun, Sep). A plot
          area placed by hand (c:manualLayout) still turns category labels that do not fit by -45 degrees.
          Horizontal value axes divide the plot area's width before the labels beside it take their room into
          intervals of at least four font sizes, however wide their labels are, which then overlap (measured:
          bar and scatter charts 150 to 900 pt wide with 9 and 12 pt labels; Office 2016 charts keep one label
          wide plus three font sizes). Category labels beside a vertical axis (bar charts) wrap at half the
          outer plot area's width less half the first and half the last value label, keep the lines that fit
          their category's height with an ellipsis after the last (centered without it), and stand as blocks
          as wide as their longest line beside the axis, their lines centered (measured: bar charts 200 to
          950 pt wide with 9 to 24 pt labels and value labels of several widths or none; local probes). In Word
          category labels of a horizontal axis turned a quarter by their own rotation (bodyPr rot ±5400000) wrap at
          half the outer plot area's height, their lines centered on each other, the block's middle at the category
          (docx/local/tlb-*, tlc-*: a Calibri 9 label beside charts 150 to 550 pt high and 288 or 432 pt wide breaks
          where a line would pass half the height less 10.1 to 12.7 pt; LibreOffice's extras-layout/xaxis-labelbreak
          22.8 → 92.6 %). A plot
          area placed by hand wraps them at half the chart's width less those overhangs and keeps all labels
          inside the chart: it moves left until the value label at its right edge is 6 pt inside, then gives
          up width on the left to the labels beside it (LibreOffice's tdf48041: 60.8 to 90.2 %). Not yet: the
          plot area of narrow bar charts whose labels nearly fill their categories starts lower in PowerPoint.
          Multi-level categories
          (c:multiLvlStrRef) put every outer level in a row of its own, the label gap below the categories,
          each name centered over its group with lines along the group edges from the axis through the row;
          with c:noMultiLvlLbl the names join their group's first label as further lines; beside a vertical axis on
          the left the outer levels take columns of their own, the names turned (measured in Word, docx chart.axes).
          Labels may hold line
          breaks and align in their slot (c:lblAlgn l, r: flush with its edge). Date axes (c:dateAx) count
          days, months or years from the first date to the last (c:baseTimeUnit, else by the closest dates),
          every point in the slot of its date, empty units keeping their place, labels every major unit
          (c:majorUnit in c:majorTimeUnit) or as many as fit (generated/charts-data: 1, 4, 5, 12 January on a
          day axis, 1 and 15 January sharing January). Days without a major unit whose dates do not fit label
          every day, every second or every seventh, the first that fits, flat, turned by 45° (slots of 1.73 line
          heights) or, for days and second days, by 90° (1.18 line heights), else the first of every month, the
          slots taken on the plot area's width for flat labels (local/da-*: 20 to 200 days on 181 to 829 pt axes,
          the same in Word; docx/external/powertools/CU004 57.7 → 87.8 %, libreoffice/extras-ooxmlimport/tdf82824
          49.8 → 90.0 %). Known deviation: below labels turned by 45° PowerPoint's plot area is up to 5 pt narrower
          on each side than ours. Lines and areas run on through the dates
          without data between their points (dispBlanksAs only concerns blank cells). A plot area placed with its
          labels (layoutTarget outer) holds them all: half a value label at the top, the first turned category
          label at the left edge. Category labels stand (1 + lblOffset / 100) / 2 default gaps below the axis
          (measured with offsets of 0, 200, 400 and 1000). Display unit labels stand 3.6 pt beside the value labels
          in a column 9.5 pt wider than their line, their end 2.5 pt below the top of the plot area. Horizontal
          value axes keep each interval one label and three font sizes wide (a 418 pt scatter axis up to 9 steps
          by 2). Checked with generated/charts-data, charts-details (99.2 %) and a label offset probe (99.6 %).
          The sides of category and value axes follow the chart type whatever c:axPos says: a bar chart's
          category axis is vertical (LibreOffice's tdf48041 saves it at b, PowerPoint shows the categories on
          the left). A value axis deleted beside another of its direction takes that one's scale, which spans the
          series of both; where both are deleted they take the first's; both shown, each keeps its own (measured in
          Word with docx/local/csx-*: columns on the primary axes, a line on secondary ones: with the secondary value
          axis deleted the primary one runs to 4500 for line values up to 3861, with the primary deleted the secondary
          one to 2500 for columns up to 1925; LibreOffice's extras-layout/tdf138773 78.6 → 83.1 %). A series has as
          many categories as values, more cached category names unseen (csx-*: a line of 13 values with 15 cached
          categories at the 13 places of the columns). A label shown on every n-th category only (c:tickLblSkip) has
          n slots before the labels turn, and the first and the last labelled of categories between ticks stay
          within the outer plot area as midCat labels do (csx-orig: "2000-01" and "2012-13f" over 13 slots of
          20.3 pt labelled every second one flat, each 10 pt inside the chart, 16.5 → 89.8 %). Number formats with
          conditions ([<>0], [>=100]) give the numbers that meet them their section, the others the next (csx-val:
          [<>0]General;\ "2011-12 $/t" labels 0 "2011-12 $/t", 33.6 → 70.7 %). Without c:majorTickMark an axis has
          its major ticks outside, without c:minorTickMark no minor ticks; with the element, val defaults to cross
          (local/ticks-*). Number formats color their labels with [Red], [Blue] … or [Color1] to [Color56] (the
          default palette, indexed colors 8-63) in the section that formats the value (tdf137691_dataTable: negative
          values red).

      - id: chart.labels
        title: Data labels
        elements: [c:dLbls, c:dLbl, c:dLblPos, c:showLegendKey, c:showVal, c:showCatName, c:showSerName,
                   c:showPercent, c:showBubbleSize, c:separator, c:showLeaderLines, c:leaderLines, c15:dLbl,
                   c15:layout, c15:dlblFieldTable, c15:dlblFieldTableCache, c15:dlblFTEntry, c15:dlblRangeCache,
                   c15:datalabelsRange, c15:showDataLabelsRange, c15:showLeaderLines, c15:leaderLines, c15:txfldGUID,
                   c15:spPr, c16:dLbl]
        priority: P1
        difficulty: 4
        status: done
        strategy: Label text from values, categories, series names, percentages or cell ranges; automatic placement and leader lines.
        office: >-
          Data labels wrap at a fifth of the chart's width, box, insets and legend key included; a word longer
          than a line breaks between characters (measured: 'Wwwwwwwwww; 1' reads 'Wwwwwwwww' and 'w; 1'). The
          default separator is a line break between a percentage and a name shown without the value, else the
          list separator of the chart's language and a space ('One; 40' with a German Office). Pie labels,
          measured against PowerPoint's label boxes for pies turned in 5 degree steps (local/pieangles,
          local/piebestfit, local/pielabels): ctr at half the radius; inEnd centered on the middle ray where
          the ray leaves the label 3.7 % of the radius inside the edge; outEnd with the inner edges 4 %
          (vertically) and 5.1 % (horizontally) of the radius outside the edge point, straddling the ray
          within 18 degrees of the vertical by (1 - 3.05 tan phi) / 2 of the width and within 45 degrees of
          the horizontal by (1 - cot phi) / 2 of the height; bestFit inside with the outermost corner 0.9 % of
          the radius inside the edge where the text fits into its slice (a one-line label may break into two
          lines), else outside. PowerPoint's object model reports best fit labels at their outside places and
          the pie keeps room for outside labels (outEnd, bestFit) but not for inEnd and ctr. Moved labels
          (c:manualLayout x, y) are offset from their outside place by fractions of the chart and stay inside
          it; a moved label clear of the pie gets a leader line from the slice's edge point, straight up or
          down to a label above or below it, else ending in a 5.6 pt level stroke at the label's first
          baseline. Legend keys (c:showLegendKey) are squares of the point's fill as in legends, the text
          1.108 line heights after the inset. Bubble sizes (c:showBubbleSize) label bubbles on the right, 5.5
          pt off the edge. A point label's own text (c:tx: rich text, or a cell) replaces the parts, its runs
          keeping their own formatting (generated/charts-details slide 6: 99.6 %); its fields (a:fld VALUE,
          CATEGORYNAME, SERIESNAME, PERCENTAGE, XVALUE, YVALUE, BUBBLESIZE, CELLRANGE) show the point's current
          values whatever text they saved ('[PERCENTAGE]' in LibreOffice's tdf125444). A label's own width
          (c15:layout w, a fraction of the chart) replaces the fifth it wraps at (tdf146487). Text from cells
          (c15:datalabelsRange) leads the parts. Best fit labels inside slices narrower than
          a half move sideways off the middle ray until their lines keep the same distance from both of the
          slice's radii, then out as far as their corners stay within reach (wide labels of slices turned in
          5° steps move towards the horizontal by up to 34 px, matched within 2 px; local/piebestfit 92.4 %);
          one-line labels near the wrap width sit up to 4 % of the radius further in in PowerPoint.

      - id: chart.titleLegend
        title: Titles, legend and layout
        elements: [c:title, c:rich, c:overlay, c:layout, c:manualLayout, c:layoutTarget, c:xMode, c:yMode, c:wMode,
                   c:hMode, c:x, c:y, c:w, c:h, c:legend, c:legendPos, c:legendEntry, c:plotArea]
        priority: P1
        difficulty: 3
        status: done
        strategy: Automatic layout of title, legend and plot area like Office; manual layouts are fractions of the chart area.
        office: >-
          Measured against COM positions (plot area, legend entries, titles) for 35 charts: title and legend sit 6 pt
          from the edge, the plot area keeps 11 pt from edges, title and legend; axis labels may reach 4.5 pt into
          that margin (1.5 pt gap to an axis title). Horizontal legends are 1.2 times as wide as their entries
          ([key/2][key][key/2][text]) with equal gaps, squeeze to the chart width minus 30 pt and then wrap into
          balanced rows; rows are one line height plus 5.85 pt. Pies with data labels shrink by 1.785 × label size. A
          manual plot area layout places the inner plot area (layoutTarget inner) or, by default, the plot area with
          its axis labels (outer); w and h are sizes (wMode, hMode factor) or far edges (edge). Verified with
          generated/charts, charts-details and charts-data. Axis titles of 3D charts take their room at their axis's
          edge and stand centered on the plot area as on flat charts, white in the black chart area of an Office 2007
          style's highest level (docx/external/powertools/CU001: "Vehicles" and "Quarter" beside a 3D bar chart).
          Axis titles wrap at 0.8 of the chart's width; in Word an unturned title of a vertical axis at 0.2 of it, its
          padding included (docx/local/atl-*: Calibri 10 titles beside charts 288 to 576 pt wide break where a line
          would pass 0.2 of the width less 6 pt; docx/external/libreoffice/extras-layout/tdf134146). A
          title without text names the chart after its single series, after none without a name: the default title
          (docx/external/libreoffice/extras-ooxmlexport/chart-size: Word's "Diagrammtitel", 89.8 → 97.3 %; strict 98.9
          → 99.5 %, extras-layout/tdf137116 76.9 → 79.2 %). Line keys keep their size at every font size (legends of 7
          to 24 pt): a 12 pt key box, the line 19.1 pt long about 12.79 pt from the entry's edge, the text at 24.31
          pt; square keys scale with the line height. A legend at the side given a size of its own (c:manualLayout w,
          h) wraps its entries at its width less 4 pt and the key's room and shows k = min(n, ceil(height / tallest
          entry)) entries in equal slots of height / k, the tallest centered in its slot, all centered across
          (measured through COM, local/legend-manualsize; LibreOffice's tdf122765 shows 7 of 9). Keys draw markers at
          most half the font size and lines and marker edges at most 0.375 times it wide (local/legacy-legend* decks).
          A dashed line key makes every key longer: the line from 3.05 to 29.31 pt, the text at 31.5 pt
          (local/legacy-longkey). In Word a title without c:overlay overlays the plot as with val 1 (scratch/
          WordProbes/probe_charttitle.py on LibreOffice's extras-ooxmlexport/fdo78474: the pie centred in the whole
          chart, below the title with val 0; fdo78474 82.2 → 99.6 %, fdo76098 88.9 → 99.8 %). PowerPoint lays the
          plot area out as Word does: a title or legend placed by hand stands where its layout says, but the
          automatic plot area keeps the room of the automatic title and of the automatic legend at its legendPos
          (local/pielay-*: LibreOffice's chart2/tdf122765, a pie with a moved title and a legend placed across it,
          has the same plot area with both moved or not; 57.3 → 98.1 %).

      - id: chart.dataTable
        title: Data tables
        elements: [c:dTable, c:showHorzBorder, c:showVertBorder, c:showOutline, c:showKeys]
        priority: P3
        difficulty: 3
        status: done
        strategy: Table of the series values below the plot area.
        office: >-
          The table reaches 6 pt past the plot area's left and bottom edges; rows are L + 0.0925 s + 2.4 pt
          high and the name column holds the widest series name plus 1.0975 s + 2.89 pt (key 0.45 L at 0.26 L,
          text at 0.958 L); the plot area's left edge is the larger of the name column and the value labels,
          its bottom the table's top. Category labels move into the header row. The name column is at most a
          third of the chart's width: longer names break between words, the further lines centered under the
          widest, the key beside the first, and every further line makes the row a line taller with its values
          centered; header names break in their column less 2.7 pt on each side (local/dtable, dtable2: 99.8
          and 99.3 %). Without keys the names keep 3.91 pt from the plot area. A value axis title on the left
          shares its room with the name column: table and plot stand where they stand without it (Word,
          docx/local/d3t-flat: 0.3 pt). Below 3D columns the table hangs from the floor's front edge, its columns
          dividing that edge, its room taken as on flat charts (docx/external/powertools/CU008, CU013: 58.6 and
          62.0 → 91.5 and 92.3 %, about 5 pt wider than Word's). A deleted axis keeps its title (CU008, CU013). Line
          series have the legend's line keys, of a fixed size, and the name column is then wider by their text's
          offset less a square key's, about 1.025 s: 11.9 pt at 12 pt, 5.9 pt at 18 pt, with or without markers
          (local/dtkey-*); a table without c:spPr draws its borders as the style's axis lines (#898989;
          LibreOffice's chart2/tdf137691_dataTable 72.1 → 91.3 %).

      - id: chart.formatting
        title: Chart formatting, chart styles and colors
        elements: [c:spPr, c:txPr, c:dPt, c:pictureOptions, c:applyToFront, c:applyToSides, c:applyToEnd,
                   c:pictureFormat, c:pictureStackUnit, c14:spPr, c14:style, c16:spPr]
        namespaces: [cs]
        priority: P1
        difficulty: 3
        status: done
        strategy: >-
          spPr and txPr of every chart element use the shared DrawingML fill, line, effect and text code; the chart
          style and color parts (cs) only matter where a property is not set directly. Charts without a style part
          are drawn in the look of their Office 2007 style (c:style, c14:style) from the theme's fill, line and
          effect styles, measured in PowerPoint; series effects (a:effectLst, the styles' effect styles) are SVG
          filters on bars, slices, areas, bubbles and markers.
        office: >-
          PowerPoint draws bars on whole device pixels and thin lines and line chart vertices on the pixel
          grid (odd widths centered in a pixel); the renderer snaps the same way in slide pixel coordinates. Word
          sets bars on its 600 dpi grid of the page, their base on the axis where it is (LibreOffice's
          extras-layout/tdf138773: bars from 102.72 to 108.6 pt, 5.88 and 6.0 pt wide; with the measurement's
          rectangles in one form, 88.6 → 98.9 %, chart 95.8 → 99.5 %, CU006 96.4 → 99.8 %).
          The chart's areas (plot and chart area, legend, title) run from their bottom left corner right, up, left
          and down, where a dashed outline begins (Word's PDF of docx/external/libreoffice/extras-ooxmlexport/
          Chart_Plot_BorderLine_Style 77.5 → 99.6 %); bars do not (Chart_BorderLine_Style).
          Picture fills come from the chart part's relationships; c:pictureOptions stacks them from the bar's
          base at their own proportions (stack) or one per c:pictureStackUnit of the value axis (stackScale),
          else stretches them over the bar (generated/charts-data). Verified with generated/charts, charts-
          more and charts-data.
          What a chart does not format itself shows one of the 48 Office 2007 styles (c:style, 2 without; measured
          with all styles, 1 to 14 series and themes whose fill, line and effect styles can be told apart), also
          where the chart has chart style and color parts: PowerPoint draws by them only for a title it makes up
          from the series' name (no c:title: the style part's 18.62 pt regular gray, generated/charts), and for
          Office 2016 charts (the same look and colors with and without them, local/legacy-keepstyle-column; a
          plot area without spPr dark in style 47, LibreOffice's tdf136754). A chart's theme override brings its
          own fonts (POI's aascu deck: Calibri charts in a Lucida Sans deck): style N has the color variant (N − 1) % 8 (grays, the accents in turn, one
          accent) and the level (N − 1) / 8. Series colors cycle through the six grays (tx1 tinted 88, 55, 78, 92,
          70, 30 %) or accents with c = n / 6 + 1 cycles (one-accent styles: one per series); cycle j is shaded
          (before the middle) or tinted (after it) by 1.4 / (c + 1) per step in linear light, so six series are
          already darker. Points take fill style 1 (levels 0, 1, 4) or 3 (2, 3, 5) in their color, edges line
          style 1 in white (level 1) or shaded 50 % (level 4), effects effect style 2 (level 2) or 3 (3, 5).
          Series lines are line style 1's width times 3, 5 or 7 (level 3), markers floor(2 w + 3) pt (w the
          series line's own width or the style's) with an edge of line style 1 in the series color. Axis and
          grid lines are line style 1 in tx1 tinted 75 %; the chart area is unfilled up to level 3 (measured on a
          yellow slide), level 4 fills it white with a frame and tints the plot area 20 %, level 5 has a black
          chart area, a 95 % tx1 plot area and white text (white titles where their paragraphs have a:pPr). Text is 10 pt; titles are bold, 1.2 times the chart's text size (18 pt without
          one), title paragraphs without a:pPr 18 pt regular whatever the size; in Word title paragraphs whose a:pPr
          has a:defRPr without a size take 10 pt (probe_charttitle.py: fdo78474's "Sales" 9.96 pt bold, 18 pt
          without the a:pPr; fdo76098 alike). The full look needs c14:style (Office
          2010) or AppVersion 12 (Office 2007); otherwise (Office 2013 and later, other programs) PowerPoint
          draws axis and grid lines black, level 4 plot areas in the full accent and dark gray edges black
          (local/legacy-* decks).

      - id: chart.threeD
        title: 3D charts
        elements: [c:view3D, c:rotX, c:rotY, c:depthPercent, c:rAngAx, c:perspective, c:hPercent, c:floor,
                   c:sideWall, c:backWall, c:thickness, c:gapDepth]
        priority: P2
        difficulty: 5
        status: done
        strategy: Projected 3D geometry with simple shading.
        office: >-
          3D charts get a box (category axis along its width, values along its height, series or the bars' row in its
          depth) with the back wall, side wall and floor on its far sides, gridlines over the walls and labels at the
          front edges (category labels turn by 45° when crowded, dates when a label and a font size do not fit, where
          flat charts thin them out; series labels thin out). With right-angle axes (the default of 3D columns and
          bars) the box is drawn in an oblique projection: front faces stay rectangles and the depth runs along (sin
          rotY, sin rotX) at full length. Clustered and stacked bars stand in one row depthPercent × (1 + gapDepth)
          bar widths deep, each bar depthPercent × its width deep and centered; standard charts, areas, lines and
          surfaces give every series a row of depthPercent × the category width. Without hPercent the box is as tall
          as the plot area's height/width ratio times its width (times floor((categories + series)/2) category widths
          with series rows; areas whose categories sit on the box's edges keep the height of n − 1 of their n category
          widths, their depth stays depthPercent of W/n: measured on 3D stacked areas of 5 and 8 categories), fitted
          to the plot area less the labels, which 3D charts compute like flat ones: labels centered on the edges of
          area and surface charts stay within the outer edges and the series axis keeps a category label gap (measured
          on single boxes with colored walls at 20 rotations and 22 category/series combinations, and with
          local/area3d, area3d3 and inset3d: 99.4 to 99.7 %). Without right-angle axes a perspective camera looks
          along the plot area's centre with a field of view of perspective/2 degrees spanning its height, the scene
          turned by rotY then rotX, and the box is fitted each way on its own: the camera's place across is where the
          box centred across fills the plot area's width, its place up and down where the box centred that way fills
          the height, and it backs off along its axis to 1.032 times the farther of both distances, keeping both
          places, so the box is off centre the way it does not fill (rotY 40°: 28 px left of centre, 60°: 77 px on a
          1037 px wide plot area). The automatic plot area of 3D charts lies 11 pt inside the chart on every side (COM
          reports 7 pt left and top); a manual inner layout places the box's plot area itself. Measured with
          local/persp5, persp6m and persp7 (40 empty boxes with colored walls, standard and clustered, rotY 10–80°,
          rotX 5–45°, perspective 20–100, depth 40–400 %, seven plot areas): corners within 1 to 5 px, the decks at
          98.5 to 99.5 %. With right-angle axes the box is fitted into the plot area less 1.72 pt on the left, 2.79
          above, 3.34 on the right and 1.9 below, whatever the chart's size, and the value axis takes its steps from
          the box as large as the whole plot area; bars lie on their side, the floor standing at the category axis on
          the left and the side wall below them, each lit as the face it is; labels at the floor's ends (a value axis
          of bars) keep their outer halves in the plot area (measured with docx/local/c3o-*: bars and columns of 432
          by 252 and 300 by 300 pt, rotations 0 to 40°, depths 100 and 200 %, gap depths 0 and 150 %, gap widths 150
          and 300 %, the box within 0.3 pt, turned 30 and 40° within 1.5 pt; docx/external/powertools/CU007 83.0 →
          93.7 %, CU012 79.3 → 90.4 %, CU001 86.2 → 90.5 %, libreoffice/extras-ooxmlexport/chart-dupe 67.8 → 91.2 %,
          chart-prop 79.8 → 95.5 %; external/libreoffice/chart2/bnc864396 83.4 → 95.9 %, generated/charts-3d 94.0 →
          96.8 %, local/labels3d 89.4 → 93.4 %). One light shades everything (0.4 ambient plus n · (0.239, 0.357,
          −0.6)): fronts 1.0, tops and the floor 0.757, right sides and the side wall 0.639, sloped area and line tops
          in between; cylinders and cones get measured gradients (1.07 − 0.47 t², 1.13 − 0.48 t²), pyramids flat
          faces, cones and pyramids taper to the bar's end, the stack's end or the axis maximum (…ToMax). Areas are
          slabs, lines ribbons, surfaces meshes cut into the value bands (wireframes as band-colored grid and contour
          lines); 3D value axes get no headroom, horizontal ones keep four font sizes per interval as on flat charts
          (docx/external/powertools/CU012: 0 to 5 by 0.5). 3D pies are disks 0.24 of their radius thick, slices
          clockwise from the back at rotY, lit by a view light (tops 0.4 + 0.43 (cos rotX + sin rotX) with a small
          highlight, sides a gradient from the front's light, cut faces of exploded slices lit from the right);
          exploded pies fit as a disk as wide as their farthest slice; in Word slices that cast a shadow (an outer
          shadow of their own, their series' or their style's) also fit a disc 1.0896 times as wide at the pie's bottom
          face, whatever the shadow (docx/local/p3x-*, p3s-*; libreoffice/writerfilter-dmapper/chart-zorder 87.7 →
          98.3 %). Data labels: on bars beyond the end face,
          centered on the front face (ctr, inEnd, inBase on it), on areas halfway up their band on the front, beside
          the points of lines, on pies inside the top as far out as they fit (outEnd beyond the rim), a labelled pie
          fitting at 89 % of its size; horizontal value axes keep a label and three font sizes per interval. Thick
          walls (c:thickness, a percentage of the box's smaller side: 10 % of a 0.82 high box reach 0.083 of its
          width) are slabs beside, below and behind the box that take their room in the fit, carry the labels on their
          outer faces and the gridlines across their front and end faces (generated/charts-data slide 6: 94.8 %, 57.7
          % before). Bars without fill and line draw nothing, their faces unshaded. Checked with generated/charts-3d
          (92.8 %, 18 slides; 88 % before the perspective fit) and local/persp to persp4 (97.0 to 99.5 %). 3D surfaces
          (measured with local/surf3d, surf3d2, surfbox and surfwalls: single cells of known slope, folded cells, 16
          grids and walls seen from 13 sides, 93.7 to 98.5 %): the box is ⌊(categories + series − 1)/2⌋ category
          widths high, each cell folds along the diagonal with the larger sum, facets are lit 0.821 + 0.313 n·(0.768,
          0.182, −0.614) for the normal as the camera sees it in perspective and 0.641 + 0.380 n·(0.616, 0.491,
          −0.616) in the box with right-angle axes, their walls 0.4 + 0.75 n·(0.572, 0.586, −0.574) for the inner
          normal (seen by the camera, or in the box with right-angle axes); at rotY 0 the side wall stands on the
          left. Views from other sides (local/backview, rotY 100° to 300°, 95.1 %): seen from behind (the camera
          beyond the middle of the box's depth) the back wall stands at the near end of the data and the floor's
          labels run along its near edge; the vertical axis always stands at the box's left end (x = 0), on whichever
          of its two edges lies outside on the screen, from behind on the right where its labels take no room; labels
          along a floor edge within 34° of the horizontal stand under it, else beside it away from the box (categories
          under at 27° and 32°, beside at 36°; series under at 12°, beside at 41°). Wireframes (local/wire and wire2,
          single cells with bands every 2): grid pieces in their band's line, a level piece on a band boundary in the
          band below, contour lines in the line of the band below (generated/charts-3d slide 13: 87.7 %, 76.3 %
          before). Category labels under the floor get 0.94 of their categories' share of its edge's width on the
          screen, wrap at their spaces when they do not fit and turn by 45° when a word alone does not (local/wrap3d:
          clustered columns 300 to 840 pt wide, names of one to three words, turned 20°, 300° and 330°: 96.3 %). Known
          deviations: the topmost contour of wireframe cells rising like a plane, which PowerPoint draws in the band
          above (not in saddles, whose contours match), and labels on the edge of fitting under an edge rising 32°
          (local/backview slide 6), which PowerPoint wraps where the box's size with single-line labels lets them fit.

      - id: chart.analysis
        title: Trendlines and error bars
        elements: [c:trendline, c:trendlineType, c:period, c:forward, c:backward, c:intercept, c:dispRSqr, c:dispEq,
                   c:trendlineLbl, c:errBars, c:errDir, c:errBarType, c:errValType, c:noEndCap, c:plus, c:minus]
        priority: P2
        difficulty: 3
        status: done
        strategy: Regression fits (linear, exponential, logarithmic, polynomial, power, moving average) and error bars.
        office: >-
          Trendlines: linear, exponential, logarithmic, polynomial (order 2-6), power and moving average, with
          forward/backward forecast and fixed intercepts, drawn 1.5 pt dotted in the series color by default
          and clipped to the plot area. Equation and R squared labels show coefficients rounded to 4 decimals;
          the block is vertically centered on the trendline's end, its right edge 8.8 pt left of it
          (measured). Legend entries follow the series; a dashed key line (the dotted trendline's, or a
          series') gives every entry a longer key of 31.5 pt (a solid trendline does not). Error bars: fixed value, percentage, standard error, custom values and standard deviation
          (around the mean of all values, like Office), 4.5 pt caps; they extend the value axis. A trendline without
          a line of its own takes the Office 2007 style's: the theme's line style 1 in tx1 (LibreOffice's
          chart2/tdf127720, a 1 px black line in style 18, 88.2 → 95.0 %); PowerPoint writes its 1.5 pt dotted line
          into the files it saves.

      - id: chart.userShapes
        title: Shapes drawn on charts
        elements: [c:userShapes]
        namespaces: [cdr]
        priority: P3
        difficulty: 2
        status: done
        strategy: Shapes anchored in relative or absolute chart coordinates; drawn with the normal shape code.
        office: >-
          A chart's drawing part (c:userShapes) anchors shapes by fractions of the chart frame (relSizeAnchor
          from/to) or by a corner and a size (absSizeAnchor); the shapes are DrawingML shapes, groups,
          pictures and connectors like on slides, their text without a size takes the chart's text properties,
          else 10 pt (measured with generated/charts-more).

      - id: chart.pivot
        title: Pivot chart settings
        elements: [c:pivotSource, c:pivotFmts, c:pivotFmt, c15:pivotSource, c16:pivotOptions16,
                   c16:showExpandCollapseFieldButtons, c14:dropZone*, c14:pivotOptions]
        priority: P3
        difficulty: 1
        status: done
        strategy: Field buttons are not shown in presentations; pivot formats apply like data point formats.
        office: >-
          Pivot sources, pivot formats and field button options do not change the picture: PowerPoint shows
          pivot charts like other charts, with the formats stored on the series and points, and without field
          buttons.

      - id: chart.ex
        title: Office 2016 charts (chartex)
        description: Waterfall, treemap, sunburst, histogram, Pareto, box and whisker, funnel and region map.
        namespaces: [cx]
        priority: P2
        difficulty: 4
        status: done
        strategy: >-
          Each type needs its own layout (treemap squarify, sunburst rings, histogram binning, box plot statistics);
          region maps use the geography data cached in the file. Check whether mc:Fallback contains a usable picture.
        office: >-
          PowerPoint saves Office 2016 charts as mc:AlternateContent (Requires cx1/cx2) with a picture of the
          chart in mc:Fallback, which PowerPoint does not show: it draws the chart itself, its default words in
          Office's language, where the picture has those of the Office that saved it (openxml-sdk's Of16-01 89 →
          99 %, Of16-02 75 → 99 %; a German "Standard" format code is General). So the chart is laid out
          natively, in Word documents as in decks (docx chart.ex): a classic frame built
          from it (title, legend, axes) with layout rules measured on probe decks of 130 to 450 pt wide charts
          (local chartex, chartex-p1 … p4, chartex-pareto: 96–99 %): the plot area 6 pt from the edges and 4.25 pt
          below the title's line, axis labels 6.9 pt off it, category labels in a row, staggered up to 1.3 slots,
          turned by −30° up to 1.65 and −60° up to 2.15 slots, else upright; legends packed in rows of at most 80 %
          of the chart; histogram bins of Scott's width to two significant digits without axis headroom; waterfall
          totals and connectors; funnels; Pareto lines on a percentage axis; box plots (exclusive or inclusive
          quartiles, 1.5 IQR whiskers, outliers, means: the series share the category's width over 1 + gapWidth, a
          single one filling it, several each 1 / (1.105 n − 0.0525) of it and 1.105 boxes apart from its left edge
          less half their line, caps 0.3 of the box wide, the mean's cross 6 pt, outliers dots of 3 pt outlined, the
          category axis at the value axis's minimum and hidden outliers out of its range; measured in Word with
          docx/local/bxw-*: one to three series, gap widths 0 to 2, one to three categories, within 0.3 pt, 41–96 →
          94–98 %; local/chartex and chartex-p1 box plot slides 95.9 → 98.8 %, 97.4 → 98.9 %); squarified treemaps
          with overlapping or banner labels;
          sunbursts sorted by size with radial, wrapped labels. Region maps (local chartex-map … map4 at 300 to
          900 pt: 98.4–99.9 %) are drawn from their geography cache (raw deflated XML whose rings are Bing point
          compressed in the base64url alphabet) in Robinson's projection, 1.5 % wider than defined, fitted beside
          a color scale legend (interpolated in linear light) with the map's credits below; like PowerPoint's own
          pictures of such files, every region is gray, as the cache does not tell which region a data point names.
          A color style that varies one color (meth withinLinear, Office's monochromatic palettes) spreads its n
          colors evenly from a shade to a tint, the i-th v = 0.7 (2i + 1 − n) / (n + 1) of the way in linear light
          (docx/local/bxl-*: box plots of one to six series on accent1 and accent2, 29 colors within one level; a
          waterfall's three kinds take the first three of four, openxml-sdk/Of16-07). Axis titles (cx:axis cx:title)
          read Office's words where they have no text. Word lays these charts out with measures of its own
          (docx/local/wfl-*: waterfall legends of 7 to 16 pt at the top, bottom and right, axis titles of 10 and 14
          pt, 98.5–99.4 %): the chart area as the style part has it (white, outlined in D9D9D9; PowerPoint draws
          none), its words in its own language (the engine's culture: "Diagrammtitel", "Anstieg", "Achsentitel");
          legend keys of 7.2 pt whatever the text's size, 3.9 pt before their text, entries 7.4 pt apart, rows at
          least 14.08 pt high, the row at the top 9.2 pt below the title's line (10.96 pt inside the chart without
          one) and 1.62 pt right of the middle, the plot area 9.16 pt below it, 10.27 pt above a legend at the bottom
          and 13.68 pt from one at the side; axis titles at the edge with their axis's labels their lines' height and
          6.6 pt further in; value labels half a line above the plot area also below a title alone.
          Not reproduced: the ellipsis PowerPoint puts on long category labels in very short charts.

  - id: smartart
    title: SmartArt
    features:
      - id: smartart.drawing
        title: Saved SmartArt drawing
        elements: [dgm:relIds]
        namespaces: [dsp]
        priority: P1
        difficulty: 2
        status: done
        strategy: Draw the shapes from the diagram's drawing part like normal shapes.
        office: >-
          PowerPoint stores the laid-out shapes of every SmartArt in a drawing part (dsp:drawing), so files
          saved by PowerPoint need no SmartArt layout engine. The drawing is not complete, though: PowerPoint
          draws the text in the color the color definition gives the shape's style label (txFillClrLst, by the
          presentation point's presStyleIdx/presStyleCnt) where the drawing keeps the quick style's fontRef
          color (white text on the white boxes of the outline color schemes otherwise); it formats text by the
          layout's list style (Office 2016 extension dgm1612:lstStyle, by the depth of the text's data point,
          which the drawing loses: the layout tree tells which points each shape shows); and a 3D quick
          style's scene (styleDef/scene3d: camera with zoom and light rig) turns the whole diagram about its
          center, which the drawing does not keep either (Camera.Pivot, Camera.Zoom). A text rectangle
          (dsp:txXfrm) stands where the shape stands, turned by the shape's rotation plus its own (rot 90 with
          a text rot of -90 keeps the text of a turned chevron upright). Measured with all 159 layouts (98.8
          %) and all 38 color definitions and 14 quick styles on a process (98.6 %, the rest 3D materials).
          A drawing part without shapes counts as missing: PowerPoint lays the diagram out anew (LibreOffice's
          SmartArt test decks, whose drawings are emptied).

      - id: smartart.data
        title: SmartArt data model
        elements: [dgm:dataModel, dgm:ptLst, dgm:pt, dgm:prSet, dgm:presLayoutVars, dgm:orgChart, dgm:chMax,
                   dgm:chPref, dgm:bulletEnabled, dgm:dir, dgm:hierBranch, dgm:animOne, dgm:animLvl,
                   dgm:resizeHandles, dgm:cxnLst, dgm:cxn, dgm:t, dgm:spPr, dgm:whole, dgm:bg]
        namespaces: [dgm14, dgm1611, dgm1612]
        priority: P2
        difficulty: 3
        status: done
        strategy: The text and structure of the nodes; needed for editing and for files without a drawing part.
        office: >-
          PowerPoint keeps the laid-out shapes in the drawing part (smartart.drawing); the data model adds the
          diagram's own formatting: dgm:bg (fill and effects, e.g. a shadow) is drawn as a rectangle over the
          frame behind the shapes and dgm:whole (line and effects) on top of them (measured with
          generated/smartart: 99.2 %). The diagram is an element of its own sized like its frame, which
          animations of the whole diagram change; every shape carries the model id of its presentation point,
          which per-shape animations target (p:graphicEl/a:dgm with the drawing shape's model id; ids of data
          nodes or transitions animate nothing in PowerPoint, measured with its video export), and a:dgm
          bldStep=bg targets the background and outline. Checked against PowerPoint's video of
          generated/smartart slide 3 (background, a node fading, a node and its connector flying in, the rest
          appearing): 96.8 % (tools/Fidelity animate). The node structure (points, connections, presentation
          variables) only serves the layout engine for files without a drawing part (smartart.layout).

      - id: smartart.layout
        title: SmartArt layout engine
        elements: [dgm:layoutDef, dgm:layoutNode, dgm:alg, dgm:param,
                   dgm:shape, dgm:adjLst, dgm:adj, dgm:presOf, dgm:constrLst, dgm:constr, dgm:ruleLst, dgm:rule,
                   dgm:varLst, dgm:forEach, dgm:choose, dgm:if, dgm:else, dgm:sampData, dgm:styleData, dgm:clrData,
                   dgm:catLst, dgm:cat, dgm:title, dgm:desc]
        priority: P3
        difficulty: 5
        status: done
        strategy: >-
          Only for SmartArt without a saved drawing (files from other producers): layout algorithms (linear, snake,
          cycle, hierarchy, pyramid …) with constraints and rules.
        office: >-
          Only for SmartArt without a saved drawing (PowerPoint 2007 and other producers; PowerPoint itself
          always saves one). The layout tree is instantiated for the data model (all 159 built-in layouts
          match PowerPoint's presentation points; pos functions with an axis take the first selected point's
          position). Constraints: a node's own values first, those its ancestors give over them (the nearest
          last; equalizing and defaulting constraints do not count); a node showing a node's text counts as
          one for ptType; sp given to all descendants skips the lines laying out the owner's own point; a
          list's lte and gte bounds on other nodes hold where they stand and again until they hold together, a
          node's bounds on itself at the end, a value only bounds give follows them unless fitting fixed it,
          bounds on user variables hold nothing, and bounds between font sizes lower the larger one after
          fitting (an unset size being the default 36 pt), bounds with a negative factor hold nothing; a
          constraint without value or reference gives 0
          only where nothing else gives a value, in the node's own list only where nothing before it does
          (HorizontalActionList's titles, h <= 0.3 w then h: 0.3 w high; arrow5's ring of eight, sibSp then
          sibSp <= 0.1 h: spaced 0); edges, centers and sizes are derived from each other with
          their offsets, references to a placed node read its laid-out box (sizes without its own offset), a
          root's child taller than the diagram as high as it (a square one keeping its shape), references to a
          node no instance
          of which exists take the value the list would give it, and every node evaluates its list again once
          its parent's algorithm gives it its box. Rules lower their targets toward val, or toward fact times
          what the target's value refers to; a lin node's font size rule also applies while a child is larger
          across the line than the node, strictly (LibreOffice's smartart-dir: hList1's columns at 31 pt in a
          frame 182.5 pt high, 56 -> 99.8 %), the children measured once the bounds their own lists set have
          settled (process3's descriptions below titles h <= 0.4 w: the row keeps its width and the titles
          their 34 pt; LibreOffice's smartart-accent-process 72.1 -> 98.6 %). Text whose runs all have sizes of their own keeps them and is not
          fitted; its margins follow that size, while boxes sized from its font size keep the size the
          constraints gave (LibreOffice's fill-color-list: titles of 18 pt, descriptions 1.22 x 65 high, 51 ->
          100 %). Algorithms: composite (the room of all its children's boxes,
          invisible leaves included, a child taking its box keeping the bounds the composite sets between its
          width and height by giving up room across, centered, a lin child without a size taking its box; ar
          keeps its box while references see its constraint size; a composite root's drawing centered in the
          frame), lin (its rules on the children's length first, by halving to within a point of the room,
          font size rules in whole points, then uniform shrinking, a shrunk composite taking its content's
          room, along and, without a size of its own, across; a lin child whose children all stay narrower across its line taking their room; the row as
          long as the farthest a child reaches; sp only between neighbors without a spacer node; the row
          aligned in the node and each child across it; fallback 2D laid out at the own size and
          scaled; a tree alone on the line centered by itself; children's subtrees evaluated for its box
          before they are measured), snake (rules in 32nds of the way, fixed and balanced breakpoints, cells
          in place by their box and the grid aligned by the room their shapes take, short rows from their
          start unless off ctr, each row alignOff further, rows growing from grDir, cells never grown,
          connectors with a size spacing the cells, line gaps following the placed cells they refer to), cycle
          (the circle as small as keeps each two neighbors' outlines, an ellipse's or a box's as laid out, not
          turned along the path, sibSp apart along the line between them, each next but one at least touching,
          and the ring sp from the middle shape; measured with arrow5 and arrow1 at 3 to 8 nodes and sibSp from
          -0.9 to 0.3 times their width, 26 rings within 0.2 %: three nodes never closer than touching, seven
          spaced by the box their turned neighbors would not have; the node's rules in 32nds before
          shrinking; a ring with room to spare spreading out up to its own diameter, the shapes keeping their
          size; curved connectors as circular arrows or arcs over their span, padded along the arc),
          hierRoot/hierChild (subtrees as close as the shapes lying side by side allow, sibSp apart; rows
          lined up with the root's box and hung sp beyond its shapes; parents centered over their first and
          last child's head; assistants on a level of their own, in a horizontal chart a column of their own
          half their sibSp above the line; bent connectors; texts' values evaluated again as drawn), pyra
          (text rectangles 0.65 of a level's width, the apex's whole box), connectors between the shapes they
          join (named ends found inside the transitions' nodes, the diagram's own, the siblings named or the
          one node of that name; straight ones between named points, an automatic end at the middle of its
          node's side nearest to the named one, the radial points where a cycle's circle meets the nodes, or a
          center; placed again once laid out where they join nodes outside their parent; connDist made equal
          at the shortest; curved ones with a diameter along
          their circle between their named points, a diameter of connDist following it, negative ones
          counterclockwise, one from a node back to itself in a cycle closing the ring short of the node by
          0.09°, a band without heads in a cycle a quarter of its width further in; stems alone 0.6 of the height without heads; lines without a height having none).
          Shapes turned by their rot take the size whose turned bounds are their box; a composite root is
          centered where its drawing fits the frame with its own connectors. Text fitting: every line its
          font's height times the line spacing, paragraphs apart by their space after, within the geometry's
          text rectangle and the margins (a boxless text node within the shape showing it); 36 pt where no
          constraint gives a size; font sizes in whole points, secondary sizes by their own rules, equ groups
          at their smallest; heights growing in sixteenths as far as the parent has room and lte bounds allow,
          widths growing in 32nds of the way to a rule's limit; descendants' text at the top level unless
          bullets start at its depth; the diagram laid out again with the pinned values. The output writes the
          shapes the way PowerPoint writes its drawing (text nodes' text taken by shapes showing the same
          data, styles and colors by label); a data point's own formatting (dgm:pt/dgm:spPr) colors the
          shape showing its text, unless that shape hides its geometry, before the shape's presentation
          point's (LibreOffice's smartart-cycle-matrix: 75.3 to 98.7 %); bulleted text hangs by 4.5 pt per
          size class (4.5 pt below 12 pt, 9 below 16, 13.5 below 20, 18 below 28, then 22.5; measured on
          PowerPoint's drawings of one diagram at 22 sizes). Measured against PowerPoint's drawings of the 159 layouts: 1349
          of 1455 shapes within 1 %, 146 diagrams exact, 745 of 823 font sizes (151 shapes and 12 diagrams
          before this engine work); against generated decks of snake, picture, cycle, radial and hierarchy
          layouts at 1 to 8 nodes: 541 of 542, 550 of 594, 311 of 320, 412 of 427 and 578 of 690 shapes;
          rendered with the drawings removed 94.1 % (38.5 % before), all color definitions and quick styles on
          a process 97.9 %. Known deviations (only for diagrams saved without their drawing): HorizontalActionList's
          description boxes, which PowerPoint keeps at one height for two or more nodes that depends on the
          frame alone (250.3 pt in 840 x 460, 133 in 840 x 300, 285.1 in 600 x 460; one node fills the
          composite), AscendingPictureAccentProcess's drawing, which PowerPoint shrinks by 0.74 to 0.93 for 2
          to 5 nodes and centers by its outline, BendingPictureBlocks' pictures overhanging their composites,
          cycle3's long curves, NameandTitleOrganizationalChart's names narrower than their constraint and
          radial2's ring (2 % smaller), each within 1 to 7 % (sa_all: 13 of 159 layouts not exact), and
          process3 with a description longer than its box, for which PowerPoint lowers the titles' font size
          the description's follows and grows the box, where the engine lets the description overflow. A lin node
          shrinks to its children along its line as well as across it, and its parent aligns it by nodeHorzAlign or
          nodeVertAlign: a row of vList5 whose node has no children is as wide as its parent text and stands at the
          left with nodeHorzAlign l, in the middle with ctr, at the right with r, whatever the row's own direction
          and horzAlign (local/vlist-*, layout variants laid out by PowerPoint; LibreOffice's
          sd/smartart-vertical-block-list 76.0 → 99.6 %, the probe decks sa_* unchanged).
      - id: smartart.styles
        title: SmartArt styles and color definitions
        elements: [dgm:styleDef, dgm:styleLbl, dgm:scene3d, dgm:sp3d,
                   dgm:txPr, dgm:style, dgm:colorsDef, dgm:fillClrLst,
                   dgm:linClrLst, dgm:effectClrLst, dgm:txLinClrLst, dgm:txFillClrLst, dgm:txEffectClrLst]
        priority: P3
        difficulty: 3
        status: done
        strategy: Part of the layout engine path.
        office: >-
          Color definitions: each style label lists fill, line, effect and text colors applied in turn
          (repeat), spread from the first to the last color (span: shape i of n at i/(n-1)) or there and back
          (cycle: 2i/n up to the middle, then back), spread colors written as the first with the HSL and alpha
          differences added (hueOff, satOff, lumOff, alphaOff; hue clockwise unless hueDir=ccw); PowerPoint's
          offsets match HSL differences computed with the sRGB transfer function for tint and shade. The index
          is the presentation point's presStyleIdx of presStyleCnt: shapes showing the same data points share
          one, decorations count each. Text color from txFillClrLst, else the quick style's fontRef. The quick
          style's scene3d turns the whole diagram (3d5 to 3d9 styles); its labels give style references, sp3d
          and light rigs, which the drawing keeps; its labels' text properties (dgm:txPr, the 3d9 style's
          a:sp3d extrusion) go into the text body's a:bodyPr. Applied to diagrams with a saved drawing
          (smartart.drawing) and to those the engine lays out (smartart.layout writes style references, color
          list colors, 3D properties and text properties per label like PowerPoint's drawings; all color
          definitions and quick styles on a process with the drawings removed: 95.7 %). Built-in color
          definitions leave txLinClrLst and txEffectClrLst empty; they are not applied.

  - id: transition
    title: Slide transitions
    features:
      - id: transition.settings
        title: Transition timing and sound
        elements: [p:transition, p:sndAc, p:stSnd, p:endSnd, p:snd]
        priority: P1
        difficulty: 2
        status: done
        strategy: Duration from spd or p14:dur; advance on click and/or after advTm; optional sound.

      - id: transition.classic
        title: Classic transitions
        elements: [p:blinds, p:checker, p:circle, p:comb, p:cover, p:cut, p:diamond, p:dissolve, p:fade, p:newsflash,
                   p:plus, p:pull, p:push, p:random, p:randomBar, p:split, p:strips, p:wedge, p:wheel, p:wipe, p:zoom]
        priority: P1
        difficulty: 3
        status: done
        strategy: Two stacked slide layers with SVG masks, transforms and opacity; WebGL for the 3D ones.
        office: >-
          Compared with PowerPoint's videos (tools/Fidelity transitions): 95.2 % over
          generated/transitions-classic. Masks with the soft edges PowerPoint draws for wipes, splits, strips,
          shapes and wheels; push, cover, uncover, comb, zoom and newsflash with PowerPoint's easing; blinds
          and checkerboard turn bands and tiles over in 3D as PowerPoint plays them since 2013; dissolve and
          random bars use random patterns of their own.

      - id: transition.office2010
        title: Office 2010 transitions
        elements: [p14:conveyor, p14:doors, p14:ferris, p14:flash, p14:flip, p14:flythrough, p14:gallery,
                   p14:glitter, p14:honeycomb, p14:pan, p14:prism, p14:reveal, p14:ripple, p14:shred, p14:switch,
                   p14:vortex, p14:warp, p14:wheelReverse, p14:window]
        priority: P2
        difficulty: 4
        status: done
        strategy: >-
          The slides (or their content and backgrounds apart) rasterized into textures and drawn in a WebGL scene
          with PowerPoint's camera; particle-like ones (vortex, shred, honeycomb, glitter) as many small tiles.
        office: >-
          All of them, compared with PowerPoint's videos: 83.4 % over generated/transitions-2010. Prism, cube,
          box, orbit, flip, switch, gallery, doors, window, ferris wheel, conveyor, pan, fly through, warp,
          reveal and flash as WebGL scenes whose poses and timing are fitted frame by frame; ripple as a
          growing soft circle; glitter, vortex, shred and honeycomb as turning tiles and particles with
          PowerPoint's timing, their random patterns differing from PowerPoint's. Written as
          mc:AlternateContent with a p:fade fallback.

      - id: transition.office2013
        title: Office 2013 transitions
        elements: [p15:prstTrans]
        priority: P2
        difficulty: 5
        status: done
        strategy: The slides as WebGL meshes deformed per vertex (hinged, curled, gathered, crumpled, shattered, folded).
        office: >-
          All presets with invX, compared with PowerPoint's videos: 83.9 % over generated/transitions-2013.
          Fall over, drape, curtains, wind, prestige, crush, fracture, peel off, page curl (single and
          double), airplane and origami as meshes bent, folded and moved with keyframes measured from the
          videos; airplane and origami fold into simplified shapes.

      - id: transition.morph
        title: Morph
        elements: [p159:morph]
        priority: P2
        difficulty: 5
        status: done
        strategy: >-
          Match objects between the two slides (same name, names starting with !!, similar content), then interpolate
          position, size, rotation, fill and geometry; words or characters for text.
        office: >-
          Compared with PowerPoint's video: 96.8 % over generated/transitions-morph (objects, words,
          characters, !! names). Shapes paired by name move, grow and turn at PowerPoint's ease, the old one
          fading out over the new one; text by words or characters moves unit by unit. Written as
          mc:AlternateContent with p:fade in mc:Fallback.

  - id: animation
    title: Animations
    features:
      - id: animation.timing
        title: Timing tree
        elements: [p:timing, p:tnLst, p:par, p:seq, p:excl, p:cTn, p:childTnLst, p:subTnLst, p:stCondLst,
                   p:endCondLst, p:endSync, p:nextCondLst, p:prevCondLst, p:cond, p:tn, p:rtn, p:iterate, p:tmAbs,
                   p:tmPct]
        priority: P1
        difficulty: 4
        status: done
        strategy: >-
          A JS timing engine for the SMIL-like time containers (par, seq, excl): click sequences, with/after previous,
          triggers on shapes and media bookmarks, fill, repeat, auto-reverse, acceleration and deceleration.
        office: >-
          Checked against PowerPoint's own video of the slides (tools/Fidelity animate: slideshow 99.9 %,
          smartart 99.9 %, animations-charts 99.6 %, animations-text 100.0 %, animations-gallery 99.7 % of
          frames). Acceleration and deceleration follow a smoothstep speed curve (measured on six accel/decel
          pairs). A behaviour without fill of its own reverts when it ends, a set without duration holds;
          formulas take the current values (ppt_x, ppt_y …, not #ppt_x) as they are when their behaviour
          begins, a behaviour ending just then with its end (Bounce Out's fall and bounces build on each
          other). Text built letter by letter or word by word (p:iterate lt, wd; el, the default, animates the
          whole target): the shape's background first for the effect's duration when the build animates it
          (bldP animBg) and for emphases, then every letter or word (blanks are none) with the whole effect,
          tmPct of the effect's duration or tmAbs apart; a group after the previous effect starts when the
          groups before it end (the stored delay is the editor's guess, which iterated text outlasts). After
          effects and sounds (p:subTnLst): sameClick ones when their effect begins or ends as their condition
          says, nextClick ones (dim, hide on next click) when the next effect of the sequence begins.
          Containers repeat (repeatCount, repeatDur); indefinite repeats go on after their step until the end
          of the slide, or until the next click with an onNext end condition (checked live). A container ends
          with its last child (endSync all), with its first under endSync first; an exclusive container
          (p:excl) stops the child playing when another begins. Interactive sequences (triggers) play a click
          group per click on their shape or bookmark; once played (endSync all) the next click starts them
          again (restart whenNotActive), not with restart never. Effects with fill=remove rewind when done,
          tmFilter remaps progress, p14:bounceEnd swings about the end as a damped spring over its share of
          the duration (fitted on five videos). PowerPoint's video clock advances whole milliseconds per frame
          (33 ms at 30 fps) within a step while steps follow the video's frames; the player's frame mode does
          the same.

      - id: animation.targets
        title: Animation targets
        elements: [p:tgtEl, p:spTgt, p:sldTgt, p:sndTgt, p:inkTgt, p:txEl, p:charRg, p:pRg, p:graphicEl, p:oleChartEl,
                   p:subSp, a:dgm, a:chart]
        priority: P1
        difficulty: 3
        status: done
        strategy: >-
          Targets are shapes, paragraph or character ranges and chart or SmartArt parts, so the rendered output must
          keep those addressable.
        office: >-
          Shapes, paragraph ranges (p:pRg), character ranges (p:charRg; their text is drawn character by
          character), backgrounds (p:bg), SmartArt shapes (a:dgm), chart parts (a:chart: series, categories,
          points, background), the letters and words of text built by iteration (data-c, data-w), sounds
          (p:sndTgt, played with their effect) and ink (p:inkTgt, and p:spTgt of an ink content part, which
          PowerPoint writes: the ink is drawn with its shape id; checked with a fade on two ink drawings) are
          addressable.

      - id: animation.behaviors
        title: Animation behaviours
        elements: [p:anim, p:animClr, p:animEffect, p:animMotion, p:animRot, p:animScale, p:set, p:cmd, p:cBhvr,
                   p:attrNameLst, p:attrName, p:tavLst, p:tav, p:val, p:boolVal, p:intVal, p:fltVal, p:strVal,
                   p:clrVal, p:by, p:from, p:to, p:rgb, p:hsl, p:rCtr, p:progress]
        priority: P1
        difficulty: 4
        status: done
        strategy: >-
          Attribute names (ppt_x, ppt_y, ppt_w, ppt_h, style.rotation, style.opacity, style.visibility, fillcolor …)
          map to properties of the rendered elements; animEffect filters (fade, wipe, barn, blinds, circle …) become
          SVG masks; motion paths are relative path strings.
        office: >-
          Formulas use ppt_x, ppt_y, ppt_w, ppt_h (the property's current value as the behaviour begins, used
          by exit effects such as Fly Out and Bounce Out) besides #ppt_x … (the value before the animation).
          Motion paths move at a speed even in the path's own units (fractions of the slide's width and
          height), not on the screen (measured with a circle path: 1.1 px against 7.6 px). Filters (measured
          frame by frame with PowerPoint's videos of every filter and direction, entrance and exit): every
          point of the shape's drawn bounds (its outline included) has a moment u at which the edge passes it,
          in the bounds' own proportions: the distance from the starting side (wipe; blinds in 6 bands;
          checkerboard in 6 x 6 cells, odd rows half a cell over), from the middle (box, circle reaching the
          corners, diamond, plus, barn), the angle from 12 o'clock (wedge both ways, wheel per spoke), the
          diagonal of a 16 x 16 block grid (strips, u = d/31). The edge is a linear ramp 0.14 wide from just
          before u = 0 to just past u = 1. Exits hide what the edge passes; blinds, checkerboard and strips
          play their entrance backwards instead. Dissolve shows one-pixel specks at the pace of the average of
          three random numbers (an S curve), random bars one-pixel lines at a measured pace. The player draws
          all of them as SVG masks (gradients, fans, a thresholded noise image) on the shape's drawing, so
          outlines past the shape's box stay; groups get a CSS mask over their box. Color animations work in
          RGB and HSL (to, by; the hue turns the way dir says whatever the sign of by, Complementary Color 2).
          Text formatting (style.fontWeight, style.fontStyle, style.textDecorationUnderline, style.fontFamily)
          shows the text laid out anew in the real faces, as PowerPoint does: the converter draws it in every
          formatting the timing gives it, per paragraph or, for text built letter by letter, per letter (lined
          up with the letter it stands for); style.fontSize scales the text about its anchor and ends in the
          text laid out at that size. fill.on gives a shape without fill the animated fill; stroke.on,
          fill.opacity, stroke.opacity, stroke.weight, ppt_r and imageData.grayscale (VML-era names
          PowerPoint's presets do not use) are applied too. Effects of an iterated build animate the
          background first, the font size scales only the text (generated/animations-gallery: 99.7 % of 373
          video frames over 12 slides of PowerPoint's effect gallery).

      - id: animation.build
        title: Build lists
        elements: [p:bldLst, p:bldP, p:bldDgm, p:bldGraphic, p:bldOleChart, p:bldAsOne, p:bldSub, p:tmplLst, p:tmpl,
                   a:bldChart, a:bldDgm]
        priority: P1
        difficulty: 3
        status: done
        strategy: Build text by paragraph and level, charts by series or category, SmartArt by node.
        office: >-
          SmartArt builds (a:bldDgm one, lvlOne, lvlAtOnce) are written as effects per drawing shape
          (p:graphicEl with a:dgm id = the shape's model id, bldStep bg for the diagram's background); the
          player animates each shape of the diagram on its own (checked with tools/Fidelity animate on
          generated/smartart). Chart builds (a:bldChart series, category, seriesEl, categoryEl) are effects
          per a:chart step: gridLegend (everything but the data), series, category, ptInSeries, ptInCategory,
          with seriesIdx -3/-4 and categoryIdx -3/-4 where they do not apply (PowerPoint keeps them so; its
          object model refuses chart builds of modern charts). PowerPoint animates a series or category as
          one: a wipe runs over the box around all its bars, labels and markers; a line segment builds with
          the category it ends at. The chart marks its parts (data-ser in plot order, data-pt), the player
          animates their union (generated/animations-charts: 99.5 % of 103 video frames). Builds of legacy OLE
          charts (p:bldOleChart) animate the whole object, which is drawn from its picture.

      - id: animation.presets
        title: Effect presets
        description: presetClass, presetID and presetSubtype on p:cTn.
        priority: P1
        difficulty: 3
        status: done
        strategy: The timing tree already contains the behaviours; presets only name PowerPoint's effects (Fade, Fly In, Wipe …) for the editor.

      - id: animation.media
        title: Media control and bookmarks
        elements: [p:audio, p:video, p:cMediaNode, p14:bmkTgt, p14:nullEvt, p14:playEvt, p14:pauseEvt, p14:resumeEvt,
                   p14:seekEvt, p14:stopEvt, p14:triggerEvt, p14:showEvtLst]
        priority: P2
        difficulty: 3
        status: done
        strategy: Play, pause and stop commands and media bookmarks as timing events.
        office: >-
          Media nodes (p:audio, p:video, cMediaNode) give volume and mute, showWhenStopped 0 (the shape hides
          in the show while the medium is not playing), numSld (it plays on across that many slides), fullScrn
          (a video fills the slide, centered, while it plays) and isNarration (narration media stay silent
          when the show plays without narrations); p:cmd plays, pauses, resumes, stops and seeks them;
          bookmarks (p14:bmkTgt) start trigger sequences when playback reaches them; sounds of effects
          (p:sndTgt in the effect's p:subTnLst, begin of the effect) play with the effect. What was done
          during a recorded show (p14:showEvtLst in the slide's extLst: play, pause, resume, stop, seek of
          media, clicks on triggers) replays at its times from the start of the slide's timeline when the show
          uses its timings. Checked live in the browser with probe decks (times within 10 ms).

      - id: animation.pictures
        title: Animated pictures
        elements: [aanim:animPr]
        priority: P3
        difficulty: 2
        status: done
        strategy: >-
          Play the embedded animations of 3D models in the slide show with our own glTF renderer: skins, node
          transforms (linear, step and cubic spline keys) and morph targets, posed at the effect's progress.
        office: >-
          A 3D model's embedded animations (a3danim:embedAnim with aanim:animPr, a3danim:posterFrame) play in
          the slide show only through the slide's timing: PowerPoint adds a Scene effect (presetID 100, emph,
          with the slide's start, repeatCount indefinite) whose p:anim takes attrName embeddedN from 0 to 1:
          the glTF file's animation N - 1 (not embedAnim's animId) over its whole length, stretched to the
          effect's duration; without the effect the model stands still at its poster frame (measured with
          PowerPoint's videos). animPr (length, count, auto, offset, st, end) and the poster frame describe
          the playback in PowerPoint's own views; the document shows the poster frame, as printed. PowerPoint
          offers only skeletal animations: a model whose animations move plain nodes or morph targets gets
          none. Before its first key a cubic spline is, in PowerPoint, that key's in-tangent. Checked with
          generated/models (99.8 % of PowerPoint's video frames) and a rigged fox (local, 99.7 %).

      - id: animation.laser
        title: Recorded laser pointer
        elements: [p14:laserClr, p14:laserTraceLst, p14:tracePtLst, p14:tracePt]
        priority: P3
        difficulty: 3
        status: done
        strategy: Replay recorded laser pointer movements with the narration.
        office: >-
          A recorded laser pointer (p14:laserTraceLst in the slide's extLst) replays in the slide show when
          narrations play (showPr showNarration; without showPr PowerPoint plays them, measured): the pointer,
          in p14:laserClr of the show settings (red by default), follows every trace (p14:tracePtLst) from its
          first to its last point, at the points' times (ST_UniversalTimeOffset, milliseconds without a unit)
          from the start of the slide's timeline after the transition, moving straight between the recorded
          points (x, y in EMU from the slide's top left corner). PowerPoint draws nothing of it on the slide
          itself. Checked with generated/laser (slide unchanged; replay positions checked in the browser).

  - id: interactivity
    title: Slide show and interactivity
    features:
      - id: interactivity.player
        title: Slide show player
        priority: P1
        difficulty: 2
        status: done
        strategy: Navigation by click, keys and swipe; advance timings; loop and kiosk mode; full screen; presenter view with notes.
        office: >-
          Verified with generated/slideshow (navigation, timings, loop, kiosk, presenter view).

      - id: interactivity.hyperlinks
        title: Hyperlinks and action settings
        elements: [a:hlinkClick, a:hlinkHover, a:hlinkMouseOver, a:snd, ahyp:hlinkClr]
        priority: P1
        difficulty: 2
        status: done
        strategy: >-
          Links for URLs and files; ppaction:// actions (jump to slide, next, previous, first, last, end show, custom
          show) handled by the player; hover actions and sounds.
        office: >-
          Hyperlinked text is drawn in the theme's hyperlink color unless ahyp:hlinkClr says to keep the text
          color. Mouse-over actions (a:hlinkHover on shapes) run when the pointer enters the shape during the
          show. Mouse-over actions on text (a:hlinkMouseOver) run when the pointer enters the text during the
          show, like a shape's a:hlinkHover. highlightClick, invalidUrl and tgtFrame do not change the
          picture. Programs, macros and OLE verbs are deliberately not run from a web page.

      - id: interactivity.zoom
        title: Summary, section and slide zoom
        namespaces: [psez, pslz, psuz, p166]
        priority: P2
        difficulty: 3
        status: done
        strategy: Draw the zoom's picture and link it to the target slide or section; the player zooms in and back out.
        office: >-
          Zoom objects (slide, section and summary zooms) are drawn from their mc:Fallback pictures, linked to
          their slides (local/zoom: 99.6 %). In the slide show a click zooms into the target: the view closes
          in on the zoom's frame until the slide, growing out of it, fills the screen, over transitionDur (an
          even zoom in scale with a sine ease; without transitionDur the slide's own transition plays). With
          returnToParent (the default) the show zooms back out to the zoom's slide after the target slide or
          the last slide of the section. The zoom's motion is not measured against PowerPoint: its video
          export follows the slide order and a live show would need a real click.

  - id: review
    title: Comments and review
    features:
      - id: review.comments
        title: Comments (classic)
        elements: [p:cmLst, p:cm, p:cmAuthorLst, p:cmAuthor, p:pos, p:text, p15:threadingInfo, p15:parentCm,
                   p15:presenceInfo]
        priority: P3
        difficulty: 2
        status: done
        strategy: Optional comment markers and a side panel.
        office: >-
          Classic comments (p:cmLst, authors from commentAuthors.xml with their color index, replies joined to
          their thread through p15:threadingInfo/p15:parentCm) are never drawn by PowerPoint, neither on
          slides nor in the slide show. The document lists the threads below each slide on request (the
          player's comment button or C) with markers labelled with the author's initials and index at p:pos,
          which counts 1/576 inch from the slide's top left corner (PowerPoint's master units). Times are
          shown as stored. Checked with generated/comments.

      - id: review.modernComments
        title: Modern comments, reactions and tasks
        namespaces: [p188, p223, p228]
        priority: P3
        difficulty: 2
        status: done
        strategy: Optional threaded comments in a side panel.
        office: >-
          Modern comments (p188:cmLst, authors from authors.xml, linked from the slide by p188:commentRel) are
          listed with their replies, status (resolved, closed), reactions (p223: the emoji with the reacting
          authors) and tasks (assignees, start and due date, progress and title from the comment's attributes,
          or replayed from the p228 history without undone events). Markers sit at p188:pos in EMU from the
          top left corner of the anchor: the slide, or the shape that ac:deMkLst or ac:txMkLst names by id or
          creationId. Created times are UTC and shown in the viewer's time zone. Checked with
          generated/comments; PowerPoint draws none of it on slides.

  - id: legacy
    title: Legacy content
    features:
      - id: legacy.vml
        title: VML drawings
        namespaces: [v, o, pvml]
        priority: P3
        difficulty: 4
        status: done
        strategy: >-
          Only for very old converted files and controls: prefer the DrawingML fallback (the picture of an OLE object
          or control); a VML renderer is a separate project.
        office: >-
          PowerPoint 2007 saved the pictures of OLE objects and ActiveX controls only in a VML drawing part of
          the slide: p:oleObj and p:control name their VML shape (spid), whose v:imagedata (o:relid or r:id,
          croptop/bottom/left/right as fractions or 1/65536ths) holds the picture; later versions add a
          DrawingML picture in p:pic and write the VML choice without any picture (mc:Choice Requires=v, so
          the fallback is taken). Without a DrawingML picture the document draws the VML one in the object's
          frame, a control at the place its VML shape's style gives (PowerPoint does the same: measured with a
          VML picture differing from the object, generated/legacy-vml 99.8 %). HTML-like VML (unclosed br) is
          closed before parsing. Slides hold no other VML content.

  - id: engine
    title: Rendering engine (cross-cutting)
    description: Features without elements of their own that decide the fidelity of everything else.
    features:
      - id: engine.output
        title: HTML output
        priority: P0
        difficulty: 2
        status: done
        strategy: >-
          One self-contained HTML document (or folder) per presentation: slides as fixed-size containers at 96 dpi,
          scaled to the viewport; images and fonts embedded or next to it; no external dependencies. Slides can be
          drawn for device pixels of their own (PixelGrid): scaled to them, outlines, rectangles and chart lines placed
          on the slide's pixels first and then where PowerPoint's antialiasing samples the device's, text and table
          borders on the device's.
        office: >-
          Every corpus deck converts to one self-contained document. PowerPoint's own picture of a slide whose size is
          no whole number of pixels covers the size rounded half up on each side, shapes across as on the slide and
          down scaled by (h / H)(W / w), text and tables by w / W across and h / H down (measured with probe decks of
          one-pixel bars at 1058.33 × 793.67, 907.17 × 604.67, 1280.5 × 720, 1209.5 × 604.67 and 1350 × 759.33 px,
          of one-cell tables and of text boxes); outlines keep the places they take on the slide's pixels and are
          antialiased where they land (a 1 px outline at 60.3 px of a 793.67 px slide drawn 794 high covers 3/4 of row
          60 and 1/4 of row 61). Asked for another size, PowerPoint resamples the picture in bands.

      - id: engine.textLayout
        title: Text measurement and line breaking
        priority: P0
        difficulty: 5
        status: done
        strategy: >-
          Shape text with HarfBuzz using the actual font files, break lines like PowerPoint (UAX 14 plus Office's
          rules), justify and position every line ourselves; the browser only draws the positioned runs.
        office: >-
          Measured with the text-snap calibration deck: glyph advances, kerning and letter spacing are each
          rounded to master units (1/8 pt, half up); kerning uses the legacy 'kern' table (GDI pairs). Fonts
          without one are kerned from GPOS only when they are PostScript (CFF) or variable fonts (measured:
          Bahnschrift, Segoe UI Variable, Sitka and embedded Gotham and Wix Madefor Display are kerned; Gabriola,
          Javanese Text and Yu Mincho, static TrueType with GPOS pairs, are not). Within a format run the glyph
          origins are rounded to whole pixels (half up) from the
          run's exact start; a new format run starts exactly. Baselines sit on whole pixels counted from the
          top of the text area (box top plus inset, anchor offset included). Glyphs are drawn unhinted with
          8×4 samples per pixel. From 30 pixels per em text is therefore drawn as glyph outlines (paths
          defined once per document, placed with use) at the exact positions, with the text transparent on top
          for selection and search; browser text would sit on whole-pixel baselines and be hinted. PowerPoint
          samples coverage at the top-left of 8 × 4 sub-pixels, Chromium at the centers of 4 sub-rows:
          outlines are shifted by 1/16 and 1/8 pixel to see the same edges. Verified with generated/text-
          metrics, text-snap and text-basic.

      - id: engine.fonts
        title: Font resolution and fallback
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Find installed and embedded fonts, metric-compatible substitutes (Carlito for Calibri, Liberation for
          Arial and Times New Roman) and Office cloud fonts (Aptos); subset and embed them as WOFF2, so the browser
          draws with exactly the font we measured.
        office: >-
          PowerPoint renders text from 30 pixels per em on unhinted (cap height and x-height exactly as
          designed), below that hinted with crisp horizontal edges on whole-pixel baselines (22 pt hinted, 23
          pt smooth at 96 dpi). Large text is emitted as glyph outlines, so the viewer needs no fonts for it;
          small text, color fonts, synthesized bold or italic and glyphs missing from the font are left to the
          browser, whose hinted rendering matches PowerPoint's small text closely (Arial exactly); fonts the
          browser cannot find by name are embedded for these runs. Installed fonts without a typographic family
          whose family name holds a weight or width are named by their faces' full names (local()): Windows groups
          them by the rest of the name, so Chrome drew "Franklin Gothic Medium" in Franklin Gothic Demi and found
          "Franklin Gothic Demi", "Eras Medium ITC" or "OCR A Extended" not at all (Times New Roman); all 30 such
          families on this machine are their own faces so. Verified with generated/text-basic, text-eastasian,
          text-more and probe/font.

      - id: engine.fidelity
        title: Fidelity measurement
        priority: P0
        difficulty: 2
        status: done
        strategy: >-
          Reference renderings from PowerPoint (COM, Windows only) against screenshots of our HTML (headless
          Chromium), compared slide by slide; the scores show where to work next.
        office: >-
          tools/Fidelity generates the corpus, renders references with PowerPoint and scores every deck.
