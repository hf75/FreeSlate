  - id: math
    title: Equations (Office Math)
    features:
      - id: math.equations
        title: Equations
        description: Inline equations (m:oMath in a paragraph) and display equations (m:oMathPara).
        elements: [w:oMath, a14:m]
        namespaces: [m]
        priority: P1
        difficulty: 4
        status: done
        strategy: >-
          The OMML layout of pptx `text.math` (done) with Word's paragraph context: display equations take their
          own lines and justification, inline equations sit on the text baseline, long display equations break at
          operators.
        office: >-
          Equations are laid out by the OMML engine of pptx text.math with the runs' w:rPr: an m:oMath stands in the
          line on its baseline with its ascent and descent; the display equations of an m:oMathPara take lines of
          their own, broken before the binary and relation operators of their top level where they are too wide (the
          next lines indented by m:wrapIndent) and placed by m:jc: centered as a group, centered, left or right
          (docx/generated/equations, equation by equation within 0.3 pt of Word's lines but the limit with its
          fraction). A line's height is the equation's ascent and descent and the spacing's extra of the text fonts,
          the paragraph mark's where the equation stands alone (docx/local/eq-shaded). Word differs from PowerPoint in
          two rules: delimiters grow to the content's height less the shortfall, not twice its reach from the axis
          (docx/local/ppt-math: PowerPoint's own probe equations in Word), and a function's name keeps a thin space
          before an opening delimiter; both draw the hyphen-minus as the minus sign and ∇ and ∂ in italic. Glyphs are
          drawn as outlines under transparent selectable text. Text inserted or moved into a math run in a tracked
          change (w:ins, w:moveTo inside m:r) prints, deleted text not (powertools/RP/RP014-Inserted-Math-Control-Char:
          "A = 2πr²").

      - id: math.settings
        title: Document math settings
        elements: [m:mathPr, m:mathFont, m:brkBin, m:brkBinSub, m:smallFrac, m:dispDef, m:lMargin, m:rMargin, m:defJc,
                   m:preSp, m:postSp, m:interSp, m:intraSp, m:wrapIndent, m:wrapRight, m:intLim, m:naryLim]
        priority: P1
        difficulty: 3
        status: done
        strategy: Defaults for all equations of the document (math font, break rules, margins, limits placement).
        office: >-
          m:mathFont (a font with a MATH table, else Cambria Math), m:defJc, m:wrapIndent, m:wrapRight, m:intLim and
          m:naryLim apply to all equations of the document. Display equations break at the binary operators of their
          top level as m:brkBin says (measured with docx/local/mathset-a to -c, every line as in Word): before them
          (the default), after them, or both (repeat), a repeated minus shown as m:brkBinSub says ("--", "-+", "+-":
          the sign at the end of the line and the one at the start); an operator at a line's end keeps the space
          before it. m:lMargin and m:rMargin narrow the room of display equations, also without m:dispDef, which
          center in it (mathset-d). The equations of one m:oMathPara stand on one line one after the other. m:preSp,
          m:postSp, m:interSp, m:intraSp and m:smallFrac changed nothing in Word's printout (mathset-d).

  - id: vml
    title: Legacy VML content
    features:
      - id: vml.shapes
        title: VML shapes, text boxes and WordArt
        elements: [w:pict, w10:wrap, w10:anchorlock, w10:bordertop, w10:borderleft, w10:borderbottom, w10:borderright]
        namespaces: [v, o]
        priority: P1
        difficulty: 4
        status: done
        strategy: >-
          The VML renderer of pptx `legacy.vml` (done), positioned in the text flow by the style attribute
          (mso-position-*) and w10:wrap; VML text boxes hold WordprocessingML like wps text boxes.
        office: >-
          VML shapes (w:pict) are converted to Word drawings: rectangles, rounded rectangles, ovals, lines, preset
          shapes by o:spt, paths as custom geometries, groups (v:group: the children in its coordorigin and coordsize,
          nested), pictures (v:imagedata with crop), text boxes (v:textbox with its insets), WordArt (v:textpath),
          placed by the style attribute (position, margins, mso-position-*, rotation, flip, z-index) and w10:wrap
          (docx/local/vml-shapes, vml-group). A shape turns first and flips after, unlike DrawingML (docx/local/
          vmlflip: triangles and connectors turned 30° and 90° with flip:x, flip:y and both; docx/external/libreoffice/
          extras-ooxmlexport/n751117 79.1 → 88.4 %), a turn in fixed point (fd) counting 65536ths of a degree
          (docx/external/libreoffice/tdf137314_vml_rotation_unit_fd 61.8 → 99.7 %). A path's parameter left out
          before, between or after commas is 0 (m,128588; tdf105875_VmlShapeRotationWithFlip 1.8 → 99.3 %,
          core-ooxml-pass/vml-path 0.1 → 95.8 %, extras-ooxmlimport/tdf105143 3.5 → 100 %). A rounded rectangle's text stands inside its corners, as the DrawingML
          text rectangle says. An inline shape hangs from the top of its line (of its paragraph's space before on the
          first line), pictures stand on the baseline; an outlined shape takes the room of its box in whole 0.75 pt
          pixels, its outline and its shadow's offset right of and below it; spaces between drawings do not make their
          line taller (docx/local/vml-inline*). Fills and lines as Word draws them (docx/local/vml-fx, vml-angles,
          vml-pattern): a gradient runs, at the focus 0 Word writes by default, from color2 at the start of its angle
          (0: the top, 90: the left, 45: the top left corner, the angle applying in the shape stretched to a square)
          to the fill color, at focus 100 % the other way, at 50 % from the fill color to color2 in the middle and
          back, at -50 % the other way round, at any other focus the focus applied twice; a negative angle turns it
          round (the angle plus 180, the focus ±50 % reversed, any other the rest to 100 %); along its colors list
          where it has one; color2 "fill darken(n)" or "lighten(n)" for one-color gradients; gradientRadial from its
          focus position outwards; colors blend in linear light along an S-curve, in plain RGB along a straight line
          where the method is none or linear, and o:opacity2 fades color2 without tinting (within 3 of 255 of Word's
          pixels); pattern fills as their 8 × 8 bitmap, a point a bit, tiled from the page's corner; double and triple
          lines (linestyle), line opacity, shadows (v:shadow: an unblurred copy at its offset, 2 pt right and down by
          default, in its color and opacity, a double shadow's second in color2 at offset2 behind it). Word 97 borders
          (w10:bordertop, borderleft, borderbottom, borderright) frame the shape outside, width/8 pt each floored to
          Word's 0.12 pt dots, double lines three times that, dotted and dashed ones dashed (docx/local/vml-border).
          w10:anchorlock only locks the anchor while editing. A floating shape's shadow widens its extent on its side,
          which alignment counts (docx/local/sa-v*: a shape centered at the page's top with a shadow 80 pt left and
          36 pt up stands 40 pt right and 36 pt down; docx/external/libreoffice/extras-ooxmlexport/testOuterShdw);
          mso-wrap-distance-* keep wrapped text away (9 pt left and right, none above and below by default); a text
          box with mso-fit-shape-to-text is as high as its text where it is drawn. Shape types resolve across their
          part, not only in their w:pict (poi/WordWithAttachments: a picture frame type of the first w:object;
          libreoffice/core-objectpositioning/vml-vertical-alignment: triangles); v:stroke on="f" takes the outline off
          as stroked="f" does (tika/testWPSAttachment). Horizontal rules (o:hr) span o:hrpct of the width of the
          column they stand in (all of it without, whatever width the style gives; the style's width at 0), in cells
          and text boxes too, aligned by o:hralign in their paragraph's text area, each on a line of its own; the line
          is as high as the paragraph mark's with the rule's bottom 2.52 pt above its foot, before Word 2013 where the
          mark is not on it only 2.52 pt higher and lower than the rule, whatever the spacing; a rule of a share widens
          no autofit column, and a paragraph of nothing but such rules makes one an inch wide. Unless o:hrnoshade it is
          framed as Internet Explorer's rules are, 0.24 pt edges of #A0A0A0 above and left and #E3E3E3 below and right
          (docx/local/hr-*, hrh-*, hrc-*, hrt-*, hrtm-*: 0.75 to 6 pt in Times New Roman 10 to 24 and Calibri 11 at
          1.08 and 1.15 lines, at 50 and 100 % and 0 with 200 pt, alone, before and after text, in autofit cells, in
          modes 12, 14 and 15, all 37 within 0.25 pt; poi/bug57031, openxml-sdk/May_12_04, tika/testInstrLink,
          libreoffice/extras-ooxmlexport/tdf97648_relativeWidth). Known deviations: a perspective shadow's matrix is
          left out; the text wraps the stated height of a box fitted to its text; a rule in a text box takes its share
          of the last column laid out.

      - id: vml.ole
        title: Embedded objects and controls
        elements: [w:object, w:objectEmbed, w:objectLink, w:control, w:movie, o:OLEObject, a15:objectPr,
                   a15:signatureLine]
        priority: P1
        difficulty: 3
        status: done
        strategy: >-
          OLE objects, ActiveX controls and signature lines show their preview picture (often EMF or WMF, see
          picture.metafiles), as pptx `picture.ole` (done).
        office: >-
          Embedded objects (w:object) show the picture of their VML shape like any VML picture; so do ActiveX controls
          (w:control): Word prints the picture they store, not the control (docx/local/ole-probe: a check box whose
          stored picture is a red rectangle prints as that rectangle). Signature lines (o:signatureline) Word draws
          itself whatever picture they store, scaled from 256 × 128 pixels to the shape: on white an X in 32 px Arial
          10 px in with its baseline at 68, a line 2 px thick at 75 across the shape, the suggested signer, the
          signer's title and e-mail in 11 px Segoe UI 10 px in, their baselines at 91, 107 and 123 (docx/local/ole-
          sigsizes: 192 × 96, 288 × 144 and 120 × 60 pt, with and without signer and title, within 0.2 pt).

      - id: vml.watermarks
        title: Watermarks
        description: Text or picture watermarks are VML shapes in the header, centered on the page behind the text.
        elements: [v:shape, v:textpath, v:imagedata]
        priority: P1
        difficulty: 3
        status: done
        strategy: Text watermarks are VML WordArt (v:textpath) scaled to their box; picture watermarks are washed-out pictures.
        office: >-
          WordArt (v:textpath) is drawn as text stretched over the shape like a textPlain warp, filled with the
          shape's fill; VML fits the font's em box to the shape, so the shape shrinks to the capitals' share of it
          about its turned center (docx/local/vml-watermark, the watermark of a header placed relative to the
          margins). Picture watermarks are VML pictures.

  - id: engine
    title: Layout engine (cross-cutting)
    description: Features without elements of their own that decide the fidelity of everything else.
    features:
      - id: engine.output
        title: HTML output
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          One self-contained HTML file: fixed-size page boxes with absolutely positioned glyph runs, SVG for
          drawings, embedded fonts and pictures; print CSS keeps one page per sheet.
        office: >-
          One self-contained HTML file: a fixed-size section per page with a named @page per paper size (printed,
          every page keeps its size), text as SVG text at our positions in the fonts we measured with (fonts the
          browser cannot find by name, such as Office cloud fonts, embedded), drawings, charts, SmartArt and equations
          as SVG, pictures embedded, bookmarks as anchors and hyperlinks as links. Printed, outlines keep their width:
          the crisp edges that shapes have on screen (as PowerPoint draws axis-aligned lines) would make Chrome print
          their strokes as hairlines of width 0, which PDF renderers and printers draw thinner and lighter than Word's
          0.75 pt (docx/external/powertools/WC/WC065-Textbox 70 → 88.6 %; of 306 documents with such outlines 83
          better, 40 more over 90 %).

      - id: engine.pagination
        title: Pagination
        priority: P0
        difficulty: 5
        status: done
        strategy: >-
          Page breaking with widow and orphan control, keep with next, keep lines together, page and column breaks,
          table rows that split or repeat, footnotes that share the page with their references, section breaks of
          all types and continuous sections with balanced columns.
        office: >-
          Pages, columns, sections, headers and footers and the paragraph keep rules match Word's line positions
          within 0.1 pt on the generated documents (word-lines); tables break between rows and split rows at lines,
          repeat their header rows, keep rows that may not split and rows whose paragraphs keep with the next
          (docx/local/tblpages: 229 lines, mean 0.06 pt); footnotes share the page with their references and continue
          on the next (note.footnotes); floating objects stay on their anchor's page (engine.floats).

      - id: engine.lineLayout
        title: Line layout
        priority: P0
        difficulty: 5
        status: done
        strategy: >-
          The text engine of pptx `engine.textLayout` (done) extended by Word's rules: line height from the font's
          metrics and line spacing, tabs, justification, East Asian grid and kinsoku, hyphenation, inline objects,
          lines shortened by floating objects.
        office: >-
          Lines break at UAX #14 opportunities with Word's kinsoku, and at every space before a character that is not
          East Asian, also before periods, closing brackets and quotes, slashes and percent signs (docx/local/
          spacebreak: 19 characters), after every hyphen and en dash whatever stands before it, digits, punctuation
          or a space, after the hyphen U+2010 from Word 2013 on, not after slashes, plus signs, underscores or
          non-breaking hyphens (docx/local/hyphbreak-15, -12: 19 cases; w:noBreakHyphen too, powertools/RP/RP038
          76.5 → 100 % of the lines), and before and after inline pictures as
          beside ideographs (docx/local/tblpic3); a word longer than the line breaks between characters, on the line
          where it begins if nothing but a tab or a list number stands before it there, with at least one character
          after a number, none needed after a tab (docx/local/lw-*, lx-*, ly-*, lt-*: modes 14 and 15); a tab goes to
          the next line with the word after it where that word does not fit (lw-6 to lw-10, ly-1, ly-4; docx/external/
          libreoffice/extras-ooxmlexport/tdf123054, tdf142404_tabOverMarginC15); trailing spaces hang past the end;
          spaces never make a line taller or lower, whatever their size or place, and a line of only spaces is the
          paragraph mark's (docx/local/ts-*, tu-*, tv-*: a 45 pt space before, between or after 9 pt words leaves the
          line 9 pt in modes 12 to 15, a 45 pt "x" or no-break space does not); tabs neither, a paragraph's last line
          of only tabs is the mark's, a line before it of a tab alone the tab's (docx/local/tabheight: a 24 pt tab
          alone, twice or between 8 pt letters leaves an 8 pt mark's line 8 pt, an 8 pt tab alone a 24 pt mark's 24 pt;
          tovc-10: a 10 pt tab wrapped past the right indent before 12 pt text keeps its line 10 pt); justified lines squeeze spaces for one more word where that
          changes them less than stretching would (paragraph.basic); automatic hyphenation breaks words as Word does (paragraph.hyphenation); line grids
          snap lines to whole pitches (section.docGrid); East Asian spacing and alignment (paragraph.eastAsian).
          Glyphs are drawn as browser text at positions from our layout; Word's PDF and ours go through the same
          rasterizer, so equal positions give equal pixels. Punctuation compression changed nothing in Word's printout
          (docx/local/ec-*).

      - id: engine.floats
        title: Floating objects and text wrapping
        priority: P0
        difficulty: 5
        status: done
        strategy: >-
          Anchored objects, frames and floating tables are placed first, then lines are broken into the space
          around them; objects anchored in later text may move earlier lines, so layout iterates until stable.
        office: >-
          Floating drawings are placed on their anchor's page and the page is laid out again around them until it is
          stable (at most four runs); from Word 2013 an object that wraps text and moves with its paragraph takes the
          paragraph to the next page where it would reach past the bottom margin, a box that resizes to its text at
          least as high as Word saved it (docx/local/af-over, af-over-tb, af-huge go; af-fit, af-over-none in front of
          the text, af-over-page, af-over-margin and af-over-14 stay; docx/external/libreoffice/extras-ooxmlexport/
          tdf123243, tdf115719 20 → 100 %, tdf137655 54.2 → 100 % of the lines); lines are broken into the segments beside the objects, words that do not fit a
          segment continue in the next one, lines with no room move down below the object (docx/generated/wrapping,
          wrap-types), below the first of the objects beside them to end (td-1), beside objects wrapped along their
          polygons a line at a time, so on the paragraph's line pitch (ub-*), and to the next page where they do not
          fit below it. A segment takes text from 18 pt, also an empty line's, the first of a line only where the line's
          first word fits (docx/local/tf-*, tk-*, tq-*, te-*, tg-*, th-*, tl-*: 17.3 pt stay empty, 19.3 take "a an", a
          word of 40.6 pt goes below an object leaving 39.3 pt); before Word 2013 a line beside objects wrapped square
          stays where the column has 18 pt beside them, also only outside its indents, takes what of it they leave, a
          character a line where none, a word breaking where it does not fit (tx-*, ty-*, tz-*, ua-*;
          powertools/RP/RP001-Tracked-Revisions-01-Accepted), and beside objects wrapped along their polygons a segment
          takes text from 9 pt (tv-*, tw-*; core-text/fly-minimal-wrap). A line moved down for the height of its
          paragraph mark stands where it fits with its own (uitest/tdf124675). A paragraph whose own object leaves it no
          room on the page moves on with the object, and the page it left is laid out without it
          (docx/local/anchorpush-*). An object kept free above and below that reaches down to its paragraph's place
          pushes the lines already in the column that it overlaps below it; where its paragraph would then no longer
          begin in the column, or where the object ends above the paragraph, it takes the paragraph to the next (uc-1
          to uc-5, ud-*; generated/wrapping, local/compat11-wrapping; extras-layout/fdo43573-2-min). Objects beside the
          column leave its lines alone, also those kept free above and below, and a paragraph going on in another column
          or page goes on beside the objects there (fdo43573-2-min: an image at the top of a page's left column, the
          right column's text and the last line of a paragraph from the page before). Text frames and drop caps
          (paragraph.frames) and floating tables (table.floating)
          take part in the same exclusions. A table does not stand beside the floating objects and frames before it:
          it begins below every one its part on the page would overlap, from Word 2013 on whatever their wrapping,
          before only those kept free above and below (docx/local/fx-1 to fx-13, ft-1 to ft-8: below a 40 pt shape
          wrapped square or top and bottom, also one beside a 70-row table's last rows on the page, and below frames not
          beside text, anchored to the text or the page; a shape right of the table and one without wrapping leave it;
          docx/external/tika/testWORD_tableInRunInsideParagraph, docx/external/libreoffice/core-ooxml-pass/
          fdo78904_fileHang); below a floating table of the text only where it does not fit beside it and reaches its
          box, its distances aside (ib-1 to ib-7: a table of 90 pt beside one of 350 pt, of 468 pt below it;
          writerfilter-dmapper/floattable-then-table, extras-layout/tdf167526; extras-ooxmlexport/tdf92157: a table
          into the distance of a floating table in the right margin stays). A floating table that may not overlap others (w:tblOverlap never) moves right of the one
          before it that it would overlap where it fits, else below it (table.floating). Known deviations: a table
          that fits beside a floating table Word moves beside it (ib-1, ib-2), ours stays at its place across it; in
          mode 14 Word sets a table beside a shape wrapped square, indented and narrower (fx-5), ours stays over it; a table whose cells' paragraphs have frame properties stands in that
          frame at its position (lb-1 to lb-4, tdf104394_lostTextbox), ours in the text.

      - id: engine.tableLayout
        title: Table layout
        priority: P0
        difficulty: 5
        status: done
        strategy: Word's autofit algorithm, measured against generated tables, and rows that span pages.
        office: >-
          Word's autofit: each column's minimum and maximum width with margins (the maximum capped at 1584 pt);
          preferred widths fixed, giving way where they do not fit; the maxima when they fit, else the minima and the
          rest in proportion to max - min, else the content minima shrunk (table.width); fixed layout by the grid; rows that split across pages unless cantSplit,
          repeated header rows, nested tables (docx/local/tbl-autofit 92/92 lines, docx/generated/tables 44/44).

      - id: engine.fonts
        title: Font resolution and fallback
        priority: P0
        difficulty: 4
        status: done
        strategy: As pptx `engine.fonts` (done) with Word's font substitution (font.table).
        office: >-
          Installed, embedded and Office cloud fonts (Aptos) as in pptx, with Word's own substitution of missing
          families (font.table) and theme fonts (font.theme). A character the run's font lacks is measured and drawn
          in the font Word falls back to, by range: emoji Segoe UI Emoji (also before U+FE0F); symbols, dingbats,
          arrows and Braille Segoe UI Symbol; letterlike and mathematical symbols, technical symbols and enclosed
          numbers Cambria Math (enclosed letters then MS Gothic or MS Mincho); geometric shapes Arial; Thai, Lao and
          Khmer Leelawadee UI; Indic scripts Nirmala UI; Georgian Sylfaen; Ethiopic Ebrima; Cherokee Gadugi; Syriac
          Segoe UI Historic; Tibetan Microsoft Himalaya; Myanmar Myanmar Text; Hangul Malgun Gothic or Batang beside
          serif and East Asian fonts; Chinese characters and kana MS Mincho, then PMingLiU or Microsoft JhengHei;
          Hebrew and Arabic outside right-to-left runs Arial, Times New Roman beside serif fonts (docx/local/thd2-a,
          thd2-b; docx/external/poi/rtl 62.9 → 91.9 %).
          Lines grow with the fallback's metrics as in Word; spaces and format characters stay in the run's font,
          marks with their base (docx/local/fallback-arial 96.1 %, fallback-calibri 95.7 %, fallback-times 97 %, every
          line within 0.1 pt). Color emoji are Chrome's (COLRv1 shading) where Word draws them flat. Installed fonts
          the browser does not find by their family name are named by their faces as in pptx (Franklin Gothic
          Medium, the theme font of powertools/HC006 and HW010-Symbols01, was drawn in Franklin Gothic Demi).

      - id: engine.fidelity
        title: Fidelity measurement
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Word (COM) exports every reference document to PDF; its pages are rasterized and compared with our pages
          like the PowerPoint references, on documents Word generates by COM and on external test documents.
        office: >-
          Word (COM) exports every reference document to PDF; Chrome prints our HTML to PDF and the same rasterizer
          (Windows.Data.Pdf) renders both, page by page at 96 dpi, for the pixel and SSIM scores; pdf-text and word-
          lines compare Word's PDF layout with ours line by line and glyph by glyph. 29 documents generated by Word
          through COM (docx/generated, 92.6 % overall) and local probes for each measured rule. The rasterizer ignores
          the soft masks Chrome writes (reflections, soft edges), which MuPDF shows.
