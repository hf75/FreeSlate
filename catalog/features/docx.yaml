          character, and down where one of them covers the paragraph's top (docx/local/np-*: in modes 12 and 14 an
          unwrapped rectangle 28.35 pt from the column and the paragraph, or the character and the line, stands 28.35
          pt right of and below its line pushed below one wrapped rectangle and right of another, one placed from the
          margin or wrapped square where it was; np2-a, -b, -c: one kept free above and below from 8.3 pt under the
