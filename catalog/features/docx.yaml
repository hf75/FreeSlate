          line and $([\{£¥‘“〈《「『【〔＄（［｛｢￡￥ not end one, w:strictFirstAndLastChars adds the small kana and ー; Simplified
          and Traditional Chinese have their own lists, Korean none; other languages and text without one keep the
          Japanese ones' Latin punctuation alone (hgl-*, hgd-*, hgn-*: a 。 after a full line of ideographs begins the
          next line in en-US, de-DE and without a language whatever the default East Asian font). A
          document's own lists (w:noLineBreaksBefore, w:noLineBreaksAfter for a w:lang) replace both of Word's, a
          missing one by none (kinsoku-custom*); Word looks them up as written in code point order, as it writes them.
          East Asian punctuation and full-width forms break like ideographs (a line may end between 。 and 「, ea-
          adjust). Punctuation that may not begin a line hangs past the end instead where w:overflowPunct lets it (on
          by default): before Word 2013 in every paragraph, from then on in justified ones; Japanese ,.’”、。」』】），．］｝｡､,
          Chinese more (kinsoku-chars12-*, -both, -distribute); the line before it fills its width; East Asian
          punctuation only where the document's default East Asian font is one, else the character before it goes down
          with it whatever room the line leaves (hgr-*, hgd-*; docx/external/libreoffice/extras-odfexport/tdf130314
          84.8 → 99.2 % with drawing.wrapping), Latin commas and periods without (fdo63164-1). Only paragraphs
          with East Asian text or an East Asian language for it hang punctuation: a comma after Latin words goes down
          with its word (hangcomma-*; docx/external/poi/bug65649), before Word 2013 with ja-JP as the East Asian
          language it hangs (c3-lines12-*; docx/external/libreoffice/core-ooxml-pass/fdo63164-1) where the document
          defaults name no other East Asian language (hgp-*: zh-CN in Normal hangs a comma or period without defaults,
          not under defaults of en-US; extras-ooxmlexport/tdf89377_tableWithBreakBeforeParaStyle 92.3 → 99.7 %,
          extras-ooxmlimport/groupshape-child-rotation), from Word 2013 on the language alone does not do
          (hangcomma-h4, -h7; extras-ooxmlexport/tdf163894). w:wordWrap off breaks
          Latin words anywhere (ea-opts). w:topLinePunct sets an East Asian opening bracket that begins a line half
          its width further left (toplinepunct15/12). In kerned runs (w:kern) an East Asian comma, period or closing
          bracket before another one or an opening bracket loses half its width unless w:noPunctuationKerning
          (ea-punctkern). The automatic space between East Asian and Latin text (w:autoSpaceDE, w:autoSpaceDN, on by
          default) exists only where the document's default East Asian font (w:docDefaults, through the theme) is an
          East Asian one (ea-auto-*: MS Mincho, SimSun, Yu Gothic yes whatever the language; Arial, none, a style's or
          the paragraph mark's no): a quarter of the East Asian character's size after East Asian text, half the Latin
          font's average character width (OS/2) after Latin text (ea-autospace2: Arial, Times New Roman, Calibri,
          Courier New, Segoe UI beside four East Asian fonts within 0.1 pt), none at a line's end. Justified lines
          with two East Asian characters or more (where that default font is one; with one Latin lines' spaces only:
          docx/local/cjkr-*, cjky-*, cjkz-*, cjkx-*, every character within 0.22 pt) share their free width equally
          among the gaps after and before every East Asian character and after every space, a space 0.45 of its width
          more and the automatic space at an East Asian/Latin boundary once more; distributed lines among all
          characters where the paragraph has East Asian text or the document such a font (cjk-justify-lines,
          cjk-justify15/12, cjk-justify-western), Latin ones too, every line of the paragraph, unless their text is
          kerned or takes ligatures, then among their spaces (docx/local/dst-*, dst2-*, dst4-*: a space 0.44 of its
          width more than a letter, before Word 2013 0.6, dst6-*; dst5-kern, dst5-lig,
          docx/generated/paragraph-alignment: spaces only;
          docx/external/libreoffice/extras-ooxmlexport/para-adjust-distribute 75.2 to 100 %). From Word 2013 on a
          line with less room than those extras widens its spaces first, then the boundaries, the other gaps keeping
          their pitch (docx/local/cjv-*, cjx-*: Microsoft YaHei lines of ideographs and "ABC def ghi" 0.5 and 2 pt
          wider in turn, the spaces up to 1.5 times their width, then the boundaries' 3 pt up to 6, then every gap
          alike; dst4-s68 85.2 → 90.4 %, cjkx-spaces-both 95.9 → 99.5 %; pandoc/instrText_hyperlink 87.7 → 95.9 %,
          nested_instrText 87.2 → 91.7 %, empty_field 93.9 → 97.8 %); before, every gap alike (cgw14-lat). A
          justified line of nothing but inline objects spreads between them where lines spread around East Asian text;
          beside Latin text objects take nothing (docx/local/ojx-ea, ojx-lat: five rectangles 13.2 pt apart with SimSun
          as the document's East Asian font, none without; tika/testWPSAttachment 71.8 → 95.7 %). Before Word
          2013 justified lines do not squeeze their spaces for one more word. East Asian fonts are their win ascent and
          descent high and 15 % of that more above and below, each rounded to the font's units (ea-pitch: nine fonts
          at 10.5, 12 and 16 pt within 0.003 em). w:textAlignment top, center and bottom align a line's characters by
          their fonts' win ascents and descents (ec-none). Aligned by their tops, a line of one font and size has its
          baseline where Word's 600 dpi device puts it: the font's whole-pixel ascent as GDI realizes it (its VDMX
          record at the size's whole pixels per em, else its win or, with USE_TYPO_METRICS, typo ascent rounded) and
          the rounded line gap below the line's top, less one pixel (docx/local/tat-top against tat-base: Arial 12 two
          pixels higher, Times New Roman 12, Calibri 11 and Verdana 9 alike, Cambria 12, Georgia 14 and Aptos 12 one
          higher, Segoe UI 10 two, Courier New 12 four, East Asian fonts alike; Nyala 11 six lower, here seven), and
          lowered text first takes up its font's line gap, going down and growing its line only by the rest (lowr-12,
          -15, -18, -19, -22: 84.7 to 94.3 → 94.0 to 100 %; LibreOffice's extras-ooxmlexport/tdf140668, Nyala 11
          lowered 0.5 pt, 88.9 → 95.0 %); w:adjustRightInd changed nothing in Word's printout
          (ea-adjust). Punctuation compression (w:characterSpacingControl compressPunctuation) lets a justified line
          take the character that does not fit: a closing mark ending it hangs half its width past the end where that
          is enough, the line stretching to its middle (rather than its spaces squeezing for it; where they may squeeze
          for all of it, it stands inside; else it hangs half and they squeeze for the rest: docx/local/cpv-b-c, Latin
          words and "可从页看起，" in lines 0.5 pt apart); else the line's full-width East Asian punctuation squeezes
          alike, ，。、；：！ and closing brackets on their right, opening ones on their left (？, quotes, ・, … and ～
          not), each by half its width at most, from Word 2013 on each by no more than 32 times what each gap of the
          line without the character would stretch, before by half a mark in all; left aligned lines take nothing
          (docx/local/cpq-*, cpr-*, cps-a, cpt-*, cpu-*: Microsoft YaHei lines of 10 to 36 characters with 1 to 5 marks 1
          to 16 pt over, at 12 and 10.5 pt, in modes 15 and 14: with two commas a line of 20 characters takes 9.3 pt, not
          9.4, of 30 8.3, not 8.4; LibreOffice's extras-ooxmlexport/tdf142407 69.3 → 75.3 %, pandoc/nested_instrText
          81.4 → 86.7 %, docx/local/cjkx-one-both 84.5 → 100 %). Before Word 2013 ideographic spaces
          (U+3000) at a line's end trail it as spaces do, hanging past the edge (docx/local/isp-both-12: "tttest（"
          justified to the margin, the twelve ideographic spaces after it past it; tdf128375). Known deviation: from
          Word 2013 on an opening bracket followed by ideographic spaces goes to the next line with them (isp-both),
          here it ends the line with the first of them. Known deviation: custom kinsoku lists not in code point order
          lose different characters in Word than here.

      - id: paragraph.bidi
        title: Right-to-left paragraphs and text direction
        elements: [w:bidi, w:textDirection]
        priority: P1
        difficulty: 4
        status: done
        strategy: Right-to-left paragraphs mirror indents and alignment; vertical text direction in frames and cells.
        office: >-
          A right-to-left paragraph (w:bidi) is laid out from its start edge and mirrored: w:left and w:start indent
          the right side, left and start alignment align right, tab stops count from the right margin and trailing
          spaces hang past the left one (docx/local/bidi: single and justified lines, indents, first line indent,
          tabs, mixed text, numbers and brackets as in Word). Vertical text (w:textDirection) of a section is laid out
          on the page turned a quarter, its header, footer and page border upright (docx/local/vertical, vertical2):
          tbRl runs the lines down from the right margin with East Asian characters upright, btLr the same with all
          text turned, tbRlV and tbLrV from the left margin with East Asian characters upright, lrTbV keeps lines
          across and lays East Asian characters on their side; a section with another direction begins a new page.
          Upright characters are turned a quarter counterclockwise against their line about the middle of their em box
          (half an em above the BASE table's ideographic baseline, else the middle of the win metrics) in their
          vertical forms (OpenType vert), half their advance from their place, the font's own where the line squeezed
          them; they are drawn as text of their own each, as Word's PDF writes them, not from their outlines
          (libreoffice/extras-ooxmlexport/tdf142407 75.3 → 95.3 %, docx/local/vertical 90.3 → 97.3 %, vertical2 89.6
          → 97.8 %). Vertical lines are 1/32 of their size thicker than horizontal ones (1.3
          times that for East Asian fonts), half above and half below the text (docx/local/vertical3, vertical4: Yu
          Mincho, MS Mincho, Meiryo, Yu Gothic and Arial at 8 to 28 pt, single and 1.5 lines; exact and at least
          spacing keep their heights); lines that stack from the left keep the extra of their spacing on the side the
          next line follows. Table cells are table.cells, text boxes drawing.textBoxes, frames paragraph.frames. Known
          deviation: floating drawings on pages of vertical text stand upright where their middles turn to.

      - id: paragraph.hyphenation
        title: Hyphenation
        elements: [w:autoHyphenation, w:consecutiveHyphenLimit, w:hyphenationZone, w:doNotHyphenateCaps,
                   w:suppressAutoHyphens]
        priority: P1
        difficulty: 4
        status: done
        strategy: >-
          Automatic hyphenation per language with our own pattern-based hyphenator; which word breaks Word chooses
          with its proofing dictionaries is measured on generated documents. Soft and non-breaking hyphens are run
          content (run.content).
        office: >-
          Automatic hyphenation (w:autoHyphenation) by Liang's algorithm with the hyph-utf8 patterns of German
          (reformed spelling) and American English, by the language of each word (w:lang, else the document's
          culture), British English with the American patterns as Word breaks it (powertools/HC048-Excerpt: en-GB
          arbi-trators, applica-ble, rea-sonable, fi-nancial, not the British arbit-rators, applic-able), at least 2
          letters before and 2 (German) or 3 (English) after a break; w:suppressAutoHyphens turns it off for a
          paragraph, w:doNotHyphenateCaps for words in capitals, w:consecutiveHyphenLimit limits the lines in a row
          that end with a hyphen. As Word breaks (measured with docx/local/hyph-a to -d and hyph-fit, every line as in
          Word): the word that does not fit breaks at its last place where its part and a hyphen fit, before Word 2013
          its part and the wider of the hyphen and the letter after the place (docx/local/hys-14l, hys-14j: Times New
          Roman 11 at 211 line widths, every first line as in Word, "inter" needing 1.83 pt more for its "n" than for
          a hyphen; hys-15l, hys-15j the hyphen alone; docx/external/libreoffice/extras-ooxmlexport/
          tdf166141_linkedStyles 89.5 → 99.6 %, tdf166141_linkedStyles2 86.6 → 94.9 %; Word's German hyphenator
          breaking English words of these probes where the patterns do not, "thoroug-hly"); justified lines
          may squeeze their spaces by 23 % for it (Word takes 21.9 %, not 25.2 %); other lines break so only where
          they would end more than the hyphenation zone short: 0.25 in from Word 2013 on whatever w:hyphenationZone
          says (zones of 0, 0.25 and 1 in break alike), w:hyphenationZone in older compatibility modes; a word longer
          than a line breaks at its last fitting place; a line ending with a hyphen does not end a column or page. A
          line that ends with a hyphen may end a page before Word 2013 and where the document allows it
          (w:compatSetting allowHyphenationAtTrackBottom), else it goes on with the line after it (docx/local/hyph-d;
          docx/external/libreoffice/extras-ooxmlexport/tdf160518_allowHyphenationAtTrackBottom 40.9 → 89.0 %,
          tdf160518_useWord2013TrackBottomHyphenation; powertools/HC048-Excerpt in mode 14 87.5 → 93.7 %). The hyphen
          at a line's end kerns with the letter before it
          (docx/external/libreoffice/extras-ooxmlexport/tdf160518_useWord2013TrackBottomHyphenation: "differ-" in
          kerned Times New Roman 49 pt, the hyphen 0.98 pt left). With useWord2013TrackBottomHyphenation 0 (Word 2016
          and later) a column's last line that would end with an automatic hyphen breaks anew before that word instead
          (extras-ooxmlexport/tdf165354 83.4 → 96.1 %: page 1 ends "except that it has an", "atmosphere" begins page
          2, where "an at-" would have fitted). Known deviations: Word's own
          dictionaries may allow other places than the patterns (it leaves un-characteristically whole); other
          languages are not hyphenated.

      - id: paragraph.outline
        title: Outline levels and collapsed headings
        elements: [w:outlineLvl, w15:collapsed]
        priority: P2
        difficulty: 1
        status: done
        strategy: Feeds TOC fields and the navigation pane; collapsed headings are expanded in the printed layout.
        office: >-
          Outline levels feed TOC fields and draw nothing (docx/local/misc-nothing); collapsed headings
          (w15:collapsed) are laid out expanded, untested in Word.

      - id: paragraph.htmlDivs
        title: HTML divisions
        description: Paragraphs of documents that came from HTML refer to nested divisions with margins and borders.
        elements: [w:divId, w:divs, w:div, w:divsChild, w:divBdr, w:bodyDiv, w:blockQuote, w:marLeft, w:marRight,
                   w:marTop, w:marBottom]
        priority: P2
        difficulty: 3
        status: done
        strategy: Division margins add to the paragraph indents and spacing; division borders are drawn around their paragraphs.
        office: >-
          Paragraphs of HTML divisions (w:divId) take the margins of their division and the divisions around it as
          indents; bordered divisions frame their paragraphs like paragraph borders at the division's indents, their
          top and bottom lines with their space before the first and after the last paragraph. HTML auto spacing
          (w:beforeAutospacing, w:afterAutospacing) is 14 pt, none before the document's first paragraph or after a
          table (docx/local/html-divs, a page Word converted from HTML: 97.5 %, every line as in Word).

  - id: numbering
    title: Lists and numbering
    features:
      - id: numbering.definitions
        title: Numbering definitions and number formats
        elements: [w:numbering, w:abstractNum, w:abstractNumId, w:num, w:lvl, w:lvlOverride, w:startOverride, w:start,
                   w:lvlText, w:lvlJc, w:numFmt, w:suff, w:lvlRestart, w:isLgl, w:multiLevelType, w:nsid, w:tmpl,
                   w:numStyleLink, w:styleLink, w:numIdMacAtCleanup, w:legacy]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Level text with %1..%9 placeholders, about 60 number formats (decimal, roman, letters, ordinal and cardinal
          text, East Asian, Hebrew, Arabic, Thai, Hindi ...), legal numbering, suffix tab, space or nothing, number
          alignment, the level's run and paragraph properties.
        office: >-
          Level texts with %1 to %9, about 60 number formats (decimal, roman, letters repeated after z, ordinals and
          number words, full-width, enclosed, Chinese, Japanese and Korean counting, Hebrew, Arabic, Thai, Hindi,
          Russian), legal numbering, suffix tab, space or nothing, numbers aligned left, centered or right at the
          first line's indent (docx/local/num-rules). The space after a number is as wide as Arial's at the number's
          size, bold and italic as it is, the number's font still setting the line (docx/local/sfy-*, sfx-*: Word's
          PDFs draw it in Arial after numbers in Times New Roman, Courier New, Verdana and Cambria and after East Asian
          numbers whatever their hint, theme or fonts, in modes 14 and 15; LibreOffice's extras-ooxmlexport/chtoutline
          86.4 → 89.3 %). Number words and ordinals follow the paragraph's language
          (English, German, French, Russian; words only below a million); letters repeat up to thirty times, then
          start over; Chinese counting goes digit by digit from 100 (○ for zero); ideographLegalTraditional writes
          financial numerals with the one before ten (壹 to 玖, 10 壹拾, 11 壹拾壹, 20 貳拾; LibreOffice's
          extras-ooxmlexport/cjklist34 0 → 100 % of the lines); the heavenly stems turn decimal after ten; Word 2010's
          custom formats pad with zeros (docx/external/powertools/LIR001 … LIR020 and docx/local/numwords2-*: every
          number exactly as Word writes it). Word 6 numbering (w:legacy) puts the text after its number at the
          furthest of the number's start and w:legacyIndent, the number's end and w:legacySpace, and the left indent
          (docx/local/lgy-a, lgy-b: legacy indents of 0, 336 and 720 twips, spaces of 0, 120 and 288, hanging indents of 0
          and 360, every line as in Word in modes 15 and 12; LibreOffice's extras-ooxmlexport/tdf90697_complexBreaksHeaders:
          seven times the characters in place). An abstract numbering linked to a numbering style that is missing
          (w:numStyleLink without the style) takes the levels of the definition that names the style as its own
          (w:styleLink; Word's PDF of docx/external/libreoffice/extras-ooxmlexport/tdf120394: an empty styles part,
          "1" and "1.2.1", 86.9 → 98.2 %). The tab after a number takes the left indent as its stop also where the
          number ends right at it (an empty number, one right-aligned at the indent), leaving the text there; custom
          and default stops count only after its place, as for other tabs (docx/local/emptylabel, tabzero, tabzero2;
          docx/external/libreoffice/extras-ooxmlexport/tdf153042_largeTab), every one of them as a left stop
          (docx/local/lbt2-15, lbt2-14: centre, right and decimal stops between the number's end and the indent put the
          text at the stop; extras-ooxmlexport/rhbz988516 79.9 → 100 %). The level's indents and tabs override the
          paragraph style's (a level indented 360 twips puts a List Paragraph, whose style says 720, at 360;
          docx/generated/lists); where the numbering comes from the paragraph style itself, the style's override the
          level's attribute by attribute (a style's left 1080 with a level's left 1620 and hanging 360 makes left
          1080, hanging 360; docx/local/styleind-A … -H). The number is drawn in the paragraph mark's formatting with
          the level's run properties over it, but for the mark's shading: a mark shaded directly, through its style or
          in a pattern leaves the number and its tab or space white, only the level's own w:shd shades them, while the
          mark's highlight is theirs (docx/local/labelshd; docx/external/
          libreoffice/extras-tiledrendering/tdf114799_shd, tdf114799_highlight); only its ascent counts in the line
          height, not its descent (a 16 pt number before 12 pt text makes the line 17.52 pt high), and beside nothing
          but drawings the line has no descent at all (docx/local/lt-8, lt-10: a bullet beside a 40 pt shape makes the
          line 40 pt high); beside nothing at all it takes the paragraph mark's ascent where that is larger, and its
          descent (libreoffice/core-text/redline-bullet: a Courier New 10 pt bullet whose item's text is all deleted
          stands on the Aptos 12 pt mark's baseline, 0 → 100 % of the lines). A level without w:start counts from 0,
          where letters and roman numbers show nothing (docx/local/ns-*: "0.", "1.", "2." in modes 12 to 15, ".",
          "A.", "B."; docx/external/libreoffice/ extras-ooxmlexport/tdf132754). Picture bullets are
          numbering.pictureBullets. Where the numbering comes from a paragraph style, the level's properties sit right
          under the style that holds w:numPr: the styles it is based on give way to the level, it and the styles based
          on it override the level (docx/local/lvb-base, lvb-own, lvb-derived: a level's left 2160 over a base style's
          1440, under the numbering style's and a derived style's 1440;
          docx/external/libreoffice/extras-ooxmlexport/n778836 57.1 → 100 %). A legal level (w:isLgl) prints the
          numbers of all levels as Arabic numerals, zero-padded ones (decimalZero) staying so (docx/local/lgl-*: upper
          Roman, full-width, circled, ordinal and letters as 1, decimalZero as 01;
          docx/external/libreoffice/extras-ooxmlexport/listWithLgl "Sect 1.01"). Numbering switched off in a paragraph
          (w:numId 0 in its own w:numPr) takes its left and first-line indents from its own w:ind alone, none from its
          styles, numbered or not, the right one as usual (docx/local/nz0-*, nzs-*; tdf95374); a paragraph style that
          switches it off drops its base styles' left and first-line indents for itself and the styles based on it,
          the right one staying (docx/local/nzs-15, nzs-14: under a numbered style of left 2000, right 1500, hanging 500
          and an unnumbered one alike; extras-ooxmlexport/tdf132752 58.3 → 96.4 %).

      - id: numbering.counting
        title: List counters
        elements: [w:numPr, w:ilvl, w:numId]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Counters run per abstract numbering through the whole document (the headers and footers share a state of
          their own, notes keep theirs), restart by w:lvlRestart, w:startOverride and numbering instances; measured
          against Word because the specification leaves gaps.
        office: >-
          Instances of one abstract definition count together; an instance with a start override restarts the shared
          counter at the overridden level where it first uses that level, and the other instances go on from there (5,
          6, then 7); until then the level counts as it would, unused its own start (docx/local/sov-15: level 0 starting
          at 1 and overridden to 5 shows 1.1., 1.2., then 5., 5.1.; started and overridden at 10 10.1., 10.2., 10.;
          LibreOffice's extras-ooxmlexport/tdf153104 77.8 → 96.5 %, tdf148455_1, _2 97.7 → 100 %); a deeper level used
          before a higher one shows the higher one's start and counts from it (7.1.1. then 7.2.); w:lvlRestart 0 never
          restarts; paragraphs numbered through their style continue the same counters (docx/local/num-rules). A
          paragraph of nothing but a section break takes no number and counts for none, in modes 14 and 15
          (docx/local/ sn-1 to sn-6: items 1, 2, an empty numbered section end, then 3;
          docx/external/libreoffice/extras-ooxmlexport/ section_break_numbering, tdf170602_exportContext). A level
          outside the nine a list has (w:ilvl 9 and above) takes no number and no level's indents
          (docx/external/libreoffice/extras-ooxmlexport/tdf61309: ilvl 12 at the margin, 58.2 → 94.0 %). The headers
          and footers count on from story to story, section by section in the order even header, default header, even
          footer, default footer, first page's header and footer, shown or not; each story ends with a mark of the
          Normal style and eight such marks come before the first, which take numbers where Normal is numbered
          (docx/local/hfn-*: a header's item 1, the footer's 2; Normal numbered 9 and 11, with even header and footer
          before them 11 and 15, a second section's 13 and 15; the notes' separators count for none, nor do the
          compatibility modes change it; extras-ooxmlexport/tdf135164_cancelledNumbering "xi" and "xv", 83.4 → 92.5 %
          with its Bahnschrift Light, see engine.fonts).

      - id: numbering.pictureBullets
        title: Picture bullets
        elements: [w:numPicBullet, w:lvlPicBulletId]
        priority: P2
        difficulty: 3
        status: done
        strategy: The bullet is the picture of w:numPicBullet (VML or DrawingML), sized to the paragraph's font.
        office: >-
          A level with w:lvlPicBulletId shows the picture of its w:numPicBullet (VML or DrawingML) where the number
          would stand, on the baseline, 0.996 × size − 1.97 pt high (from 8 to 48 pt: 6 to 45.85 pt) and as wide as
          its aspect ratio makes it; the tab after it goes on from its end (picture bullet probes Word made, 94 %). A
          w:numPicBullet whose VML shape has no picture keeps that room and shows nothing, no bullet character
          (LibreOffice's extras-ooxmlexport/lvlPicBulletId 63.6 → 100 % of the lines).

  - id: section
    title: Sections and pages
    features:
      - id: section.page
        title: Page size, margins and section breaks
        elements: [w:sectPr, w:type, w:pgSz, w:pgMar, w:vAlign, w:rtlGutter, w:mirrorMargins, w:gutterAtTop,
                   w:formProt]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Every section starts on a new page, an even or odd page (inserting a blank page) or continues on the same
          page; orientation, margins with gutter, mirrored margins and vertical alignment of the page content.
        office: >-
          Sections start on a new page, continue, or start on an odd or even page; odd and even mean the page numbers,
          not the sheets: an odd page section after a page numbered 1 leaves a blank page even when the restart put
          that page on the second sheet (docx/local/hf-oddpage). With different odd and even headers or mirrored
          margins any section whose first number has the parity of the page before gets a blank page before it
          (docx/local/hf-restart-*). A section on a new page right after a page break begins on the page the break
          began while that holds nothing, an empty paragraph holding the break taking no line there (docx/local/pbs-*:
          no empty page between, also before a landscape section or after a break that ends a paragraph with text; of
          two page breaks one page stays empty; docx/external/poi/bug65649), and so does a continuous section, with its
          own headers there (docx/external/libreoffice/core-unocore/tdf149555: HEADER 2 on page 2 after section 1's
          page break). Before Word 2013 a page break in the
          paragraph that ends a section goes unseen where the next section goes on on the same page (docx/local/pb14*,
          pb12*: "A", a page break holding a continuous section break and "B" on one page, in mode 15 on two;
          docx/external/libreoffice/extras-uiwriter/tdf131963), unless w:splitPgBreakAndParaMark moves the mark and
          the section break after it (pbsp14*, pbsp12*); a line of nothing but such a break is the paragraph mark's,
          not the break's (docx/local/ubk-12, ubk-14: an 18 pt break with an 11 pt mark at 1.5 lines makes an 11 pt
          line's, an 11 pt break with an 18 pt mark an 18 pt one's; extras-ooxmlexport/090716_Studentische_Arbeit_VWS
          88.2 → 98.4 %). Blank pages have no header or footer, count in NUMPAGES but
          not in SECTIONPAGES. A document whose first section begins on an even page begins at page 2, without a blank
          page before it (docx/external/libreoffice/core-header_footer/tdf135216_evenOddFooter: four pages numbered 2
          to 5, the first with the even footer, 32.8 → 96.4 %; extras-ooxmlexport/A019_min: margins mirrored as on an
          even page, 54.0 → 98.1 %). An empty paragraph that holds the break before a section on a new page stays at
          the end of a full page, past the bottom too, and makes no page of its own; one with text moves
          (docx/local/sbe-15, sbe-14, sbe-after: after 29 lines of 24 pt, in modes 15 and 14, also below 30 pt after;
          sbe-text; docx/external/libreoffice/extras-ooxmlexport/section_break_after_table 35.0 → 100 %,
          tdf136589_paraHadField 35.1 → 97.4 %, tdf166510_sectPr_bottomSpacing 52.8 → 100 %). So does the last line of
          such a paragraph where it holds nothing but the mark after a line break, whether the next section begins on
          a new page or goes on (docx/local/sbe-br, sbe-brc; sbe-brp: a paragraph without the section break goes on
          whole with widow control; sbe-brt: one with text after the line break;
          docx/external/libreoffice/extras-ooxmlexport/tdf126287 35.8 → 99.1 %). At the top of a page an empty
          paragraph holding the break before a continuous section gives its space after as the section's last, which
          the next paragraph's space before has to exceed (docx/local/sbb-a, sbb-b, sbb-c: after a page break 200 pt
          after leave nothing of 150 pt before, none all of it, in modes 14 and 15;
          docx/external/libreoffice/extras-ooxmlexport/tdf170119_bottomSpacing 42.6 → 94.8 %). One that a page break
          left at a page's top before a section on a new page still gives its space after, which shortens the next
          paragraph's space before, and its style for contextual spacing (docx/local/secb-b, secb-d, secb-e in modes 12,
          14 and 15: a heading with 24 pt before 18 pt down below 6 pt after, at the top after an empty paragraph of
          its style with contextual spacing; extras-ooxmlexport/tdf170602_exportContext 89.3 → 97.3 % with the
          header's field format). Vertical alignment
          centers the text from the top margin, with the space before its first paragraph, to the space after its last
          (docx/generated/page-setup, page 4; docx/local/va-1 to va-5 in modes 12 to 15), an empty paragraph that only
          ends the section left out (vb-1 to vb-3); justified (both) it spreads the room left evenly between the
          paragraphs (va-6; extras-ooxmlexport/tdf36117_verticalAdjustment); centered or at the bottom the page's
          floating objects count down to their bottoms and move with the text, never up (docx/local/vao-11, -14, -15:
          a page frame centred on the page, a text box at the page's top wrapped square, rectangles in front of the
          text or wrapped below their paragraph; a page-sized one behind the text leaves no room; tdf36117 85.5 →
          96.2 %, tdf154703_framePrWrapSpacing 90.7 → 100 %). A continuous section on paper of another
          size begins a new page (docx/external/libreoffice/core-doc/header-footer-delete: a Letter section after an
          A4 one on page 3, 66.7 → 100 %). Known deviation: with a frame on the page Word centers otherwise (tdf36117,
          page 5). Section form protection (w:formProt) only guards editing and shows nothing; pages keep their sizes
          in the HTML whatever a browser can print. What the document leaves out comes from Word's Normal template,
          which depends on the region (measured on German Word, docx/local/nosect*): without w:sectPr A4, with one but
          without w:pgSz Letter; missing margins 2.5 cm, the bottom 2 cm, header and footer 0.5 in; regions measuring
          in inches get Letter and 1 inch.

      - id: section.columns
        title: Columns
        elements: [w:cols, w:col]
        priority: P1
        difficulty: 4
        status: done
        strategy: Equal or individual column widths with separator lines; a continuous section break balances the columns above it.
        office: >-
          An empty paragraph holding a section break after other text of its section takes no room before a continuous
          section (docx/local/colsect-*: no line, no space, in balanced columns too); alone in its section or before a
          new page it is a line as any other. All columns of a continuous section begin below the space after the
          paragraph above it; its first paragraph adds what its space before has more than the space after of the
          paragraph that holds the section break, the empty one holding it alone (in full where that has none) or the
          last one of text, below the longest column whatever column that paragraph ends in (docx/local/colsp-*;
          hbt-*: 3 pt after and 12 before 15 pt apart, 12 and 3 also 15, 8 and 8 16, in modes 12 and 15, after one
          or two columns, before one, two or three; the empty paragraph's own 12 or 6 pt after taking 6 or 4 pt
          before, the break in the paragraph of text 12 pt for 3 and 12; hbu-*: the last paragraph above in the
          shorter column; LibreOffice's extras-ooxmlexport/tdf90697_complexBreaksHeaders; openxml-sdk/complex0 page 3
          84 → 99.7 %). A
          continuous section break balances the columns above it (before Word 2013 not with w:noColumnBalance,
          docx/local/colsect-h, -i) by height in whole lines: the columns are as high as the least multiple of the
          section's least line height that holds all lines, each filled as far as that height lets it with widow,
          keep-with-next and keep-together rules (a height at which they cannot hold is not taken: the last two lines
          of a paragraph stand together in the first of three columns, docx/local/kcs-3-4; before Word 2013, where the
          section's columns begin at the page's top, a paragraph they find no place to break breaks where it must:
          docx/local/hbs-*, mode 12, a heading or text of two lines alone in two columns has one line in each, widow
          control on or off, kept with the next or not, the columns equally wide or not, below other text and in mode 15
          not; openxml-sdk/complex0 page 3 63 → 84 %); the first column holds the
          space before its first paragraph, a column's last line needs its text but not the extra space of multiple
          line spacing below it, nor the space after its paragraph (docx/local/cb-*, cbx-*, cbs-*: ten 13.6 pt lines
          below 13.5 pt go 5/5, below 13.6 pt 4/6; cbp-*: four paragraphs of four lines with A after move two lines
          once the first column passes the least multiple of 13.6 pt that holds the second with them, at 27.2 to 57.6
          pt before for A = 0 to 24 pt; cbq-*: 1.16 lines in multiples of 15.75 pt; cbr*-*: one 27.2 pt line or lines
          of 20.4 pt keep the 13.6 pt grid; docx/generated/page-setup: a heading and 60 lines go 31/30 as the 0.3 pt
          that moving two lines would save stay within one multiple of 16.97 pt, 4 pt would not, docx/local/ps-h*).
          The columns end below the space after their last paragraph; the next section's first paragraph keeps what
          its space before has more than the space after of the paragraph that holds the break. Before Word 2013 the space after a paragraph with text that ends the section is
          shared out among the columns: they end below the longest column without it or at a column's share of all
          lines, spaces and it, whichever is further down (docx/local/cbl-12, cbl-14: 15 lines of 15.44 pt in three columns
          end 77.2, 80.53 and 87.2 pt down with 0, 10 and 30 pt after, 18 lines 95.97 pt with 10 pt, 16 lines at their
          longest column of six lines whatever the space after; cbl-15 below the longest column and the space after;
          w:cachedColBalance changes nothing, cblc-12; docx/external/libreoffice/extras-ooxmlexport/
          tdf121670_columnsInSectionsOnly 87.1 → 100 %; an empty paragraph that ends its section keeps its space after
          whole, extras-ooxmlimport/tdf103931). Separator lines are 0.75 pt wide in the middle of the gap, from the columns' top
          to the bottom of the longest column. Columns of different widths (w:equalWidth 0): a paragraph that goes on
          in another column breaks its rest anew at that column's width, in balanced columns too, the balance trying
          each height with the text flowing anew (docx/local/uc-1 to uc-8: 90 and 400 words in columns of 132 and 264
          pt, either first; docx/external/ libreoffice/extras-ooxmlexport/fdo77812, tdf166553_paraStyleAfterBreak,
          docx/external/openxml-sdk/complex0); one that moves to such a column whole is measured there broken anew
          (docx/local/cc-*: complex0's heading, two lines in a 264 pt column and four in the 132 pt one beside it,
          goes to the next page, in a 216 pt column or shortened to a word it stays beside). A section on the next
          column (w:type nextColumn) goes on at the top of the column after the current one, in the columns of the
          section before, on a new page after its last column and where it has another number of columns than the
          section before (docx/local/ncs-13-12, -14, -15: three columns after one begin page 2, the next three in its
          second column; ncs-22-15: two after two in the second column, then page 2;
          docx/external/libreoffice/extras-ooxmlexport/tdf135343_columnSectionBreak_c14v2 57.1 → 94.7 %; _c14, _c15:
          three after three on a page that two began go on in its columns). The columns of a right-to-left section
          (w:bidi) run from the right, a section on the next column keeping the direction of the one whose columns it
          goes on in (tdf135343_columnSectionBreak_c12v3: "RTL 1" centered in the right-hand first column; _c14). A
          continuous section that begins on a page has its own left and right margins there (docx/local/csm-1,
          csm-cols: its text 144 pt from the page's left edge below a section's at 72 pt, its two columns out to its
          36 pt right margin; docx/external/libreoffice/extras-ooxmlexport/fdo52208 70.7 → 92.6 %, endingSectionProps
          94.5 → 98.3 %).

      - id: section.pageBorders
        title: Page borders
        elements: [w:pgBorders, w:top, w:bottom, w:left, w:right, w:alignBordersAndEdges, w:bordersDoNotSurroundHeader,
                   w:bordersDoNotSurroundFooter]
        priority: P2
        difficulty: 3
        status: done
        strategy: >-
          Line borders and the 165 art borders of the format catalog, measured from the page edge or the text,
          on all pages, the first page or all but the first.
        office: >-
          Line borders as Word prints them: from the page's edge a side's outer edge stands its space from the edge,
          from the text its inner edge its space outside the margins and around a header and footer the page has
          (w:bordersDoNotSurroundHeader, w:bordersDoNotSurroundFooter); on all pages, the first or all but the first;
          in front of or behind the text. From the page's edge the spaces are floored to whole device dots and the
          right and bottom sides stand a dot further out, as GDI's rectangles end (docx/local/pgb-c: 20 pt at 19.92 pt,
          the right line ending at 575.52 pt of an A4 page; extras-ooxmlexport/fdo64350: shadows ending 23.88 pt from
          the right and bottom edges). Dashed and dotted lines are stroked dash by dash, as Word's PDF strokes them
          with a dash pattern, which the rasterizer widens to a pixel, each dash a path of its own (as subpaths of one path
          they lose the ink at their ends; fdo64350, page-borders-export-case-2 63.7 → 86.3 → 100 %). Lines and gaps are
          floored to Word's 0.12 pt device dots; double, triple and
          thin-thick lines with white gaps (thin lines 0.75 pt, gaps 0.75 pt, half the width or the width) nest at the
          corners; dotted and dashed lines run between filled corners; embossed and engraved lines in three shades;
          shadows as black bands of the lines' width (docx/generated/page-borders, docx/local/pgb-a, pgb-b, pgb-c:
          line styles 85 to 99.9 %). Waves and stroked dash-dots, pictures in Word, are drawn as lines. Art borders:
          with an art on any side Word draws every side there is with the art and color of the last side at the size
          of the first art (w:sz in points), nothing when the last side has a line; a square tile in each corner,
          which ends a side at the page's edge where the side it meets is left out, and between the corners as many
          tiles as fit of the picture's length in whole device dots plus one, stretched to the side dot by dot (the
          first tiles a dot shorter). The ten basic art borders (black and white dots, dashes and squares, thin, wide
          inline, midline and outline lines) are drawn from their measured geometry, the bottom's and right's tiles as
          Word's own (docx/local/pgb-art2 99.3 %, pgb-art3 99.4 %, sizes 10 to 31 pt). 3-D page borders (threeDEmboss,
          threeDEngrave) of black or the automatic color are light gray, gray and black stripes (C0C0C0, 606060,
          000000) as table borders' (docx/external/libreoffice/extras-ooxmlexport/n705956-1). Known deviation: Word's
          other 155 art borders are pictures of its own (apples, hearts, trees ...) and are left out.

      - id: section.lineNumbers
        title: Line numbers
        elements: [w:lnNumType, w:suppressLineNumbers]
        priority: P2
        difficulty: 3
        status: done
        strategy: Numbers in the left margin per line, restarting per page, section or never, every n-th line.
        office: >-
          Body lines of numbered sections count, empty ones too, except those of paragraphs with
          w:suppressLineNumbers, tables, notes, headers and footers; the first line has w:start + 1; the count starts
          again on every page (newPage, the default), in every section (newSection) or never (continuous); every
          w:countBy-th number shows, right-aligned w:distance (0.25 in by default) left of its column on the line's
          baseline, in the Line Number style rather than the paragraph's formatting (docx/local/line-numbers 97.8 %).

      - id: section.pageNumbers
        title: Page numbering
        elements: [w:pgNumType, w:pgNum]
        priority: P0
        difficulty: 2
        status: done
        strategy: Number format and restart per section, chapter numbers from heading styles; PAGE fields read them.
        office: >-
          PAGE shows the page number in the section's format (w:pgNumType/@fmt) unless the field's own \* switch names
          one; w:pgNumType/@start restarts the count at the section's first page (docx/local/hf-parity). With chapter
          numbers (w:chapStyle) the number of the last heading of that level on the page or before it, in its level's
          format alone (Chapter B shows B), stands before it with the separator of w:chapSep (hyphen, period, colon,
          em dash, en dash; docx/local/chapter: a page ending one chapter and starting the next shows the next's).

      - id: section.docGrid
        title: Document grid
        elements: [w:docGrid]
        priority: P1
        difficulty: 4
        status: done
        strategy: >-
          Line pitch (lines snap to the grid) and character pitch, the default of East Asian templates; changes the
          line height of every paragraph that snaps to the grid.
        office: >-
          A line grid (w:docGrid type lines, linesAndChars, snapToChars) makes every line of auto spacing in
          paragraphs that snap to it as many whole pitches high as its natural height needs, times its spacing factor,
          the extra half above and half below; exact spacing and w:snapToGrid off keep their heights; headers and
          footers do not snap (docx/local/docgrid: 18 and 15 pt grids with Arial 10 to 30 pt, every line within 0.13
          pt). What ruby and raised text reach beyond a line counts in its natural height there, the whole standing in
          the middle of its pitches (docx/local/rg-*: 11 pt MS Mincho with ruby 10 pt up takes two 18 pt pitches, ruby
          5 pt up one; poi/61470, tika/testWORD_phonetic 63.2 to 78.1 %). A character grid adds w:charSpace / 4096 pt
          to every character (East Asian lines exact, Latin within 0.03 pt a character). Lines of auto spacing above
          single take the larger of the factor's pitches and the whole pitches their text needs (docx/local/lgr-20,
          lgr-40: Arial 20 pt at 1.5, 2 and 3 times an 18 pt grid 36, 36 and 54 pt high, 40 pt 54 pt at all three;
          docx/external/libreoffice/extras-ooxmlexport/chtoutline 42.0 → 69.9 %). A grid that snaps characters (w:type
          snapToChars) adds its pitch to East Asian characters only, Latin text keeping its natural width
          (docx/local/cgr-chars, cgr-both: Japanese a point wider a character in both, Latin only under linesAndChars;
          docx/external/libreoffice/extras-ooxmlexport/tdf91261 57.8 → 85.4 %). Before Word 2013 the lines of a
          character grid's paragraphs span as many whole pitches (the Normal style's size and w:charSpace / 4096) as
          the column holds, aligned and justified there; Word 2013 and later use the whole column (docx/local/cgw14-*,
          cgw12-dist: a 415.6 pt column holds 17 pitches of 24 pt, a distributed line spreads over 408 pt, right
          aligned text ends there, centered text is centered in it, with 10.5 pt runs too; cgw-*, cgw15c-dist;
          docx/external/libreoffice/extras-ooxmlexport/tdf107359-char-pitch 70.4 → 100 %). Lines in table cells snap
          to the line grid only where the document says w:adjustLineHeightInTable (docx/local/ygc-12, -15: 11 pt Yu
          Gothic lines 18.4 pt apart in a cell under an 18 pt grid, two pitches in the body; ygc-12-adj, -15-adj: two
          pitches in the cell too; tdf128375; docx/local/nfg-*: on both sides of a page break through a nested table,
          its cell laid out again for the cut under the settings of its first layout). Under a grid that snaps characters the cells fill the width the text is
          laid out in, as many whole ones as fit stretched to it, and a paragraph's last line of Latin text stands
          centered in the whole cells it needs from its start, however the paragraph is aligned and with w:snapToGrid
          off too (docx/local/cglc-snap0: left and right aligned and centered lines of Calibri 11 on 11 pt cells
          centered in 9, 8, 6 and 2 cells from the margin; cgl-*: cells of 20.265 pt before Word 2013, whose lines
          shrink to whole cells first, 20.51 pt across 451.3 pt from Word 2013 on; full lines from the margin;
          tdf91261 86.8 → 97.7 %). Text boxes in the body snap to the grid, those of headers and footers do not, as
          their stories (docx/local/gbx-*: a footer box's line at its insets under 18 pt pitches of type lines and
          snapToChars, the body box's on the pitch and centered in cells of 20.62 pt, its 185.6 pt over 9), and a box
          keeps its whole width before Word 2013 too (gbx-both-14: right aligned text at the right inset). Known
          deviation: Word centers each East Asian character in its grid cell where the grid snaps characters, 6 pt in
          for 12 pt characters in 24 pt cells (cgr-chars, cgw-snap, cgw14-snap, cgl-*), and centers the Latin text
          between them in whole cells; ours begin at their cell's start, and lines with East Asian text keep theirs.

      - id: section.printing
        title: Printer and book fold settings
        elements: [w:paperSrc, w:printerSettings, w:bookFoldPrinting, w:bookFoldPrintingSheets, w:bookFoldRevPrinting,
                   w:printTwoOnOne]
        priority: P3
        difficulty: 2
        status: done
        strategy: Printer trays are ignored; book fold and two pages per sheet change the page geometry and are measured.
        office: >-
          Paper trays and printer settings are ignored. Book fold and two pages per sheet already halve the paper in
          w:pgSz; with w:printTwoOnOne odd pages swap their top and bottom margins, book fold keeps them
          (docx/local/print-twoonone and print-bookfold: every line as in Word).

  - id: headerFooter
    title: Headers and footers
    features:
      - id: headerFooter.parts
        title: Headers and footers
        elements: [w:hdr, w:ftr, w:headerReference, w:footerReference, w:titlePg, w:evenAndOddHeaders]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          First, even and default headers per section, inherited from the previous section when missing; laid out by
          the same engine at w:header/w:footer distance. A header taller than the top margin pushes the body down.
        office: >-
          The header starts w:header below the page's top edge with the space before its first paragraph; the footer
          ends w:footer above the bottom edge with the space after its last. A header reaching below the top margin
          pushes the body down to its end including that space after, a footer reaching above the bottom margin moves
          the body's end up (docx/local/hf-tall, hf-short). The first page of a section with a title page has the
          first header, also the page a continuous section begins at the top of, not the one after a page where it has
          lines (docx/local/hfc-0t, hfc-2t; a page's header is its top's section's), even page numbers the even header
          when the settings ask for different odd and even headers; a section without a header of a type inherits the
          previous section's, its tables as wide as in that section's text, from the margin of the page's (docx/local/
          ifw-*: a footer table of 100 %, floating or not, 468 pt wide from the margin of a section 252 pt wide, which
          a footer of its own of the same content has 252 pt wide; paragraphs, tabs and alignment follow the page's
          margins; extras-uiwriter/tdf157131 87.0 → 98.8 %), and a type no section gives is an empty header; a
          reference of a type Word does not know
          is the default one where no default reference is given (poi/60293: type="odd" with odd and even headers,
          75.0 → 100 % of the lines). Word's footers stand 0.14 pt lower than the footer distance says (its 600 dpi
          device grid), which the layout does not copy. Inline pictures of headers and footers lie behind the body's
          text, as Word draws their layer first (openxml-sdk/complex0, 2010). Drawings of headers and footers that text
          goes around keep the body's text off them as the body's own do (by agent AE: LibreOffice's
          core-layout/table-fly-overlap, a header picture wrapped square from 34.25 to 164.75 pt with the body below
          it). Floating tables of headers and footers
          stand as in the body and take no room in the story; those anchored to its text make it reach as far as they
          do, the paragraph they are anchored to going below them where they begin above it, the story's other text
          over them; the body's text goes around those anchored to the page, and a table of the body below one that
          leaves it less than half its width beside it (docx/external/libreoffice/extras-ooxmlexport/tdf149089,
          tdf162746, poi/PageSpecificHeadFoot, core-header_footer/tdf79639,
          writerfilter-dmapper/floating-table-header, core-unocore/tdf108272-1-minimal). A header's or footer's
          paragraph goes around its own floating drawings placed from it as body text does
          (docx/external/libreoffice/extras-layout/footer-nowrap-object: a footer's line below its own picture top and
          bottom, the footer 7.5 pt higher; Cool15691_headerTextWrapsAroundImage, -Largest: a header's text beside its
          picture wrapped square, 82.0 → 91.5 %). Their paragraphs take HTML auto spacing as the body's do: 14 pt,
          none before the first (docx/external/libreoffice/extras-ooxmlexport/fdo80997: a header 14 pt above the body,
          a footer's text 14 pt above the page's bottom, 53.3 → 97.6 %). Frames in headers and footers turn their text
          (btLr, tbRl), draw their paragraphs' borders and shading around the whole frame and keep the first
          paragraph's space before inside, as in the body (docx/external/libreoffice/extras-ooxmlexport/fdo76979: a
          black frame of turned text 42.55 by 85 pt). Known deviation: Word shades the paragraphs of such a frame one
          by one along their lines, empty ones shorter.

  - id: note
    title: Footnotes and endnotes
    features:
      - id: note.footnotes
        title: Footnotes
        elements: [w:footnotes, w:footnote, w:footnoteReference, w:footnoteRef, w:footnotePr, w:separator,
                   w:continuationSeparator, w:pos, w:numStart, w:numRestart, w:numFmt, w15:footnoteColumns]
        priority: P1
        difficulty: 4
        status: done
        strategy: >-
          Footnotes go to the bottom of the page of their reference (or below the text), continue on the next page
          with the continuation separator when they do not fit, and take space from the body (engine.pagination).
        office: >-
          Footnotes are numbered by the order of their references in the format, from the start and with the restarts
          of the section of the reference (w:footnotePr in w:sectPr, else the settings'; decimal by default, counting
          on through the sections; eachSect starts each section anew, eachPage each page, numbered from a second
          layout), their marks drawn in the reference style. A line with references needs room for their notes; where
          the last note does not fit but shows a line, it stays and the note continues on the next page under the
          separator, before that page's own notes, the page taking no more text (Word prints its continuation
          separator as the separator; docx/local/fnpages-a, -d). Lines no page break may come between (those of a
          paragraph keeping its lines together, the first two and the last two under widow control, the last line of a
          paragraph kept with the next and that one's first) make room only for the notes before them: a keep chain
          fills the page as without its own notes, which show what fits below the text, the first that does not fit
          with the lines that do, and go on to the next page, whole notes before its own; such lines whose notes do
          not show (all but the last whole, the last with a line) go to the next page with them unless they begin
          their page, as a chain that cannot break (docx/local/fnkeep-*: 31 cases with Word's pages and note lines;
          known deviation: a chain going on at the top of a page that begins with notes from the page before, which
          Word leaves to those notes alone). Notes left after the last page of text fill pages of their own. The notes
          stand at the bottom of the page, ending at the bottom margin, under the separator (144 pt long, its font's
          strikeout stroke on whole device dots: Aptos 12 pt 4.3 pt above the baseline and 0.6 pt thick, Times New
          Roman 10 pt 2.5 and 0.5 pt, Calibri 11 pt 2.8 and 0.8 pt; docx/generated/notes, docx/local/fbn-*,
          docx/external/libreoffice/extras-ooxmlexport/tdf90810short), the separators' paragraphs off the section's
          line grid (tdf143399: the endnote separator 12.07 pt high on a grid of 15.6 pt); a section whose own w:footnotePr puts them
          beneath the text has them follow its last line and its paragraph's space after (the settings' alone do not;
          docx/local/fnpages-f, -g; fbt2-14, fbt2-15: 12 pt after put the separator 12 pt lower, fbt3-15); pages
          of several columns spread whole notes into columns of their own width, each column taking notes until it
          holds its share of their height, under one separator at the left, every column of text ending above them
          (docx/local/fnpages-h). Notes of table cells need room with their row. Measured with docx/generated/notes
          and docx/local/fnpages-a to -h: all lines within 0.2 pt but the note marks, whose superscripts stand within
          half a point (run.decoration). Above notes a paragraph's last line needs its whole height and the
          paragraph's space after, from Word 2013 on (docx/local/fbn-*, fbm-*, fbo-*: a line of 24.15 pt with 10 pt
          after fits where 34.15 pt are left above the notes, not 33 pt; without notes 16.1 pt do, as before Word 2013
          with them; docx/external/libreoffice/extras-ooxmlexport/tdf90810short). A note without paragraphs takes the
          room of an empty one, space after included (docx/local/fnempty-*; powertools/WC/WC064-Footnote); a
          separator's paragraphs stand at single spacing without space before or after, whatever they and the defaults
          say (docx/local/fsep-*: the separator 16.2 pt above the note's baseline with before 12, after 0, 10 and 20
          pt or double spacing; pandoc/golden/notes), where the separator has that paragraph alone; one of several
          paragraphs keeps its spacing like the others (docx/external/libreoffice/extras-ooxmlexport/testFootnote:
          the line's paragraph and an empty one at 1.5 lines and 10 pt after, 85.1 -> 97.3 %; tdf123262). Footnotes beneath the text of a section that ends the document
          come before its endnotes before Word 2013, which follow under their separator below them, from Word 2013
          on after them (docx/local/fbt-14, fbt-15; docx/external/libreoffice/extras-ooxmlexport/fdo79062: three
          footnotes, then the endnotes, 36.0 → 83.2 → 94.9 %).
          A deleted reference counts in the numbering without the markup, its note not shown (docx/local/fnd-b to
          fnd-d: the second of three references deleted leaves notes 1 and 3). Before Word 2013 the notes keep the room
          of the continuation notice below them where the settings' w:footnotePr lists it, whether a note goes on or not
          (fnd-l, fnd-n: an empty notice of 12 pt Courier New puts the separator 13.68 pt higher in modes 14 and 12;
          fnd-g in mode 15 and fnd-m listing the separators alone not;
          docx/external/libreoffice/extras-ooxmlexport/tdf141660 81.7 → 96.1 %).
          A note's last paragraph keeps its HTML auto space after below it, the separator's too (docx/local/fau-both,
          fau-after: notes 14 pt apart, the last 14 pt above the bottom margin, the first 14 pt below the separator's
          paragraph; fau-note: the separator's own paragraph without it;
          docx/external/libreoffice/extras-ooxmlexport/tdf104354_firstParaInSection 69.1 → 89.0 %). A notes part
          without separators has Word's own, the 144 pt line and the continuation's
          (docx/external/libreoffice/extras-ooxmlexport/tdf152203: notes of type normal alone, the line above them on
          every page, 75.4 → 96.4 %; tdf152506 89.1 → 96.0 %). Known deviation: auto space before a note (fau-before)
          is left out here.

      - id: note.endnotes
        title: Endnotes
        elements: [w:endnotes, w:endnote, w:endnoteReference, w:endnoteRef, w:endnotePr, w:noEndnote]
        priority: P1
        difficulty: 3
        status: done
        strategy: Collected at the end of the section or the document.
        office: >-
          Endnotes follow the document's last paragraph under their separator, in the order of their references, or,
          where the settings put them at the end of sections (w:endnotePr/w:pos sectEnd), follow the text of each
          section's last paragraph, an empty section-break paragraph taking no line before them, unless the section
          has w:noEndnote (then the next section takes them). Each page they go on to begins with their continuation
          separator, a rule from the left indent to the right margin on a line of its mark's height
          (core-layout/endnote-cont-separator 83.4 → 97.8 %, inline-endnote-section-delete 84.1 → 98.9 %). Their marks follow the format and start of the section
          of the reference, lower roman by default, counting on through the sections (docx/generated/notes,
          docx/local/fnpages-c, -e). Page and column breaks in notes break only their line
          (docx/external/libreoffice/extras-ooxmlimport/tdf129659: an endnote's address on its next line, 33.3 → 86.3
          %).

  - id: table
    title: Tables
    features:
      - id: table.structure
        title: Rows, cells, merged cells and nested tables
        elements: [w:tbl, w:tblPr, w:tblGrid, w:gridCol, w:tr, w:trPr, w:tc, w:tcPr, w:tblPrEx, w:gridSpan, w:vMerge,
                   w:hMerge, w:gridBefore, w:gridAfter, w:wBefore, w:wAfter, w:hidden, w:bidiVisual]
        priority: P0
        difficulty: 3
        status: done
        strategy: Grid columns, horizontal spans, vertical merges, rows that skip grid columns, right-to-left tables.
        office: >-
          Grid columns, horizontal spans, vertical merges (a merged cell taller than its rows makes the last one
          higher; where its rows go to different pages its lines, as laid out from the cell's top whatever its
          alignment, stay with the row they end in, those of rows on the next page go on at the top of its first row,
          from Word 2013 on a paragraph that widow control keeps together whole, and the merge's last row there grows to
          hold them: docx/local/vmb*-*, docx/external/poi/bug65649, docx/external/libreoffice/extras-layout/tdf152298;
          a cell aligned to the middle or the bottom of its rows aligns within its part on the first page, and its
          turned text (btLr, tbRl) is laid out along that part alone, from its end or its top, none of it on the next
          page: docx/local/vmt-*, a cell over rows of 102, 150.45 and 121.5 pt at least, the third on the next page, in
          modes 11 and 15; extras-layout/tdf127118 80.3 → 91.9 %), rows that skip grid
          columns (no lines where no cell is), nested tables, right-to-left tables (the
          first column at the right, the table at the right margin); tables that follow each other directly are joined
          with one line between, an inside line: the first's last row's cell bottoms or inside line against the
          second's first row's cell tops or inside line, neither table's own bottom and top lines (docx/local/tbl-geom,
          tbl-features, tjn-a … tjn-i; docx/external/libreoffice/extras-ooxmlexport/tdf104061_tableSectionColumns).
          Rows with exceptions (w:tblPrEx) have their own table borders, side by side over the table's; between two
          rows each cell brings its own row's inside line, resolved by weight with the other's (docx/local/rowex: a
          row whose inside lines are red and double has them above and below it; docx/external/powertools/RP/
          RP033-Table-Prop-Ex-Change). Horizontal merges of old documents (w:hMerge): a
          cell that continues a merge widens the cell before it, which keeps its content (the continuing cells' does
          not show) and takes the right border of the last (docx/local/hmerge, 99.8 %). A cell's empty last paragraph
          after a nested table takes no room, whatever its spacing and mark (docx/local/nestedend-12, -14, -15), also
          where it holds runs without text (docx/local/bmc-*-o*, -n*: an empty w:t).
          What a cell holds is cut at its inside, between its side lines and from below the row's top line to its
          bottom: paragraph borders past the lines or below a row of exact height do not show (docx/external/
          libreoffice/core-layout/para-border-in-cell-clip: Word's clip from the left line's inner edge to the right
          one's; the cut of text is not modeled).

      - id: table.width
        title: Table and column widths (autofit)
        elements: [w:tblW, w:tcW, w:tblLayout, w:tblInd, w:jc, w:tblCellSpacing, w:tblCellMar, w:tcMar, w:top, w:bottom,
                   w:left, w:right, w:start, w:end, w:noWrap, w:tcFitText]
        priority: P0
        difficulty: 5
        status: done
        strategy: >-
          Fixed layout uses the grid; autofit layout computes column widths from the content's minimum and maximum
          widths like Word, which the specification does not describe: measured with generated tables
          (engine.tableLayout).
        office: >-
          Fixed tables use the grid; autofit tables are recomputed as Word does (measured with docx/local/tbl-autofit
          in Courier New, ten cases within 0.15 pt): each column's minimum (its widest unbreakable content) and
          maximum (its content unwrapped, at most 22 inches), rounded up to whole twips (docx/external/pandoc/golden/
          tables_separated_with_rawblock: Aptos 12's "a", 127.5 twips, makes a column of 344 twips with its margins,
          the next cell's text at 1761 twips, dot 734; 88.5 → 100 %), with the cells' margins, where narrower than half the
          line beside them that half (docx/local/cellborder), inline pictures with their width; a preferred cell width
          fixes its column; where the maxima fit the columns take them (stretched in proportion to them for a wider
          table width), where the minima fit each gets its minimum and a share of the rest in proportion to max - min;
          where preferred widths do not fit, columns whose contents need more keep their minimum and the others give
          up what is missing in proportion to how much they prefer over their contents' minimum (docx/local/tblpic
          table B, tblpic2, overpref-O1 to -O4 within 0.2 pt: cells preferring 221 pt each on 451 pt beside words of
          12, 48 and 30 pt take 143.6, 157.1 and 150.3 pt); where cells prefer percentages that fit and only columns
          whose contents need more make the table too wide, the others give up what is missing in equal shares
          (docx/local/t65649-table: four columns of 18 to 38 % give up 1.6 pt each to one of 6.5 % whose word needs
          6.4 pt more; poi/bug65649); percentages that add up to more than the table, those before the last fitting,
          leave the last column what is left (docx/local/pw-a, -b, -c 14 and 15: cells of 30 and 80 %, 80 and 30 %,
          50, 40 and 30 % within 0.1 pt; extras-ooxmlexport/fdo78469 85.7 → 99.99 %; known deviations: pw-d, 30, 80
          and 10 %, Word narrows otherwise; fixed tables take their cells' percentages over a grid that disagrees,
          pw-*f, ours the grid); a paragraph's negative left indent shrinks its column's minimum, a negative
          right one does not (docx/local/negind); where the contents' own minima do not fit either, those shrink in
          proportion, preferred widths aside (tblpic3 G: pictures of 200, 200 and 100 pt take 180, 180 and 91 pt;
          docx/external/powertools/WC/ WC023-Table-4-Row-Image-Before keeps three equal columns although each holds a
          picture wider than a third); a table narrower than its contents' minima grows to them, up to the width
          available, before they shrink; one that prefers more than is available keeps them whole, however wide it
          becomes, in modes 14 and 15 alike (docx/local/tblover-14, -15: pictures of 200 and 250 pt make a table
          preferring 400 pt 450 pt wide, of 300 and 250 pt 468 pt, the width between the margins; 700 pt of pictures
          in one preferring 500 pt; docx/external/ poi/bug59058: 553.5 pt of spacer pictures in a centered table
          preferring 552.75 pt); cells preferring more than the table give way to its width (tblover T13 to T15);
          columns with nothing in them, not even margins, take the table's preferred width by its grid, also more than
          is available (docx/local/twb-*: an empty shaded cell of a table preferring 800 pt, centered across the
          margins; 400 pt in text boxes 200 pt wide; libreoffice/extras-ooxmlexport/n780563: 1440 pt bands across a
          page); widths before and after rows do not widen columns. Cells over several columns widen them where they
          are too narrow together, the narrower spans first: what is missing goes to the columns nothing has given a
          width yet (in proportion to the grid's widths), else to those without a preferred width of their own in
          proportion to their widths, else to the span's last column (docx/local/so-1 to so-10, gw-1 to gw-16: a 300
          pt cell over a 15 pt column and two of 250 pt together makes them 17.2 and 282.8 pt, wherever it stands;
          over columns preferring 100 and 50 pt 100 and 200 pt; a cell over all columns of a table of percentages
          leaves them theirs; rows that contradict each other take the widest;
          docx/external/libreoffice/extras-ooxmlexport/ wDateValueFormat, fdo78883). Where the minima shrink, a cell
          over several columns keeps its contents' minimum, its last column taking it from the others. Tables whose
          cells all prefer widths in points Word lays out anew whatever their grid says (docx/local/t705-*: six grids
          for extras-ooxmlexport/tdf123705 give the same lines): the rows' cells laid end to end put each grid line
          where the farthest needs it; a column's floor (its contents' minimum with the margins) comes from its own
          cells, then from the cells over several columns, the narrower first, filling the room below the preferred
          widths where those hold them, else in proportion to the preferred widths (docx/local/csp-1, csp-6: pictures
          over two columns widen them by 20.5 and 19.8 pt, 17.8 and 22.5 pt; core-ooxml-pass/tdf96749); where the
          preferred widths raised to the floors are more than the table has, the columns that need more keep their
          floors and the others give way in proportion to how much they prefer over their floors (csp-2 to csp-7
          within 0.15 pt; powertools/HW002-Table07; tdf123705 69.0 → 99.4 %, tdf96749 96.3 → 98.9 %,
          powertools/RP/RP034-Deleted-Cells-Rejected 96.1 → 100 %); known deviation: inside a cell over several
          columns that gives way, Word puts the line between them up to 4 pt further right (csp-8 to csp-10).
          Word 2013 tables start their grid at the indent and move it right by half the left
          border; older compatibility modes put the first cell's text at the indent and let an autofit table as wide
          as its column end its last cell's text at the column's right edge, the cell's margin and the line's middle
          beyond it (docx/local/tw-12-*, tw-14-*, tw-15-*: margins of 0.5 and 8.5 pt reach as far past the right
          margin, in mode 15 nothing; docx/ external/libreoffice/core-ooxml-pass/fdo78904_fileHang: 440.7 pt between
          432 pt margins); right-aligned ones end their last cell's text at the column's right edge, and autofit
          centered and right-aligned ones of automatic width wider than the column take it and both outer cell margins,
          their first cell's text at the left margin (docx/local/tal-12, tal-14, tac-14: cell margins of 5.4 and 10 pt
          within 0.12 pt, tac-15, tal-15 at the column; extras-ooxmlexport/table-alignment 87.3 → 100 %, fdo66474 79.1
          → 100 %, tdf79329 67.5 → 99.0 %, extras-uiwriter/tdf135623 93.7 → 99.9 %; a table of 100 % keeps the
          column's width, sdt-company-multipara); right-to-left tables (w:bidiVisual) do so from the right, their first
          cell's text at the indent from the right margin, without an indent their right line on it, and aligned to
          their end (jc right) their last cell's text at the left margin (docx/local/btv-12, btv-14 within 0.15 pt,
          btv-15 without outset; extras-ooxmlexport/table-rtl 92.7 → 100 %, FDO76312 81.4 → 85.4 %,
          python-docx/tbl-on-off-props 97.9 → 100 %); tables nested in cells stand as from Word 2013 on in every mode, their left line at the
          outer cell's text, 100 % as wide as that text, tblInd from there, unlike those of text boxes
          (docx/local/nz-11 to nz-14b; core-text/ floattable-anchor-height, core-text/fly-minimal-wrap). A table inside a
          paragraph (w:p > w:tbl, outside the schema) stands right below the paragraph's text before it, which loses its
          space after and the empty line of a break ending it, the rest of the paragraph below the table where there
          is any (Word's PDF of docx/external/libreoffice/extras-ooxmlimport/tdf111550 68.6 → 93.3 %). A nested
          table needs of its outer column its content and the width it prefers itself, not what its cells prefer:
          wider ones it gives up in the cell (np-1 to np-4, np-7: a nested cell of 400 pt or three of 150 pt in an
          outer cell preferring 200 pt leave the outer columns theirs; core-layout/floattable-nested-rowspan,
          tika/testWORD). Floating drawings that text goes around count in their column with their width and effect
          extents, not their distances (docx/local/agr-anchor, -anchor14: shapes of 72 and 43.2 pt wrapped square
          alone in two cells share the table in proportion to them and the margins); a paragraph without content needs
          nothing, its indents neither (agr-text, agr-firsttext; agr-empty, agr-float: empty columns share it equally
          in modes 15 and 14). In a fixed table of a width of its own, grid columns that no row reaches take nothing
          of that width (docx/local/tug-1 to tug-4: rows of one cell in a grid of three fill 9072 twips, rows of two
          share them, a row of all three keeps the grid; docx/external/libreoffice/extras-mailmerge/grabbagtest 52.5 →
          100 %). A fixed table's grid that lists fewer columns than its rows use Word builds from the cells' widths,
          those of one column first, then what spanning cells leave to theirs (Word's PDF of
          docx/external/libreoffice/extras-ooxmlimport/n780645: grid columns of 2029 and 7469 twips beside a row of
          five cells, 88.3 → 100 %); an autofit table with such a grid lays its rows' cells end to end from the left, each
          grid line where the first row ending a cell there puts it, the last where the widest row ends, the others'
          last cells stretched to it (Word's PDF of docx/external/libreoffice/extras-ooxmlexport/tdf59274: a grid of
          4 columns for spans of 11, rows of 7348, 3016 and 9048 twips all 9048 wide, 42.1 → 99.5 %; one line of a
          row 2.45 pt short of the row below's goes to it in Word, not here; one without any grid column lays its columns out by
          their content, LibreOffice's writerfilter-dmapper/floattable-then-table). A nested table's outer lines take their halves beside its columns in the width its cell needs
          (docx/external/libreoffice/filter-ascii/tdf162180: nested columns of 24.23, 43.23 and 54.58 pt between 0.5
          pt lines keep "Approved" and "Central" whole, 68.7 → 98.5 %; extras-ooxmlexport/tdf79272_strictDxa 67.5 →
          99.7 % with its Strict text directions). A nested table of fixed layout wider than its cell's text shrinks to it with its outer lines'
          halves (np-5: a grid of 400 pt in a cell of 200 pt with margins of 5.4 pt from the text's left to its right
          edge; writerfilter-dmapper/floattable-nested-3tables 83.9 → 91.5 %). Known deviation: for a nested table
          preferring more than the outer table leaves it Word widens the outer table past its own preferred width
          (np-6). Cells of tables without any table style (the
          document has no default table style either) have left and right margins of 0.5 pt (docx/local/tblnostyle-12,
          -14, -15). A percentage width is of the column's width, whatever the indent (docx/local/tpi-1 to tpi-6: 100
          % indented -15.9 or 36 pt is 450.8 pt wide, ending as far before or past the right margin, in modes 14 and
          15; docx/external/poi/bug65649). A fixed table with a width of its own scales its grid to it, whatever its
          cells say; a width in points lies between the outer lines' middles (with cell spacing too), a percentage
          between their outer edges, of the available width less the outer lines (docx/local/tpw-15: 40 % and 50 % of
          451.3 pt with outer lines of 0.5, 3 and 6 pt 180.87, 182.31, 184.11, 225.87, 227.07 and 228.63 pt wide;
          core-unocore/floattable-split), before Word 2013 between the middles, a percentage of the available width
          and the outer cells' margins together (docx/local/tblwidth-15, -14, tblwidth2-15, -14: 50 % of 451.3 pt with
          margins of 5.4 pt 231.0 pt wide; pandoc/golden/raw-blocks), half an outer line instead of its margin where
          that is wider (docx/local/tpw-14: margins of 0.5 pt, 40 % and 50 % with outer lines of 0.5, 3 and 6 pt
          180.99, 181.71, 182.91, 226.23, 227.19 and 228.63 pt between the middles; extras-ooxmlexport/
          tdf168988_grabbagDatePicker 86.1 → 100 %, tdf160077_layoutInCellC 94.3 → 99.8 %). Widths, indents and cell margins in twips wrap
          around past 32767 as Word's 16-bit values do, a margin below 0 none (LibreOffice's
          extras-ooxmlexport/large-twips: a table indent of 65000 twips stands 536 twips left of the margin, cell
          margins of 65000 count as 0).

      - id: table.rows
        title: Row height, splitting and header rows
        elements: [w:trHeight, w:cantSplit, w:tblHeader]
        priority: P0
        difficulty: 4
        status: done
        strategy: Exact and minimum row heights; rows split across pages unless w:cantSplit; header rows repeat on every page.
        office: >-
          A row is its top line and its content; at-least heights count without the line, exact ones with it. A row's
          cells all take its largest top and bottom margins; an at-least height lies between them, an exact one holds
          the top line and margin and the bottom margin comes below it, in every mode (docx/local/rowmar-11 to -15,
          -12c, -15c: rows of 30 pt at least with margins of 5 and 3 pt and 0.25 pt lines are 38.25 pt apart, rows of
          exactly 30 pt 33 pt; beside a cell with 5 pt at the top and one with 10 pt at the bottom a cell without
          margins puts its text 5 pt down; docx/external/poi/60329). A row fits where it and the line that closes the
          table below it fit (docx/local/tblbottom-*). Rows that do not fit split at a line of each cell, a
          paragraph's last line fitting with its space after and with the row's bottom margin, the largest of its
          cells', in every mode (docx/local/bmc-*-b*, -t*, -o*: a line of the cell with a 10 pt bottom margin, of the
          cell beside it or of a table nested in it goes on where the margin would reach past the page's bottom, in
          modes 11 and 15; rowmar-11, -12, -14: a line ending 5 pt above the cut over a 10 pt margin goes on; sr-4,
          sr-5: rows with 5.65 pt margins in mode 15), and with the bottom margins of the nested tables' cells it
          stands in and the lines below their rows, which each part ends with (docx/local/nft-*-c*, -m*: a nested
          line whose 3 pt bottom line or 10 pt bottom margin would reach
          past the page's bottom goes on in modes 11 and 15, the part before the cut ending 10 pt below its last line;
          LibreOffice's writerfilter-dmapper/floattable-hidemark: a line of a floating table's cell with 6.75 pt at the
          bottom whose bottom is 1.6 pt above the page's goes on in mode 12, the paragraph after the table 6.75 pt
          below the rest's last line, 71.0 → 92.6 %; docx/local/sr-3: the rest of a nested row cut in two ends 11.5 pt
          lower, as in Word); header rows, rows of
          exact height, rows that may not split (w:cantSplit), rows whose at-least height does not fit and rows with a
          cell whose first line does not fit move on whole (a picture line that fits without its space after too, and
          from Word 2013 on a paragraph that widow control keeps whole: two lines on each side of the cut or none,
          docx/local/rs3-*), and a paragraph kept with the next one goes on with the next one's first line
          (docx/local/spg2-15, spg3-15; in older modes it stays, spg2-12, spg3-12, -14), as does a paragraph whose
          drawing that text goes around, laid out in the cell, would reach past the cut, from Word 2013 on, the rest
          as high as that drawing (docx/local/tpq-tbl-15-*: a 92 pt picture 1 to 50 pt past the page's bottom takes its
          paragraph to the next page, as in the body; tpq-tbl-14-*: before, it stays; LibreOffice's extras-layout/
          tdf172156 82.7 → 99.4 %); the part before the cut ends
          below its cells' content, a paragraph's last line with its space after, and their bottom margin where the
          page has room for it, not at the page's end (docx/local/spg-*, spgf-*: 0, 6 and 18 pt after 25 pt above the
          page's end; rowmar-11 to -14); a paragraph that begins the rest keeps what its space before has more than
          the space after the paragraph above it, a frame in the cell standing out of that flow (spg-11 to -15,
          spgf-14, -15: 12 pt before after 0, 6 and 18 pt after keep 12, 6 and 0 pt, in floating tables too; spg3-*:
          after a framed paragraph below one with 12 pt after nothing; docx/external/libreoffice/core-layout/
          floattable-deleted-anchor 87.0 → 99.9 %, writerfilter-dmapper/floattable-nested 84.3 → 93.9 %,
          core-text/floattable-bad-fly-pos 88.4 → 97.5 %, core-layout/floattable-in-inlinetable 90.6 → 98.4 %,
          core-ooxml-pass/fdo78904_fileHang); the rest of a split row ends below its last paragraph's space after, at least its
          at-least height, and cells aligned to the middle or bottom align again in each part, the first down to its
          tallest content (tblsplit-*, docx/local/rowsplit-*, rowsplit2-*: 13 cases within 0.1 pt); a row of a nested
          table goes on whole where its at-least height does not fit, as the table's own rows do
          (docx/external/libreoffice/writerfilter-dmapper/ floattable-nested: an inner row of 85 pt with one line
          moves to the next page); content that the cut divides goes on at the top of the rest, whatever its cell's
          alignment (docx/local/vs-1 to vs-10: of two centered or bottom-aligned lines with one row line on the page
          the second stands at the next page's top; docx/external/poi/bug65649); a nested row cut in two goes on below
          its line and its cell's top margin again (docx/local/sr-1 to sr-5: 6.15 pt further down than a row of the
          table itself; core-text/floattable-anchor-height). From Word 2013 on header rows go with the first row to the
          next page where it does not fit below them (all of it where it may not split, else a line), repeat after
          every break where the next row fits below them and stay off where it does not, which still pushes what
          follows the table to the next page; a row that may not split splits at the top of a page that cannot hold it
          (tblhdr-*). Where
          the table breaks the line below the page's last row closes it (docx/local/tbl-autofit, tbl-features), and
          the part on the next page or in the next column begins with the table's top line where no header rows stand
          above it, after a cut in a row and between rows, also of floating tables (docx/local/cb-1 to cb-7: a 3 pt
          outer top line over the continued row of a table whose inside lines are 1 pt or none;
          core-unocore/floattable-split), over a cell merged down from the row before the cell's own top line in that
          row, not the merged cell's (docx/local/vmt-*: a merged cell's 1.5 pt top line gone, a 3 pt one of the cell
          in the row going on drawn, its content below it; extras-layout/tdf127118). A table of header rows only moves to the next page where they do not all
