  - id: math
    title: Equations (Office Math)
    features:
      - id: math.equations
        title: Equations
        description: Inline equations (m:oMath in a paragraph) and display equations (m:oMathPara).
        elements: [w:oMath, a14:m]
        namespaces: [m]
        priority: P1
        difficulty: 4
        status: done
        strategy: >-
          The OMML layout of pptx `text.math` (done) with Word's paragraph context: display equations take their
          own lines and justification, inline equations sit on the text baseline, long display equations break at
          operators.
        office: >-
          Equations are laid out by the OMML engine of pptx text.math with the runs' w:rPr: an m:oMath stands in the
          line on its baseline with its ascent and descent; the display equations of an m:oMathPara take lines of
          their own, broken before the binary and relation operators of their top level where they are too wide (the
          next lines indented by m:wrapIndent) and placed by m:jc: centered as a group, centered, left or right
          (docx/generated/equations, equation by equation within 0.3 pt of Word's lines but the limit with its
          fraction). A paragraph of nothing but m:oMath (bookmarks and other marks beside them) shows them as an
          m:oMathPara would, whatever the paragraph's justification; text or a space beside them keeps them inline
          (docx/local/dmath-*: one and two equations, left and right aligned paragraphs, m:defJc left; libreoffice/
          extras-ooxmlexport/math-*: math-escaping, math-placeholders, ooxmlimport/tdf169843 0 → 100 % of the lines;
          pandoc/golden/mark_math).
          An n-ary operator that grows with its operand (m:grow), other than an integral, takes the first variant of
          the math font at least as tall as the operand less a small tolerance, displayed or inline (docx/local/
          mng-*-s-*: sums over x, a fraction, nested fractions and those in parentheses in Cambria Math 12, every size
          as Word's; mnb-*, mnl-*: binomials in parentheses 1.909 to 1.926 em tall keep the 1.91 em size, limits or
          not, which bounds the tolerance to 0.016 to 0.143 em, 0.08 taken; libreoffice/extras-ooxmlexport/tdf133030
          57.5 → 93.4 %, EquationAsScientificNumbering and math-bold-italic as before). Known deviation: integrals with m:grow keep their size, Word's
          rule for them not found (mng-*-n-*: smaller variants than the operand's height in four of eight cases). The highlight of an equation's runs lies behind all of it over its lines, inline
          and displayed (mark_math). Glyphs that are their character's in the math font (its math alphabets, the
          script forms by the ssty feature) are printed as text, as Word's PDFs hold them, which the rasterizer fits
          to the pixel grid, delimiters at their own size too, the script forms in the language und-x-hbscmath, whose
          private subtag has HarfBuzz shape with the font's OpenType script math, the only one Cambria Math has ssty
          for (Chrome's PDFs of docx/local/mrd-inl: a subscript 2 and a script x in Word's forms, glyphs 2870 and
          3051, the plain ones without); stretched and large variants as outlines
          (powertools/RP/RP013: the "=" bars one black row; libreoffice/extras-ooxmlexport/math-d: "|" one black
          column). A line's height is the equation's ascent and descent and the spacing's extra of the text fonts, the
          paragraph mark's where the equation stands alone (docx/local/eq-shaded); an equation, displayed or inline,
          reaches at least the math font's ascent with its line gap above the baseline and its descent below (Cambria
          Math's 1593 + 353 units: 11.40 pt at 12 pt; libreoffice/extras-ooxmlexport/math-color: twice the characters
          in place; tdf130907: an inline equation's line as high as a displayed one's, 75.8 → 98.9 %, found by agent
          BM; docx/local/mph-24-*: 76.1 → 89.6 % and more). Word differs from PowerPoint in two
          rules: delimiters grow to the content's height less the shortfall, not twice its reach from the axis
          (docx/local/ppt-math: PowerPoint's own probe equations in Word), and a function's name keeps a thin space
          before an opening delimiter; both draw the hyphen-minus as the minus sign and ∇ and ∂ in italic. Glyphs are
          drawn as outlines under transparent selectable text. Text inserted or moved into a math run in a tracked
          change (w:ins, w:moveTo inside m:r) prints, deleted text not
          (powertools/RP/RP014-Inserted-Math-Control-Char: "A = 2πr²"). An empty base (m:e) keeps the room of the
          placeholder Word shows while editing, 0.92 em wide: inside delimiters, each part between separators too,
          under an n-ary operator, a root or an accent, after a function's name and before scripts, which it takes as
          a letter would (docx/local/mph-11-*, mph-24-*;
          docx/external/libreoffice/extras-ooxmlexport/2120112713_OpenBrace 67.2 → 94.2 %, math-placeholders 57.4 →
          94.1 %, tdf158023_export 63.4 → 78.2 %). A bookmark's end after a display equation stays on its line
          (docx/external/libreoffice/extras-ooxmlexport/tdf130907: _GoBack after the last equation, no empty line,
          71.3 → 76.0 %). An ellipsis after an operator or relation stands on the axis (U+22EF, spaced as an inner atom:
          a thin space before a comma, docx/local/msp-a;
          EquationWithAboveAndBelowCaption, math-mso2k7: "+…"). An italic letter before an operator, a relation, a
          bracket, punctuation, a space or a construct (scripts, a fraction) keeps its italic correction, before another letter
          none (docx/local/mth-*: x+, y=, f(, x), c) at 11 pt within 0.06 pt; powertools/RP/RP013: π before r² 0.32
          pt), and so does the last letter of a box: before a closing delimiter or separator, under a fraction's bar
          or an accent, at a script's and at the equation's end (LibreOffice's extras-ooxmlexport/math-d: x before
          "|" 0.33 pt, math-accents: a bar over a 6.96 pt wide; docx/local/mth-d-close; math-lim: an equation ending in
          a function's argument x centered with x's correction, 89.1 → 98.2 %), not at the end of an n-ary's operand
          (math-nary: an equation ending in a sum over x centered as without x's correction, 83.8 → 92.2 %); a
          superscript also moves by its letter's top right math kern (mth-d-sup: x^k 0.27 pt, Cambria Math's 50
          units). Delimiters grown past 1.5 times their own height space as an inner atom on both sides, a thin
          space before an ordinary atom (mti-*: 1.7 to 1.85 pt in Cambria Math 11, displayed and inline) and after an
          ordinary or closing one (mtl-*: "x", "(a)" and a closing angle bracket 3/18 em before (x over y), none
          before (1); after "+", "=" and "," as before an opening one; math-d 76.7 → 99.4 %). A function (m:func)
          spaces as an inner atom against what follows it and its argument is a box whose last letter keeps its
          italic correction (mtf-*: "sin t" then x, (1), "," or "cos u" 3/18 em apart, x with t's correction too;
          a closing delimiter none, "+" and "=" as after a letter); below display level they
          grow by twice the content's reach from the axis (mti-i-*, mth-i-binom). Scripts and their scripts take the
          font's 73 and 60 % of their base in whole half points down (Word's PDFs: 12 pt 8.5 and 7, 14 pt 10 and 8, 11
          pt 8 and 6.5, 20 pt 14.5; docx/generated/equations 89.6 → 91.1 %,
          docx/external/libreoffice/extras-ooxmlexport/tdf171433_equation 77.5 → 95.0 %, math-literal 84.7 → 90.8 %).
          A base that is a single character under or over limits (m:limUpp, m:limLow) or after prescripts (m:sPre),
          however nested, takes its scripts as that character does, not by the stack's height, the character's
          italic correction before the superscript; the stack is as wide as the character without it (docx/local/
          mls-*, mlt-*: x with 6 above, 3 below, a over b above or below, or both, with and without prescripts, its
          scripts 4.56 pt up and 2.64 down as x alone in Cambria Math 12, inline and displayed; x over y with 6 above
          takes its scripts by the stack's height). Prescripts follow the space after scripts, the base right after
          them (mls-inl: "5" over "4" 0.5 pt on, x a digit's advance after them; LibreOffice's
          extras-ooxmlexport/math-subscripts 62.2 → 90.6 %). A subscript moves by its letter's bottom right math kern
          at the subscript's top (sdx-*, sbu-c11: gamma_20 0.41 pt left in Cambria Math 11, its kern -68 units; f_k
          0.38 pt), and a script's own first glyph adds its corner's kern: a superscript's bottom left at the letter's
          top, a subscript's top left at the letter's bottom (math-subscripts: e^x 0.24 pt further than e's kern, x's
          65 units at 8.5 pt, 90.6 → 91.5 %; msk-*: digits have none). A run at a size other than its construct's (the control properties', m:ctrlPr) is set as text:
          its glyphs keep their plain forms in scripts and limits and have no italic correction, and as a base it is
          a box whose depth and height count, without math kerns, the shifts at the construct's size (docx/local/
          sbt-*, sbu-*, sbv-*: gamma at 11 pt under a ctrlPr of 12 pt its subscript 4.08 pt down, its depth 2.16 and
          SubscriptBaselineDropMin at 12 pt, under 10 pt 3.74, a superscript right after its advance; subscripts,
          superscripts, prescripts, fractions, limits, n-ary limits and radicals take plain digits; LibreOffice's
          extras-uiwriter/tdf66405 88.4 → 99.9 %). Known deviation: a fraction as an upper limit stands
          2.2 pt lower than Word's (mlt-*).
          A square root's sign is sized and placed as if the radicand reached at least from the baseline up to the
          math font's FlattenedAccentBaseHeight: the first variant at least as tall as the radicand so taken with the
          gap (displayed RadicalDisplayStyleVerticalGap, inline RadicalVerticalGap) and the rule thickness, its middle
          a rule thickness above the radicand's, its bar at least the gap above the radicand's top (docx/local/mre-d48,
          mre-i48: Cambria Math 48 pt, x, t, +, i, 4, b, y, j, an infinity and a times sign, displayed and inline, the
          bars within 3.3 font units of Word's, at 12 pt within 0.1 pt; mrd-disp, mrd-inl: x_2 and a^2 take the larger
          variant only displayed, (x+1), x/y; LibreOffice's extras-ooxmlexport/math-color-ctrlpr 75.0 → 98.4 %,
          docx/local/mph-24-rad 89.7 → 96.9 %).
          A box (m:borderBox) draws its lines in the overbar's rule thickness, the overbar's gap away from the
          content: from its ink above and below, from its advance with the last letter's italic correction beside it;
          a hidden side drops its gap along with its line, the other lines ending at the content's edge there; a
          horizontal strike-through runs through the middle of the content's ink, not on the axis (docx/local/mbx-48:
          boxes in Cambria Math 48 pt around c, b and y with all sides, each side hidden and a horizontal strike,
          within 5 font units of Word's; LibreOffice's extras-ooxmlexport/math-color-ctrlpr 98.4 → 99.5 %, c with
          hideTop; math-overstrike 92.3 → 94.2 %, every side hidden and a strike through "abc").
          Normal text (m:nor) is set in the run's text font (docx/external/libreoffice/extras-ooxmlimport/tdf170171:
          "+" in Arial).

      - id: math.settings
        title: Document math settings
        elements: [m:mathPr, m:mathFont, m:brkBin, m:brkBinSub, m:smallFrac, m:dispDef, m:lMargin, m:rMargin, m:defJc,
                   m:preSp, m:postSp, m:interSp, m:intraSp, m:wrapIndent, m:wrapRight, m:intLim, m:naryLim]
        priority: P1
        difficulty: 3
        status: done
        strategy: Defaults for all equations of the document (math font, break rules, margins, limits placement).
        office: >-
          m:mathFont (a font with a MATH table, else Cambria Math), m:defJc, m:wrapIndent, m:wrapRight, m:intLim and
          m:naryLim apply to all equations of the document. Display equations break at the binary operators of their
          top level as m:brkBin says (measured with docx/local/mathset-a to -c, every line as in Word): before them
          (the default), after them, or both (repeat), a repeated minus shown as m:brkBinSub says ("--", "-+", "+-":
          the sign at the end of the line and the one at the start); an operator at a line's end keeps the space
          before it. m:lMargin and m:rMargin narrow the room of display equations, also without m:dispDef, which
          center in it (mathset-d). The equations of one m:oMathPara stand on one line one after the other. m:preSp,
          m:postSp, m:interSp, m:intraSp and m:smallFrac changed nothing in Word's printout (mathset-d). Spaces typed
          in an equation keep their widths, and the spacing of the classes around them stays beside them (docx/local/
          mrs-*, mrt-a at 11 pt: "x= y", "x =y", "x = y", "x+ y", "x ⋅ y", "x → y", "x ≤ y" and "x; y" a thick,
          medium or thin space more than the spaces; "x (y)" none; LibreOffice's extras-ooxmlexport/2120112713: "= "
          before "{"), but after a comma one space goes, two make a space of two ems and an operator after them is
          unary (docx/local/msp2-a at 11 pt: "x, y" as "x,y", "x,  y" 21.98 and "x,  +y" 22.10 pt from the comma's
          end, three spaces as typed; LibreOffice's extras-ooxmlexport/math-mso2k7), and a colon's spaces take its thin
          space's place. A colon is punctuation, no space before it and a thin one after it ("x:y", "a:=b", "f:A→B",
          "x:(y)"), after a typed space the ratio U+2236, a relation, in the space's place ("x :y", "x : y"); an
          exclamation mark spaces as an inner atom after it ("n!x" thin, "n!+1" medium, "n!=m" thick, "(n!)" and "n!!"
          none; docx/local/mru-a). Known deviation: Word sets no thin space between "!" and a comma.

  - id: vml
    title: Legacy VML content
    features:
      - id: vml.shapes
        title: VML shapes, text boxes and WordArt
        elements: [w:pict, w10:wrap, w10:anchorlock, w10:bordertop, w10:borderleft, w10:borderbottom, w10:borderright]
        namespaces: [v, o]
        priority: P1
        difficulty: 4
        status: done
        strategy: >-
          The VML renderer of pptx `legacy.vml` (done), positioned in the text flow by the style attribute
          (mso-position-*) and w10:wrap; VML text boxes hold WordprocessingML like wps text boxes.
        office: >-
          VML shapes (w:pict) are converted to Word drawings: rectangles, rounded rectangles (their corners arcsize
          times the shorter side, not half of it as the VML spec says, 0.2 of it without one: docx/local/vrr-arc;
          LibreOffice's extras-ooxmlimport/n779627b), sizes in percent of the page or a margin (mso-width-percent,
          mso-height-percent, mso-width-relative, mso-height-relative, as wp14:sizeRelH and wp14:sizeRelV:
          docx/local/vrr-pct-*; groups too, their coordinates mapped onto the box: docx/local/vgp-pct, vgp-pctw,
          vgp-pcth, vgp-n751 in modes 11, 12 and 15; a group sized in percent both ways one of whose text boxes changed
          its height to fit its text stretches its children's bounds, the fitted boxes as high as their text, onto the
          box, from the corner its coordinates gave the bounds or as aligned: vgp-pct-fit, vgq-fitinner, vgq-fit-center,
          vgq-fit-left0; not where no box changed, vgq-nofit, vgq-fitsame; one way only, vgq-fitw, is left as it is;
          extras-ooxmlimport/n751077 70.6 → 96.4 %), ovals, lines, polylines
          (v:polyline: their points' box with the path through them, closed where it ends where it began;
          LibreOffice's tdf112450_vml_polyline 58.5 → 94.2 %), preset
          shapes by o:spt, paths as custom geometries, groups (v:group: the children in its coordorigin and coordsize,
          nested, either number 0 or 1000 where left out: libreoffice/extras-ooxmlexport/vml-text-vertical-adjust,
          extras-ooxmlimport/groupshape-sdt, coordorigin "9201"; ",1440" in docx/local/vgp-pct-org and n751077; a
          shape's path counts from its own
          coordorigin: dml-groupshape-polygon 0 → 100 %, extras-ooxmlimport/ink 5.5 → 99.6 %), pictures (v:imagedata
          with crop, grayscale, bilevel, and gain and blacklevel as a luminance of contrast gain − 1 and brightness
          twice the black level: libreoffice/watermark, extras-ooxmlexport/pictureWatermark, washed out 5.5 → 100 %),
          text boxes (v:textbox with its insets, its text turned down by layout-flow vertical, up with
          mso-layout-flow-alt bottom-to-top, upright East Asian by vertical-ideographic), WordArt (v:textpath), placed
          by the style attribute (position, margins, mso-position-*, rotation, flip, z-index) and w10:wrap
          (docx/local/vml-shapes, vml-group). A shape turns first and flips after, unlike DrawingML (docx/local/
          vmlflip: triangles and connectors turned 30° and 90° with flip:x, flip:y and both;
          docx/external/libreoffice/ extras-ooxmlexport/n751117 79.1 → 88.4 %), a turn in fixed point (fd) counting
          65536ths of a degree (docx/external/libreoffice/tdf137314_vml_rotation_unit_fd 61.8 → 99.7 %). A path's
          parameter left out before, between or after commas is 0 (m,128588; tdf105875_VmlShapeRotationWithFlip 1.8 →
          99.3 %, core-ooxml-pass/vml-path 0.1 → 95.8 %, extras-ooxmlimport/tdf105143 3.5 → 100 %). Paths draw arcs of
          an ellipse in a box between two rays (ar, at counterclockwise, wa, wr clockwise), quarter ellipses (qx, qy)
          and ellipse sweeps by angle (ae, al), as Bézier curves; each figure a path of its own, ended by e, left
          unfilled by nf and unstroked by ns, one without a move starting where the last ended; a shape type's
          formulas (v:formulas: val, sum, prod, mid, abs, min, max, if, mod, atan2, sin, cos, tan, cosatan2, sinatan2,
          sqrt, sumangle and ellipse of numbers, adjustments #n, earlier values @n and the shape's measures, angles in
          65536ths of a degree) give its path's @n (libreoffice/extras-ooxmlexport/cloud 5.0 → 99.1 %, tdf104115 3.6 →
          100 %, core-ooxml-pass/vml-path 95.8 → 100 %, extras-ooxmlexport/tdf138739 38.9 → 74.8 %, FDO78590 93.8 →
          98.5 %). A turned shape aligns (mso-position-horizontal, -vertical) by its box, width and height swapped
          from 45 to 135 degrees (and 225 to 315), about its center, together with its turned outline, curves' control
          points and WordArt's glyphs included; offsets place the box itself (docx/local/vrb-*: rectangles and ovals
          of 300 by 100 pt turned 0 to 315 degrees at the margins' top and left, within 1.8 pt; vwa-rc*: WordArt
          centered on the margins and turned 10 to 350 degrees, within 0.3 pt: at 315 degrees by its glyphs' height
          and its box's width; libreoffice/extras-ooxmlexport/textWatermark 49.8 → 100 %, fdo78659 74.4 → 99.8 %). A
          rounded rectangle's text stands inside its corners, as the DrawingML text rectangle says. An inline shape
          hangs from the top of its line (of its paragraph's space before on the first line), pictures stand on the
          baseline; an outlined shape takes the room of its box in whole 0.75 pt pixels, its outline and its shadow's
          offset right of and below it; spaces between drawings do not make their line taller
          (docx/local/vml-inline*); an inline group stands in by what its shapes reach out beyond its box on the left
          and takes the room of it (Word's PDF of LibreOffice's extras-ooxmlexport/fdo73215: a canvas whose elbow
          connector loops out on the left stands 9.75 pt right of the indent, the connector's line from 0.25 pt right
          of it, ours by the connector's geometry 9.92 pt, 67.1 → 96.5 %; above, right and below alike, not
          measured). Fills and lines as Word draws them (docx/local/vml-fx, vml-angles, vml-pattern): a
          gradient runs, at the focus 0 Word writes by default, from color2 at the start of its angle (0: the top, 90:
          the left, 45: the top left corner, the angle applying in the shape stretched to a square) to the fill color,
          at focus 100 % the other way, at 50 % from the fill color to color2 in the middle and back, at -50 % the
          other way round, at any other focus the focus applied twice; a negative angle turns it round (the angle plus
          180, the focus ±50 % reversed, any other the rest to 100 %); along its colors list where it has one; color2
          "fill darken(n)" or "lighten(n)" for one-color gradients; gradientRadial from its focus position outwards;
          colors blend in linear light along an S-curve, in plain RGB along a straight line where the method is none
          or linear or the gradient lists its colors, whatever its method (docx/local/vgc-a: red to blue halfway
