        priority: P0
        difficulty: 3
        status: todo
        strategy: Shared DrawingML renderer, as pptx `color.transforms` (done).

  - id: shape
    title: Shapes and geometry
    features:
      - id: shape.basic
        title: Shapes
        elements: [a:sp, a:nvSpPr, a:cNvSpPr, a:spPr]
        priority: P0
        difficulty: 2
        status: todo
        strategy: Shared DrawingML renderer, as pptx `shape.basic` (done).

