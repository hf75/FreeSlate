          98.1 %). Where the style has no first-column format, column bands count the first column too, whatever
          w:tblLook says (docx/external/libreoffice/extras-ooxmlexport/tdf138020_undefined_firstCol: columns 1 and 3
          in the first band's green, 30.6 → 100 %; powertools/HC007-Test-02).

      - id: table.floating
        title: Floating tables
        elements: [w:tblpPr, w:tblOverlap]
        priority: P1
        difficulty: 4
        status: done
        strategy: Positioned like a frame; text wraps around it (engine.floats).
        office: >-
          Tables with w:tblpPr take no room in the text, but one standing with the text (vertAnchor text) over the
          lines before it, or over their paragraph's space after, moves those lines below itself and keeps its place,
          the text going on below them (LibreOffice's core-text/floattable-negative-vert-offset: tblpY -269 puts the
          line before the table below it, 33 → 100 % of the lines; floattable-anchor-next-page: 1.2 pt of overlap
          suffice, 71 → 100 %; writerfilter-dmapper/floattable-redline: tblpY -17 twips leaves the page's first,
          empty line where it is). Lines before it that reach only into its distance above it (topFromText), by more
          than a point and before Word 2013 with their paragraph's space after for its last line, go beside it where
          it leaves room, the table staying where it stood for them, else below it (docx/local/ftb-*: three lines
          before a table 150 pt wide at tblpY 1 with topFromText 300, 567 and 1134 twips have their last one, two and
          three lines beside it, with 43 twips the last one before Word 2013 by its 8 pt after, none from Word 2013 on;
          a table 450 pt wide takes them below itself alike; LibreOffice's extras-ooxmlexport/table-floating-margins
          71.6 → 100 %). One placed from the page or the margin over the lines or a table of the text before it in
          its column takes them around itself too, staying where it stood for them: the lines go beside it, the table
          beside it where it fits, else below it (docx/local/nfp-5: a table at tblpY 30 pt from the margin, a table of
          the text and a paragraph before it beside it, 74.5 → 93.7 %; fm-d14 90.3 → 100 %; known deviation: fm-d15,
          where Word puts a table of 60 rows at tblpY -345 from the margin after ten lines on the next page, ours on
          the first, the lines now beside it, 45.6 → 40.0 %). Before Word 2013 the space after of the paragraph it
          stands with (the one after it)
          counts too: where the paragraph's line clears the table but its space after reaches it, the paragraph goes
          below the table and needs room there for that space as well, else the next page; later paragraphs keep their
          lines above (uitest/tdf124675) (docx/local/fla-16-*-14: an empty paragraph and "Anchor",
          13.8 pt high with 8 pt after, 16 pt above the table go below it; without space after or with the table 24
          pt down they stay; fla-*-15 stay from Word 2013 on; fas-160-14: room below for the line but not its space
          after, the next page; core-text/floattable-overlap 65.9 → 100 %, floattable-wrap-empty-para-legacy 75.8 →
          100 %, writerfilter-dmapper/floattable-outer-nonsplit-inner 33.4 → 98.4 %, found by agents BK and BM). One that ends the document, no paragraph after it, stands in the text
          (extras-ooxmlimport/table_width: at the body's top, not at its tblpY of 513 pt). Their outer left edge
          stands w:tblpX from their column, the margin or the page, from the page on the device's dot left of it
          (PowerTools' DB-HeadersFooters-Src/Letterhead: tblpX 1135 twips, 472.92 dots, at 472;
          writerfilter-dmapper/floattable-header-overlap: 567.5 dots at 567; 2.5 → 91 % and 12 → 84 % of the characters
          within half a dot) (or aligns by w:tblpXSpec; before Word 2013 their
          first cell's text stands there, as at an indent: docx/external/libreoffice/core-layout/floattable-compat14,
          -compat14-body, -compat14-nosplit in modes 14 and 12, extras-ooxmlexport/fdo68607; aligned left the first
          cell's text at the edge, right the last cell's, half the outer line and the cell margin out, centered alike:
          docx/local/ftx-14-*, -15-*, poi/ Bug54771b, libreoffice/extras-ooxmlexport/tdf97090), their top w:tblpY
          below the next paragraph's top above its space before (docx/local/floatanchor-*), the margin or the page (or
          aligns by w:tblpYSpec), the margin without w:vertAnchor; one without a vertical position (tblpY 0, no
          tblpYSpec or inline) stands at its paragraph before Word 2013 whatever its anchor, at its anchor's top from
          then on (docx/local/ta-*, tb-*; core-layout/floattable-deleted-anchor,
          writerfilter-dmapper/floattable-header); one anchored to the page or the margin whose rows of its first page would reach past
          the page's bottom moves up to end there with them, as many rows as fit between the paragraph after it and
          the bottom margin (docx/local/fpb-*: rows of 100 pt at tblpY 300 pt move up to 192 pt, six of them on the
          page, at 500 pt three to 492 pt, one at 750 pt to 692 pt, rows of 283.5 pt at 640.85 pt two to 225 pt, at 100
          and at 450 pt they stay; in modes 12, 14 and 15 alike, where the rows then break at the bottom margin;
          extras-ooxmlexport/tdf99140: text down to 368 pt leaves one row, 84.0 → 100 %); text wraps around them on both sides, their distances kept free
          (docx/local/float-tables 91.3 %: a column-aligned table exactly as in Word). The paragraph after the table
          adds all its space before to the space after the one before it; a first line pushed below a floating object
          keeps its paragraph's own space before below it (docx/local/fsb-*: 14 pt below tables anchored to the page
