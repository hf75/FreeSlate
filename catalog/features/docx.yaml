          cc-equal; extras-ooxmlexport/tdf66401 70.0 → 90.6 %, extras-odfexport/tdf130314 61.3 → 84.8 %,
          extras-rtfexport/tdf138779 61.7 → 98.0 % with run.ruby). Known deviations: LISTNUM keeps its saved result;
