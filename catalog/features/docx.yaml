# Word (DOCX) feature catalog, level 2.
#
# Curated by hand. `dotnet run --project tools/SpecTools -- features` checks every element reference against the
# format catalog (level 1), measures coverage and writes docx.md and docx.json next to this file.
#
# Per feature: see pptx.yaml. Status describes the Word pipeline; features shared with PowerPoint (DrawingML, charts,
# SmartArt, math, VML) name the pptx feature whose implementation they reuse.

document: docx
title: Word (DOCX)
description: >-
  Rendering target: one HTML document per Word document with fixed-size pages, laid out and paginated by our own
  engine the way Word lays the document out for printing. Paragraph text is measured and broken into lines by our
  own text engine and emitted as positioned glyph runs; drawings, charts and SmartArt go through the DrawingML
  renderer shared with PowerPoint. The reference is Word's own PDF export of the document.

universe:
  roots: [w:document, w:styles, w:numbering, w:settings, w:fonts, w:footnotes, w:endnotes, w:comments, w:hdr, w:ftr,
          w:webSettings, w:glossaryDocument, w:recipients, w:txbxContent,
          pic:pic, lc:lockedCanvas,
          a:theme, a:themeOverride,
          c:chartSpace, c:userShapes, c:chart, cx:chartSpace, cx:chart, cs:chartStyle, cs:colorStyle,
          dgm:dataModel, dgm:layoutDef, dgm:styleDef, dgm:colorsDef, dgm:relIds, dsp:drawing,
          m:oMathPara, m:oMath, b:Sources,
          ap:Properties, op:Properties, cp:coreProperties, ct:Types, pr:Relationships, ds:datastoreItem]
  namespaces: [w14, w15, w16cei, w16cex, w16cid, w16cur, w16se, woe, wp, wp14, wp15, wpc, wpg, wps,
               a14, a15, a16, a1611, a3danim, aanim, aclsh, adec, ahyp, aif, am3d, ask, asl, asvg, msink, oac,
               pic14, thm15,
               c14, c15, c16, c16ac, c16r2, c16r3, cdr14, cs, cx, dgm14, dgm1611, dgm1612, dsp,
               v, o, w10]
  exclude: [p, p14, p15, x, xvml, xdr, pvml]

areas:

  - id: package
    title: Package and compatibility
    description: ZIP container, relationships, markup compatibility and metadata.
    features:
      - id: package.opc
        title: Package, content types and relationships
        elements: [ct:Types, ct:Default, ct:Override, pr:Relationships, pr:Relationship]
        priority: P0
        difficulty: 1
        status: todo
        strategy: >-
          As pptx `package.opc` (done): parts are found through relationships, never by path. Word's main part is the
          officeDocument relationship of the package; styles, numbering, settings, fonts, notes, comments, headers and
          footers hang off it.

      - id: package.mce
        title: Markup compatibility and extension lists
        description: mc:AlternateContent, mc:Ignorable and the extLst/ext mechanism every newer feature uses.
        elements: [a:extLst, a:ext, c:extLst, c:ext, cx:extLst, cx:ext, cs:extLst, dgm:extLst, dsp:extLst, a14:extLst,
                   a3danim:extLst, aanim:extLst, am3d:extLst, ask:extLst, asl:extLst, oac:extLst,
                   pic14:extLst, thm15:extLst, cdr14:extLst, w14:extLst, wp:extLst, wpc:extLst, wpg:extLst,
                   wps:extLst, w16cei:extLst, w16cex:extLst, w16cur:ext]
        priority: P0
        difficulty: 2
        status: todo
        strategy: >-
          As pptx `package.mce` (done): take the first mc:Choice whose Requires prefixes we implement, else
          mc:Fallback. Word writes its 2010 drawing objects (wps, wpg, wpc) in mc:Choice with a VML w:pict in
          mc:Fallback, so implementing the Choice side makes the VML path the exception.

      - id: package.compatibility
        title: Compatibility leftovers
        description: Properties Office keeps for older versions or for converted VML content.
        elements: [a14:hiddenFill, a14:hiddenLine, a14:hiddenEffects, a14:hiddenScene3d, a14:hiddenSp3d,
                   a14:compatExt, a14:shadowObscured, a14:useLocalDpi, a14:cameraTool]
        priority: P3
        difficulty: 1
        status: todo
        strategy: Not rendered, as pptx `package.compatibility`.

      - id: package.encryption
        title: Encrypted and write-protected files
        priority: P2
        difficulty: 2
        status: todo
        strategy: >-
          The decryption of pptx `package.encryption` (done, [MS-OFFCRYPTO] agile and standard encryption) applies
          unchanged: a password-protected document is a compound file with an EncryptedPackage stream. Editing
          restrictions (w:documentProtection, w:writeProtection) only matter to an editor.

      - id: package.properties
        title: Document properties
        namespaces: [ap, op, cp, vt]
        priority: P3
        difficulty: 1
        status: todo
        strategy: Metadata only; title, author and language go into the HTML head. DOCPROPERTY fields read them.

      - id: package.customXml
        title: Custom XML parts and schema library
        elements: [sl:schemaLibrary, sl:schema]
        namespaces: [ds]
        priority: P2
        difficulty: 1
        status: todo
        strategy: Data only; content controls bound to a custom XML part read their values from it (sdt.dataBinding).

      - id: package.ids
        title: Object ids, document ids and revision save ids
        elements: [a16:creationId, a16:predDERef, a16:cxnDERefs, a16:colId, a16:rowId, w14:docId, w15:docId,
                   w:rsids, w:rsidRoot, w:rsid]
        namespaces: [oac]
        priority: P3
        difficulty: 1
        status: todo
        strategy: Not rendered; ids for co-authoring and merging.

  - id: document
    title: Document structure
    features:
      - id: document.body
        title: Document and body
        elements: [w:document, w:body]
        priority: P0
        difficulty: 1
        status: todo
        strategy: >-
          The body's block content (paragraphs, tables, content controls, custom XML, section properties) flows
          through the layout engine into pages; the last w:sectPr of the body describes the last section.

      - id: document.background
        title: Page background
        elements: [w:background, w:displayBackgroundShape, v:background, a15:backgroundPr]
        priority: P2
        difficulty: 2
        status: partial
        strategy: >-
          Color, gradient, texture or picture behind every page (w:background with its VML fill). Whether Word's PDF
          export includes it must be measured before it is drawn.
        office: >-
          Word prints the page color whether or not w:displayBackgroundShape is set: w:background's color (theme
          colors with tint and shade) or the fill of its v:background (solid, gradient, picture), drawn behind
          everything on each page (docx/local/misc-nothing, misc-nobg). Still open: Word tiles and mirrors a VML
          gradient in bands of about 94 pt; it is drawn here as one gradient across the page.

      - id: document.altChunk
        title: Imported content (altChunk)
        description: A part in another format (HTML, RTF, plain text, another DOCX) that Word converts when it opens the document.
        elements: [w:altChunk, w:altChunkPr, w:matchSrc]
        priority: P2
        difficulty: 4
        status: todo
        strategy: >-
          DOCX chunks are merged as WordprocessingML; plain text becomes paragraphs. HTML and RTF chunks need an
          import of their own; until then their text is shown without formatting.

      - id: document.subDoc
        title: Subdocuments (master documents)
        elements: [w:subDoc]
        priority: P3
        difficulty: 2
        status: todo
        strategy: Collapsed subdocuments show as their link; expanded ones are already part of the body.

      - id: document.glossary
        title: Building blocks (glossary document)
        elements: [w:glossaryDocument, w:docParts, w:docPart, w:docPartBody, w:docPartPr, w:behaviors, w:behavior,
                   w:category, w:description, w:gallery, w:guid, w:types, w:type, w:name]
        priority: P3
        difficulty: 1
        status: todo
        strategy: Not rendered; the glossary holds AutoText and building blocks, and placeholder texts of content controls.

  - id: settings
    title: Document settings
    features:
      - id: settings.compatibility
        title: Compatibility mode and options
        description: >-
          w:compatSetting compatibilityMode (11 = Word 2003, 12 = 2007, 14 = 2010, 15 = 2013 and later) and the
          layout options older documents carry; each switches a layout rule of the engine.
        elements: [w:compat, w:compatSetting, w:alignTablesRowByRow, w:allowSpaceOfSameStyleInTable,
                   w:autoSpaceLikeWord95, w:autofitToFirstFixedWidthCell, w:cachedColBalance, w:convMailMergeEsc,
                   w:displayHangulFixedWidth, w:doNotAutofitConstrainedTables, w:doNotBreakConstrainedForcedTable,
                   w:doNotBreakWrappedTables, w:doNotSnapToGridInCell, w:doNotSuppressIndentation,
                   w:doNotSuppressParagraphBorders, w:doNotUseEastAsianBreakRules, w:doNotUseHTMLParagraphAutoSpacing,
                   w:doNotUseIndentAsNumberingTabStop, w:doNotVertAlignCellWithSp, w:doNotVertAlignInTxbx,
                   w:doNotWrapTextWithPunct, w:footnoteLayoutLikeWW8, w:forgetLastTabAlignment, w:growAutofit,
                   w:hdrShapeDefaults, w:layoutRawTableWidth, w:layoutTableRowsApart, w:lineWrapLikeWord6,
                   w:mwSmallCaps, w:noColumnBalance, w:noExtraLineSpacing, w:noLeading, w:noSpaceRaiseLower,
                   w:noTabHangInd, w:printBodyTextBeforeHeader, w:printColBlack, w:relyOnVML,
                   w:selectFldWithFirstOrLastChar, w:shapeDefaults, w:shapeLayoutLikeWW8, w:showBreaksInFrames,
                   w:spacingInWholePoints, w:splitPgBreakAndParaMark, w:subFontBySize, w:suppressBottomSpacing,
                   w:suppressSpBfAfterPgBrk, w:suppressSpacingAtTopOfPage, w:suppressTopSpacing,
                   w:suppressTopSpacingWP, w:swapBordersFacingPages, w:truncateFontHeightsLikeWP6,
                   w:underlineTabInNumList, w:useAltKinsokuLineBreakRules, w:useAnsiKerningPairs, w:useFELayout,
                   w:useNormalStyleForList, w:usePrinterMetrics, w:useSingleBorderforContiguousCells,
                   w:useWord2002TableStyleRules, w:useWord97LineBreakRules, w:wpJustification, w:wpSpaceWidth,
                   w:wrapTrailSpaces, w:adjustLineHeightInTable, w:applyBreakingRules,
                   w:balanceSingleByteDoubleByteWidth, w:doNotExpandShiftReturn, w:doNotLeaveBackslashAlone,
                   w:spaceForUL, w:ulTrailSpace]
        priority: P0
        difficulty: 4
        status: todo
        strategy: >-
          One switch per option in the layout engine, each measured in Word with a generated document that differs
          only in that option. Mode 15 comes first: it is what current Word writes.

      - id: settings.view
        title: View settings
        elements: [w:settings, w:view, w:zoom, w:doNotDisplayPageBoundaries, w:displayHorizontalDrawingGridEvery,
                   w:displayVerticalDrawingGridEvery, w:drawingGridHorizontalOrigin, w:drawingGridHorizontalSpacing,
                   w:drawingGridVerticalOrigin, w:drawingGridVerticalSpacing, w:doNotUseMarginsForDrawingGridOrigin,
                   w:readModeInkLockDown, w:showEnvelope, w:clickAndTypeStyle, w:stylePaneFormatFilter,
                   w:stylePaneSortMethod]
        priority: P3
        difficulty: 1
        status: todo
        strategy: Editor state; the printed layout does not depend on it.

      - id: settings.protection
        title: Protection and privacy
        elements: [w:documentProtection, w:writeProtection, w:removePersonalInformation, w:removeDateAndTime]
        priority: P3
        difficulty: 1
        status: todo
        strategy: Only matters to an editor.

      - id: settings.editor
        title: Editor and save options
        elements: [w:attachedTemplate, w:attachedSchema, w:linkStyles, w:styleLockTheme, w:styleLockQFSet,
                   w:autoFormatOverride, w:documentType, w:summaryLength, w:captions, w:caption, w:autoCaptions,
                   w:autoCaption, w:forceUpgrade, w:smartTagType, w:doNotEmbedSmartTags, w:saveXmlDataOnly,
                   w:saveThroughXslt, w:useXSLTWhenSaving, w:saveInvalidXml, w:ignoreMixedContent,
                   w:alwaysMergeEmptyNamespace, w:doNotValidateAgainstSchema, w:doNotDemarcateInvalidXml,
                   w:savePreviewPicture, w:doNotAutoCompressPictures, w:doNotIncludeSubdocsInStats,
                   w:printPostScriptOverText, w:printFractionalCharacterWidth, w14:defaultImageDpi,
                   w14:discardImageEditingData, w14:conflictMode, w15:chartTrackingRefBased, w15:webExtensionLinked,
                   w15:webExtensionCreated, asl:scriptLink]
        priority: P3
        difficulty: 1
        status: todo
        strategy: Not rendered.

      - id: settings.web
        title: Web page settings and frames
        elements: [w:webSettings, w:frameset, w:frame, w:framesetSplitbar, w:frameLayout, w:title, w:sourceFileName,
                   w:marW, w:marH, w:scrollbar, w:noResizeAllowed, w:linkedToFile, w:longDesc, w:noBorder,
                   w:flatBorders, w:optimizeForBrowser, w:allowPNG, w:doNotRelyOnCSS, w:doNotSaveAsSingleFile,
                   w:doNotOrganizeInFolder, w:doNotUseLongFileNames, w:pixelsPerInch, w:targetScreenSz,
                   w:saveSmartTagsAsXml, w:encoding]
        priority: P3
        difficulty: 2
        status: todo
        strategy: >-
          Options for saving as a web page. Frames pages (w:frameset) show their frames' documents side by side only
          in Web Layout; the printed layout shows the frameset document itself.

      - id: settings.mailMerge
        title: Mail merge
        elements: [w:mailMerge, w:mainDocumentType, w:linkToQuery, w:dataType, w:connectString, w:query, w:dataSource,
                   w:headerSource, w:doNotSuppressBlankLines, w:destination, w:addressFieldName, w:mailSubject,
                   w:mailAsAttachment, w:viewMergedData, w:activeRecord, w:checkErrors, w:odso, w:udl, w:table, w:src,
                   w:colDelim, w:fHdr, w:fieldMapData, w:column, w:lid, w:dynamicAddress, w:mappedName,
                   w:recipients, w:recipientData, w:active, w:uniqueTag]
        priority: P3
        difficulty: 2
        status: todo
        strategy: The data source is external; merge fields show their cached results.

  - id: style
    title: Styles
    features:
      - id: style.definitions
        title: Paragraph, character, table and numbering styles
        elements: [w:styles, w:style, w:name, w:aliases, w:basedOn, w:next, w:link, w:autoRedefine, w:hidden,
                   w:uiPriority, w:semiHidden, w:unhideWhenUsed, w:qFormat, w:locked, w:personal, w:personalCompose,
                   w:personalReply, w:rsid, w:pStyle, w:rStyle, w:tblStyle]
        priority: P0
        difficulty: 3
        status: todo
        strategy: >-
          Resolve properties in the order of ISO/IEC 29500 17.7.2: document defaults, table style, numbering,
          paragraph style, run style, direct formatting, each style through its basedOn chain. Toggle properties
          (b, i, caps, smallCaps, strike, dstrike, vanish, emboss, imprint, outline, shadow) flip along the style
          chain instead of overriding.

      - id: style.defaults
        title: Document defaults
        elements: [w:docDefaults, w:rPrDefault, w:pPrDefault]
        priority: P0
        difficulty: 2
        status: todo
        strategy: The base of every property chain; Word's own defaults apply where the part leaves a property out.

      - id: style.latent
        title: Latent styles
        elements: [w:latentStyles, w:lsdException]
        priority: P3
        difficulty: 1
        status: todo
        strategy: Not rendered; settings of built-in styles a document has not used yet.

  - id: font
    title: Fonts
    features:
      - id: font.table
        title: Font table and substitution
        elements: [w:fonts, w:font, w:altName, w:charset, w:family, w:panose1, w:pitch, w:sig, w:notTrueType]
        priority: P0
        difficulty: 3
        status: todo
        strategy: >-
          Fonts a document names but the machine lacks are replaced the way Word does it, using the font table's
          alternate name, PANOSE, family, pitch and character set; shared with pptx `engine.fonts`.

      - id: font.embedded
        title: Embedded fonts
        elements: [w:embedRegular, w:embedBold, w:embedItalic, w:embedBoldItalic, w:embedTrueTypeFonts,
                   w:embedSystemFonts, w:saveSubsetFonts]
        priority: P2
        difficulty: 2
        status: todo
        strategy: >-
          Embedded fonts are obfuscated TrueType parts (ISO/IEC 29500 17.8.1: the font key GUID XORed over the first
          32 bytes); decode them and use them for layout and output like installed fonts.

      - id: font.theme
        title: Theme fonts
        description: rFonts asciiTheme, hAnsiTheme, eastAsiaTheme and cstheme refer to the theme's major and minor fonts.
        elements: [w:themeFontLang]
        priority: P0
        difficulty: 2
        status: todo
        strategy: >-
          Resolve theme font references against a:fontScheme (theme.fonts); w:themeFontLang picks the script-specific
          entries of the theme for East Asian and complex-script text.

  - id: run
    title: Runs and character formatting
    features:
      - id: run.basic
        title: Runs, fonts, size and color
        elements: [w:r, w:rPr, w:t, w:rStyle, w:b, w:i, w:sz, w:color, w:rFonts, w:lang]
        priority: P0
        difficulty: 2
        status: partial
        strategy: >-
          Each run picks one of its four fonts (ascii, hAnsi, eastAsia, cs) per character by Unicode range and the
          w:hint attribute, then is measured and broken into lines by our text engine (engine.lineLayout).
        office: >-
          Widths are the fonts' advances shaped by HarfBuzz at the nominal size (not rounded to the 600 dpi device);
          GPOS kerning only where w:kern is set and the size reaches its threshold, ligatures and contextual
          alternates only per w14:ligatures and w14:cntxtAlts (measured with docx/generated/text-fonts: positions
          within 0.1 pt per line without kerning). Theme fonts and theme colors resolve through the theme and the
          settings' color scheme mapping. Still open: font fallback for missing glyphs per Word's rules.

      - id: run.decoration
        title: Underline, strike, caps, highlight, borders and shading
        elements: [w:u, w:strike, w:dstrike, w:caps, w:smallCaps, w:highlight, w:shd, w:bdr, w:vertAlign, w:emboss,
                   w:imprint, w:outline, w:shadow]
        priority: P0
        difficulty: 2
        status: partial
        strategy: >-
          Drawn with the glyph runs as SVG: 18 underline styles with their own color, single and double strike,
          highlight and shading behind the line box, run borders merged across adjacent runs with the same border.
        office: >-
          Superscript and subscript are 58 % of the size, raised by 33 % or lowered by 8 % of it; small caps are 80 %
          of the size rounded to half points (12 pt to 9.5 pt); single underline lies at the font's post table
          underline position and thickness; highlight and shading cover the line's natural box (ascent above the
          baseline, the rest below), measured with docx/generated/character-formats. Still open: the other underline
          styles (double lines 0.12 pt apart by 1.08 pt, dotted 1.44 pt dots every 2.88 pt, wavy), emboss, imprint,
          outline and shadow, which Word draws as several copies of the text, and run borders.

      - id: run.spacing
        title: Character spacing, scale, kerning and position
        elements: [w:spacing, w:w, w:kern, w:position, w:fitText]
        priority: P1
        difficulty: 2
        status: partial
        strategy: Applied in measurement; kerning from the font's kern/GPOS data above the w:kern threshold size.
        office: >-
          Character spacing is added after every cluster, horizontal scale stretches the advances, raised and lowered
          text adds what it reaches beyond the line outside the line spacing multiple (text 3 pt up and 3 pt down
          makes a 1.15 line 6 pt higher, not 6.95 pt; docx/generated/character-formats). Still open: w:fitText.

      - id: run.hidden
        title: Hidden text
        elements: [w:vanish, w:specVanish, w:webHidden]
        priority: P1
        difficulty: 2
        status: done
        strategy: Hidden runs take no space in the printed layout unless Word is measured to print them.
        office: >-
          Hidden text (w:vanish, w:specVanish) is left out of Word's PDF export and takes no space; the layout drops
          it the same way.

      - id: run.complexScript
        title: Right-to-left and complex scripts
        elements: [w:rtl, w:cs, w:bCs, w:iCs, w:szCs, w:bdo, w:dir]
        priority: P1
        difficulty: 4
        status: todo
        strategy: >-
          Complex-script runs use their own font, size, bold and italic; reordering and shaping as in pptx
          `text.rtl` (done), with w:bdo and w:dir as explicit embeddings.

      - id: run.content
        title: Breaks, symbols and special characters
        elements: [w:br, w:cr, w:tab, w:sym, w:noBreakHyphen, w:softHyphen, w:lastRenderedPageBreak, w:dayLong,
                   w:dayShort, w:monthLong, w:monthShort, w:yearLong, w:yearShort, w16se:symEx]
        priority: P0
        difficulty: 2
        status: todo
        strategy: >-
          Page, column and text-wrapping breaks (with clear) go to the layout engine; w:sym characters are drawn from
          their symbol font (private use area F000-F0FF). w:lastRenderedPageBreak is where Word broke the page when
          it last saved: not rendered, but a free check of our pagination.

      - id: run.ruby
        title: Ruby (phonetic guides)
        elements: [w:ruby, w:rubyPr, w:rubyAlign, w:hps, w:hpsRaise, w:hpsBaseText, w:lid, w:dirty, w:rt, w:rubyBase]
        priority: P2
        difficulty: 4
        status: todo
        strategy: Ruby text set above the base text in its own size, aligned by w:rubyAlign; raises the line height.

      - id: run.eastAsian
        title: East Asian layout and emphasis marks
        elements: [w:eastAsianLayout, w:em]
        priority: P2
        difficulty: 4
        status: todo
        strategy: Combined characters, horizontal-in-vertical text, two lines in one and emphasis marks.

      - id: run.textEffects
        title: Text effects (Word 2010)
        description: Glow, shadow, reflection, outline, gradient fill and 3D formats on text.
        elements: [w14:glow, w14:shadow, w14:reflection, w14:textOutline, w14:textFill, w14:scene3d, w14:props3d,
                   w14:alpha, w14:bevel, w14:bevelB, w14:bevelT, w14:camera, w14:contourClr, w14:extrusionClr,
                   w14:fillToRect, w14:gradFill, w14:gs, w14:gsLst, w14:hueMod, w14:lightRig, w14:lin, w14:lum,
                   w14:lumMod, w14:lumOff, w14:miter, w14:noFill, w14:path, w14:prstDash, w14:rot, w14:round,
                   w14:sat, w14:satMod, w14:satOff, w14:schemeClr, w14:shade, w14:solidFill, w14:srgbClr, w14:tint]
        priority: P1
        difficulty: 3
        status: partial
        strategy: >-
          Word's copy of the DrawingML text effects in the w14 namespace; map them onto the shared effect renderer
          (pptx `text.fillOutline`, `text.effects` and `text.threeD`, done).
        office: >-
          w14:glow, w14:shadow and w14:reflection are drawn by the effect filter shared with PowerPoint (sized with
          the font; text reflects about its baseline), w14:textOutline as a stroke, w14:textFill as a solid, gradient
          or no fill. The line makes room for the effects outside its spacing: a glow 0.778 of its radius, a shadow
          1.046 of its blur plus or minus its vertical offset, both at (size / 78)^0.695, a reflection size × (0.944
          end − 0.21) and 0.0566 size per point of its distance (docx/local/text-effects*, Arial 12 to 96 pt, lines
          within 0.3 pt; docx/generated/shapes-effects 99.1 %). Still open: 3D text (w14:props3d, w14:scene3d),
          w14:lightRig.

      - id: run.openType
        title: OpenType features
        elements: [w14:ligatures, w14:numForm, w14:numSpacing, w14:stylisticSets, w14:styleSet, w14:cntxtAlts]
        priority: P2
        difficulty: 3
        status: done
        strategy: >-
          OpenType features of the shaper (HarfBuzz, as in pptx `text.runs`): liga, clig, hlig and dlig by the ligature
          setting, lnum or onum, pnum or tnum, ss01 to ss20 and calt.
        office: >-
          The run's OpenType features go to the shaper and to the browser: liga and clig by w14:ligatures (standard),
          calt by w14:ligatures (contextual) or w14:cntxtAlts, hlig and dlig, lnum or onum by w14:numForm, pnum or
          tnum by w14:numSpacing, ss01 to ss20 by w14:stylisticSets (docx/local/opentype: all 63 lines within 0.1 pt,
          every glyph Word's, Gabriola's contextual swashes included). The browser shapes every character that has a
          position of its own alone, so words with ligatures or contextual glyphs reach it whole with dx shifts, the
          other words keep the position of every character.

      - id: run.animated
        title: Animated text
        elements: [w:effect]
        priority: P3
        difficulty: 1
        status: done
        strategy: Screen-only effects of old Word versions (blinking, marching ants); not printed.
        office: >-
          Animated text (w:effect) prints as plain text, as in Word (docx/local/misc-nothing).

  - id: paragraph
    title: Paragraphs
    features:
      - id: paragraph.basic
        title: Paragraphs, alignment and indentation
        elements: [w:p, w:pPr, w:pStyle, w:jc, w:ind, w:mirrorIndents]
        priority: P0
        difficulty: 3
        status: partial
        strategy: >-
          Left, right, first-line and hanging indents (mirrored on even pages with w:mirrorIndents); alignment left,
          center, right, justified, distributed and the Arabic kashida variants.
        office: >-
          Justified lines may squeeze the spaces between their words by a fifth to take one more word (ten Courier New
          words fit a column 12 pt narrower than they are, not 13 pt; docx/local/jc-compress); left, centered and
          right aligned lines take no word that does not fit (docx/local/jc-left). The last line of a justified
          paragraph keeps its natural spacing unless it was squeezed. Still open: w:mirrorIndents and the kashida
          variants.

      - id: paragraph.spacing
        title: Line and paragraph spacing
        elements: [w:spacing, w:contextualSpacing]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Line spacing auto (multiples of the font's single line height), exact and at least; spacing before and
          after, auto spacing of HTML paragraphs, contextual spacing between paragraphs of the same style. How Word
          derives single line height from the font tables is measured, not assumed.
        office: >-
          A single line is the font's hhea ascender, descender and line gap; the baseline lies the larger of the line
          gaps (hhea against OS/2 win, as DirectWrite does; OS/2 typo metrics where USE_TYPO_METRICS is set) plus the
          ascent below the line's top. Fonts for East Asian code pages (OS/2 ulCodePageRange1 bits 17 to 21) are 1.3
          times their win ascent and descent high, the extra half above and half below, their line gap ignored
          (docx/local/ea-lines: MS Gothic, MS Mincho, Yu Gothic, SimSun, Malgun Gothic, Microsoft YaHei). Auto spacing
          multiplies the line and puts the extra below the text, exact spacing puts the baseline at 80 % of the height
          whatever the font, at least spacing puts the extra above (measured with 14 fonts, docx/local/lm-*). The
          space between paragraphs is the larger of the space after the one and before the next (docx/generated/text-
          basic, as ISO/IEC 29500 17.3.1.33 says); contextual spacing drops both between paragraphs of the same style.

      - id: paragraph.pagination
        title: Keep with next, keep lines together, widow control, page break before
        elements: [w:keepNext, w:keepLines, w:widowControl, w:pageBreakBefore]
        priority: P0
        difficulty: 4
        status: done
        strategy: Constraints for the page breaker (engine.pagination).
        office: >-
          At the top of a page the space before is kept on the document's first page, after a section break only what
          it has more than the space after the section's last paragraph, and dropped after page and column breaks,
          page break before and natural breaks (docx/local/sp-pagetop). The extra space of auto line spacing below the
          last line may hang past the bottom margin (a line whose text ends 0.4 pt above the margin stays,
          docx/generated/headers-footers). Keep with next, keep lines together and widow control move whole paragraphs
          or two lines (docx/generated/breaks).

      - id: paragraph.borders
        title: Paragraph borders and shading
        elements: [w:pBdr, w:top, w:bottom, w:left, w:right, w:between, w:bar, w:shd]
        priority: P1
        difficulty: 3
        status: done
        strategy: >-
          Consecutive paragraphs with identical borders share one box with w:between lines; borders sit outside the
          text by their w:space. Shading fills the box, patterns included.
        office: >-
          Paragraphs with the same borders, shading and indents form one box: the top line above the first, the bottom
          line below the last, the between line between them with its space above and below it; each line and its
          space take room in the paragraph, the space before and after lie outside the box. The shading reaches 1.4 pt
          left and 1.55 pt right of the text (vertically just its lines), the side lines stand their space outside it
          (measured with docx/local/pbdr, all lines within 0.15 pt).

      - id: paragraph.tabs
        title: Tab stops
        elements: [w:tabs, w:tab, w:ptab, w:defaultTabStop, w:decimalSymbol]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Left, center, right, decimal and bar tabs with leaders, cleared style tabs, default tab interval;
          absolute position tabs (w:ptab) relative to the margins or indents.
        office: >-
          Leaders repeat their character at its advance rounded to Word's 600 dpi device (dots of Aptos 12 pt every
          3.48 pt), on a grid from the page's left edge, every one that fits between the tab's start and end. Bar tabs
          draw a line through the line and the space after the paragraph. Decimal stops align on the settings' decimal
          symbol (with a German comma, 12.5 ends at the stop). A left stop past the right margin moves the tab to the
          next line, where it fills the line; centered, right and decimal stops past it align at the margin
          (docx/generated/tabs, docx/local/tab-rules, tab-break).

      - id: paragraph.frames
        title: Text frames and drop caps
        elements: [w:framePr, w:suppressOverlap]
        priority: P2
        difficulty: 4
        status: todo
        strategy: >-
          Paragraphs with w:framePr are positioned like floating objects and text wraps around them; drop caps are
          frames of one large letter spanning w:lines lines.

      - id: paragraph.eastAsian
        title: East Asian line breaking and character grid
        elements: [w:kinsoku, w:wordWrap, w:overflowPunct, w:topLinePunct, w:autoSpaceDE, w:autoSpaceDN,
                   w:textAlignment, w:snapToGrid, w:adjustRightInd, w:characterSpacingControl, w:noLineBreaksAfter,
                   w:noLineBreaksBefore, w:strictFirstAndLastChars, w:noPunctuationKerning]
        priority: P1
        difficulty: 4
        status: todo
        strategy: >-
          Kinsoku (characters that may not start or end a line, custom lists in settings), hanging punctuation,
          automatic spacing between Asian and Latin text and digits, punctuation compression, and snapping to the
          section's document grid (section.docGrid).

      - id: paragraph.bidi
        title: Right-to-left paragraphs and text direction
        elements: [w:bidi, w:textDirection]
        priority: P1
        difficulty: 4
        status: todo
        strategy: Right-to-left paragraphs mirror indents and alignment; vertical text direction in frames and cells.

      - id: paragraph.hyphenation
        title: Hyphenation
        elements: [w:autoHyphenation, w:consecutiveHyphenLimit, w:hyphenationZone, w:doNotHyphenateCaps,
                   w:suppressAutoHyphens]
        priority: P1
        difficulty: 4
        status: todo
        strategy: >-
          Automatic hyphenation per language with our own pattern-based hyphenator; which word breaks Word chooses
          with its proofing dictionaries is measured on generated documents. Soft and non-breaking hyphens are run
          content (run.content).

      - id: paragraph.outline
        title: Outline levels and collapsed headings
        elements: [w:outlineLvl, w15:collapsed]
        priority: P2
        difficulty: 1
        status: done
        strategy: Feeds TOC fields and the navigation pane; collapsed headings are expanded in the printed layout.
        office: >-
          Outline levels feed TOC fields and draw nothing (docx/local/misc-nothing); collapsed headings
          (w15:collapsed) are laid out expanded, untested in Word.

      - id: paragraph.htmlDivs
        title: HTML divisions
        description: Paragraphs of documents that came from HTML refer to nested divisions with margins and borders.
        elements: [w:divId, w:divs, w:div, w:divsChild, w:divBdr, w:bodyDiv, w:blockQuote, w:marLeft, w:marRight,
                   w:marTop, w:marBottom]
        priority: P2
        difficulty: 3
        status: todo
        strategy: Division margins add to the paragraph indents and spacing; division borders are drawn around their paragraphs.

  - id: numbering
    title: Lists and numbering
    features:
      - id: numbering.definitions
        title: Numbering definitions and number formats
        elements: [w:numbering, w:abstractNum, w:abstractNumId, w:num, w:lvl, w:lvlOverride, w:startOverride, w:start,
                   w:lvlText, w:lvlJc, w:numFmt, w:suff, w:lvlRestart, w:isLgl, w:multiLevelType, w:nsid, w:tmpl,
                   w:numStyleLink, w:styleLink, w:numIdMacAtCleanup, w:legacy]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Level text with %1..%9 placeholders, about 60 number formats (decimal, roman, letters, ordinal and cardinal
          text, East Asian, Hebrew, Arabic, Thai, Hindi ...), legal numbering, suffix tab, space or nothing, number
          alignment, the level's run and paragraph properties.
        office: >-
          Level texts with %1 to %9, about 60 number formats (decimal, roman, letters repeated after z, ordinals and
          number words, full-width, enclosed, Chinese, Japanese and Korean counting, Hebrew, Arabic, Thai, Hindi,
          Russian), legal numbering, suffix tab, space or nothing, numbers aligned left, centered or right at the
          first line's indent (docx/local/num-rules). The level's indents and tabs override the paragraph style's (a
          level indented 360 twips puts a List Paragraph, whose style says 720, at 360; docx/generated/lists). The
          number is drawn in the paragraph mark's formatting with the level's run properties over it; only its ascent
          counts in the line height, not its descent (a 16 pt number before 12 pt text makes the line 17.52 pt high).
          Picture bullets are numbering.pictureBullets.

      - id: numbering.counting
        title: List counters
        elements: [w:numPr, w:ilvl, w:numId]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Counters run per abstract numbering through the whole document (headers, footers and notes keep their own
          state), restart by w:lvlRestart, w:startOverride and numbering instances; measured against Word because the
          specification leaves gaps.
        office: >-
          Instances of one abstract definition count together; an instance with a start override restarts the shared
          counter where it is first used, and the other instances go on from there (5, 6, then 7); a deeper level used
          before a higher one shows the higher one's start and counts from it (7.1.1. then 7.2.); w:lvlRestart 0 never
          restarts; paragraphs numbered through their style continue the same counters (docx/local/num-rules).

      - id: numbering.pictureBullets
        title: Picture bullets
        elements: [w:numPicBullet, w:lvlPicBulletId]
        priority: P2
        difficulty: 3
        status: todo
        strategy: The bullet is the picture of w:numPicBullet (VML or DrawingML), sized to the paragraph's font.

  - id: section
    title: Sections and pages
    features:
      - id: section.page
        title: Page size, margins and section breaks
        elements: [w:sectPr, w:type, w:pgSz, w:pgMar, w:vAlign, w:rtlGutter, w:mirrorMargins, w:gutterAtTop,
                   w:formProt]
        priority: P0
        difficulty: 3
        status: partial
        strategy: >-
          Every section starts on a new page, an even or odd page (inserting a blank page) or continues on the same
          page; orientation, margins with gutter, mirrored margins and vertical alignment of the page content.
        office: >-
          Sections start on a new page, continue, or start on an odd or even page; odd and even mean the page numbers,
          not the sheets: an odd page section after a page numbered 1 leaves a blank page even when the restart put
          that page on the second sheet (docx/local/hf-oddpage). With different odd and even headers or mirrored
          margins any section whose first number has the parity of the page before gets a blank page before it
          (docx/local/hf-restart-*). Blank pages have no header or footer, count in NUMPAGES but not in SECTIONPAGES.
          Vertical alignment centers the text from the top margin, with the space before its first paragraph, to the
          space after its last (docx/generated/page-setup, page 4). Still open: w:formProt (nothing to draw) and page
          sizes beyond what browsers print.

      - id: section.columns
        title: Columns
        elements: [w:cols, w:col]
        priority: P1
        difficulty: 4
        status: done
        strategy: Equal or individual column widths with separator lines; a continuous section break balances the columns above it.
        office: >-
          A continuous section break balances the columns above it by line count, not height: as many lines in each
          column as the least count that holds them all, the first columns taking the extra lines, with widow, keep-
          with-next and keep-together rules (9 lines go 5/4, docx/local/cols-balance; a heading and 60 lines go 31/30
          although the first column is 42 pt longer, docx/generated/page-setup). The columns end below the space after
          their last paragraph; the next section's first paragraph keeps what its space before has more. Separator
          lines are 0.75 pt wide in the middle of the gap, from the columns' top to the bottom of the longest column.

      - id: section.pageBorders
        title: Page borders
        elements: [w:pgBorders, w:top, w:bottom, w:left, w:right, w:alignBordersAndEdges, w:bordersDoNotSurroundHeader,
                   w:bordersDoNotSurroundFooter]
        priority: P2
        difficulty: 3
        status: partial
        strategy: >-
          Line borders and the 165 art borders of the format catalog, measured from the page edge or the text,
          on all pages, the first page or all but the first.
        office: >-
          Line borders as Word prints them: from the page's edge a side's outer edge stands its space from the edge,
          from the text its inner edge its space outside the margins and around a header and footer the page has
          (w:bordersDoNotSurroundHeader, w:bordersDoNotSurroundFooter); on all pages, the first or all but the first;
          in front of or behind the text. Lines and gaps are floored to Word's 0.12 pt device dots; double, triple and
          thin-thick lines with white gaps (thin lines 0.75 pt, gaps 0.75 pt, half the width or the width) nest at the
          corners; dotted and dashed lines run between filled corners; embossed and engraved lines in three shades;
          shadows as black bands of the lines' width (docx/generated/page-borders, docx/local/pgb-a, pgb-b, pgb-c:
          line styles 85 to 99.9 %). Waves and stroked dash-dots, pictures in Word, are drawn as lines. Not drawn: the
          art borders, Word's own pictures (the basic dots, dashes, squares and lines among them).

      - id: section.lineNumbers
        title: Line numbers
        elements: [w:lnNumType, w:suppressLineNumbers]
        priority: P2
        difficulty: 3
        status: todo
        strategy: Numbers in the left margin per line, restarting per page, section or never, every n-th line.

      - id: section.pageNumbers
        title: Page numbering
        elements: [w:pgNumType, w:pgNum]
        priority: P0
        difficulty: 2
        status: partial
        strategy: Number format and restart per section, chapter numbers from heading styles; PAGE fields read them.
        office: >-
          PAGE shows the page number in the section's format (w:pgNumType/@fmt) unless the field's own \* switch names
          one; w:pgNumType/@start restarts the count at the section's first page (docx/local/hf-parity). Still open:
          chapter numbers (w:chapStyle, w:chapSep).

      - id: section.docGrid
        title: Document grid
        elements: [w:docGrid]
        priority: P1
        difficulty: 4
        status: todo
        strategy: >-
          Line pitch (lines snap to the grid) and character pitch, the default of East Asian templates; changes the
          line height of every paragraph that snaps to the grid.

      - id: section.printing
        title: Printer and book fold settings
        elements: [w:paperSrc, w:printerSettings, w:bookFoldPrinting, w:bookFoldPrintingSheets, w:bookFoldRevPrinting,
                   w:printTwoOnOne]
        priority: P3
        difficulty: 2
        status: todo
        strategy: Printer trays are ignored; book fold and two pages per sheet change the page geometry and are measured.

  - id: headerFooter
    title: Headers and footers
    features:
      - id: headerFooter.parts
        title: Headers and footers
        elements: [w:hdr, w:ftr, w:headerReference, w:footerReference, w:titlePg, w:evenAndOddHeaders]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          First, even and default headers per section, inherited from the previous section when missing; laid out by
          the same engine at w:header/w:footer distance. A header taller than the top margin pushes the body down.
        office: >-
          The header starts w:header below the page's top edge with the space before its first paragraph; the footer
          ends w:footer above the bottom edge with the space after its last. A header reaching below the top margin
          pushes the body down to its end including that space after, a footer reaching above the bottom margin moves
          the body's end up (docx/local/hf-tall, hf-short). The first page of a section with a title page has the
          first header, even page numbers the even header when the settings ask for different odd and even headers; a
          section without a header of a type inherits the previous section's, and a type no section gives is an empty
          header. Word's footers stand 0.14 pt lower than the footer distance says (its 600 dpi device grid), which
          the layout does not copy.

  - id: note
    title: Footnotes and endnotes
    features:
      - id: note.footnotes
        title: Footnotes
        elements: [w:footnotes, w:footnote, w:footnoteReference, w:footnoteRef, w:footnotePr, w:separator,
                   w:continuationSeparator, w:pos, w:numStart, w:numRestart, w:numFmt, w15:footnoteColumns]
        priority: P1
        difficulty: 4
        status: partial
        strategy: >-
          Footnotes go to the bottom of the page of their reference (or below the text), continue on the next page
          with the continuation separator when they do not fit, and take space from the body (engine.pagination).
        office: >-
          Footnotes are numbered by the order of their references (w:footnotePr numFmt and numStart), their marks
          drawn in the reference style; a line with references needs room for their notes, else it goes to the next
          page with them; the notes stand at the bottom of the page, ending at the bottom margin, under the separator
          (0.6 pt thick, 144 pt long, through the middle of its line; measured with docx/generated/notes, all lines
          within 0.2 pt). Still open: footnotes continued on the next page, restarts per page or section, notes
          beneath the text, columns.

      - id: note.endnotes
        title: Endnotes
        elements: [w:endnotes, w:endnote, w:endnoteReference, w:endnoteRef, w:endnotePr, w:noEndnote]
        priority: P1
        difficulty: 3
        status: partial
        strategy: Collected at the end of the section or the document.
        office: >-
          Endnotes follow the document's last paragraph under their separator, in the order of their references,
          numbered in lower roman by default (docx/generated/notes). Still open: endnotes at the end of each section.

  - id: table
    title: Tables
    features:
      - id: table.structure
        title: Rows, cells, merged cells and nested tables
        elements: [w:tbl, w:tblPr, w:tblGrid, w:gridCol, w:tr, w:trPr, w:tc, w:tcPr, w:tblPrEx, w:gridSpan, w:vMerge,
                   w:hMerge, w:gridBefore, w:gridAfter, w:wBefore, w:wAfter, w:hidden, w:bidiVisual]
        priority: P0
        difficulty: 3
        status: partial
        strategy: Grid columns, horizontal spans, vertical merges, rows that skip grid columns, right-to-left tables.
        office: >-
          Grid columns, horizontal spans, vertical merges (a merged cell taller than its rows makes the last one
          higher), rows that skip grid columns (no lines where no cell is), nested tables, right-to-left tables (the
          first column at the right, the table at the right margin); tables that follow each other directly are joined
          with one line between (docx/local/tbl-geom, tbl-features). Still open: w:hMerge of old documents.

      - id: table.width
        title: Table and column widths (autofit)
        elements: [w:tblW, w:tcW, w:tblLayout, w:tblInd, w:jc, w:tblCellSpacing, w:tblCellMar, w:tcMar, w:top, w:bottom,
                   w:left, w:right, w:start, w:end, w:noWrap, w:tcFitText]
        priority: P0
        difficulty: 5
        status: done
        strategy: >-
          Fixed layout uses the grid; autofit layout computes column widths from the content's minimum and maximum
          widths like Word, which the specification does not describe: measured with generated tables
          (engine.tableLayout).
        office: >-
          Fixed tables use the grid; autofit tables are recomputed as Word does (measured with docx/local/tbl-autofit
          in Courier New, ten cases within 0.15 pt): each column's minimum (its widest unbreakable content) and
          maximum (its content unwrapped, at most 22 inches) with the cells' margins; a preferred cell width fixes its
          column; where the maxima fit the columns take them (stretched in proportion to them for a wider table
          width), where the minima fit each gets its minimum and a share of the rest in proportion to max - min, else
          the contents' minima shrink in proportion; widths before and after rows do not widen columns. Word 2013
          tables start their grid at the indent and move it right by half the left border; older compatibility modes
          put the first cell's text at the indent.

      - id: table.rows
        title: Row height, splitting and header rows
        elements: [w:trHeight, w:cantSplit, w:tblHeader]
        priority: P0
        difficulty: 4
        status: done
        strategy: Exact and minimum row heights; rows split across pages unless w:cantSplit; header rows repeat on every page.
        office: >-
          A row is its top line and its content; at-least heights count without the line, exact ones with it. Rows
          that do not fit split at a line of each cell unless w:cantSplit; header rows repeat after every break; where
          the table breaks the line below the page's last row closes it (docx/local/tbl-autofit, tbl-features).

      - id: table.borders
        title: Table and cell borders and shading
        elements: [w:tblBorders, w:tcBorders, w:insideH, w:insideV, w:tl2br, w:tr2bl, w:top, w:bottom, w:left, w:right,
                   w:start, w:end, w:shd]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Conflicting borders of adjacent cells are resolved by the rules of ISO/IEC 29500 17.4.66 (weight, style,
          color); with cell spacing every cell keeps its own border. Diagonal borders, shading patterns.
        office: >-
          Every vertical line is centered on its grid line (moved right by half the table's left border); text starts
          the larger of the margin and half the line after it, below the whole top line and the top margin (a 3 pt
          inside line of a table with 0.5 pt outside lines is centered 0.25 pt right of its grid line; docx/local/tbl-
          geom). Conflicts follow MS-OI29500 17.4.66: a cell's own border wins over the table's, then weight (eighths
          of a point times the style number, dotted and dashed 1), style, darker color. Double lines take three times
          their width, triple five, thin-thick lines the width and 0.75 pt for the thin line and the small gap; dotted
          and dashed lines are dashed strokes; diagonal lines; with cell spacing every cell has its own frame, the
          cells twice the spacing apart. Shading patterns are mixed to a flat color.

      - id: table.styles
        title: Table styles and conditional formatting
        elements: [w:tblStyle, w:tblStylePr, w:tblStyleRowBandSize, w:tblStyleColBandSize, w:tblLook, w:cnfStyle,
                   w:defaultTableStyle]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Whole table, banded rows and columns, first and last row and column and the four corner cells, applied in
          Word's order and switched by w:tblLook.
        office: >-
          The table style along its basedOn chain under the table's own properties; conditional formats in Word's
          order (whole table, column bands, row bands, first and last row, first and last column, corner cells),
          switched by w:tblLook, bands skipping the first and last row and column; a conditional format's borders
          apply at its region's edges, its inside lines inside the region; the style's paragraph and run properties
          sit above the document defaults and under the paragraph style (docx/generated/tables).

      - id: table.floating
        title: Floating tables
        elements: [w:tblpPr, w:tblOverlap]
        priority: P1
        difficulty: 4
        status: todo
        strategy: Positioned like a frame; text wraps around it (engine.floats).

      - id: table.cells
        title: Cell alignment, text direction and header cells
        elements: [w:vAlign, w:textDirection, w:hideMark, w:headers, w:header]
        priority: P1
        difficulty: 3
        status: partial
        strategy: Vertical alignment, rotated text in cells, cells whose end mark takes no height.
        office: >-
          Vertical alignment; rotated text (tbRl starts at the cell's top right and runs down, btLr at its bottom left
          and runs up; rotated columns are as wide as their lines; docx/local/tbl-features); w:noWrap keeps a cell
          unwrapped in autofit; w:hideMark lets an empty cell take no height. Still open: w:tcFitText.

      - id: table.accessibility
        title: Table title and description
        elements: [w:tblCaption, w:tblDescription]
        priority: P3
        difficulty: 1
        status: todo
        strategy: Alt text of the table in the HTML output.

  - id: field
    title: Fields, hyperlinks and bookmarks
    features:
      - id: field.structure
        title: Simple and complex fields
        elements: [w:fldSimple, w:fldChar, w:instrText, w:delInstrText, w:fldData]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Show the cached result between the separate and end field characters, nested fields included; which fields
          Word recomputes when it prints (PAGE, NUMPAGES ...) is measured (field.evaluation).
        office: >-
          Field instructions are hidden, results between the separate and end characters show, nested fields included
          (a field inside another's instruction is part of the instruction). The results of PAGE, NUMPAGES and
          SECTIONPAGES are computed after pagination (field.evaluation); others keep their saved result.

      - id: field.evaluation
        title: Field evaluation
        description: >-
          The 72 field codes of the format catalog (field-codes.md): page and section numbers, references, sequences,
          dates, document properties, formulas, IF, TOC and index entries.
        elements: [w:docVars, w:docVar, w:updateFields, w:listSeparator]
        priority: P1
        difficulty: 4
        status: partial
        strategy: >-
          Page-dependent fields (PAGE, NUMPAGES, SECTIONPAGES, PAGEREF, STYLEREF in headers) are computed after
          pagination; others keep their cached result unless Word is measured to update them.
        office: >-
          PAGE, NUMPAGES and SECTIONPAGES are computed for every header and footer after pagination, with the number
          format switches (roman, ROMAN, alphabetic, ALPHABETIC, Arabic, ArabicDash, Ordinal, CardText, OrdText, Hex)
          and about 60 ST_NumberFormat formats; NUMPAGES counts blank pages (docx/local/hf-parity). Other fields keep
          their saved results. Still open: PAGEREF, STYLEREF, SEQ, dates and the rest of the field codes.

      - id: field.hyperlinks
        title: Hyperlinks
        elements: [w:hyperlink, a:hlinkClick, a:hlinkHover, a:hlinkMouseOver, a:snd, ahyp:hlinkClr]
        priority: P0
        difficulty: 2
        status: done
        strategy: HTML links on the text and on drawings (as pptx `interactivity.hyperlinks`, done); bookmarks become anchors.
        office: >-
          w:hyperlink (external targets through the relationship, bookmarks through w:anchor) and HYPERLINK fields
          (with \l) make the text a link in the HTML.

      - id: field.bookmarks
        title: Bookmarks
        elements: [w:bookmarkStart, w:bookmarkEnd]
        priority: P1
        difficulty: 1
        status: done
        strategy: HTML anchors; REF and PAGEREF fields and hyperlinks refer to them.
        office: >-
