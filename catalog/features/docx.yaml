        title: Position, size, rotation and flip
        elements: [a:xfrm, a:off, a:ext, a:chOff, a:chExt]
        priority: P0
        difficulty: 2
        status: todo
        strategy: Shared DrawingML renderer, as pptx `shape.transform` (done).

