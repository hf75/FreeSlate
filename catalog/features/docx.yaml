  - id: drawing
    title: Drawing objects in text
    description: How DrawingML objects sit in the text flow; what they draw is the shared DrawingML renderer.
    features:
      - id: drawing.inline
        title: Inline objects
        elements: [w:drawing, wp:inline, wp:extent, wp:effectExtent, wp:docPr, wp:cNvGraphicFramePr]
        priority: P0
        difficulty: 3
        status: done
        strategy: An inline object is one box on the line, standing on the baseline, its effect extent added around it.
        office: >-
          Pictures, shapes, groups, canvases, charts and SmartArt are converted to PresentationML and drawn by the
          slide renderer with the document's theme and color mapping. An inline drawing's box (its extent with the
          effect extents) stands on the baseline as all ascent; the extra of multiple line spacing comes from the
          fonts (a 90 pt picture beside 12 pt Aptos at 1.16 lines makes the line 90 + 3.38 + 2.32 pt high, a picture
          alone 160.5 + 2.32 pt; docx/generated/drawings).

      - id: drawing.anchor
        title: Floating objects and their position
        elements: [wp:anchor, wp:simplePos, wp:positionH, wp:positionV, wp:posOffset, wp:align, wp14:pctPosHOffset,
                   wp14:pctPosVOffset, wp14:sizeRelH, wp14:sizeRelV, wp14:pctWidth, wp14:pctHeight]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Positioned relative to page, margin, column, paragraph, line or character, by offset or alignment, sized
          relative to the page or margins; behind or in front of text, stacked by relativeHeight, kept inside table
          cells with layoutInCell.
        office: >-
          Floating drawings stand at their offset from, or aligned in, the frame wp:positionH and wp:positionV name,
          at a percentage of it, or at wp:simplePos; behind or in front of the text by behindDoc and relativeHeight
          (docx/generated/drawings). The paragraph's top lies above its own space before (below the space after the
          paragraph before), the line's is that of the line holding the anchor (docx/local/anchor-rules, within 0.05
          pt); relative to the character counts from the start of the character before the anchor (docx/local/anchor-
          char, within 0.01 pt). In table cells the column and margin across are the cell's text area, the page and
          its margins the cell inside its line, down the page and margins the cell's content, whether layoutInCell is
          set or not (docx/local/cell-anchor). Sizes relative to the page or its margins (wp14:sizeRelH,
          wp14:sizeRelV) apply to shapes as they are and to pictures only both together, scaled evenly to fit
          (docx/local/size-rel-shape, size-rel).

      - id: drawing.wrap
        title: Text wrapping around objects
        elements: [wp:wrapNone, wp:wrapSquare, wp:wrapTight, wp:wrapThrough, wp:wrapTopAndBottom, wp:wrapPolygon,
                   wp:start, wp:lineTo]
        priority: P0
        difficulty: 5
        status: done
        strategy: Square, tight and through wrapping along the wrap polygon, top and bottom, with wrap distances (engine.floats).
        office: >-
          Square wrapping keeps the box with the effect extents and the wrap distances free, top and bottom the whole
          width; tight and through wrapping keep free what of the wrap polygon (21600ths of the extent) lies beside
          each line's text, from its ascent to its descent, with the left and right distances; text goes to both
          sides, the left or right one or the larger (wrapText). Objects push every line of their page, also above
          their anchor (docx/generated/wrapping, docx/generated/wrap-types: all lines within 0.2 pt).

      - id: drawing.shapes
        title: Word shapes
        elements: [wps:wsp, wps:cNvPr, wps:cNvSpPr, wps:cNvCnPr, wps:spPr, wps:style, wps:bodyPr, wp:wsp, wp:cNvPr,
                   wp:cNvSpPr, wp:cNvCnPr, wp:spPr, wp:style, wp:bodyPr]
        priority: P0
        difficulty: 3
        status: done
        strategy: Geometry, fill, line and effects through the shared DrawingML renderer (shape, fill, line and effect areas).
        office: >-
          Word 2010 shapes (wps:wsp) with their style references are drawn as PowerPoint draws DrawingML shapes; the
          Word drawing namespaces are chosen over their VML fallbacks.

      - id: drawing.textBoxes
        title: Text boxes
        elements: [wps:txbx, wps:linkedTxbx, wp:txbx, wp:linkedTxbx, wp:txbxContent, w:txbxContent,
                   w:textboxTightWrap]
        priority: P0
        difficulty: 4
        status: partial
        strategy: >-
          The content is WordprocessingML laid out by our engine inside the shape's text rectangle (bodyPr insets,
          anchoring, rotation, autofit); linked text boxes continue the text from one box to the next.
        office: >-
          A shape's text box content is laid out like body text in the shape's rectangle less the insets of
          wps:bodyPr, at its top, middle or bottom (docx/generated/textboxes). Still open: vertical text, linked text
          boxes, autofit; Word measures the insets from inside the outline (text 0.3 pt further in with a 0.75 pt
          outline).

      - id: drawing.groups
        title: Groups
        elements: [wpg:wgp, wpg:cNvGrpSpPr, wpg:grpSpPr, wpg:grpSp, wpg:cNvPr, wpg:cNvFrPr, wpg:graphicFrame, wpg:xfrm,
                   wpg:extLst, wp:wgp, wp:grpSp, wp:grpSpPr, wp:cNvGrpSpPr, wp:cNvFrPr, wp:graphicFrame, wp:xfrm]
        priority: P1
        difficulty: 3
        status: done
        strategy: Child transforms as pptx `shape.group` (done); children may be pictures, shapes, text boxes and graphic frames.
        office: >-
          Groups (wpg:wgp) map their children's space (a:chOff, a:chExt) onto their box, nested groups (wpg:grpSp)
          again; the text boxes of grouped shapes are laid out in their shapes' places and turn with them
          (docx/local/groups: a stretched group, a nested group with a turned star and a text box, 100 %).

      - id: drawing.canvas
