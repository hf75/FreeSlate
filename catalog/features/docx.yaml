        office: >-
          Without markup Word prints nothing of comments, and neither do we: ranges, references and the comments part
          are skipped (docx/generated/revisions). Not shown: comments beside the pages as the markup view has them.

      - id: review.revisions
        title: Tracked changes
        elements: [w:ins, w:del, w:moveFrom, w:moveTo, w:moveFromRangeStart, w:moveFromRangeEnd, w:moveToRangeStart,
                   w:moveToRangeEnd, w:delText, w:rPrChange, w:pPrChange, w:sectPrChange, w:tblPrChange,
