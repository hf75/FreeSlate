                   w:trackRevisions, w:revisionView, w:doNotTrackMoves, w:doNotTrackFormatting]
        priority: P1
        difficulty: 3
        status: partial
        strategy: >-
          Render the document with all changes accepted (final view); a markup view with colored insertions,
          struck deletions and change bars follows Word's simple and all markup views.
        office: >-
          Printed as Word exports without markup: insertions and moved-to text stay, deletions and moved-from text are
          left out, deleted table rows (w:trPr/w:del) disappear, a paragraph whose mark is deleted joins the next,
          which keeps its own formatting and number; formatting changes show the new formatting
