        priority: P3
        difficulty: 4
        status: done
        strategy: Ink content parts drawn as in pptx `picture.ink` (done).
        office: >-
          Word writes ink (w14:contentPart, wpi) with a picture of it as fallback, which is drawn; ink without one is
          drawn from its InkML part by the ink renderer shared with pptx picture.ink (docx/local/ink 99.9 %).

