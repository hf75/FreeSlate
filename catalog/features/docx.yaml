# Word (DOCX) feature catalog, level 2.
#
# Curated by hand. `dotnet run --project tools/SpecTools -- features` checks every element reference against the
# format catalog (level 1), measures coverage and writes docx.md and docx.json next to this file.
#
# Per feature: see pptx.yaml. Status describes the Word pipeline; features shared with PowerPoint (DrawingML, charts,
# SmartArt, math, VML) name the pptx feature whose implementation they reuse.

document: docx
title: Word (DOCX)
description: >-
  Rendering target: one HTML document per Word document with fixed-size pages, laid out and paginated by our own
  engine the way Word lays the document out for printing. Paragraph text is measured and broken into lines by our
  own text engine and emitted as positioned glyph runs; drawings, charts and SmartArt go through the DrawingML
  renderer shared with PowerPoint. The reference is Word's own PDF export of the document.

universe:
  roots: [w:document, w:styles, w:numbering, w:settings, w:fonts, w:footnotes, w:endnotes, w:comments, w:hdr, w:ftr,
          w:webSettings, w:glossaryDocument, w:recipients, w:txbxContent,
          pic:pic, lc:lockedCanvas,
          a:theme, a:themeOverride,
          c:chartSpace, c:userShapes, c:chart, cx:chartSpace, cx:chart, cs:chartStyle, cs:colorStyle,
          dgm:dataModel, dgm:layoutDef, dgm:styleDef, dgm:colorsDef, dgm:relIds, dsp:drawing,
          m:oMathPara, m:oMath, b:Sources,
          ap:Properties, op:Properties, cp:coreProperties, ct:Types, pr:Relationships, ds:datastoreItem]
  namespaces: [w14, w15, w16cei, w16cex, w16cid, w16cur, w16se, woe, wp, wp14, wp15, wpc, wpg, wps,
               a14, a15, a16, a1611, a3danim, aanim, aclsh, adec, ahyp, aif, am3d, ask, asl, asvg, msink, oac,
               pic14, thm15,
               c14, c15, c16, c16ac, c16r2, c16r3, cdr14, cs, cx, dgm14, dgm1611, dgm1612, dsp,
               v, o, w10]
  exclude: [p, p14, p15, x, xvml, xdr, pvml]

areas:

  - id: package
    title: Package and compatibility
    description: ZIP container, relationships, markup compatibility and metadata.
    features:
      - id: package.opc
        title: Package, content types and relationships
        elements: [ct:Types, ct:Default, ct:Override, pr:Relationships, pr:Relationship]
        priority: P0
        difficulty: 1
        status: done
        strategy: >-
          As pptx `package.opc` (done): parts are found through relationships, never by path. Word's main part is the
          officeDocument relationship of the package; styles, numbering, settings, fonts, notes, comments, headers and
          footers hang off it.
        office: >-
          Shared with pptx: the main part is the package's officeDocument relationship; styles, settings, theme,
          numbering, font table, notes, headers and footers are found through its relationships, pictures and charts
          through those of the part that refers to them; nothing is found by its path. Strict Office Open XML is read
          as the transitional markup of the same schemas; Word shapes and groups, which it names in the drawing
          namespace (wp:wsp, wp:spPr, wp:bodyPr, wp:txbx …), are their wps and wpg elements, and DrawingML percentages
          ("15%") thousandths of a percent (openxml-sdk/Strict01: the cover page's six shapes, gray chart lines).
          Strict's text directions (tb, rl, lr and their V forms) are read as the transitional ones
          (docx/external/libreoffice/extras-ooxmlexport/tdf150822: a section of "rl" runs down, 50.4 → 100 %;
          tdf79272_strictDxa: a cell of "lr" reads upward). Strict documents of Word also write Word 2010's relative
          sizes and positions (wp14:pctWidth …) as "45.5%" and name text box content wne:txbxContent; both are read
          (openxml-sdk/Strict01: the cover page's panels, every text box's text).

      - id: package.mce
        title: Markup compatibility and extension lists
        description: mc:AlternateContent, mc:Ignorable and the extLst/ext mechanism every newer feature uses.
        elements: [a:extLst, a:ext, c:extLst, c:ext, cx:extLst, cx:ext, cs:extLst, dgm:extLst, dsp:extLst, a14:extLst,
                   a3danim:extLst, aanim:extLst, am3d:extLst, ask:extLst, asl:extLst, oac:extLst,
                   pic14:extLst, thm15:extLst, cdr14:extLst, w14:extLst, wp:extLst, wpc:extLst, wpg:extLst,
                   wps:extLst, w16cei:extLst, w16cex:extLst, w16cur:ext]
        priority: P0
        difficulty: 2
        status: done
        strategy: >-
          As pptx `package.mce` (done): take the first mc:Choice whose Requires prefixes we implement, else
          mc:Fallback. Word writes its 2010 drawing objects (wps, wpg, wpc) in mc:Choice with a VML w:pict in
          mc:Fallback, so implementing the Choice side makes the VML path the exception.
        office: >-
          Shared with pptx: every part is read with mc:AlternateContent resolved, the first mc:Choice whose required
          namespaces the engine implements, else mc:Fallback. Word's 2010 shapes, groups, canvases and drawing
          extensions (wps, wpg, wpc, wp14) take the Choice, so VML is only read where a document has nothing else;
          ignorable elements and extension lists the engine does not know are skipped.

      - id: package.compatibility
        title: Compatibility leftovers
        description: Properties Office keeps for older versions or for converted VML content.
        elements: [a14:hiddenFill, a14:hiddenLine, a14:hiddenEffects, a14:hiddenScene3d, a14:hiddenSp3d,
                   a14:compatExt, a14:shadowObscured, a14:useLocalDpi, a14:cameraTool]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered, as pptx `package.compatibility`.
        office: >-
          As pptx: the hidden fills, lines, effects and 3D settings of a14 and the other compatibility extensions sit
          in extension lists and draw nothing.

      - id: package.encryption
        title: Encrypted and write-protected files
        priority: P2
        difficulty: 2
        status: done
        strategy: >-
          The decryption of pptx `package.encryption` (done, [MS-OFFCRYPTO] agile and standard encryption) applies
          unchanged: a password-protected document is a compound file with an EncryptedPackage stream. Editing
          restrictions (w:documentProtection, w:writeProtection) only matter to an editor.
        office: >-
          The decryption shared with pptx ([MS-OFFCRYPTO] agile and standard) opens password-protected documents: one
          Word encrypted converts with its password, without one or with a wrong one the converter throws a
          PasswordException saying which (Fidelity convert --password). Editing restrictions only matter to an editor.

      - id: package.properties
        title: Document properties
        namespaces: [ap, op, cp, vt]
        priority: P3
        difficulty: 1
        status: done
        strategy: Metadata only; title, author and language go into the HTML head. DOCPROPERTY fields read them.
        office: >-
          Title, author, description, keywords and dates of docProps/core.xml go into the HTML head (shared with
          pptx), the language from dc:language or the document defaults' w:lang; the file name is the title where the
          properties have none.

      - id: package.customXml
        title: Custom XML parts and schema library
        elements: [sl:schemaLibrary, sl:schema]
        namespaces: [ds]
        priority: P2
        difficulty: 1
        status: done
        strategy: Data only; content controls bound to a custom XML part read their values from it (sdt.dataBinding).
        office: >-
          Custom XML parts are data: content controls bound to them show their nodes' values (sdt.dataBinding); the
          schema library draws nothing.

      - id: package.ids
        title: Object ids, document ids and revision save ids
        elements: [a16:creationId, a16:predDERef, a16:cxnDERefs, a16:colId, a16:rowId, w14:docId, w15:docId,
                   w:rsids, w:rsidRoot, w:rsid]
        namespaces: [oac]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered; ids for co-authoring and merging.
        office: >-
          Revision save ids, document ids and DrawingML creation and row ids draw nothing.

  - id: document
    title: Document structure
    features:
      - id: document.body
        title: Document and body
        elements: [w:document, w:body]
        priority: P0
        difficulty: 1
        status: done
        strategy: >-
          The body's block content (paragraphs, tables, content controls, custom XML, section properties) flows
          through the layout engine into pages; the last w:sectPr of the body describes the last section.
        office: >-
          The body's paragraphs, tables, content controls and custom XML flow through the layout into pages; each
          section's w:sectPr in the last paragraph of the section, the body's own w:sectPr for the last section. A
          damaged document with several w:body elements shows them all, one after the other
          (docx/external/poi/MultipleBodyBug).

      - id: document.background
        title: Page background
        elements: [w:background, w:displayBackgroundShape, v:background, a15:backgroundPr]
        priority: P2
        difficulty: 2
        status: done
        strategy: >-
          Color, gradient, texture or picture behind every page (w:background with its VML fill). Whether Word's PDF
          export includes it must be measured before it is drawn.
        office: >-
          Word prints the page color whether or not w:displayBackgroundShape is set: w:background's color (a theme
          color over w:color, its tint and shade applied to its HSL lightness as for text: docx/local/bgt-a to bgt-c,
          background2 EEECE1 shaded 3F prints 484329 whatever w:color says, 494429 by that rule; LibreOffice's
          WPC_CanvasBackground 47 → 100 % emulated) or the fill of its v:background, behind everything on each page
          (docx/local/misc-nothing, misc-nobg), as its PDF draws it (measured with Word's own presets,
          docx/local/bgpreset-*, and docx/local/ bggrad-*). A linear gradient lies over a tile of 1025 × 769 of Word's
          0.12 pt dots from the page's corner and turns back at the tile's end: at the angles 0 and 180 and at
          negative multiples of 45 (Word's presets write 0, -90, -45 and -135) a gradient between both colors spans a
          tile of 512 × 384 dots, as does one out and back at those diagonals; negative angles turn the gradient
          round, at any focus but 0, ±50 and 100 % Word applies the focus twice; colors blend as on shapes. Radial
          gradients repeat a tile of 1025 × 769 dots, Word's "from corner" presets (o:fill gradientCenter) one of 512
          × 384. Textures tile at the picture's size; a picture over the page Word prints as tiles of its pixels at
          0.12 pt each; a pattern as its 8 × 8 bitmap, a point a bit, white in the fill color and black in color2, where
          the bitmap is one of Word's 48 patterns (the presets but horz, vert, cross, dnDiag, upDiag, diagCross, as Word's
          own documents of them hold them); another 8 × 8 bitmap a bit a 600 dpi dot, kept at 150 dpi: a tile of the
          bits at (0, 0), (4, 0), (0, 4), (4, 4) in 0.48 pt pixels, printed as their mean (docx/local/ypf-a to ypf-f;
          extras-tiledrendering/tdf159626_yellowPatternFillB 52.4 → 100 %). A
          background without a color (w:color, w:themeColor) Word ignores, its VML fill too
          (docx/external/libreoffice/extras-ooxmlexport/tdf126533_noPageBitmap: no picture of the page, 13.7 → 100 %).
          Known deviations: Word's PDF draws a gradient between two colors with the method linear or none in steps of
          half its length, flat between them; a texture of 300 dpi tiles 0.12 pt larger in Word.

      - id: document.altChunk
        title: Imported content (altChunk)
        description: A part in another format (HTML, RTF, plain text, another DOCX) that Word converts when it opens the document.
        elements: [w:altChunk, w:altChunkPr, w:matchSrc]
        priority: P2
        difficulty: 4
        status: done
        strategy: >-
          DOCX chunks are merged as WordprocessingML; plain text becomes paragraphs. HTML and RTF chunks need an
          import of their own; until then their text is shown without formatting.
        office: >-
          Chunks are converted as Word converts them when it opens the document (compared with the WordprocessingML
          Word writes when it saves such a document again): a WordprocessingML package's body in the document's
          formatting, plain text a paragraph per line in Courier New 10.5 pt without spacing, HTML through an import
          of our own: headings in bold Times New Roman 24 to 7.5 pt, paragraphs in 12 pt with 14 pt auto spacing
          unless the page's style sheet gives margins (p{margin:0}), list items with Symbol bullets or numbers in the
          document's font, tables with a pixel of cell spacing (none with cellspacing="0"), outset frames and cells in
          Word's two grays, the padding of cellpadding, widths in pixels, cells centered and in the document's own
          spacing and font, header cells bold and centered (docx/local/altchunk, altchunk-tables); CSS borders
          (border: 1px solid black) single lines of that width on the table and its cells, collapsed borders without
          cell spacing, CSS cell widths as cell and column widths (docx/external/tika/testAltChunkHTML). A web archive
          (MHTML, message/rfc822) gives its HTML part (testAltChunkMHT). RTF through an import of our own: Word reads
          the RTF into a document of its own and pastes it with the destination's styles, so a paragraph whose style
          the document has (by name) takes it and keeps as direct formatting only what differs from the RTF's own
          definition of that style, and a style the document lacks comes along with all its formatting; the RTF's
          styles start from its defaults (\*\defchp, \*\defpap, else the default font, 12 pt and no spacing), without
          a stylesheet the paragraphs are in Word's own Normal (Aptos 12 pt, 8 pt after, 1.16 lines); character
          formatting lasts until \plain or the end of its group, paragraph formatting until \pard; fonts by their
          charset's code page, Unicode with its fallback; list labels from \listtext and \pntext; fields with their
          instructions and results; PNG, JPEG, EMF and WMF pictures; tables from their rows' cell boundaries, gaps,
          paddings, borders, shading and merges (docx/local/altchunk-rtf, altchunk-rtf2: Word's own RTF among them,
          lines within 0.3 pt). An imported WordprocessingML package's section breaks keep their kind, their pages the
          section's the chunk stands in (docx/external/libreoffice/writerfilter-dmapper/alt-chunk: a chunk of square
          pages of 283 pt in an A4 section, two A4 pages, 99.8 %). Known deviations: an RTF chunk's nested tables are
          flattened, its footnotes, comments and drawn shapes left out; after an HTML list Word gives the first cell
          of a following table no space after; a web archive's pictures are left out.

      - id: document.subDoc
        title: Subdocuments (master documents)
        elements: [w:subDoc]
        priority: P3
        difficulty: 2
        status: done
        strategy: Collapsed subdocuments show as their link; expanded ones are already part of the body.
        office: >-
          A collapsed subdocument prints as a paragraph of the default style showing the subdocument's path,
          underlined in the hyperlink color (the Hyperlink style where the document has one, else the theme's) and
          linking to it; expanded subdocuments are part of the body (docx/local/subdoc 99.7 %).

      - id: document.glossary
        title: Building blocks (glossary document)
        elements: [w:glossaryDocument, w:docParts, w:docPart, w:docPartBody, w:docPartPr, w:behaviors, w:behavior,
                   w:category, w:description, w:gallery, w:guid, w:types, w:type, w:name]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered; the glossary holds AutoText and building blocks, and placeholder texts of content controls.
        office: >-
          The glossary document (AutoText, building blocks, placeholder texts) is not printed; content controls
          already hold the placeholder text they show.

  - id: settings
    title: Document settings
    features:
      - id: settings.compatibility
        title: Compatibility mode and options
        description: >-
          w:compatSetting compatibilityMode (11 = Word 2003, 12 = 2007, 14 = 2010, 15 = 2013 and later) and the
          layout options older documents carry; each switches a layout rule of the engine.
        elements: [w:compat, w:compatSetting, w:alignTablesRowByRow, w:allowSpaceOfSameStyleInTable,
                   w:autoSpaceLikeWord95, w:autofitToFirstFixedWidthCell, w:cachedColBalance, w:convMailMergeEsc,
                   w:displayHangulFixedWidth, w:doNotAutofitConstrainedTables, w:doNotBreakConstrainedForcedTable,
                   w:doNotBreakWrappedTables, w:doNotSnapToGridInCell, w:doNotSuppressIndentation,
                   w:doNotSuppressParagraphBorders, w:doNotUseEastAsianBreakRules, w:doNotUseHTMLParagraphAutoSpacing,
                   w:doNotUseIndentAsNumberingTabStop, w:doNotVertAlignCellWithSp, w:doNotVertAlignInTxbx,
                   w:doNotWrapTextWithPunct, w:footnoteLayoutLikeWW8, w:forgetLastTabAlignment, w:growAutofit,
                   w:hdrShapeDefaults, w:layoutRawTableWidth, w:layoutTableRowsApart, w:lineWrapLikeWord6,
                   w:mwSmallCaps, w:noColumnBalance, w:noExtraLineSpacing, w:noLeading, w:noSpaceRaiseLower,
                   w:noTabHangInd, w:printBodyTextBeforeHeader, w:printColBlack, w:relyOnVML,
                   w:selectFldWithFirstOrLastChar, w:shapeDefaults, w:shapeLayoutLikeWW8, w:showBreaksInFrames,
                   w:spacingInWholePoints, w:splitPgBreakAndParaMark, w:subFontBySize, w:suppressBottomSpacing,
                   w:suppressSpBfAfterPgBrk, w:suppressSpacingAtTopOfPage, w:suppressTopSpacing,
                   w:suppressTopSpacingWP, w:swapBordersFacingPages, w:truncateFontHeightsLikeWP6,
                   w:underlineTabInNumList, w:useAltKinsokuLineBreakRules, w:useAnsiKerningPairs, w:useFELayout,
                   w:useNormalStyleForList, w:usePrinterMetrics, w:useSingleBorderforContiguousCells,
                   w:useWord2002TableStyleRules, w:useWord97LineBreakRules, w:wpJustification, w:wpSpaceWidth,
                   w:wrapTrailSpaces, w:adjustLineHeightInTable, w:applyBreakingRules,
                   w:balanceSingleByteDoubleByteWidth, w:doNotExpandShiftReturn, w:doNotLeaveBackslashAlone,
                   w:spaceForUL, w:ulTrailSpace]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          One switch per option in the layout engine, each measured in Word with a generated document that differs
          only in that option; the options and every rule the compatibility mode changes are read once per document
          into one profile of named switches. Mode 15 comes first: it is what current Word writes.
        office: >-
          Word lays a document out in its compatibility mode (w:compatSetting compatibilityMode, 12 without one):
          before mode 15 tables put the first cell's text at the indent, or center their left line on the margin where
          no indent is given at all (measured with docx/local/c2-tblpos in modes 11 to 15), and widen percentage
          widths by the outer cells' margins (table.width); before 14 there are no OpenType features and kerning comes
          (in mode 14 too without w:compatSetting enableOpenTypeFeatures: run.openType) from the kern table, every pair of it (docx/local/legkern-*: Times New Roman, Calibri and Arial pairs of
          Latin, Cyrillic, Greek, quotation marks and superscripts, in modes 11 and 12 as w:useAnsiKerningPairs alike;
          run.openType); before 15 the hyphenation zone counts (paragraph.hyphenation). Each layout option was
          measured alone in Word in modes 15 and 12 (docx/local/compat15-* and compat12-*: 65 options on a document of
          justified, bordered and spaced paragraphs, lists, tabs, small caps, raised text, a table and Japanese text),
          and those that changed anything again with what their rules depend on, in modes 15, 14, 12 and 11 (c2- to
          c7-*); each of them switches its rule in the engine. doNotExpandShiftReturn: justified lines that end with a
          manual line break are not stretched. doNotUseHTMLParagraphAutoSpacing: the space after a paragraph and the
          space before the next add up instead of overlapping, and HTML auto spacing takes the paragraphs' own values.
          doNotLeaveBackslashAlone: a backslash in Japanese text (w:lang w:eastAsia ja) shows as a yen sign unless its
          font is an East Asian one. balanceSingleByteDoubleByteWidth: spaces beside spaces or East Asian characters
          are half the font size wide where the run's East Asian font is one, and do not squeeze in justified lines, a
          list number's keeping their width (docx/external/libreoffice/ extras-ooxmlexport/chtoutline: "第 1 章" in
          Cambria's spaces, 69.9 → 85.7 %). noExtraLineSpacing: exact lines put their baseline below the font's ascent
          and line gap, at the line's bottom at most. suppressTopSpacing: the first line on a page has its baseline
          9.6 pt below its top where its height is exact, and loses its at-least height less 9.6 pt above its text
          where it is at least, whatever its font (Arial from 8 to 40 pt, Times New Roman, Calibri). Before Word 2013
          only (modes 11 to 14; Word 2013 and later ignore them): mwSmallCaps sets small capitals in the largest
          Macintosh size (7, 9, 10, 12, 14, 18, 24, 36, 48, 60 or 72 pt) below the text's size, 7 pt at least, in the
          line of the text's size; noLeading drops the line gap Word adds to the fonts' win metrics (11 pt Arial lines
          12.29 pt high); suppressTopSpacingWP makes lines as WordPerfect 5 did: the font size and 2 pt high, fixed-
          pitch fonts without the 2 pt, the descent below the baseline; noSpaceRaiseLower leaves raised and lowered
          text out of the line height; splitPgBreakAndParaMark moves the mark after a page break that ends its
          paragraph to the next page as an empty line, and the floating objects after one that begins it
          (docx/local/breakmark-*); suppressSpacingAtTopOfPage drops the extra of at-least and grid spacing above the
          first line on a page; allowSpaceOfSameStyleInTable turns contextual spacing off in table cells;
          doNotUseIndentAsNumberingTabStop lets the tab after a list number pass the hanging indent for a custom stop
          after it, before Word 2013 only (docx/local/numtabind-*: modes 14, 12, 11). In all modes:
          doNotBreakWrappedTables keeps floating tables whole (table.floating). Before Word 2013 noColumnBalance
          leaves the columns above a continuous section break unbalanced (section.columns). ulTrailSpace underlines
          the spaces that end a line (run.decoration). Below Word's 0.12 pt device grid and not modeled:
          suppressBottomSpacing (exact lines one dot lower), truncateFontHeightsLikeWP6 (glyphs printed one dot
          smaller, positions within 0.5 %), useWord97LineBreakRules (Latin letters up to 0.15 pt, Japanese lines 0.03
          pt higher). Measured and not modeled: useAltKinsokuLineBreakRules breaks two of 23 Japanese test paragraphs
          elsewhere in mode 12. Without effect on Word's printed output in modes 15 and 12, on the probes' paragraphs,
          lists, tabs, tables (autofit wider than the page, contextual spacing in cells), Japanese text at 23 widths,
          two columns, a line grid, footnotes and page tops: alignTablesRowByRow, autoSpaceLikeWord95,
          autofitToFirstFixedWidthCell, convMailMergeEsc, displayHangulFixedWidth, doNotAutofitConstrainedTables,
          doNotBreakConstrainedForcedTable, doNotSnapToGridInCell, doNotSuppressIndentation,
          doNotSuppressParagraphBorders, doNotUseEastAsianBreakRules, doNotVertAlignCellWithSp, doNotVertAlignInTxbx,
          doNotWrapTextWithPunct, footnoteLayoutLikeWW8, forgetLastTabAlignment, growAutofit, layoutRawTableWidth,
          layoutTableRowsApart, lineWrapLikeWord6, noTabHangInd, printBodyTextBeforeHeader, printColBlack,
          selectFldWithFirstOrLastChar, shapeLayoutLikeWW8, showBreaksInFrames, spaceForUL, spacingInWholePoints,
          subFontBySize, suppressSpBfAfterPgBrk, swapBordersFacingPages, underlineTabInNumList, useAnsiKerningPairs
          (kerning without w:kern), useFELayout, useNormalStyleForList, usePrinterMetrics,
          useSingleBorderforContiguousCells, useWord2002TableStyleRules, wpJustification, wpSpaceWidth,
          wrapTrailSpaces, applyBreakingRules, cachedColBalance, and the compatSettings
          enableOpenTypeFeatures, overrideTableStyleFontSizeAndJustification and doNotFlipMirrorIndents set to 0 in
          mode 15. Measured along the way and fixed in the base layout: a paragraph after a table gets HTML auto
          spacing; contextual spacing compares a table's first paragraph with the paragraph before it and the
          paragraph after it with the table's last, works in cells (a cell's first paragraph follows the cell before
          or the end of the row before), and where it drops a space after, the next space before gives only its
          excess; a table whose style is not based on the default table style has no cell margins of its own; small
          caps set spaces at the small size and keep the line of the text's size. Known deviation: Word before 2010
          measures Aptos spaces 0.26 pt wider at 11 pt (docx/local/c3-lines12).

      - id: settings.view
        title: View settings
        elements: [w:settings, w:view, w:zoom, w:doNotDisplayPageBoundaries, w:displayHorizontalDrawingGridEvery,
                   w:displayVerticalDrawingGridEvery, w:drawingGridHorizontalOrigin, w:drawingGridHorizontalSpacing,
                   w:drawingGridVerticalOrigin, w:drawingGridVerticalSpacing, w:doNotUseMarginsForDrawingGridOrigin,
                   w:readModeInkLockDown, w:showEnvelope, w:clickAndTypeStyle, w:stylePaneFormatFilter,
                   w:stylePaneSortMethod]
        priority: P3
        difficulty: 1
        status: done
        strategy: Editor state; the printed layout does not depend on it.
        office: >-
          View settings (zoom, drawing grid display, page boundaries) do not change the printed layout.

      - id: settings.protection
        title: Protection and privacy
        elements: [w:documentProtection, w:writeProtection, w:removePersonalInformation, w:removeDateAndTime]
        priority: P3
        difficulty: 1
        status: done
        strategy: Only matters to an editor.
        office: >-
          Document and write protection only matter to an editor; nothing is drawn.

      - id: settings.editor
        title: Editor and save options
        elements: [w:attachedTemplate, w:attachedSchema, w:linkStyles, w:styleLockTheme, w:styleLockQFSet,
                   w:autoFormatOverride, w:documentType, w:summaryLength, w:captions, w:caption, w:autoCaptions,
                   w:autoCaption, w:forceUpgrade, w:smartTagType, w:doNotEmbedSmartTags, w:saveXmlDataOnly,
                   w:saveThroughXslt, w:useXSLTWhenSaving, w:saveInvalidXml, w:ignoreMixedContent,
                   w:alwaysMergeEmptyNamespace, w:doNotValidateAgainstSchema, w:doNotDemarcateInvalidXml,
                   w:savePreviewPicture, w:doNotAutoCompressPictures, w:doNotIncludeSubdocsInStats,
                   w:printPostScriptOverText, w:printFractionalCharacterWidth, w14:defaultImageDpi,
                   w14:discardImageEditingData, w14:conflictMode, w15:chartTrackingRefBased, w15:webExtensionLinked,
                   w15:webExtensionCreated, asl:scriptLink]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered.
        office: >-
          Editor settings (attached template, captions, automatic formatting, scripts) draw nothing, except
          w:linkStyles without an attached template: Word updates the styles from its Normal template on opening
          (style.defaults; docx/local/lsk-1; with a template attached that cannot be found nothing changes, lsk-2).

      - id: settings.web
        title: Web page settings and frames
        elements: [w:webSettings, w:frameset, w:frame, w:framesetSplitbar, w:frameLayout, w:title, w:sourceFileName,
                   w:marW, w:marH, w:scrollbar, w:noResizeAllowed, w:linkedToFile, w:longDesc, w:noBorder,
                   w:flatBorders, w:optimizeForBrowser, w:allowPNG, w:doNotRelyOnCSS, w:doNotSaveAsSingleFile,
                   w:doNotOrganizeInFolder, w:doNotUseLongFileNames, w:pixelsPerInch, w:targetScreenSz,
                   w:saveSmartTagsAsXml, w:encoding]
        priority: P3
        difficulty: 2
        status: done
        strategy: >-
          Options for saving as a web page. Frames pages (w:frameset) show their frames' documents side by side only
          in Web Layout; the printed layout shows the frameset document itself.
        office: >-
          Web page options matter only when saving as a web page; a frames page prints the frameset document itself.

      - id: settings.mailMerge
        title: Mail merge
        elements: [w:mailMerge, w:mainDocumentType, w:linkToQuery, w:dataType, w:connectString, w:query, w:dataSource,
                   w:headerSource, w:doNotSuppressBlankLines, w:destination, w:addressFieldName, w:mailSubject,
                   w:mailAsAttachment, w:viewMergedData, w:activeRecord, w:checkErrors, w:odso, w:udl, w:table, w:src,
                   w:colDelim, w:fHdr, w:fieldMapData, w:column, w:lid, w:dynamicAddress, w:mappedName,
                   w:recipients, w:recipientData, w:active, w:uniqueTag]
        priority: P3
        difficulty: 2
        status: done
        strategy: The data source is external; merge fields show their cached results.
        office: >-
          The data source is external: merge fields show their cached results, as printed without merging.

  - id: style
    title: Styles
    features:
      - id: style.definitions
        title: Paragraph, character, table and numbering styles
        elements: [w:styles, w:style, w:name, w:aliases, w:basedOn, w:next, w:link, w:autoRedefine, w:hidden,
                   w:uiPriority, w:semiHidden, w:unhideWhenUsed, w:qFormat, w:locked, w:personal, w:personalCompose,
                   w:personalReply, w:rsid, w:pStyle, w:rStyle, w:tblStyle]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Resolve properties in the order of ISO/IEC 29500 17.7.2: document defaults, table style, numbering,
          paragraph style, run style, direct formatting, each style through its basedOn chain. Toggle properties
          (b, i, caps, smallCaps, strike, dstrike, vanish, emboss, imprint, outline, shadow) flip along the style
          chain instead of overriding.
        office: >-
          Formatting resolves as ISO/IEC 29500 17.7.2 says: document defaults, table style (with its conditional
          formats), numbering, paragraph style, character style and direct formatting, each style through its basedOn
          chain (cycles cut); toggle properties (b, i, caps, smallCaps, strike, dstrike, vanish, emboss, imprint,
          outline, shadow) flip along the chain (17.7.3); default paragraph, character and table styles apply where
          none is named. Run properties written inside a style's w:pPr (not their place) are the style's, under its own
          w:rPr (LibreOffice's extras-ooxmlexport/tdf135774_numberingCRProps: a highlight there highlights the runs in
          Word). The default paragraph and table style is the last one marked w:default; without one marked,
          paragraphs take the paragraph style named Normal (in any case, whatever its id), tables none
          (docx/local/nodefault-*, tdef-*). Word keeps its own Normal Table: a table style of that name shows no
          borders, indent or formatting of its own, its cells 5.4 pt margins left and right (docx/local/tn-*), also
          where only Word 2010's copy of the styles (word/stylesWithEffects.xml) has it as the default table style and
          styles.xml none (docx/local/swe-tbl: the cells' 5.4 pt margins and the edge outdented by them; swe-none
          without that part none; its paragraph and other table styles do not count, swe-font, swe-pstyle, swe-tstyle;
          LibreOffice's core-ooxml-pass/liststyle-gridbefore 78.7 → 92.4 %). A
          style without w:styleId has its name for an id, as it is, without w:type it is a paragraph style; styles
          are named by id only (docx/local/styleid: neither the name without its spaces or in another case nor a
          name of a style with an id applies; docx/external/poi/60329, by SQL Server Reporting Services). A built-in
          style defined twice under its name in any case is the later definition, also for paragraphs that name the
          earlier one; custom names keep the first (docx/local/dupst-*: "footnote text" of 20 pt, then "Footnote Text",
          prints a paragraph of the first in Normal's 11 pt; tika/testWORD_various). The other elements are for
          editing and change nothing printed.

      - id: style.defaults
        title: Document defaults
        elements: [w:docDefaults, w:rPrDefault, w:pPrDefault]
        priority: P0
        difficulty: 2
        status: done
        strategy: The base of every property chain; Word's own defaults apply where the part leaves a property out.
        office: >-
          w:rPrDefault and w:pPrDefault are the base of every chain; where they leave a property out Word's own
          defaults hold: Times New Roman 10 pt, single spacing, no space between paragraphs (docx/local/defaults-
          empty, 94.3 %). A document without a styles part gets the defaults of Word's Normal template: the theme's
          minor fonts (asciiTheme, hAnsiTheme and eastAsiaTheme minorHAnsi, cstheme minorBidi) at 12 pt, kerning,
          standard and contextual ligatures, 8 pt after paragraphs, 1.16 lines: without a theme part Aptos, Arabic
          outside right-to-left runs falling back to Arial (docx/local/defaults-none, 91.7 %), with a theme its minor
          Latin font, Calibri or Georgia, right-to-left text in Times New Roman (docx/local/thd-nostyles-georgia,
          thd-nodef-calibri; docx/external/libreoffice/extras-ooxmlexport/tdf108496 82 → 96.9 %, tdf104167 84.8 →
          100 %); so does each of w:rPrDefault and w:pPrDefault a styles part leaves out, also in an empty
          w:docDefaults, in every mode (docx/local/nodefaults-none, -empty, -run, -para, thd-emptydef-georgia,
          thd-ppr-georgia, thd-nodef-georgia-12, -14; thd2-b prints as thd2-c, which names the theme fonts). A document whose styles
          update from the template (w:linkStyles) without one attached takes the template's defaults in the theme's
          minor fonts and its Normal style, which states nothing; its other styles stay, based on them (docx/local/
          lsk-1: Arial 10 pt single in Normal turns to 12 pt at 1.16 lines, a heading keeps 16 pt bold;
          docx/external/libreoffice/extras-ooxmlexport/tdf61000). Theme fonts without a theme part are Word's own
          since 2023, Aptos Display and Aptos (lsk-1).

      - id: style.latent
        title: Latent styles
        elements: [w:latentStyles, w:lsdException]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered; settings of built-in styles a document has not used yet.
        office: >-
          Latent style exceptions describe built-in styles a document has not used; nothing is drawn.

  - id: font
    title: Fonts
    features:
      - id: font.table
        title: Font table and substitution
        elements: [w:fonts, w:font, w:altName, w:charset, w:family, w:panose1, w:pitch, w:sig, w:notTrueType]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Fonts a document names but the machine lacks are replaced the way Word does it, using the font table's
          alternate name, PANOSE, family, pitch and character set; shared with pptx `engine.fonts`.
        office: >-
          A family the machine lacks is replaced as Word replaces it: a family known by the name (Word's own: any
          Futura Century Gothic, any Baskerville Baskerville Old Face, Myriad Pro Segoe UI, New York Times New Roman,
          Gill Sans Light and Helvetica Light the Nova families, docx/local/fontnames-plain; names beginning with Open
          Sans or Lato Segoe UI, with Roboto or Arial Arial, as web font lists from HTML have them, other lists
          ("Calibri;Zz") not, docx/local/font-list, font-list2, tika/testWORD_features 20 → 100 %; PostScript and
          other platforms' names: ArialMT, TimesNewRomanPSMT, Calibri-Bold, Helvetica, Helvetica Neue, Times, Courier,
          Palatino, Geneva, Lucida Grande, and Windows' font substitutes), then the table's w:altName where a family
          of that very name is installed (an altName of Courier or Arial Unicode MS counts for nothing,
          docx/local/fontnames-alt; RP052-Deleted-Para-Mark 90.3 to 100 % of its lines), which comes before the
          PostScript, platform and free names (docx/local/fs2-d: DejaVu Sans with altName Times New Roman in Times New
          Roman, without it in Verdana; LibreOffice's core-layout/tdf157096 85.2 → 99.7 %), and before them Sylfaen for
          a signature with the Armenian range and the Georgian one or without Basic Latin (w:sig usb0 bits 10, 26, 0;
          docx/local/fs3-d, -f, -g, pano-00 to pano-15: DejaVu, Liberation and unknown names with usb0 E7002EFF,
          E7006EFF or the Armenian range alone, whatever their code pages; extras-ooxmlexport/fdo71646; Latin and
          Armenian alone, extras-layout/tdf138465min, and Georgian alone, pano2-04, not), those not for a Cyrillic
          font (fs2-a to -c: Liberation Serif of character set 00 or EE in Times New Roman, of CC in Cambria, which
          also passes the signature's code pages by; extras-layout/tdf153136), Windows' own substitutes (Times,
          Helvetica) for every character set (Word's PDF of docx/external/poi/bookmarks in a session of its own: Times of
          CC in Times New Roman, 77.9 → 100 %), then a font for the table's
          character set (symbol: Wingdings, docx/local/psym-a, psym-b: U+F021 to U+F0FE of a missing font of charset 02
          all in Wingdings; Shift JIS: Yu Gothic, MS PMincho where the alternate name is Times New Roman, before that
          name (docx/local/fs3-a, fs3-b, fs3-c: Liberation Serif and Sans of charset 80; extras-ooxmlexport/fdo69548,
          fdo47669, extras-ooxmlimport/tdf103931), Hangul: Malgun Gothic, GB 2312: Microsoft YaHei, Big5:
          PMingLiU, Thai: Browallia New; Arabic and Hebrew by the table's family: roman Sakkal Majalla and Times New
          Roman, modern Tahoma, all others Arial, docx/local/font-sub3), then Arial for a signature with the Hebrew or
          Arabic code page (w:sig csb0 bits 5, 6), Times New Roman for such serif fonts (docx/local/ font-sig:
          Cyrillic or Greek code pages and PANOSE alone change nothing; pandoc/normalize: Apple Chancery, Apple
          Symbols, Big Caslon), then a font for an Indic, Lao or Georgian Unicode range of the signature (w:sig usb0
          bits 15 to 26, the lowest first: Devanagari Mangal, Bengali to Tamil, Kannada and Malayalam Nirmala UI,
          Telugu Microsoft New Tai Lue, Lao Leelawadee UI, Georgian Sylfaen, Thai none, passed over for the next
          (docx/local/pano2-01: Thai and Georgian in Sylfaen; known deviation: without Latin ranges Word prints Lao in
          DokChampa, pano2-00, pano2-02); docx/local/fsu-a to fsu-c:
          Bangla MN's 80008003 in Mangal, also pandoc/normalize exported on its own), then Courier New for American
          Typewriter and Apple Chancery, else Cambria for serif fonts (w:family roman) and fonts the table does not
          describe and Calibri for all others, whatever their PANOSE, pitch or the theme (docx/local/font-sub 94.4 %,
          font-sub2 98 %, every line within 0.1 pt). Caladea and Carlito stand in where Cambria and Calibri are
          missing too. Of a family's entries the table's last one counts, and a character set of 01 means nothing
          (docx/local/fontdup: OpenSymbol, first roman, then auto, prints in Calibri, as in
          tdf153526_commentInNumbering). A list number's missing complex script font becomes Times New Roman instead
          (see run.complexScript). A missing family that the table gives an East Asian character set takes that
          script's font before what its name begins with, and a missing name in East Asian characters Yu Gothic, Latin
          and kana alike (docx/local/fsy-*, measured one Word instance a document since Word keeps a family's
          substitute for its session: "Arial Unicode MS" and "Arial Zz" of charset 80 in Yu Gothic, of charset 00 or
          undescribed in Arial; "ＭＳ 明朝;MS Mincho" and "明朝Zz" in Yu Gothic, "Zz;MS Mincho" in Cambria;
          docx/external/libreoffice/extras-ooxmlexport/tdf107969 66.6 → 92.6 %, extras-uiwriter/tdf128375 66.3 → 93.4
          %).

      - id: font.embedded
        title: Embedded fonts
        elements: [w:embedRegular, w:embedBold, w:embedItalic, w:embedBoldItalic, w:embedTrueTypeFonts,
                   w:embedSystemFonts, w:saveSubsetFonts]
        priority: P2
        difficulty: 2
        status: done
        strategy: >-
          Embedded fonts are obfuscated TrueType parts (ISO/IEC 29500 17.8.1: the font key GUID XORed over the first
          32 bytes); decode them and use them for layout and output like installed fonts.
        office: >-
          Fonts the font table embeds (w:embedRegular, Bold, Italic, BoldItalic) are decoded when first used:
          obfuscated fonts have their first 32 bytes XORed with the w:fontKey GUID's bytes read from its end (a
          Gabriola Word embedded decodes to the installed file); they stand behind the installed fonts as in Word and
          are embedded into the HTML when the browser lacks them (a renamed embedded family renders as in Word,
          docx/local/embedded-renamed 97.8 %). A subset (w:subsetted) that lacks characters of the runs set in it is
          not used at all (LibreOffice's writerfilter-dmapper/subsetted-embedded-font: a subset of 11 characters,
          "MASTER SERVICES AGREEMENT" printed in another font; subsetted-full-embedded-font: 755 characters, used).

      - id: font.theme
        title: Theme fonts
        description: rFonts asciiTheme, hAnsiTheme, eastAsiaTheme and cstheme refer to the theme's major and minor fonts.
        elements: [w:themeFontLang]
        priority: P0
        difficulty: 2
        status: done
        strategy: >-
          Resolve theme font references against a:fontScheme (theme.fonts); w:themeFontLang picks the script-specific
          entries of the theme for East Asian and complex-script text.
        office: >-
          rFonts asciiTheme, hAnsiTheme, eastAsiaTheme and cstheme take the theme's major or minor font of their
          script. Where the theme's East Asian font is empty, and for complex scripts always (the theme's complex
          script font does not count: docx/local/thd2-c, a minor complex script font of Tahoma prints right-to-left
          text in Times New Roman), the theme's a:font for the script of the language w:themeFontLang names (ja-JP:
          Jpan, zh-CN: Hans, zh-TW: Hant, ko-KR: Hang, ar-SA: Arab, he-IL: Hebr …) is taken, for all complex scripts
          alike (thd2-d: ar-SA's Arial for Hebrew too); without one, East Asian text keeps the run's Latin font and
          complex scripts take Times New Roman, both then falling back by glyph; the runs' own languages do not matter
          (docx/local/tf-de, tf-ja, tf-zh, tf-ko, tf-he, tf-none: the East Asian lines within 0.1 pt).

  - id: run
    title: Runs and character formatting
    features:
      - id: run.basic
        title: Runs, fonts, size and color
        elements: [w:r, w:rPr, w:t, w:rStyle, w:b, w:i, w:sz, w:color, w:rFonts, w:lang]
        priority: P0
        difficulty: 2
        status: done
        strategy: >-
          Each run picks one of its four fonts (ascii, hAnsi, eastAsia, cs) per character by Unicode range and the
          w:hint attribute, then is measured and broken into lines by our text engine (engine.lineLayout).
        office: >-
          Widths are the fonts' advances shaped by HarfBuzz at the nominal size (not rounded to the 600 dpi device);
          GPOS kerning only where w:kern is set and the size reaches its threshold, the font's kern table instead
          without OpenType features (before Word 2013, and in mode 14 without w:compatSetting enableOpenTypeFeatures)
          and, with them, for a font standing in for a missing family and for one whose GPOS does not kern Latin text
          where the run asks for no OpenType feature (docx/local/ksg-*, ksg2-*, ksg3-*: Segoe UI and Aptos, whose kern
          tables and GPOS differ in 223 and 320 Latin pairs, by their kern tables in modes 12 and 14, by GPOS in mode
          15; Segoe UI for "Open Sans;Arial;sans-serif" by its kern table in mode 15 too; Tahoma by its kern table in
          all modes, unkerned with w14:ligatures in mode 15; compat14-*: Aptos by GPOS with enableOpenTypeFeatures;
          tika/testWORD_features 89.0 → 98.7 %), across runs of the same font,
          size, features and spacing whatever their colors, decorations or revision ids (docx/local/kr-15, kr-12:
          Times New Roman and Aptos pairs kerned across runs of one letter each, of other w:rsidR, red and black; not
          across 12 and 9 pt or regular and bold; LibreOffice's extras-ooxmlimport/tdf124670 80.0 → 100 %; known
          deviation: before Word 2013 small capitals kern with the capital before them), ligatures and contextual
          alternates only per w14:ligatures and w14:cntxtAlts (measured with docx/generated/text-fonts: positions
          within 0.1 pt per line without kerning). Theme fonts and theme colors resolve through the theme and the
          settings' color scheme mapping. Text of automatic color (w:color auto or none) is black, white on dark
          shading: the run's own, else its paragraph's, else its cell's, where 0.30 red + 0.59 green + 0.11 blue of it
          is below 60 of 255 (docx/local/autocolor: 100 shadings of each kind, C00000 and 006400 white, C80000, 006600
          and 3C3C3C black; highlights, even black, change nothing). Characters the run's font lacks fall back per
          Unicode range as Word's do (Segoe UI Symbol and Emoji, Cambria Math, Nirmala UI, Leelawadee, MS Mincho, …),
          the line growing with them, whole clusters together (engine.fonts, docx/local/fallback); arrows and
          geometric shapes in Cambria Math, also those drawn as emoji elsewhere, the black square and rectangle in
          Arial (docx/local/gf-15: U+2190 to U+21FF and U+25A0 to U+25FF in Calibri, Aptos and Times New Roman text;
          LibreOffice's extras-ooxmlexport/tdf94628 83.0 → 100 %). An empty font name
          (w:ascii="") names nothing, the slot keeping the font it had (LibreOffice's extras-ooxmlexport/
          font-name-is-empty: the style's Calibri; 25 → 100 % of the characters within half a dot). Sizes in
          half-points may carry a unit (w:sz "20pt" is 20 pt; docx/external/libreoffice/extras-ooxmlimport/tdf108408
          6.0 → 91.8 %). Colors may be written with a "#" before their six hex digits, other "#" values being no
          color, for text, shading and borders alike (tdf57589_hashColor: #004080 text, #e6e6e6 cells, "#f00ff"
          nothing; 25.2 → 88.8 %). Bold of a font without a bold face is the regular face filled and stroked a 35th of
          the size wide (Word's PDF of LibreOffice's extras-ooxmlexport/style-inheritance: Lucida Sans Unicode at 12
          and 14.04 pt stroked 0.343 and 0.401 pt).

      - id: run.decoration
        title: Underline, strike, caps, highlight, borders and shading
        elements: [w:u, w:strike, w:dstrike, w:caps, w:smallCaps, w:highlight, w:shd, w:bdr, w:vertAlign, w:emboss,
                   w:imprint, w:outline, w:shadow]
        priority: P0
        difficulty: 2
        status: done
        strategy: >-
          Drawn with the glyph runs as SVG: 18 underline styles with their own color, single and double strike,
          highlight and shading behind the line box, run borders merged across adjacent runs with the same border.
        office: >-
          Measured with docx/local/underlines, ulsizes, ulmixed, supsizes, supsizes2 and raised (Arial, Times New
          Roman, Calibri, Courier New, Segoe UI, Cambria, Aptos from 8 to 72 pt). Word draws on its 600 dpi device: a
          single underline from the font's post underline position, as thick as its underline thickness, both in whole
          0.12 pt dots; double lines half as thick (rounded up), the first from half the position, the second ending
          with the single line or 8 dots below the first; thick lines and the heavy patterns fill from the first
          double line to the second; dotted, dashed, long dashed, dot-dash and dot-dot-dash underlines have fixed
          lengths whatever the size (1.44/1.44, 3.96/1.92, 7.92/3.96, 3.0/0.96/0.96/0.96, 2.16/0.72 pt) from the
          underline's start; waves are 2.4 pt long, crests on the page's 2.4 pt grid, 0.24 pt thin (heavy 0.96 pt),
          within half the double band less 3 dots, wavy double splitting it. Neighbouring runs with the same underline
          share one, at their lowest baseline, its lines averaging theirs by width; superscripts underline alone at
          their own baseline; spaces at a line's end stay bare, tabs not; words leaves out spaces. Strikethrough from
          the OS/2 strikeout position and size, double strikethrough that line moved up and down by its thickness.
          Emboss: gray (#999999) copy in place, black copy 1.92 pt up-left, the text 0.96 pt up-left; imprint the same
          down-right; shadow a #C0C0C0 copy a 24th of the size down-right; outline hollow letters stroked 0.14 pt
          (white over a shadow), drawn as paths as Word's PDF draws them, whose thin strokes the rasterizer widens to
          a pixel (extras-ooxmlimport/tdf154370 85.0 → 95.7 %). Run borders take their lines and space (floored to dots) beside the text in the line,
          and above and below it, the line taller by twice both outside its spacing (docx/local/rbd-*: 0.5 to 3 pt
          with 0 and 4 pt of space, Calibri 11 and Arial 12; powertools/HC033 66.7 → 100 % of the lines), neighbouring
          runs with one border sharing a frame over the font's height. Super- and subscripts take the font's OS/2
          sizes in whole half-points (Calibri 11 pt: 7 pt; Aptos 12 pt: 7 pt), raised by its superscript offset or as
          far as the line's top allows, lowered by its subscript offset or as far as its bottom allows, in
          half-points, and make no line higher (within half a point where the line decides). Small caps are 80 % of
          the size rounded to half points; highlight and shading (patterns mixed over the fill) cover the line's
          natural box as far as its content goes: tabs too, not the spaces that end the line (docx/local/hlspace: a
          paragraph of highlighted or shaded spaces shows none, "Word" and four spaces only the word, a tab after it
          all of it). Word ignores a character style's highlighting, a color as none
          (docx/external/libreoffice/extras-ooxmlexport/tdf138345_charStyleHighlight 23.4 → 96.4 %;
          tdf137683_charHighlightTests: a paragraph style's cyan under a character style's none, 95.6 → 98.7 %). With
          w:ulTrailSpace underlines go on under the spaces that end a line too
          (docx/external/libreoffice/extras-cjk/UnderlineTrailingSpace: 70 and 80 underlined spaces in mode 15, 29.1 →
          100 %). The highlight and shading band reaches what raised and lowered text adds to the line
          (docx/external/libreoffice/extras-ooxmlexport/tdf140572_docDefault_superscript: text raised 9 pt shaded from
          9 pt above the ascent, 60.0 → 99.4 %). Known deviations: double and thick underlines of Arial and Courier
          New below 12 pt stand up to 3 dots higher; Garamond from 12 pt takes other super- and subscript sizes.

      - id: run.spacing
        title: Character spacing, scale, kerning and position
        elements: [w:spacing, w:w, w:kern, w:position, w:fitText]
        priority: P1
        difficulty: 2
        status: done
        strategy: Applied in measurement; kerning from the font's kern/GPOS data above the w:kern threshold size.
        office: >-
          Character spacing is added after every cluster, horizontal scale stretches the advances, raised and lowered
          text adds what it reaches beyond the line outside the line spacing multiple (text 3 pt up and 3 pt down
          makes a 1.15 line 6 pt higher, not 6.95 pt; docx/generated/character-formats), and lowered text takes as
          much less of the line's ascent, raised text of its descent (docx/local/lowr-*: 48 pt Arial lowered 12 pt
          beside 12 pt text has the baseline 33 pt below the line's top, 45 pt less 12; text all lowered half a point
          stands as unlowered; tdf99602_charStyleSubscript 41.1 to 96.9 %, tdf143384_tableInFoot_negativeMargins
          33.7 to 99.3 %); an inline picture or object lowered or raised moves as such text does (Word's PDFs of
          docx/external/libreoffice/extras-layout/tdf138465min: an equation 15.6 pt high lowered 3 pt gives its line
          an ascent of 12.6 pt, 76.6 → 84.5 %; extras-ooxmlimport/tdf119200: equations lowered 2, 3 and 4 pt on exact
          lines), except that lowering moves nothing on a line of nothing but drawings that is not exactly so high
          (docx/local/c2mt-a, -c, -e: an equation of 13.25 pt alone in its paragraph lowered 2 to 6 pt stands as
          unlowered, the lines below too; c2mt-d: raised 2 pt its line grows; extras-odfexport/2_MathType3). Known
          deviation: where characters align their centers or bottoms (w:textAlignment) lowered text keeps its whole
          ascent (aligned by their tops the line gap takes up the lowering first, paragraph.eastAsian). Fit text
          (w:fitText):
          neighboring runs with one id fit together into the width; wider text is scaled horizontally to it, narrower
          text spreads with equal gaps between its characters, the last ending at the width (docx/local/fittext,
          fittext2). Known deviation: Word also narrows spread characters, to between (n - 1)/n of their width (very
          wide fits) and all of it, and quantizes the scale to its 600 dpi font widths; characters here keep their
          width, each standing within about a point of Word's. A scale of none (w:w 0) Word ignores
          (docx/external/libreoffice/extras-ooxmlexport/tdf106001: 100 %, 8.3 → 97.7 %).

      - id: run.hidden
        title: Hidden text
        elements: [w:vanish, w:specVanish, w:webHidden]
        priority: P1
        difficulty: 2
        status: done
        strategy: Hidden runs take no space in the printed layout unless Word is measured to print them.
        office: >-
          Hidden text (w:vanish, w:specVanish) is left out of Word's PDF export and takes no space; the layout drops
          it the same way. A paragraph whose mark is hidden runs into the next one, the joined paragraph in the
          first's formatting (alignment, space before); one whose text is all hidden too is gone; before a table it
          stays without its space after; a cell's last paragraph stays even when all of it is hidden, the body's goes
          (docx/local/hiddenmark). A paragraph whose mark is hidden and that has nothing to show is gone, the next
          paragraph keeping its own formatting, its space before too (docx/local/hmp-1, hmp-2: an empty, centered,
          yellow paragraph after text or a table leaves "B" 24 pt before and no shading;
          docx/external/libreoffice/extras-ooxmlexport/cell-grid-span 39.9 → 93.7 %). Hidden runs print none of their
          tabs, breaks and drawings either (docx/external/libreoffice/core-undo/anchor-type-change-position: a hidden
          flowchart and line break before a frame's caption, 58.6 → 97.4 %).

      - id: run.complexScript
        title: Right-to-left and complex scripts
        elements: [w:rtl, w:cs, w:bCs, w:iCs, w:szCs, w:bdo, w:dir]
        priority: P1
        difficulty: 4
        status: done
        strategy: >-
          Complex-script runs use their own font, size, bold and italic; reordering and shaping as in pptx
          `text.rtl` (done), with w:bdo and w:dir as explicit embeddings.
        office: >-
          Complex script text takes the w:cs font with w:szCs, w:bCs and w:iCs; a w:rtl run or paragraph mark without a
          w:szCs anywhere takes Word's default of 10 pt, not its w:sz (docx/local/rsz-a, rsz-b: w:rtl Hebrew, Latin
          and empty marks of w:sz 28 print at 10 pt, at the docDefaults' w:szCs 20 pt where it has one, Hebrew without
          w:rtl at its w:sz; LibreOffice's extras-ooxmlexport/style-inheritance 93 → 100 % of the lines).
          Bidirectional levels follow UAX #9 with the paragraph's direction as the base, neutrals of w:rtl and w:dir
          runs reading right to left, those of other runs left to right also in right-to-left paragraphs, a list
          number's as the paragraph (Word's PDFs of extras-ooxmlexport/fdo43093b: "$" stays after its "M", 82.6 → 97.8 %;
          extras-ooxmlimport/tdf129659: "Lemberg." keeps its period at its end, 85.8 → 91.1 %; docx/local/rtlnum-e:
          "a." reads ".a"), and w:bdo forcing its direction; a w:dir ltr in a right-to-left paragraph is an embedding
          two levels up whose text reads as UAX #9 says in it, its neutrals of the embedding's direction whatever their
          runs', an explicit formatting character in it standing as that direction (Word's PDF of extras-ooxmlexport/
          tdf119143: an Arabic paragraph from "يتكلّم" on in such an embedding, its runs left to right, the comma after a
          stray U+202C too, 78.6 → 97.2 %); spaces ending a line take the paragraph's level, at the
          line's end (UAX #9 L1; docx/local/rtt-14, rtt-15: "Final " of a left-to-right run ending a line of a centred,
          right or left aligned right-to-left paragraph stands a space further right than the run would put it;
          extras-ooxmlexport/FDO76312 85.4 → 92.8 %); a right-to-left paragraph beside floating objects lays its lines
          out in the room they leave from the right, its rightmost part first (docx/local/rtw-14, rtw-15: Hebrew lines
          beside rectangles at the column's edges and middle 84.4 → 98.4 %, 87.3 → 98.0 %; extras-odfexport/tdf163575
          86.7 → 94.6 %); lines are reordered between their tabs,
          right-to-left pieces reach the browser whole from their right end (shaped, mirrored brackets) and
          justification widens their spaces. Clusters of several characters (marks, conjuncts, emoji sequences) are
          drawn whole. In a left-to-right paragraph a right-to-left run is an embedding of its own, reversed as a
          whole with its neutrals ("abc def!" shows "!abc def"; docx/local/bidi 94.1 %, every line as in Word;
          fallback-marks 93.3 %). Which characters are complex script follows ECMA-376's two steps as Word takes them:
          by its block a character is ASCII (Basic Latin and the right-to-left scripts: Hebrew, Arabic, Syriac,
          Thaana, the Arabic presentation forms), East Asian or high ANSI (all else, Thai and the Indic scripts too,
          which fall back from the high ANSI font and never take the w:cs font); w:cs and w:rtl then make every
          character complex script in font, size, bold and italic, Latin letters and punctuation too, but in a w:rtl
          run (not w:cs) numbers keep the font of their block with complex script size and bold, Arabic-Indic digits
          always, digits and % $ unless the run's w:lang w:bidi is Hebrew; w:hint="cs" changes nothing
          (docx/local/rtlslot-a to -p, every line as in Word). A w:rtl or w:cs paragraph mark measures its empty line
          in its w:cs font. A right-to-left paragraph's list number takes the rules of a w:rtl run but for its
          left-to-right letters ("1." beside Arabic: "1" Times New Roman, "." Aharoni; "a." "a" in the ASCII font), a
          left-to-right paragraph's none, whatever the w:rtl of its mark or level, but for its Hebrew and Arabic
          letters, which do (extras-ooxmlexport/tdf141231_arabicHebrewNumbering: an arabicAlpha number's letter in the
          theme's Arabic font Arial at w:szCs 28 pt, its "." in Calibri at 24 pt, 81.3 → 94.9 % with the note marks;
          FDO74106: hebrew1 letters in Arial, 99.2 → 100 %), and a number's missing w:cs font becomes Times New Roman
          (docx/local/rtlnum-a to -o). A note's mark in Hebrew or Arabic letters takes the complex script font at the
          run's own size (tdf141231: abjad marks of Calibri runs in Arial at 15.5 pt; the text of such runs keeps
          Calibri, which has the letters, docx/local/arf-15). Hebrew text set in Times New Roman beside Aharoni lines
          had made every line taller (docx/external/powertools/ HC002-Hebrew-01, HC003-Hebrew-02, HC012-Test-07,
          HC014-RTL-Table-01 from 2–26 % to 100 % of their lines). Tabs and breaks of a right-to-left or complex
          script run take its complex script font and size, as its other characters do
          (docx/external/powertools/RP/RP051-Arabic: two breaks of w:rtl runs of w:szCs 14 two lines 17.9 pt high).

      - id: run.content
        title: Breaks, symbols and special characters
        elements: [w:br, w:cr, w:tab, w:sym, w:noBreakHyphen, w:softHyphen, w:lastRenderedPageBreak, w:dayLong,
                   w:dayShort, w:monthLong, w:monthShort, w:yearLong, w:yearShort, w16se:symEx]
        priority: P0
        difficulty: 2
        status: done
        strategy: >-
          Page, column and text-wrapping breaks (with clear) go to the layout engine; w:sym characters are drawn from
          their symbol font (private use area F000-F0FF). w:lastRenderedPageBreak is where Word broke the page when
          it last saved: not rendered, but a free check of our pagination.
        office: >-
          Page and column breaks go to the paginator. One that begins a paragraph comes before it where the rest goes
          on in the next page or column: the number, the space before (what it has more than the space after above it)
          and the text (docx/local/leadbreak-a … -k, breakmark2-*; docx/external/libreoffice/extras-ooxmlexport/
          wDateValueFormat, tdf153964_topMarginAfterBreak15: 52 of 60 pt after a paragraph with 8 pt after). A column
          break always takes the paragraph mark along, which then holds a line of the next column or page, with the
          floating objects anchored to it, also after text; a page break only where text or an inline picture follows
          or w:splitPgBreakAndParaMark says so, which Word 2013 and later ignore (docx/local/breakmark-*,
          breakmark3-*, breakmark4-* in modes 11, 14 and 15; tdf153613_anchoredAfterPgBreak, -2, -3;
          tdf153592_columnBreaks). Where a content control starts before the break, as around a table of contents, the
          break ends the first line like any other and the space before stays behind (leadbreak-j, -m … -q;
          tdf154478). In table cells page and column breaks break nothing at all, the text going on in its line, in
          text boxes they end the line (docx/local/cb-1 to cb-5 in modes 14 and 15; fdo68607, table-pagebreak,
          tdf163178_columnbreakInTable). Text wrapping breaks (and w:cr) end the line; with w:clear the next line
          moves below the floating objects of the side it clears (an object on the left half of the column is on the
          left; docx/local/br-clear 99.8 %). Tabs go to the tab stops; w:sym characters are drawn from their symbol
          font. A line breaking at a soft hyphen shows a hyphen, which has to fit; a no-break hyphen prints the font's
          hyphen kept with the next character; date blocks show the printing day's day, weekday, month, month name
          and year in the regional format, whatever the run's language (docx/local/run-content 96.6 %; dlg-15: runs
          in en-US, fr-FR, ja-JP and de-DE alike; powertools/CA/CA007-DayLong "Montag"). w:lastRenderedPageBreak and
          w16se:symEx (its fallback character is taken) draw nothing of their own. Line feeds and carriage returns
          kept in w:t show as spaces (CR LF as one), tabs as tabs (docx/local/wtcontrol;
          docx/external/libreoffice/extras-uiwriter/tdf134021: table cells ending in a line feed stay one line high).
          Without xml:space="preserve" on the w:t itself or on w:document the spaces, tabs and line ends at the ends
          of its text are dropped and tabs inside show as spaces, the spaces inside and no-break spaces kept;
          xml:space on w:body, the paragraph or the run does not count (docx/local/ws-1 to ws-5;
          docx/external/libreoffice/extras-ooxmlimport/xml_space, tdf124670). A run inside a run counts as a run of
          its own (docx/external/libreoffice/writerfilter-ooxml/nested-runs: a text box's text, 8.3 → 100 %). A break
          (w:br) between paragraphs, in the body or a cell, breaks at the start of the next paragraph, in the next
          table too; one straight in a paragraph as a run's (docx/external/libreoffice/extras-ooxmlimport/tdf108714:
          four pages, 24.8 → 97.6 %). A page break that ends the document begins no page: one after the last
          paragraph's text, a last paragraph of only a page break, the second of two (docx/local/trail-text-15, -14,
          trail-only-*, trail-two-15; docx/external/libreoffice/extras-ooxmlexport/tdf153964_topMarginAfterBreak14:
          six pages).

      - id: run.ruby
        title: Ruby (phonetic guides)
        elements: [w:ruby, w:rubyPr, w:rubyAlign, w:hps, w:hpsRaise, w:hpsBaseText, w:lid, w:dirty, w:rt, w:rubyBase]
        priority: P2
        difficulty: 4
        status: done
        strategy: Ruby text set above the base text in its own size, aligned by w:rubyAlign; raises the line height.
        office: >-
          Ruby sets its phonetic text w:hpsRaise above its base, centered, left or right over it or spread over it
          (distributeLetter: the gaps between its letters; distributeSpace: also half a gap at either end); a ruby
          wider than its base spans its own width with the base spread under it alike (Word's PDF of
          docx/external/poi/61470: とうきょう over 東京 at distributeSpace, 東 at 73.344 and 京 at 87.144 pt; mean
          distance 3.56 → 0.31 dots); rightVertical runs it down the
          base's right, centered on the base; the line makes room for it (docx/local/ruby: the lines' baselines within
          0.1 pt). The ruby text takes w:hps's size whatever its runs say (docx/local/rbs-15: hps 16 over runs of
          20 pt prints 8 pt, hps 40 over runs of 8 pt 20 pt). What ruby reaches above the text counts in what multiple
          line spacing multiplies, the extra going below the text, where raised text (w:position, EQ \s\up) adds its
          part once (docx/local/eql-15, eql-s: MS Mincho 20 pt with 8 pt ruby 19 and 23 pt up is 1.15 times its single
          height at 1.15 lines; docx/external/libreoffice/extras-rtfexport/tdf138779 61.7 → 98.0 % with EQ fields).

      - id: run.eastAsian
        title: East Asian layout and emphasis marks
        elements: [w:eastAsianLayout, w:em]
        priority: P2
        difficulty: 4
        status: done
        strategy: Combined characters, horizontal-in-vertical text, two lines in one and emphasis marks.
        office: >-
          Emphasis marks (w:em) over every character but spaces, measured at 12 pt: a dot (U+FF0E) or comma (U+3001)
          in the run's font starting 0.17 em before the character's middle and 1.01 em above the baseline, a ring
          (U+02DA, Batang) 0.157 em before it and 0.29 em above, a dot below (SimSun) 0.205 em before it and 0.38 em
          below (LibreOffice's extras-ooxmlexport/em: over Calibri letters as over ideographs); the line makes room for
          them outside its spacing, a quarter of the text's single line height above it or below it for the dot below
          (docx/local/emr-*: Calibri 11, 16 and 24 pt lines 3.36, 4.92 and 7.32 pt lower, the line after an underDot
          one as much lower, at single and 1.15 spacing, modes 12 and 15; Times New Roman 11 3.12; em 69.1 → 93.4 %).
          Two lines in one (w:eastAsianLayout w:combine): the
          text's halves in half size above one another, between full-size brackets (docx/local/ruby). Text across the
          line (w:eastAsianLayout w:vert, horizontal in vertical text) is a little line of its own turned a quarter
          counterclockwise against its line, in any text direction (horizontal text too): along the line it takes the
          height of a line across it (a vertical line's in horizontal text, a horizontal one's in vertical text), its
          baseline that line's ascent from where it begins; across the line it is centered on the middle of its font's
          win ascent and descent and makes the line as thick as it is long; w:vertCompress changes nothing in Word's
          printout (docx/local/vertical, vertical2, vertical3: Yu Mincho, MS Mincho, Meiryo, 2 to 6 digits, lines
          within 0.1 to 0.3 pt).

      - id: run.textEffects
        title: Text effects (Word 2010)
        description: Glow, shadow, reflection, outline, gradient fill and 3D formats on text.
        elements: [w14:glow, w14:shadow, w14:reflection, w14:textOutline, w14:textFill, w14:scene3d, w14:props3d,
                   w14:alpha, w14:bevel, w14:bevelB, w14:bevelT, w14:camera, w14:contourClr, w14:extrusionClr,
                   w14:fillToRect, w14:gradFill, w14:gs, w14:gsLst, w14:hueMod, w14:lightRig, w14:lin, w14:lum,
                   w14:lumMod, w14:lumOff, w14:miter, w14:noFill, w14:path, w14:prstDash, w14:rot, w14:round,
                   w14:sat, w14:satMod, w14:satOff, w14:schemeClr, w14:shade, w14:solidFill, w14:srgbClr, w14:tint]
        priority: P1
        difficulty: 3
        status: done
        strategy: >-
          Word's copy of the DrawingML text effects in the w14 namespace; map them onto the shared effect renderer
          (pptx `text.fillOutline`, `text.effects` and `text.threeD`, done).
        office: >-
          w14:glow, w14:shadow and w14:reflection are drawn by the effect filter shared with PowerPoint (sized with
          the font; text reflects about its baseline; glow and shadow behind a copy of the text, the text unfiltered,
          since a filtered group prints as a picture: LibreOffice's extras-ooxmlexport/tdf166325_scheme_color 88.4 →
          93.9 % emulated), w14:textOutline as a stroke, w14:textFill as a solid, gradient
          or no fill. A color's w14:alpha is its transparency, not its opacity as a:alpha (docx/local/w14alpha,
          w14shadow: fills, outlines and shadows of w14:alpha 20000, 50000 and 80000 print at 80, 50 and 20 % opacity;
          docx/external/libreoffice/writerfilter-dmapper/tdf152884_Char_Transparency 11.3 → 100 %,
          semi-transparent-text 73.3 → 100 %). The line makes room for the effects outside its spacing: a glow 0.778
          of its radius, a shadow 1.046 of its blur plus or minus its vertical offset, both at (size / 78)^0.695, a
          reflection size × (0.944 end − 0.21) and 0.0566 size per point of its distance (docx/local/text-effects*,
          Arial 12 to 96 pt, lines within 0.3 pt; docx/generated/shapes-effects 99.1 %). 3D text (w14:props3d with a
          bevel, depth or contour, w14:scene3d) Word draws as pictures of its lit glyphs; here it is PowerPoint's 3D
          text (pptx text.threeD) in the run's place, its baseline on the run's, under the run's light rig and always
          facing the viewer (a perspective camera draws as the front view in Word too); the glyphs' counters are holes
          the bevel runs into (docx/local/text-3d: bevels, depth with a contour, metal, perspective, 78 %). A gradient
          outline spans the piece as its fill does (docx/external/libreoffice/extras-ooxmlexport/tdf80526_word_wrap
          93.9 → 97.3 %). A dashed outline repeats its pattern in units of its exact width (docx/local/wae-text: 2 pt
          dashed 8:6 pt). Known deviation: double compound outlines and their dashes (TextEffects_TextOutline 63.9 →
          53.8 % once its gradient lies on the text); the browser starts a dashed outline where the font's contours
          start, Word at each contour's topmost point (docx/local/wae-text; WordArt's are drawn as Word's, see
          drawing.textBoxes). Known deviations: Word's bevels are smoother at sharp corners
          and lit somewhat differently; a document draws its first 400 characters of 12 pt (fewer of larger ones) of
          3D text as bodies, the rest flat, as each 48 pt character takes 85 to 420 KB of markup
          (docx/external/libreoffice/writerfilter-dmapper/fdo78333-1-minimized: a page of it ran out of memory).

      - id: run.openType
        title: OpenType features
        elements: [w14:ligatures, w14:numForm, w14:numSpacing, w14:stylisticSets, w14:styleSet, w14:cntxtAlts]
        priority: P2
        difficulty: 3
        status: done
        strategy: >-
          OpenType features of the shaper (HarfBuzz, as in pptx `text.runs`): liga, clig, hlig and dlig by the ligature
          setting, lnum or onum, pnum or tnum, ss01 to ss20 and calt.
        office: >-
          The run's OpenType features go to the shaper and to the browser: liga and clig by w14:ligatures (standard),
          calt by w14:ligatures (contextual) or w14:cntxtAlts, hlig and dlig, lnum or onum by w14:numForm, pnum or
          tnum by w14:numSpacing, ss01 to ss20 by w14:stylisticSets (docx/local/opentype: all 63 lines within 0.1 pt,
          every glyph Word's, Gabriola's contextual swashes included). The browser shapes every character that has a
          position of its own alone, so words with ligatures or contextual glyphs reach it whole with dx shifts, the
          other words keep the position of every character. Arabic script takes the font's own kerning, ligatures and
          contextual forms whatever w:kern and w14:ligatures say (Persian in Traditional Arabic is as wide as shaped
          with them, with w:kern and without, 445 against 465 pt over 34 words, "تم" in its ligature; the Latin
          letters of a w:rtl run stay unkerned: docx/local/csfeat-a, -b, -d), and its letters do not join across a
          bidirectional control, which ends Word's shaping run (Persian words with a right-to-left mark after their
          prefix, 29 of 30 as wide as shaped apart). The browser, which shapes right-to-left text whole, does the same.
          docx/external/libreoffice/extras-uiwriter/tdf104649 and powertools/RP/RP051-Arabic then break 95 % of their
          lines as Word does (65 and 54 % before). Across runs a word's letters join as their joining types say: a
          right-joining letter (alef, dal, reh, waw …) or hamza ends the joining, the next run's first letter taking
          its initial or isolated form (extras-ooxmlimport/tdf87533_bidi 89.2 → 93.4 %, found by agent BI).

      - id: run.animated
        title: Animated text
        elements: [w:effect]
        priority: P3
        difficulty: 1
        status: done
        strategy: Screen-only effects of old Word versions (blinking, marching ants); not printed.
        office: >-
          Animated text (w:effect) prints as plain text, as in Word (docx/local/misc-nothing).

  - id: paragraph
    title: Paragraphs
    features:
      - id: paragraph.basic
        title: Paragraphs, alignment and indentation
        elements: [w:p, w:pPr, w:pStyle, w:jc, w:ind, w:mirrorIndents]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Left, right, first-line and hanging indents (mirrored on even pages with w:mirrorIndents); alignment left,
          center, right, justified, distributed and the Arabic kashida variants.
        office: >-
          Indents in characters (w:leftChars, w:rightChars, w:firstLineChars, w:hangingChars, hundredths of a
          character) count over those in twips: a first-line or hanging indent in characters of the paragraph's first
          run, its size and its character spacing, the spacing twice where w:balanceSingleByteDoubleByteWidth is on
          (docx/local/chu2-*: 14 pt runs in a 10.5 pt style indented 28 pt by 200, 29.2 pt with 0.6 pt spacing, 30.4 pt
          balanced, the mark's size counting for nothing; extras-ooxmlexport/tdf131594 80.9 → 98.7 %),
          a left or right one in characters of the Normal style's, the left one where the first line begins, so the
          left edge lies the hanging indent further in; a hanging indent in characters makes the left one count in
          characters too; 0 leaves the twips (docx/local/chu-15, chu-14: of 22 pt text under 10.5 pt Normal leftChars
          200 puts the first line 21 pt in and the rest the style's hanging of 72 pt further, hangingChars 100 hangs
          22 pt from a left of 0, firstLineChars 200 indents 44 pt, every line within a dot;
          docx/external/libreoffice/extras-ooxmlexport/tdf167721_chUnits 50.7 → 99.95 %); in a style 0 characters
          without twips beside them make that indent 0 over its base styles', in direct formatting they keep the
          inherited twips (docx/local/chi-15, chi-14: leftChars 0 on a base style's left of 2880 begins the lines at the
          margin, firstLineChars or hangingChars 0 drop a base style's hanging; tdf167721_chUnits2 49.4 → 99.95 %,
          _chUnits3 51.7 → 99.95 %). Justified lines may squeeze the spaces
          between their words to take one more word: where the spaces shrink
          less than half as much as the spaces of the line without the word would stretch, and by less than a quarter
          (docx/local/compress3: 225 lines of random words alike; compress, compress2: a Russian line taken at 23.6 %,
          not at 25.9 %; jc-compress: ten Courier New words fit a column 12 pt narrower than they are, not 13 pt);
          left, centered and right aligned lines take no word that does not fit (docx/local/jc-left). Centered and
          right aligned lines are laid out as left aligned, tabs and list numbers with them, and move as a whole by
          the room left before the paragraph's own right edge, also where a stop took the line past it
          (docx/local/numcenter: "a", a tab and "b" centered, a number with its tab, every line within 0.1 pt;
          tdf135774_numberingShading 9.8 to 99.9 %, tdf95213 57.2 to 95.3 %; DA034-HeaderFooter: a centered footer
          whose right tab takes its text past the margin stays put). The last line of a justified paragraph keeps its
          natural spacing unless it was squeezed. Mirrored indents (w:mirrorIndents) trade the left and right indent
          on pages with even numbers, the lines breaking as on odd pages (docx/local/mirror: every line as in Word).
          Medium and high kashida justification lengthen every Arabic word by two or three kashidas at one joining
          place, chosen by the Arabic justification priorities (after seen or sad, before a final teh marbuta, heh or
          dal, before a final alef, tah, lam or kaf, before a medial beh, before a final waw, ain, qaf or feh, before
          another final letter), and justify with them (docx/local/kashida). Left-to-right paragraphs with kashida
          justification break their lines on 0.9 (medium) or 0.8 (high) of the measure, their spaces not squeezed, and
          stretch them over the whole, low as justified ones (docx/local/ksh-*: English paragraphs in Calibri and Times
          New Roman at 11 to 20 pt, 200 and 451 pt wide, indented, in modes 14 and 15, every line breaking as in Word;
          LibreOffice's extras-ooxmlexport/tdf155707 70.4 → 82.4 %); where their text is kerned or takes ligatures
          they leave the lines as they broke, flush left, low kashida justification too before Word 2013
          (docx/local/kss-*: the same paragraph with w:kern 2 or w14:ligatures standardContextual in modes 14 and 15,
          lowKashida justified in mode 15 only; kss-o: enableOpenTypeFeatures alone stretches; tdf155707 82.4 → 85.9
          %, page 1 92.3 %). Spaces at a line's end trail it over runs
          of other formatting too, as far back as the runs hold nothing but spaces
          (docx/external/libreoffice/extras-uiwriter/MsWordCompTrailingBlanks: centered and right aligned "TEST"
          before spaces in runs of several shadings, 43.8 → 100 %). Known deviations: low kashida justification widens
          spaces where Word inserts single kashidas; lines with kashidas break up to a word differently.

      - id: paragraph.spacing
        title: Line and paragraph spacing
        elements: [w:spacing, w:contextualSpacing]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Line spacing auto (multiples of the font's single line height), exact and at least; spacing before and
          after, auto spacing of HTML paragraphs, contextual spacing between paragraphs of the same style. How Word
          derives single line height from the font tables is measured, not assumed. The space above a paragraph comes
          from one rule: all of the space between it and the paragraph above within a column, at a column's top what
          the way the column began leaves of it, and whether a break dropped it there.
        office: >-
          A single line is the font's hhea ascender, descender and line gap; the baseline lies the larger of the line
          gaps (hhea against OS/2 win, as DirectWrite does; OS/2 typo metrics where USE_TYPO_METRICS is set) plus the
          ascent below the line's top. Fonts for East Asian code pages (OS/2 ulCodePageRange1 bits 17 to 21) are 1.3
          times their win ascent and descent high, the extra half above and half below, their line gap ignored
          (docx/local/ea-lines: MS Gothic, MS Mincho, Yu Gothic, SimSun, Malgun Gothic, Microsoft YaHei). Auto spacing
          multiplies the line and puts the extra below the text; below single spacing the line loses its share above
          the baseline and below it alike (docx/local/linemult-120 to -192, in modes 12, 14 and 15: Arial, Times New
          Roman, Calibri, Cambria and Traditional Arabic at 0.5 to 0.8 within 0.13 pt; negative values do not count),
          exact spacing puts the baseline at 80 % of the height whatever the font, at least spacing puts the extra
          above (measured with 14 fonts, docx/local/lm-*). The space between paragraphs is the larger of the space
          after the one and before the next (docx/generated/text- basic, as ISO/IEC 29500 17.3.1.33 says); contextual
          spacing drops both between paragraphs of the same style. HTML auto spacing (14 pt) in table cells lies
          between a cell's blocks, after a nested table too, none at the cell's top or bottom
          (docx/local/autospace-cells-15, -14). A negative w:line is its size: exactly under auto, at least or without
          a rule, at least under exact (docx/local/nls-auto, -none, -least, -exact: -360 lines 18 pt apart;
          docx/external/libreoffice/extras-ooxmlexport/tdf125469_singleSpacing 41.1 → 91.4 %, tdf108682 100 %). HTML
          auto spacing keeps the last list item's space after above a table, whatever the table's first paragraph is,
          and the space before of the first item after a table whose last paragraph is an item of its list (Word's
          PDF of docx/external/libreoffice/extras-ooxmlexport/tdf132807: 14 pt, 83.9 → 98.2 %), and at a cell's end a list item keeps it where other paragraphs have none (docx/local/acl-list, acl-other,
          acl-mixed, acl-14: numbered items 14 pt above the table and above the cell's bottom line;
          docx/external/libreoffice/extras-ooxmlexport/tdf132802 64.7 → 95.7 %, tdf106690-cell 63.8 → 100 %,
          tdf119188_list_margin_in_cell 79.0 → 99.6 %); items of one abstract numbering definition count as one list
          whatever instance numbers them, items of two definitions not (acl2-two, acl2-direct, acl2-bullet; tdf133052,
          tdf133363 70.5 → 96.3 %). An empty paragraph's raised or lowered mark (w:vertAlign) takes the line of its
          unscaled size (docx/external/libreoffice/core-text/empty-superscript: a superscript 10 pt mark 12.2 pt high,
          65.8 → 97.9 %). An empty paragraph whose mark is raised or lowered (w:position, also from a table style)
          moves its line as such text does, a superscript or subscript mark not
          (docx/external/powertools/HC061-Hyperlink-in-Field: empty cells as high as those with text).

      - id: paragraph.pagination
        title: Keep with next, keep lines together, widow control, page break before
        elements: [w:keepNext, w:keepLines, w:widowControl, w:pageBreakBefore]
        priority: P0
        difficulty: 4
        status: done
        strategy: Constraints for the page breaker (engine.pagination).
        office: >-
          At the top of a page the space before is kept on the document's first page, after a section break only what
          it has more than the space after the section's last paragraph, and dropped after page and column breaks,
          page break before and natural breaks (docx/local/sp-pagetop); before Word 2013 a page break before keeps
          what it has more than the space after the paragraph before (docx/local/sptm-11, -12, -14; sbk-*: 14 pt,
          also beforeAutospacing, after 0, 6 and 20 pt keep 14, 8 and 0 in modes 11, 12 and 14; python-docx/
          sty-known-styles 33.3 → 100 % of the lines; LibreOffice's extras-ooxmlexport/fdo81492). The extra space of
          auto line spacing below the last line may hang past the bottom margin (a line whose text ends 0.4 pt above
          the margin stays, docx/generated/headers-footers). Keep with next, keep lines together and widow control
          move whole paragraphs or two lines (docx/generated/breaks). A paragraph that does not fit and cannot break
          where it stands (a line or two, too few lines for widow control, its lines kept together) takes the
          paragraphs kept with it before it to the next page, back to one that can break and give its last lines or
          one that is not kept with the next; reaching the top of the page, they stay and the chain breaks where it
          must. So a chain begun below other text moves to the next page even when it is taller than a page, and lines
          kept together move although they need more than a page (docx/local/kc1 … kc12). The columns of a section
          that begins below other text count as below other text: a chain that does not fit moves on column by column,
          to the next page (docx/local/kcs-2-*, kcs-3-*). A first line that ends in a page or column break needs no
          second line with it, a paragraph that ends with one ends its chain (docx/external/libreoffice/
          extras-ooxmlexport/testPageref: a page break kept with the next paragraph through its style makes no empty
          page); an empty paragraph that holds a continuous section break and takes no room ends a chain too, as one
          that always fits (docx/local/keepsect-k1 to -k4: a heading kept with it stays at the bottom of the page,
          with "x" in the paragraph or without the break it goes on), and a line of nothing but such a break stays on
          its page, past the bottom too (docx/external/libreoffice/extras-ooxmlexport/FDO77715: no empty pages before
          headings that begin with a column break). Tables take part: a row whose first cell's first paragraph is kept
          with the next one carries the chain on to the next row or block and does not break for it, its other cells
          and paragraphs do not count; the first row of the chain that is not kept needs only to begin on the page,
          all of it where it may not split (or has a height at least that does not fit), so a paragraph kept with a
          table goes along with a first row that cannot begin below it. A chain that begins at a row inside a table
          moves to the next column or page the same way (docx/local/tk1 … tk13, tkr-a … tkr-h;
          docx/external/libreoffice/extras-ooxmlexport/ tdf104061_tableSectionColumns: a heading row goes on with a
          row of 173 pt at least). A table whose first cell begins with a paragraph that breaks the page before it
          (its own w:pageBreakBefore or its style's) begins on a new page, unless the page is still empty
          (docx/external/libreoffice/extras-ooxmlexport/tdf89377_tableWithBreakBeforeParaStyle: two tables on pages of
          their own, 33.3 → 91.3 %).

      - id: paragraph.borders
        title: Paragraph borders and shading
        elements: [w:pBdr, w:top, w:bottom, w:left, w:right, w:between, w:bar, w:shd]
        priority: P1
        difficulty: 3
        status: done
        strategy: >-
          Consecutive paragraphs with identical borders share one box with w:between lines; borders sit outside the
          text by their w:space. Shading fills the box, patterns included.
        office: >-
          Paragraphs with the same borders and indents form one box, whatever their shading (docx/local/bordergroup-*;
          without borders the same shading): the top line above the first, the bottom line below the last, the between
          line between them with its space above and below it; each line and its space take room in the paragraph, the
          space before and after lie outside the box. The shading reaches 1.4 pt left and 1.55 pt right of the text
          (vertically just its lines), the side lines stand their space outside it (measured with docx/local/pbdr, all
          lines within 0.15 pt); the text's left edge is the first line's where it hangs, its number's too, and
          paragraphs of the same left indent but other first lines have boxes of their own (docx/local/pbh-*: hanging
          360 to 1080 twips, numbered, borders and shading alone, modes 14 and 15, within 0.05 pt; poi/52288,
          checkboxes, libreoffice/extras-ooxmlexport/tdf153964_numberingAfterBreak14). Double and thin-and-thick lines
          are drawn in their strokes as table borders are (a thin-thick top line 3 pt above 0.75 pt,
          docx/external/poi/FancyFoot); headers and footers draw their paragraphs' borders and shading too, and table
          cells and text boxes, where the lines take room alike (docx/external/libreoffice/extras-layout/fdo48718-1:
          bordered paragraphs in a cell, the rows below 3 pt lower each). A line of w:sz 0 is as thin as one of 1,
          0.12 pt in Word's print (docx/local/bsz-para: boxes of sizes 0, 1, 2, 4 and 8 drawn 0.12, 0.12, 0.24, 0.48
          and 0.96 pt wide). Shadowed lines (w:shadow) cast black bands of their width as page borders do: right of
          the right line from below the top line down through the bottom band, below the bottom line from inside the
          left line to the right band's edge; a shadowed top line keeps its width free above the box, a shadowed
          bottom line's band takes room below it, the left and right ones none (docx/local/psh-*: 3 and 1 pt lines on
          all sides, the top, bottom or right alone, around one or two paragraphs, all 100 %;
          docx/external/libreoffice/extras-ooxmlexport/para-shadow 31.7 → 100 %). Beside floating objects a line's
          shading covers only its segments, from 1.4 pt before a start the object cuts to 1.55 pt after a cut end,
          behind the text wrapped tight as well (docx/local/psl-square, psl-behind;
          docx/external/libreoffice/extras-ooxmlimport/tdf60351 51.3 → 99.2 %); a line pushed below floating objects
          is shaded from its top, the room it skipped white, a first line's as well, also where the paragraph goes on
          with the shading of the one before it at a page's top (docx/local/psk-15, psk-14: a yellow paragraph below a
          rectangle wrapped top and bottom, the third of nine lines below one; bwr-15-*-sql-100 39.8 → 100 %, ub-1
          to ub-7 92.2 to 98.0 → 100 %, tv-3 96.2 → 100 %). A box that goes on in the next column or page is drawn
          in both parts, without the bottom line in the first and without the top line in the next,
          whether the page's end, a column's or a page or column break breaks it (docx/local/bsp-nat-15, -14,
          bsp-col-15, bsp-pbr-*, bsp-cbr-*: 3 pt lines, 30 pt before and 8 pt after, 98.2 to 100 %). In a box of
          several paragraphs each one's shading reaches its space after and the next one's begins below it (bsp2-gap:
          8 pt of yellow below "A", the 22 pt more before "B" blue); a paragraph that goes on with the box at the top
          of another column or page has no top line there, its shading reaching the space before it dropped above the
          column (bsp-end-*, bsp2-flow, bsp2-flowc: "B" at the top margin, shaded from 22 pt above it). A paragraph's
          first line that holds only a page or column break is shaded as a paragraph without borders is, below the box
          before, which closes there, and its space after, without a space before of its own; the rest of the
          paragraph opens a box of its own (bsp-lead-*, bsp-only-*;
          docx/external/libreoffice/extras-ooxmlexport/tdf153964_firstIndentAfterBreak14 81.6 → 99.5 %,
          tdf153964_numberingAfterBreak14 78.7 → 99.3 %, tdf153964_topMarginAfterBreak14, -15 48.3 → 99.0 %;
          extras-ooxmlimport/n820504 44.8 → 89.7 %). The shading lies between the top and the bottom line, the gap of
          a double line white (bsp2-other). A paragraph whose first line goes below a floating object takes its top
          border along, the box beginning below the object (docx/external/libreoffice/core-ooxml-pass/tdf108272: a
          bordered heading below a header's floating table, its top line at the table's bottom). At least spacing's
          extra above a bordered paragraph's first line goes above its top border (docx/local/abx-*: space 6 over 8.5
          pt Verdana at least 12 and 24 pt, the line 1.68 and 13.68 pt lower; exact and auto lines keep the border at
          the top; docx/external/powertools/DB-HeadersFooters-Dest/Fax (content control)).

      - id: paragraph.tabs
        title: Tab stops
        elements: [w:tabs, w:tab, w:ptab, w:defaultTabStop, w:decimalSymbol]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Left, center, right, decimal and bar tabs with leaders, cleared style tabs, default tab interval;
          absolute position tabs (w:ptab) relative to the margins or indents.
        office: >-
          Leaders repeat their character at its advance rounded to Word's 600 dpi device (dots of Aptos 12 pt every
          3.48 pt), on a grid from the page's left edge, every one that fits between the tab's start and end, both
          counted in whole dots before the PDF's growth moves them (LibreOffice's extras-ooxmlexport/
          tdf137335_whitespaceLineHeight: dots of 9 pt from 72 pt, not from 81, 81.6 → 92.8 %; docx/generated/tabs:
          the last of 93 hyphens ends where the tab does, 0.01 pt behind it; 63 documents with leaders checked). Bold
          of a font without a bold face steps one dot further and strokes its characters as its text (docx/local/sbl-a,
          sbl-b: Lucida Sans Unicode and Lucida Console bold from 8 to 36 pt, dots, hyphens, underscores and middle
          dots; extras-ooxmlexport/testPageref, style-inheritance, fdo69649: 135 to 163 dots a line as Word's, not
          140 to 141). Bar tabs
          draw a line through the line and the space after the paragraph. Decimal stops align on the decimal separator
          of the regional settings Word runs with, whatever w:decimalSymbol or the text's language say (docx/local/
          dect-*: with a German comma "1,234.5" aligns on its comma, "1.5" and "12.5" end at the stop, within 0.07 pt;
          powertools/HC024, HC025). A custom stop at or past the right indent holds: from Word 2013 on where it is not
          past the column's or the cell's edge, the rest of the line then reaching up to that edge and justified to it
          where it wraps (not where it ends in a line break, docx/local/jz-a to jz-d), the line not breaking next to
          such tabs (a word that does not fit after them breaks inside where it has no other place); before Word 2013
          also past the edge, the line then reaching 22 in into the column (docx/local/tov-a to tov-i, tovc-1 to
          tovc-12, tv-a to tv-d in modes 15, 14 and 12; docx/external/libreoffice/extras-ooxmlexport/tdf77417,
          extras-ooxmlimport/ tdf156078_rightTabOutsideParaRightIndent). Default stops past the indent do not hold,
          except on a line an earlier stop took further. From Word 2013 on a left stop past the column's edge moves
          the tab to the next line, where it fills the line; centered, right and decimal stops past it align at the
          indent, or at the edge where an earlier stop took the line there (docx/generated/tabs, docx/local/tab-rules,
          tab-break), also after a space at the paragraph's start (docx/local/lke-sp: " " alone on the first line of a
          box 15.2 pt wide before a tab to 36 pt), not after a tab that filled a line (dts-31680). Centered and decimal
          text that would reach past the line's end ends there (tv-c, tv-d). A tab
          goes to the next line together with the word after it where that word does not fit after it (docx/local/lw-6
          to lw-10; engine.lineLayout). An absolute position tab (w:ptab) aligns what follows it at the left edge, the
          middle or the right edge of the margins or indents, as a stop of that alignment there would
          (docx/external/poi/ThreeColHead, ThreeColFoot: within 0.1 pt). Word keeps the default tab stop
          (w:defaultTabStop) in 16 bits: 65536 twips are none, its tabs going nowhere, 65537 one twip, 66256 half an
          inch (docx/local/dts-0 to dts-66256, all within 0.7 %;
          docx/external/libreoffice/extras-ooxmlexport/tdf168607_tabstopZero 5.7 → 95.9 %); a document without
          settings takes the stop of Word's own Normal template, 708 twips in the German Word the references come from
          (LibreOffice's extras-ooxmlimport/xml_space: 14 → 88 % of the characters within half a dot); spaces a tab follows do
          not trail a line for its alignment ("10", a space and tabs of no width centered with the space). An absolute
          position tab whose place lies behind what its line holds before it starts the next line, where it takes the
          text to its place; at its place or before it nothing breaks (docx/local/ptb-la, ptb-li, ptb-cp: left at the
          margin or the indent after "A", centered after text past the middle; ptb-l0, ptb-l0i, ptb-lr, ptb-anchor: at
          the line's start; docx/external/libreoffice/writerfilter-dmapper/ptab: after a space, the page number a line
          lower, 33.2 → 92.3 %). In a table cell a decimal tab stop aligns a paragraph without tabs at its decimal
          point, as if a tab began it (docx/external/libreoffice/extras-odfexport/table_number_format_3: numbers at a
          stop of 1884 twips without tab characters, 75.5 → 98.4 %).

      - id: paragraph.frames
        title: Text frames and drop caps
        elements: [w:framePr, w:suppressOverlap]
        priority: P2
        difficulty: 4
        status: done
        strategy: >-
          Paragraphs with w:framePr are positioned like floating objects and text wraps around them; drop caps are
          frames of one large letter spanning w:lines lines.
        office: >-
          Consecutive paragraphs with the same w:framePr form a frame that takes no room in the text: w:w wide or as
          wide as its content, at w:x or aligned (w:xAlign) in its column, the margin or the page, w:y below the next
          paragraph's top, the margin or the page, its first paragraph's space before inside it above its lines
          (docx/local/fb-*: 6 and 12 pt before take its text and the text below it as much lower; fdo78904_fileHang);
          the paragraphs' borders frame it, all the way down where w:h makes it higher than its content, its last
          paragraph's space after inside them (docx/external/libreoffice/extras-ooxmlexport/tdf131420, tdf133702,
          tdf133924: within 0.1 pt), paragraphs of other borders or shading in boxes of their own, the last one reaching
          down (extras-ooxmlexport/tdf154703_framePr 88.1 → 100 %); text wraps around it with its borders, w:hSpace and w:vSpace kept free (not
          beside it with notBeside, over it with none). A drop cap is a frame of its letter at the start of the next
          paragraph, whose lines go around it; a margin drop cap stands left of the column (docx/local/frames: every
          line as in Word). Its first line starts at the cap's room or at its own start, whichever is further, a
          first-line indent past the room; before Word 2013 a first line indented or hanging moves by the room's whole
          width instead (docx/local/dcn-*: text unindented, at left 36 pt, numbered or hanging 18 pt at left 36 or
          72 pt, indented 18 pt first, beside caps of three and four lines, every line within 0.12 pt;
          extras-ooxmlexport/tdf109308_dropCapNumbered). Frames in headers and footers stand alike, taking no room in their story
          (docx/external/libreoffice/extras-ooxmlexport/tdf168017: a page number framed centered 1 twip below the next
          paragraph's top stands on that paragraph's line). A paragraph's w:framePr overrides its style's attribute by
          attribute (special_styles), w:x and w:xAlign as one position and w:y and w:yAlign as another
          (docx/local/framepos: a paragraph's w:x of the page, 0 too, over its style's xAlign right of the margin;
          tdf112446_frameStyle), one without any w: attribute makes no frame (docx/local/fe-5, fg-7; tdf133457). w:y
          and w:yAlign count from the margin without w:vAnchor (fd-1, fd-3, fd-5), a w:y outweighing a w:yAlign
          beside it (fya-14, fya-15: yAlign center with w:y 10 stands 0.5 pt below the margin or the page, without w:y
          on the margin's middle; tdf157572_defaultVAnchor), as a w:x, 0 too, outweighs a w:xAlign (docx/local/fxa-a,
          -b, -f: x 720 and xAlign center in either order 36 pt from the column, x 0 at the margin, in modes 14 and 15);
          a frame without a vertical position (w:y 0, whatever w:yAlign beside it says, or no w:y and no w:yAlign or
          inline) stands at its paragraph before mode 15 whatever its anchor and on its anchor's top from mode 15
          (ff-*, fg-*, fh-*, fxa-c, -d: y 0 and yAlign bottom; core-ooxml-pass/fdo81491; extras-ooxmlexport/tdf112287B
          52.0 → 100 %). The body's text goes around frames standing on the page, also
          lines above them and around those of headers (special_styles: an envelope address at the page's bottom;
          fh-1), and around the frames of headers and footers standing with their text as far as they reach below
          them, the header ending where its text does and its own text going over them (docx/local/hfr-*, hfs-*: the
          body's first four lines at the top margin beside a header's frame 72 pt high from 51.3 pt down, one 20 pt
          high above the margin leaving them; openxml-sdk/complex0: a table on page 4 below such a frame, the header's
          picture and rule over it, 63.9 → 99.3 %, the text on page 7 beside it), what they keep free wholly above or
          below the body's text leaving it alone (docx/external/libreoffice/core-ooxml-pass/fdo78904_fileHang: a
          footer's page number framed below the body leaves the line breaks of the paragraph ending the page). Before
          Word 2013 the room beside a frame takes text only where it is an inch wide, counted as if the frame stood a
          twip further left (frw-*, frx-*, fry-*: 1441 twips between the left margin and a frame's hSpace take text,
          1440 not, 1439 between its hSpace and the right margin, 1438 not, whatever the frame's width, its hSpace and
          the margins, in modes 12 and 14; hfs-12-*: beside the frames of headers too), from Word 2013 on any room its
          line's first word fits in (hfs-15-*: "The body" in 62.65 pt left of a frame). Lines above a frame standing
          with the text that it reaches with its w:vSpace go below it (notBeside),
          the frame keeping its place, and a next frame follows them (fi-2, fi-3, fj-2; tdf105035_framePrB: a title
          and an author line framed with vSpace 187; tdf164500_framePrBeforeTable); the last paragraph's space after
          stands in the frame (fk-*). Before mode 15 Word draws a frame's inline shapes and groups (VML and DrawingML,
          not pictures) at the frame's left edge and as far below the page's top as the frame stands below where its
          paragraph would stand in the text, wherever they stand in its lines, the text where it belongs
          (docx/local/framepg-*, frin-*, frio-*: a rectangle after "Framed " in a frame at page y 49.8 pt, the first
          paragraph below a top margin of 27 pt, at 22.75 pt, after a 13.8 pt line at 8.95 pt, in a frame without a
          position at the page's top; FDO78590, Tdf147485: a letterhead logo 27 pt above its frame, within 0.05 pt). A
          frame without w:w is as wide as its paragraph, an empty one as its mark (Calibri 11's 6.4 pt ¶), one of
          several paragraphs as its column; its borders go down past the last paragraph's space after
          (docx/external/libreoffice/extras-layout/tdf124423: two empty paragraphs framed across the column 48.4 pt
          high with their 8 pt after each; tdf135035: a column of three; poi/checkboxes; frame-wrap-auto). A frame
          standing with the text (w:vAnchor text) is placed by w:y alone, its w:yAlign unseen
          (docx/external/libreoffice/extras-ooxmlexport/tdf157572_insidiousCombination: a frame of yAlign bottom below
          its paragraph's top, 37.3 → 100 %; tdf157572_noVAlignAsText 58.2 → 100 %). A frame whose first paragraph
          breaks the page before it, by its own w:pageBreakBefore or its style's, stands on the next page unless the
          page is still empty (docx/external/libreoffice/writerfilter-dmapper/framepr-pagebreak-style: a framed
          Heading 1 on page 2, 45.3 → 96.7 %). A frame of a given height whose paragraph runs its text down
          (w:textDirection tbRl) or up (btLr) lays it out along that height, turned a quarter: its first line at the
          right running down from the top, or at the left running up from the bottom
          (docx/external/libreoffice/writerfilter-dmapper/frame-direction: frames 44.35 pt wide and 820 pt high, 45.9
          → 72.8 %; extras-ooxmlexport/tdf154703_framePrTextDirection 57.4 → 70.7 %), its lines as a turned text box's:
          vertical lines on Word's device from the frame's edges (drawing.textBoxes; tdf154703_framePrTextDirection: a
          tbRl frame's 12 pt line from the right edge's dot before it, its baseline 12/64 pt deeper, 70.7 → 100 %);
          its paragraphs' borders frame it turned, across its width and 3.13 pt past both its ends as side borders
          stand out, each paragraph's shading across its own lines from the border at their end to 2.52 pt before its
          first glyph, an empty centered paragraph's mark in the middle (extras-ooxmlexport/fdo76979: a btLr header
          frame 42.55 by 85.05 pt, 72.1 → 99.7 %). In vertical lines the curly quotation marks take a whole em
          (docx/local/vqt-*: ‘ ’ “ ” 18 pt wide at 18 pt in tbRl and btLr frames and vert, vert270 and eaVert boxes,
          3.94 to 7.11 pt across; the ellipsis, the middle dot and the apostrophe keep their widths; frame-direction
          "King’s", 78.6 → 95.2 %). A framed paragraph's floating
          drawings are placed from it in the frame as in the text
          (docx/external/libreoffice/extras-ooxmlexport/tdf90789, tdf90789-2: a page-relative VML rectangle in a
          framed paragraph, 52.7 → 97.1 % and 65.0 → 98.4 %). A frame of one paragraph without a width is as wide as
          its text, at most its column (docx/external/libreoffice/extras-layout/tdf135035: a frame in a column 127.6
          pt wide in four lines, 71.1 → 99.3 %). Before Word 2013 a paragraph whose floating table reaches beside its
          first line has that line below the page frames over the column's edges it meets, wrapped around or not
          (docx/local/fwa-*-14: a frame over the right or the left margin, a table 28.8 pt below the paragraph's top,
          the 36 pt line below the frame; without the table, with the table below the line, with the frame inside the
          column, and in mode 15 beside it; LibreOffice's extras-ooxmlexport/tdf164500_framePrBeforeTable2 57.9 → 98.5
          %). Known deviations: Word draws frame-direction's KingsBureauGrot ThreeSeven, a font this machine lacks, in
          Franklin Gothic Medium, here in Calibri; Word keeps a footer's frame standing with its text that would reach
          below the page's bottom edge on the page, ours lets it reach below (docx/local/hfr-ftr: a frame 72 pt high
          1.5 pt below the footer's last paragraph ends at the page's edge).

      - id: paragraph.eastAsian
        title: East Asian line breaking and character grid
        elements: [w:kinsoku, w:wordWrap, w:overflowPunct, w:topLinePunct, w:autoSpaceDE, w:autoSpaceDN,
                   w:textAlignment, w:snapToGrid, w:adjustRightInd, w:characterSpacingControl, w:noLineBreaksAfter,
                   w:noLineBreaksBefore, w:strictFirstAndLastChars, w:noPunctuationKerning]
        priority: P1
