      - id: table.borders
        title: Table and cell borders and shading
        elements: [w:tblBorders, w:tcBorders, w:insideH, w:insideV, w:tl2br, w:tr2bl, w:top, w:bottom, w:left, w:right,
                   w:start, w:end, w:shd]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Conflicting borders of adjacent cells are resolved by the rules of ISO/IEC 29500 17.4.66 (weight, style,
          color); with cell spacing every cell keeps its own border. Diagonal borders, shading patterns.
        office: >-
          Every vertical line is centered on its grid line (moved right by half the table's left border); text starts
          the larger of the margin and half the line after it, below the whole top line and the top margin (a 3 pt
          inside line of a table with 0.5 pt outside lines is centered 0.25 pt right of its grid line; docx/local/tbl-
          geom). Where two cells meet each side brings its own border, else the table's, nothing where it is nil or
          none, so the other side's line shows and takes its room (docx/local/nilborder-*, rowborder-*: 21 cases
          within 0.1 pt); a line between rows that only the cells above bring with their bottom borders lies in the
          row's top margin and takes room only as far as it is wider (docx/local/cellhlines, cellhlines2: 0.5 pt over
          margins of 2.75 pt none, 3 pt 0.25 pt, 0.5 pt over none 0.5 pt;
          docx/external/libreoffice/core-layout/rtl-table); the two are resolved by MS-OI29500 17.4.66: weight
          (eighths of a point times the style number, dotted and dashed 1), style, darker color, a table's thick
          inside line over a cell's thin own one too; at the table's edge a cell's own border wins over the table's.
          Double lines take three times their width, triple five; thin-and-thick lines lie top to bottom and left to
          right on every side, small gaps and thin lines 0.75 pt, medium ones half the width, large gaps the width
          beside 1.5 pt and 0.75 pt lines (docx/local/tblcompound-24, -12, as page borders); dotted and dashed lines
          are dashed strokes, drawn dash by dash as strokes of their own (the browser's PDF would fill each dash as a
          shape, lighter than Word's stroked dashes; extras-ooxmlexport/tableborder-finedash 69.3 → 81.1 %, tdf61000
          91.7 → 97.7 %); diagonal lines; with cell spacing every cell has its own frame, the cells twice the
          spacing apart, the text after the cell's line and margin, after half the line without a gap (spacing 0);
          before Word 2013 the first cell's text stands at the table's indent, without one the frame's line centred on
          the column's edge, an indent of another type than twips taking the style's away (docx/local/tsl-12, -14,
          -15: spacing 0 and 40 twips, tblInd none, 0 and 720; hk-*s; core-layout/floattable-del-empty 83.6 → 91.1 %,
          extras-htmlexport/fdo62336 91.7 → 99.9 %, extras-ooxmlexport/tdf106724 92.9 → 100 %, tdf140137: tblInd of
          type auto); a fixed table's grid holds the gaps where it has no width of its own (tdf123104), one of a width
          of its own takes them from that width (tsl-* c: 300 pt with 2 pt spacing, cells of 143.9 pt; tblwidth2-14, -15
          95.3 → 100 %), its content aligned vertically as without spacing, a cell merged down framing its rows and
          the gaps between them and counting in the last of them (docx/external/poi/bug57031: a SAS table's two-line
          heading over two header rows of one line), and an autofit table its text fills as wide as the page with all
          frames (docx/external/poi/bib-chernigovka.netdo.ru_download_docs_17459), a cell's border set to nil or none
          taking no room in its column (bug57031: SAS tables whose cells clear their borders inside a 0.75 pt frame
          have columns as wide as their text and margins, the text within a dot of Word's); a part that goes on on
          the next page begins below its frame's top line and the spacing (docx/local/sb-*: 4.5, 2.9 and 1.5 pt),
          and one that moves to the next page whole leaves no frame behind (bib-chernigovka: no zero-height frame at
          page 1's bottom). Shading patterns are mixed to a flat color. A cell line of w:sz 0 is as thin as one of 1
          (docx/local/bsz-cell; docx/external/libreoffice/extras-ooxmlexport/tdf57589_hashColor: hairlines of 0.12 pt
          between its cells). Border colors may be named as shading colors are
          (docx/external/libreoffice/extras-ooxmlexport/tdf132898_extraBorder: darkblue lines, 32.6 → 75.3 %). Shading
          patterns, of cells, paragraphs and runs alike, mix as much of their color over the fill as their 8 × 8 tiles
          cover: stripes and the horizontal cross half, the diagonal cross three quarters, thin stripes a quarter,
          thin crosses 28 of 64 dots (docx/local/shp-patterns: all 37 patterns in Word's print, 100 %;
          docx/external/libreoffice/extras-ooxmlexport/style-pane-format-filter 33.4 → 99.0 %, theme-preservation 34.2
          → 98.7 %). Embossed and engraved lines (threeDEmboss, threeDEngrave) are their width wide with a thin line
          on each side, 0.72 pt beside lines thinner than 3 pt and 1.44 pt beside thicker ones, in room of 0.75 or
          1.5 pt (LibreOffice's extras-ooxmlexport/tdf82177_tblBorders, all_gaps_word: 0.72 pt beside sz 6, 12 and 18,
          1.44 pt beside 24, 36 and 48); top to bottom and left to right on every side embossed light, the line, dark,
          engraved the other way round: automatic and black lines C0C0C0, 606060 and black, others their color and 70
          and 80 of Word's 240 steps of lightness darker, towards white less (docx/local/b3d-*: sz 24 and 8, auto, red
          and eight colors, paragraphs and cells, 87 to 100 %; docx/external/powertools/HC049-Borders 42.4 → 92.9 %,
          libreoffice/extras-ooxmlexport/all_gaps_word, tdf82177_tblBorders). Inset and outset paragraph lines are
          plain (b3d-in, b3d-out). Between rows the inside line stands also where a cell has none above or below it
          (w:gridBefore, w:gridAfter), the top and bottom lines at the table's first and last row only
          (docx/local/gaf-1; extras-ooxmlexport/tdf134609_gridAfter 43.2 → 99.8 %). Each row of a vertical merge takes
          its side lines from its own cell, the merge's bottom line its last row's cell's
          (docx/external/libreoffice/extras-ooxmlexport/tdf132898_extraBorder: a 5 pt right border of the continuing
          cells beside them, 75.3 → 100 %; tdf132898_missingBorder 93.9 → 100 %; tdf129452_excessBorder 95.4 → 100 %).
          Outset and inset borders of a color of their own draw it on their light sides and half of it, each channel
          halved down, on their dark sides (docx/external/tika/testInstrLink: EDEBE9 and 767574; poi/bug59058: C0C0C0
          and 606060).

      - id: table.styles
        title: Table styles and conditional formatting
        elements: [w:tblStyle, w:tblStylePr, w:tblStyleRowBandSize, w:tblStyleColBandSize, w:tblLook, w:cnfStyle,
                   w:defaultTableStyle]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Whole table, banded rows and columns, first and last row and column and the four corner cells, applied in
          Word's order and switched by w:tblLook.
        office: >-
          The table style along its basedOn chain under the table's own properties; conditional formats in Word's
          order (whole table, row bands, column bands, first and last column, first and last row, corner cells, each
          over the ones before; docx/external/libreoffice/extras-ooxmlexport/conditionalstyles-tbllook 26.9 → 100 %),
          switched by w:tblLook, bands skipping the first and last row and column; a conditional format's borders
          apply at its region's edges, its inside lines inside the region; the style's paragraph and run properties
          sit above the document defaults and under the paragraph style (docx/generated/tables), except that where
          the compatibility settings leave w:compatSetting overrideTableStyleFontSizeAndJustification off, a table
          style of its own sets its font size, the document default's where it gives none, over Normal's where Normal
          gives 12 pt and that size is not 10 pt, and its alignment over Normal's left (docx/local/tso-*: a style of
          8 pt and centred over Normal of 12 pt makes text of Normal and of styles based on it without a size 8 pt and
          centred in modes 11, 12 and 14, styles of their own size keep it; Normal of 10, 11 or 14 pt and aligned
          right keeps them; table styles of 9, 11 and 14 pt win, of 10 pt not, tsx-*; tsq-m11, tsr-d10: a style
          without a size over docDefaults of 8 pt sets 8 pt, of 10 pt keeps 12; tsr-none, tsr-normal: no table style
          or the default one keeps Normal's; extras-ooxmlexport/tdf118812_tableStyles-comprehensive 81.6 → 99.7 %,
          tdf90906_colAutoB of 10 pt as before). The settings are read in order: compatibilityMode 15 and later
          switch the option on, each of its own entries sets it, the last one counting (docx/local/tsq-*: 0 after
          mode 15 off as in mode 11, 0 before it on; 1, 1, 0 off and 0, 0, 1 on; w:uiCompat97To2003 changes nothing;
          tso-A-11s1: 1 before mode 11 on; extras-ooxmlexport/tdf118947_tableStyle); the row properties of
          the formats of whole rows (w:trPr) under the row's own, so a first-row format's w:tblHeader repeats the
          first row where w:tblLook asks for first-row formatting (docx/local/hc-1, hc-0; docx/external/libreoffice/
          core-ooxml-pass/fdo78904_fileHang). The first-row format covers the first row and the header rows
          (w:tblHeader) right after it, one region for borders; with it off, bands still skip the header rows from the
          top; the last-row format applies to the last row unless it is a first row, also to a table's only row, the
          last column's alike; w:cnfStyle does not count (docx/local/hdrstyle, hdrstyle2 … 5). Where any flag of
