      - id: vml.ole
        title: Embedded objects and controls
        elements: [w:object, w:objectEmbed, w:objectLink, w:control, w:movie, o:OLEObject, a15:objectPr,
                   a15:signatureLine]
        priority: P1
        difficulty: 3
        status: done
        strategy: >-
          OLE objects, ActiveX controls and signature lines show their preview picture (often EMF or WMF, see
          picture.metafiles), as pptx `picture.ole` (done).
        office: >-
          Embedded objects (w:object) show the picture of their VML shape like any VML picture; so do ActiveX controls
          (w:control): Word prints the picture they store, not the control (docx/local/ole-probe: a check box whose
          stored picture is a red rectangle prints as that rectangle). Signature lines (o:signatureline) Word draws
          itself whatever picture they store, scaled from 256 × 128 pixels to the shape: on white an X in 32 px Arial
          10 px in with its baseline at 68, a line 2 px thick at 75 across the shape, the suggested signer, the
          signer's title and e-mail in 11 px Segoe UI 10 px in, their baselines at 91, 107 and 123 (docx/local/ole-
          sigsizes: 192 × 96, 288 × 144 and 120 × 60 pt, with and without signer and title, within 0.2 pt). An object
          may show a Word drawing (w:object holding w:drawing and w:objectEmbed) instead of a VML shape
          (docx/external/openxml-sdk/Strict01: an EMF of 362 by 146 pt).

      - id: vml.watermarks
        title: Watermarks
        description: Text or picture watermarks are VML shapes in the header, centered on the page behind the text.
        elements: [v:shape, v:textpath, v:imagedata]
        priority: P1
        difficulty: 3
        status: done
        strategy: Text watermarks are VML WordArt (v:textpath) scaled to their box; picture watermarks are washed-out pictures.
        office: >-
          WordArt (v:textpath on a v:shape with the text path on, its own or its type's; a rectangle with one stays a
          rectangle with its text box: libreoffice/extras-ooxmlexport/drawinglayer-pic-pos 65.1 → 100 %) bends its
          text as the DrawingML warp of its shape type (o:spt 136 to 175: the arches, circles, buttons and pours with
          their angles, the others with their offsets where VML's and DrawingML's defaults agree), envelopes between
          the shape type's own guide paths (its path's figures, its formulas evaluated: textInflateTop's cubic top
          reaches the shape's top, DrawingML's quadratic only halfway), as text converted from old WordArt
          (docx/local/vwa-*: textCanDown, textCurveUp, textDeflateInflateDeflate, textSlantUp and textInflateTop as
          Word draws them within 0.2 pt); along an arch (textArchUp) the kerned text fills the half ellipse, every
          glyph rigid at its advance's middle and turned to the path there, its baseline half an em less the font's GDI
          descent (usWinDescent) inside the path (docx/local/vwa-arch*, vwb-*: "WORD-ART" and "HOH" along arches of
          286.45 by 134.8, 200 by 200 and 400 by 100 pt in ten fonts, within 0.1 pt, 85 → 99 %;
          extras-ooxmlexport/FDO78590 98.5 → 99.7 %), and inline it takes the room of its glyphs beyond its box: their
          ink, across with half its outline (at least 0.75 pt's) out from their corners as mitered lines count, up
          (and down) with the whole outline, rounded out to whole pixels (vwa-archin, vwb-ab-in, vwc-*, vwd-*: outlines
          of 0.25 to 6 pt, within 0.17 pt; extras-ooxmlimport/WordArt 13.4 → 75.6 %); filled with the shape's fill, pictures too
          (tdf153258_VML_import_WordArt_detection: a purple mesh tiled over the glyphs, 10.2 → 100 %), outlined with
          its stroke (0.75 pt of black by default) and shadowed with its shadow
          (libreoffice/extras-ooxmlexport/fdo79540 28.2 → 94.7 %, fdo78663 26.7 → 91.1 %, fdo74110 25.7 → 48.4 %,
          tdf114308 4.9 → 94.3 %), a line per line of its string, a line break at its end adding none. Plain text
          (textPlain) VML lays out with each line's em its share of the shape's height, the baseline its GDI descent
          (usWinDescent) above the line's bottom, lines GDI's height (usWinAscent and usWinDescent) apart, the longest
          line's advance across the shape and the others centered at its scale; PowerPoint's warp fills the shape with
          the ink both ways, so the shape shrinks to the ink's share about its turned center (docx/local/vwa-f-*:
          "DRAFT" and "Typeface" in Arial, Segoe UI, Cambria, Verdana, Georgia and Arial Black, vwa-calibri,
          vwa-calibri2, vwa-times2, vwa-segoe3: within 0.1 pt; fdo77727 76.0 → 97.8 %); trimmed text (trim) fits its
          ink to the shape (vwa-plain). Placed on the page, an outlined one stands as far right as its outline reaches
          left of its ink, miters included, in whole pixels, the line at least 0.75 pt (docx/local/vwp-*: "xxxx" in
          Impact 1.5 to 7.5 pt right with outlines of 0.25 to 6 pt, exactly; extras-ooxmlexport/tdf138739 79.1 →
          99.7 %). Bent lines lie GDI's height apart too (extras-ooxmlexport/fdo74110: three lines
          of textInflateTop 1.117 em apart, not PowerPoint's 1.2 em, 87.4 → 90.6 %; docx/local/vwa-inflate 84.7 →
          97.1 %). Trimmed text centres each line by its ink between shape-bound paths, spaces before and after it
          inked over their advance (docx/local/wtu-*: "11" and "rr" under "HHHHHH" with their ink's middle on the
          shape's in textPlain and textSlantUp; wts-*, wtu-*-lead1, -lead3: "HH" one and three spaces after it 8.6 and
          21.9 pt further left, before it as far right; vwa-slant 88.7 → 99.3 %; extras-ooxmlexport/
          testWordArtWithinDraingtool, "program and ", 87.0 → 94.5 %); untrimmed text keeps its advances
          (vwa-calibri2). A family the machine lacks is drawn in Arial, as GDI maps it
          (libreoffice/extras-uiwriter/watermark: DejaVu Sans Light, 55.1 → 99.3 %; extras-ooxmlexport/watermark-font
          45.0 → 68.2 %), also one only in Office's cloud font cache, which GDI does not see
          (extras-ooxmlexport/fdo74110: "Noto Sans" in Arial, 48.1 → 87.4 %). Picture watermarks are VML pictures. WordArt is kerned only where its text path says
          v-text-kern, its type's text path style under the shape's own (docx/external/libreoffice/
          extras-ooxmlexport/watermark-font: "TestFont" without Arial's T-e pair, 68.2 → 100 %; extras-ooxmlimport/
          WordArt: kerned by its type's, the kerned advance filling the arch). Known deviations: inline at the line's
          start, an arch of Word's own shape type outlined thinner than 1.5 pt draws its glyphs closer along the path
          in some sizes, at their size and with the room as without (docx/local/vwc-stroke-in, extras-ooxmlimport/
          WordArt: 286.45 by 134.8 pt, 0.979 of their places, also on screen; vwe-*, vwf-*: not indented by 1 pt, after
          text or centred, not outlined 1.5 pt or more, not 250 to 350 pt wide or 100 to 170 pt high, not "OOO"; no
          rule found); a shape type other than Word's own (without fitpath or v-text-kern) leaves the room out or
          draws the glyphs from the room's corner (vwf-nofitpath, vwf-nokern); an arch of 90 degrees Word does not draw
          (vwa-arch90: the type's formulas leave no sweep); core-ooxml-pass/ fdo79131, whose shapes Word blows up over
          three pages.

  - id: engine
    title: Layout engine (cross-cutting)
    description: Features without elements of their own that decide the fidelity of everything else.
    features:
      - id: engine.output
        title: HTML output
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          One self-contained HTML file: fixed-size page boxes with absolutely positioned glyph runs, SVG for
          drawings, embedded fonts and pictures; print CSS keeps one page per sheet. Every step onto Word's 600 dpi
          device (0.12 pt dots, twips five twelfths of one) is named in one place by the rounding Word takes there.
        office: >-
          One self-contained HTML file: a fixed-size section per page with a named @page per paper size (printed,
          every page keeps its size), text as SVG text at our positions in the fonts we measured with (fonts the
          browser cannot find by name, such as Office cloud fonts, embedded), drawings, charts, SmartArt and equations
          as SVG, pictures embedded, bookmarks as anchors and hyperlinks as links. Printed, outlines keep their width:
          the crisp edges that shapes have on screen (as PowerPoint draws axis-aligned lines) would make Chrome print
          their strokes as hairlines of width 0, which PDF renderers and printers draw thinner and lighter than Word's
          0.75 pt (docx/external/powertools/WC/WC065-Textbox 70 → 88.6 %; of 306 documents with such outlines 83
          better, 40 more over 90 %). Word's PDF moves the runs of text of a page right and down by 0.945 dots of its
          600 dpi device (0.04 mm) across the paper's whole width and height, in the 0.2 dot steps of its 1/3000 in
          grid, the glyphs' widths as they are; ours are moved alike (docx/local/lsg7-a4, lsg8-a4-*, lsg9-*: line
          starts 0.2 dots further right from 491.5 dots on and every 1050 dots after across A4, every 740 across A5,
          1079 across Letter; lsgy-a4: baselines down the page; scaling the whole page instead moved pattern fills,
          pictures and turned frames that Word leaves); lines on the page start on whole dots, the column's or cell's
          edge and the line's indent each rounded, halves to even (lsg-*, lsg2-*, lsg3-*: margins 1120 to 1160 twips
          and indents 0 to 24 twips, the right margin no matter); centered and right aligned lines stand by their
          room's edges each rounded so, their content's width in whole dots and half the room left over rounded down
          (docx/local/jco-a to jco-d: Arial and Calibri 11 pt, margins of 1440 and 1134 twips, indents of 7 twips: 291
          of 320 line starts on Word's dot, 256 before). Lines of right-to-left paragraphs stand on the grid mirrored
          about the page's width in whole dots, up: start aligned and justified lines end at their room's right edge
          counted from the page's right edge and floored, end aligned ones begin at its left edge so counted, centered
          ones take half the room left over floored (Word's PDFs of LibreOffice's extras-ooxmlexport/
          tdf106174_rtlParaAlign: a page of 3496.25 dots mirrored about 3497, a right margin of 312.5 dots ending the
          text at 3185; fdo72560, fdo72560b, fdo72560c: end aligned text from 473 and 474). Within a line Word puts each glyph on its device by its
          natural width in whole dots at the font's pixel size (its design width with its kerning scaled, up from 0.46
          of a dot), a dot less or more where the error against the exact advances would pass 1.5 dots after the next
          glyph, the line in stretches of 1024 dots at whose ends the error comes back within half a dot; a stretch
          starts on the nearest dot, its error counted from there, at the line's start, after a tab or an object, at a
          note's mark of another size or height than the text beside it and after it, where other runs of another size
          or height go on (67 documents of the corpus: 82.9 % of 389,256 characters within half a dot, 81.9 % when
          every such run starts a stretch; extras-ooxmlexport/sdt-2-run 82.2 → 100 %, extras-ooxmlimport/n782061
          87.6 → 100 %, bnc773061 92.6 → 98.3 %);
          justified spaces are as much wider in whole dots, the error deciding which take a dot more. Its PDF writes
          the device's advances per run against the glyphs' widths: as character spacing where the first seven glyphs
          need what the first needs within 0.01 pt (14,496 runs of extras-ooxmlexport's PDFs: 99.8 %), otherwise as
          adjustments written once they reach 3/1000 em, their remainder dropped; runs of the same w:rPr, w:rsidRPr
          and w:rsidR are one (docx/local/adv-*, probes in five fonts from 8 to 28 pt: all 90 lines and 100 runs of
          Word's PDFs). Character spacing (w:spacing) adds its whole dots to the natural width (docx/local/gxs-a,
          gxs-k: 5 to 20 and -5 to -10 twips in Times New Roman, Calibri and Arial, kerned and not: 97.8 and 92.6 % of
          the characters within half a dot, 22.6 % before; LibreOffice's extras-ooxmlexport/tdf154369 86.9 → 99.2 %),
          kern table pairs count as kerning (run.openType). Ours alike for text of one glyph per character without
          scaling or synthetic bold
          (adv-*: 92 to 98 % of the characters within half a dot of Word's PDF, 46 to 59 % before; 103 documents of
          the corpus: 88.5 %, 72.5 % before; docx/generated/*, Aptos kerned: 77.8 %, 37.5 % before; gxl-*, 24 to 72 pt
          in five fonts: 90 to 100 %, 60 to 75 % before), the text after a tab from the stop's nearest dot, halves
          down (gxt-*: 58 of 60 stops exact, the halves so); so the lines of text boxes that are not turned (40
          documents of the corpus with text boxes: 83.4 % of the characters within half a dot, 73.1 % before), the
          edge of a box and its inset on a dot together, a half dot going down with a left inset of 7.2 pt or more, up
          with a narrower one, to even without one (docx/local/tbd-*, tbe-*: a box at 1887.5 dots has its text with
          insets of 144 and 288 twips on dots 1947 and 2007 in modes 11 to 15, with 12 and 72 twips on 1893 and 1918;
          extras-ooxmlexport/tdf91260 90.0 → 100 %; boxes at 472.5 dots without an inset on 472), edge and inset in
          whole twips with halves down (half an unfilled line of 0.25 or 0.75 pt counts 2 or 7 twips, of 0.255 pt 3),
          an inline box counted from where it stood before its line moved onto the device and the PDF's growth moved
          it (docx/local/tbi-1417, tbi-1440: unfilled lines of 0 to 2 pt beside boxes at 1417 and 1440 twips, every
          text start on Word's dot; extras-layout/tdf117188 89.4 → 100 %, extras-ooxmlexport/pagerelsize 97.8 → 100
          %, tdf92724_continuousBreaksComplex 98.5 → 99.9 %), and
          the turned lines of vert and vert270 boxes along the page: from Word 2013 on the box's top on the dot before
          it and its height in whole dots from there, before the edge the lines start from on a dot (the top on the
          nearest, the bottom for text up on the one before it) and the room in whole dots on from there, lines down the
          box stacking from its right edge on the dot before it; the insets in whole dots, aligned lines by their width
          on the device, baselines on the nearest dot, halves to even, the PDF's growth across and along
          (docx/local/vtb-*: boxes at 72.00, 72.05 and 72.07 pt, insets of 3.6 and 7.2 pt, every line's start and
          baseline on Word's dot; vtc-*: a box 385.4 pt high at 72 pt counting text up from 3812 dots in mode 15, from
          3811 in mode 14; extras-ooxmlimport/btlr-frame-vml 87.3 → 100 %, extras-ooxmlexport/tbrl-frame-vml
          88.1 → 100 %, tdf103573 88.4 → 99.2 %, layout-flow-alt-alone 90.0 → 100 %, vml-text-vertical-adjust
          95.2 → 100 %, extras-ooxmlimport/tdf127825 94.3 → 97.9 %). Known deviation: Word rounds some halves up where the page is wide (1462.5 dots and more) or
          the margins mirrored (lsm-2418); right to left text keeps its exact advances.

      - id: engine.pagination
        title: Pagination
        priority: P0
        difficulty: 5
        status: done
        strategy: >-
          Page breaking with widow and orphan control, keep with next, keep lines together, page and column breaks,
          table rows that split or repeat, footnotes that share the page with their references, section breaks of
          all types and continuous sections with balanced columns.
        office: >-
          Pages, columns, sections, headers and footers and the paragraph keep rules match Word's line positions
          within 0.1 pt on the generated documents (word-lines); tables break between rows and split rows at lines,
          repeat their header rows, keep rows that may not split and rows whose paragraphs keep with the next
          (docx/local/tblpages: 229 lines, mean 0.06 pt); footnotes share the page with their references and continue
          on the next (note.footnotes); floating objects stay on their anchor's page (engine.floats).

      - id: engine.lineLayout
        title: Line layout
        priority: P0
        difficulty: 5
        status: done
        strategy: >-
          The text engine of pptx `engine.textLayout` (done) extended by Word's rules: line height from the font's
          metrics and line spacing, tabs, justification, East Asian grid and kinsoku, hyphenation, inline objects,
          lines shortened by floating objects.
        office: >-
          Lines break at UAX #14 opportunities with Word's kinsoku, and at every space before a character that is not
          East Asian, also before periods, closing brackets and quotes, slashes and percent signs (docx/local/
          spacebreak: 19 characters), after an em dash but not before it (docx/local/emd-*, eme-*: "order—" ends a
          line, "order—even" goes on whole where "order" alone would fit, after digits alike, in modes 12 and 15;
          LibreOffice's writerfilter-dmapper/floattable-hidemark), after every hyphen and en dash whatever stands before it, digits, punctuation
          or a space, and whatever Latin character follows, also one kinsoku keeps off a line's start, after the
          hyphen U+2010 from Word 2013 on, not after slashes, plus signs, underscores or non-breaking hyphens
          (docx/local/hyphbreak-15, -12: 19 cases; hkn-*: "ametur-" | "%…", before ) . ; ! ] ° ? , : alike, with and
          without w:useAltKinsokuLineBreakRules; w:noBreakHyphen too, powertools/RP/RP038 76.5 → 100 % of the lines;
          LibreOffice's extras-ooxmlexport/fdo81492), and before and after inline pictures as
          beside ideographs (docx/local/tblpic3); spaces with a no-break space among them break nowhere, neither after
          them nor before the no-break space (docx/local/nb-15, nb-14: "X)" and NBSP SP, SP NBSP or NBSP NBSP SP before
          a word too long for the line keep it there, broken by characters; LibreOffice's extras-ooxmlexport/tdf134606
          85.8 → 99.6 %); a word longer than the line breaks between characters, on the line
          where it begins if nothing but a tab or a list number stands before it there, with at least one character
          after a number, none needed after a tab (docx/local/lw-*, lx-*, ly-*, lt-*: modes 14 and 15); spaces alone
          before what does not fit stay on a line of their own (docx/local/spic-*: a space or two before a picture as
          wide as the column or a word wider than it; pandoc/image); a tab goes to
          the next line with the word after it where that word does not fit (lw-6 to lw-10, ly-1, ly-4; docx/external/
          libreoffice/extras-ooxmlexport/tdf123054, tdf142404_tabOverMarginC15); trailing spaces hang past the end;
          spaces never make a line taller or lower, whatever their size or place, and a line of only spaces is the
          paragraph mark's (docx/local/ts-*, tu-*, tv-*: a 45 pt space before, between or after 9 pt words leaves the
          line 9 pt in modes 12 to 15, a 45 pt "x" or no-break space does not), nor do the en, em, four-per-em and
          ideographic spaces, where the other spaces count (wsp-15, wsp-12: U+2002, U+2003, U+2005 and U+3000 as
          U+0020; U+00A0, U+2000, U+2001, U+2004, U+2006 to U+200A, U+202F and U+205F make the line 45 pt; LibreOffice's
          extras-layout/tdf153136 77.6 → 97.6 %); tabs neither, a paragraph's last line
          of only tabs is the mark's, a line before it of only tabs and spaces as high as the largest of them
          (LibreOffice's extras-ooxmlexport/tdf137335_whitespaceLineHeight: 36, 48 and 72 pt tabs and spaces wrapped
          before the mark's line, the baselines at 235.1 and 275.0 pt as Word's; docx/local/tabheight: a 24 pt tab
          alone, twice or between 8 pt letters leaves an 8 pt mark's line 8 pt, an 8 pt tab alone a 24 pt mark's 24 pt;
          tovc-10: a 10 pt tab wrapped past the right indent before 12 pt text keeps its line 10 pt); justified lines squeeze spaces for one more word where that
          changes them less than stretching would (paragraph.basic); automatic hyphenation breaks words as Word does (paragraph.hyphenation); line grids
          snap lines to whole pitches (section.docGrid); East Asian spacing and alignment (paragraph.eastAsian).
          Glyphs are drawn as browser text at positions from our layout; Word's PDF and ours go through the same
          rasterizer, so equal positions give equal pixels. Punctuation compression changed nothing in Word's printout
          (docx/local/ec-*).

      - id: engine.floats
        title: Floating objects and text wrapping
        priority: P0
        difficulty: 5
        status: done
        strategy: >-
          Anchored objects, frames and floating tables are placed first, then lines are broken into the space
          around them; objects anchored in later text may move earlier lines, so layout iterates until stable. What
          the runs before settled travels in one record to the next: each page's floating objects and footnote band,
          the paragraphs that begin a page for an object going back and forth, the drawings held where they stood.
        office: >-
          Floating drawings are placed on their anchor's page and the page is laid out again around them until it is
          stable (at most five runs); an object that goes back and forth between two pages, its own exclusion pushing
          its paragraph off the first, leaves its paragraph at the top of the second and the first without itself and
          without the paragraph's other objects (openxml-sdk/Complex01, Strict01 page 4: no stale exclusion; Strict01
          65.5 → 76.0 % of the lines; Document: a cover's two text boxes, one over a chart, one over the table above
          it; Complex01 84.5 → 89.0 %), in a section of columns at the top of the next column (LibreOffice's
          extras-layout/fdo43573-2-min: two columns, the second filled, 81.3 → 82.8 %); from Word 2013 an object that wraps text and moves with its paragraph takes
          the paragraph to the next page where, moved up to end at the bottom margin, it would reach with its effect
          extent above the bottom of its line, the paragraph's space after below a last line, a box that resizes to its
          text at least as high as Word saved it, there placed from the paragraph's top, as any drawing of a
          paragraph moved on before its first line, before Word 2013 as far down as it stood (docx/local/af-over,
          af-over-tb, af-huge go, af-over-tb 72.5 → 100 % on its second page; af-fit, af-over-none in front of the
          text, af-over-page, af-over-margin and af-over-14 stay; efg-15, efh-15: 50 pt below a line ending at 136.85
          pt rectangles of up to 71 pt stay, of 71.5 pt and more go, below a line of 20 pt text one of 60 pt; efi-15:
          3 pt of effect extent above count, 4 pt of distance from the text not, 12 pt of space after do, a line of 1.5
          lines its whole height; extras-layout/fdo43573-2-min, mode 14: a picture below an empty paragraph moved to
          the right column where it stood in the left; docx/external/libreoffice/extras-ooxmlexport/tdf123243,
          tdf115719 20 → 100 %, tdf137655 54.2 → 100 % of the lines); one taller than the page's body,
          its effect extents above and below with it, leaves its paragraph's first line where it would stand without
          it and takes the lines after it below it, whatever its wrapping (docx/local/tlw-15: rectangles of 201 pt and
          of 190 pt with a 12 pt bottom effect extent on a body of 200 pt, wrapped square or top and bottom; 199 pt and
          190 pt with 12 pt distB wrap, tlw-14, tlw-12 wrap; bhy-*: extras-ooxmlexport/tdf160049_anchorMargin15 88.1
          → 97.6 %, a picture of 117.75 pt with 2.25 pt of effect extents on a body of 118 pt), before Word 2013 only
          one wrapped through or tight (docx/local/bwr-14-*: a square of 117.75 pt with those effect extents wrapped
          through on its left, behind the text or in front of it, leaves the line over it, wrapped square not, nor one
          of 100 pt; tdf160049_anchorMargin14 87.1 → 99.1 %); lines are broken into the segments
          beside the objects, words that do not fit a segment continue in the next one, each segment aligned in its own
          room, justified ones but the paragraph's last (docx/local/jf-*: justified, centred and right aligned lines
          beside a frame and rectangles wrapped square or tight, every segment within 0.2 pt; LibreOffice's
          extras-ooxmlexport/tdf133701 87.9 → 98.0 %), lines with no room move down
          below the object (docx/generated/wrapping, wrap-types), below the first of the objects beside them to end
          (td-1), beside objects wrapped along their polygons a line at a time, so on the paragraph's line pitch
          (ub-*), and to the next page where they do not fit below it. A segment takes text from 18 pt, also an empty
          line's, the first of a line only where the line's first word fits (docx/local/tf-*, tk-*, tq-*, te-*, tg-*,
          th-*, tl-*: 17.3 pt stay empty, 19.3 take "a an", a word of 40.6 pt goes below an object leaving 39.3 pt);
          before Word 2013 a line beside objects wrapped square stays where the column has 18 pt beside them, also
          only outside its indents, takes what of it they leave, a character a line where none, a word breaking where
          it does not fit (tx-*, ty-*, tz-*, ua-*; powertools/RP/RP001-Tracked-Revisions-01-Accepted), and beside
          objects wrapped along their polygons a segment takes text from 9 pt (tv-*, tw-*;
          core-text/fly-minimal-wrap). A line moved down for the height of its paragraph mark stands where it fits
          with its own (uitest/tdf124675); from Word 2013 a line taller than the height it was placed for keeps clear
          of the objects beside the rest of it too (docx/local/tall-*: a 200 pt inline picture whose line top is clear
          goes below a shape over its lower or upper part, wrapped square or top and bottom, anchored before or after
          it; beside one leaving it room enough it stays; in mode 14 it stays over the shape; openxml-sdk/Document: a
          cover page's text box over a chart's lower half, the cover then on the next page, 68.3 → 95.8 % of the
          lines). A paragraph whose own object leaves it no room on the page moves on with the object, and the page it
          left is laid out without it (docx/local/anchorpush-*). An object kept free above and below that reaches down
          to its paragraph's place pushes the lines already in the column that it overlaps below it; where its
          paragraph would then no longer begin in the column it takes the paragraph to the next (uc-1 to uc-5, ud-*;
          generated/wrapping, local/compat11-wrapping; extras-layout/fdo43573-2-min), not where the object only ends
          above the paragraph (tall-t: a picture line before the anchor goes below the object, the anchor stays).
          Objects beside the column leave its lines alone, also those kept free above and below, and a paragraph going
          on in another column or page goes on beside the objects there (fdo43573-2-min: an image at the top of a
          page's left column, the right column's text and the last line of a paragraph from the page before). Text
          frames and drop caps (paragraph.frames) and floating tables (table.floating) take part in the same
          exclusions. A table does not stand beside the floating objects and frames before it: it begins below every
          one its part on the page would overlap, as does its part going on in the next column or page
          (openxml-sdk/complex0: rows going on below a header's frame), from Word 2013 on whatever their wrapping and also below those
          anchored after it on the page (tbo-*: a shape anchored after a table over its last or first row, wrapped
          square or top and bottom; openxml-sdk/Document), before only those kept free above and below and those that
          leave it less than half its width right of them, their own boxes over it (tfh-*-14: below a shape wrapped
          square at the column's right, in the header or the body, that leaves 50, 65 or 85 % of a full-width table
          left of it; core-layout/table-fly-overlap 88.5 → 100 %, found by agent BI; table-fly-overlap-spacing: a
          picture only its distance over a narrow table leaves it; docx/local/fx-1 to fx-13, ft-1 to ft-8: below a
          40 pt shape wrapped square or top and bottom, also one
          beside a 70-row table's last rows on the page, and below frames not beside text, anchored to the text or the
          page; a shape right of the table and one without wrapping leave it;
          docx/external/tika/testWORD_tableInRunInsideParagraph, docx/external/libreoffice/core-ooxml-pass/
          fdo78904_fileHang); below a floating table of the text only where it does not fit beside it and reaches its
          box, its distances aside (ib-1 to ib-7: a table of 90 pt beside one of 350 pt, of 468 pt below it;
          writerfilter-dmapper/floattable-then-table, extras-layout/tdf167526; extras-ooxmlexport/tdf92157: a table
          into the distance of a floating table in the right margin stays). A floating table that may not overlap
          others (w:tblOverlap never) moves right of the one before it that it would overlap where it fits, else below
          it (table.floating). A table whose cells' paragraphs have frame properties stands in that frame as a
          floating table placed as the frame would be, its indent (w:tblInd) kept from Word 2013 on too, the empty
          paragraph ending the section after it a line of the text where it is not framed, none where it is as the
          table's paragraphs (docx/local/frsb-12, -14, -15: tblInd 360 18 pt right of the margin in mode 15, the first
          cell's text there before; a framed one with text stands below the table in its frame, frsb-* b; lb-1 to
          lb-4: at the margin's outside top;
          docx/external/libreoffice/extras-ooxmlexport/tdf164474 54.0 → 91.3 → 100 %, tdf104394_lostTextbox,
          extras-ooxmlimport/tdf75573_lostTable 84.7 → 95.4 %); paragraphs and tables framed alike one after the
          other stand one below the other in that frame (extras-ooxmlexport/fdo60957-2: "F", a table and "H" in a
          frame of 5103 by 1565 twips, 55.9 → 100 %), not in a cell, where frames do not apply
          (extras-ooxmlexport/fdo77887, extras-layout/fdo48718-1: a table framed 113.3 pt from the page's top in a
          floating table's cell stays in it), nor framed in line with the text (w:yAlign inline,
          extras-ooxmlexport/n780853). A table that fits beside a floating table it would stand across moves into the
          room beside it, aligned there as in its column (ib-1: a 90 pt table at the 350 pt one's right distance; ib-2
          centered in that room; docx/external/libreoffice/extras-uiwriter/tdf134227 60.3 → 100 %). Known deviations:
          in mode 14 Word sets a table beside a shape wrapped square, indented and narrower (fx-5), ours stays over
          it; in mode 14 Word moves only the row of a table that a shape anchored after it overlaps (tbo-14), ours
          leaves the table.

      - id: engine.tableLayout
        title: Table layout
        priority: P0
        difficulty: 5
        status: done
        strategy: Word's autofit algorithm, measured against generated tables, and rows that span pages.
        office: >-
          Word's autofit: each column's minimum and maximum width with margins (the maximum capped at 1584 pt);
          preferred widths fixed, giving way where they do not fit; the maxima when they fit, else the minima and the
          rest in proportion to max - min, else the content minima shrunk (table.width); fixed layout by the grid; rows that split across pages unless cantSplit,
          repeated header rows, nested tables (docx/local/tbl-autofit 92/92 lines, docx/generated/tables 44/44).

      - id: engine.fonts
        title: Font resolution and fallback
        priority: P0
        difficulty: 4
        status: done
        strategy: As pptx `engine.fonts` (done) with Word's font substitution (font.table).
        office: >-
          Installed, embedded and Office cloud fonts (Aptos) as in pptx, with Word's own substitution of missing
          families (font.table) and theme fonts (font.theme). A character the run's font lacks is measured and drawn
          in the font Word falls back to, by range: emoji Segoe UI Emoji (also before U+FE0F); symbols, dingbats,
          arrows and Braille Segoe UI Symbol; letterlike and mathematical symbols, technical symbols and enclosed
          numbers Cambria Math (enclosed letters then MS Gothic or MS Mincho); geometric shapes Arial; Thai, Lao and
          Khmer Leelawadee UI; Indic scripts Nirmala UI; Georgian Sylfaen; Ethiopic Ebrima; Cherokee Gadugi; Syriac
          Segoe UI Historic; Tibetan Microsoft Himalaya; Myanmar Myanmar Text; Hangul Malgun Gothic or Batang beside
          serif and East Asian fonts; Chinese characters and kana MS Mincho, then PMingLiU or Microsoft JhengHei;
          Hebrew and Arabic outside right-to-left runs Arial, Times New Roman beside serif fonts (docx/local/thd2-a,
          thd2-b; docx/external/poi/rtl 62.9 → 91.9 %).
          Lines grow with the fallback's metrics as in Word; spaces and format characters stay in the run's font,
          marks with their base (docx/local/fallback-arial 96.1 %, fallback-calibri 95.7 %, fallback-times 97 %, every
          line within 0.1 pt). Color emoji are Chrome's (COLRv1 shading) where Word draws them flat. Installed fonts
          the browser does not find by their family name are named by their faces as in pptx (Franklin Gothic
          Medium, the theme font of powertools/HC006 and HW010-Symbols01, was drawn in Franklin Gothic Demi). The
          named instances of variable fonts are families of their own as Windows lists them (Word's
          Application.FontNames): the typographic family with the STAT table's names of the instance's values in its
          axis order, elidable names left out, Bold and Italic as the style, cut to 31 characters ("Bahnschrift Light",
          "Bahnschrift SemiLight SemiConde", "Bahnschrift Condensed" bold, "Segoe UI Variable Small Light", "Sitka
          Small"); measured and drawn at the instance's axes, which the browser is given as font-variation-settings
          (extras-ooxmlexport/tdf135164_cancelledNumbering, set in Calibri before, 83.4 → 90.1 %).

      - id: engine.fidelity
        title: Fidelity measurement
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Word (COM) exports every reference document to PDF; its pages are rasterized and compared with our pages
          like the PowerPoint references, on documents Word generates by COM and on external test documents.
        office: >-
          Word (COM) exports every reference document to PDF; Chrome prints our HTML to PDF and the same rasterizer
          (Windows.Data.Pdf) renders both, page by page at 96 dpi, for the pixel and SSIM scores; pdf-text and word-
          lines compare Word's PDF layout with ours line by line and glyph by glyph. 29 documents generated by Word
          through COM (docx/generated, 92.6 % overall) and local probes for each measured rule. The rasterizer ignores
          the soft masks Chrome writes (reflections, soft edges), which MuPDF shows.
