          over the part of the table each page holds.

  - id: field
    title: Fields, hyperlinks and bookmarks
    features:
      - id: field.structure
        title: Simple and complex fields
        elements: [w:fldSimple, w:fldChar, w:instrText, w:delInstrText, w:fldData]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Show the cached result between the separate and end field characters, nested fields included; which fields
          Word recomputes when it prints (PAGE, NUMPAGES ...) is measured (field.evaluation).
        office: >-
          Field instructions are hidden, results between the separate and end characters show, nested fields included
          (a field inside another's instruction is part of the instruction). The results of PAGE, NUMPAGES and
          SECTIONPAGES are computed after pagination (field.evaluation); others keep their saved result. A computed
          field whose saved result runs across paragraphs (REF, IF, NOTEREF, PAGEREF, STYLEREF) joins them into one:
          the text before the field, its result and the text after its end in one paragraph of the last one's
          properties, tables in the saved result gone; fields whose saved results Word keeps, as tables of contents,
          keep their paragraphs (docx/local/fsp-ref, fsp-miss, fsp-align: "A", the REF's "Target" or its error and "
          B" on one line, right aligned as the field's last paragraph;
          docx/external/libreoffice/extras-ooxmlexport/line-break-in-ref 53.7 → 100 %, tdf171299_tableInField 62.2 →
          100 %, tdf171383_refFieldInCell, tdf125038_conditionalText_DOCPROPERTY; extras-ooxmlimport/tdf125038b 53.8 →
          100 %; writerfilter-dmapper/if-field 33.3 → 100 %). A paragraph mark within a field's instruction belongs to
          it and is hidden: the paragraph runs into the next one (Word's PDF of
          docx/external/libreoffice/extras-globalfilter/fieldmark_QUOTE_nest: a QUOTE whose instruction runs over seven
          paragraphs, a nested QUOTE in it, prints its result's six lines from the top, 55.3 → 100 %).

      - id: field.evaluation
        title: Field evaluation
        description: >-
          The 72 field codes of the format catalog (field-codes.md): page and section numbers, references, sequences,
          dates, document properties, formulas, IF, TOC and index entries.
        elements: [w:docVars, w:docVar, w:updateFields, w:listSeparator]
        priority: P1
        difficulty: 4
        status: done
        strategy: >-
          Page-dependent fields (PAGE, NUMPAGES, SECTIONPAGES, PAGEREF, STYLEREF in headers) are computed after
          pagination; others keep their cached result unless Word is measured to update them.
        office: >-
          Measured with docx/local/fields, a document whose fields saved wrong results, printed by Word: Word computes
          PAGE, NUMPAGES, SECTIONPAGES, PAGEREF (the bookmark's page in its section's format; \p above, below or on
          page n), REF (the bookmark's text, its paragraph's number), STYLEREF (in a header or footer the first
          paragraph of the style on its page, \l the last, else the last before it; in the body the nearest before the
          field; a heading level, or a built-in heading by the name Word's user interface gives it, in its language:
          docx/external/libreoffice/core-fields/suppress-non-numerical, styleref-flags, tdf86790: "Heading 1" finds no
          "heading 1" in German Word, 35.3 → 96.5 %, 47.5 → 93.8 %, 47.3 → 96.8 %; extras-ooxmlexport/StyleRef-DE:
          "Überschrift 1" does; a heading level no paragraph has its own error, extras-uiwriter/tdf146248; of a
          character style the text of the first or last runs in it,
          docx/external/libreoffice/extras-ooxmlexport/tdf163894_from_top: a dictionary's headers; a header measured
          for its page's text sees that page's paragraphs of the layout before; \s, as captions with chapter numbers
          have it, the paragraph's number from its first digit to its last: powertools/HC061 "Table 1.1." of a heading
          numbered "1."), NOTEREF (the mark of the note in the bookmark, with \f raised as that mark; to a missing
          bookmark Word's error in the instruction's format, bold in every mode, whatever MERGEFORMAT says:
          docx/local/nref-*, powertools/RP043, RP044-Rejected 50 → 100 % of the lines), LISTNUM (in the list of its
          name, an abstract definition's w:name, else Word's default list 1) a) i) (1) (a) (i) 1. a. i. of that name,
          OutlineDefault and LegalDefault too; without a name in the list of the last numbered paragraph, else the
          default list; at \l's level, else one deeper than a LISTNUM before it in its paragraph, else the last one's
          level without a name and the first with one; \s its number; counting with the list's paragraphs:
          docx/local/lnum-*, powertools/ RP026 ×3 50 → 100 %, HC048, libreoffice/extras-ooxmlexport/tdf89731),
          AUTONUM, AUTONUMLGL and AUTONUMOUT whatever result was saved (the paragraphs holding them count once each, a
          heading at its outline level with the deeper levels and the body text after it starting again, body text
          in a count of its own one level below the last heading; AUTONUM shows the paragraph's count, AUTONUMLGL the
          counts down to its level, 1.0.1.2., AUTONUMOUT its count in its level's outline style I. A. 1. a) (1) (a)
          (i) (a) (i), 1. below the ninth level), BIDIOUTLINE, which counts too, ### in bold (docx/local/anf-a to
          anf-c, modes 14 and 15; libreoffice/extras-ooxmlexport/99_Fields 66.7 → 100 % of the lines),
          MACROBUTTON without a result (its display text, the instruction after the macro's name, in the formats of
          its runs: powertools/ DB-HeadersFooters-Dest/Fax, Letter,
          libreoffice/extras-ooxmlexport/Unsupportedtextfields), SEQ (\c, , \h, \s), SECTION, IF (numbers or text,
          wildcards), SYMBOL (in its font \f and size \s; libreoffice/extras-ooxmlexport/tdf85161: 94 in Symbol prints
          ⊥; a backslash before a field's name does not hide it), DATE, TIME and PRINTDATE (when it prints, in the \@
          picture or the language's short date and time) and SAVEDATE (when it prints too, whatever the document's
          properties say: docx/local/svd-core, svd-none, saved 2020 or without core properties; a CREATEDATE keeps its
          result), all in the field's language (w:lang), not the computer's: its names, its short date and time and
          its AM and PM as Word has them, none in most European languages, upper case in English, the Gregorian
          calendar in all (docx/local/datelang: 18 languages on a German Windows); the page-dependent ones come from a
          layout before. PAGE, NUMPAGES and SECTIONPAGES of headers and footers carry the number format switches
          (roman, ROMAN, alphabetic, ALPHABETIC, Arabic, ArabicDash, Ordinal, CardText, OrdText, Hex) and about 60
          ST_NumberFormat formats; NUMPAGES counts blank pages (docx/local/hf-parity). Word computes IF only where it
          updates a story's fields when it prints: always in headers and footers, in the body where it has a field of
          the kinds above beside it (docx/local/iff-*: a body's IF 1 = 1 keeps its saved "maybe" in modes 11 to 15 and
          without one, a header's prints "yes"; ifg-*: with a PAGEREF, REF, SEQ, DATE, NUMPAGES, PAGE or STYLEREF in
          the body it prints "yes" there too, with a header's PAGE not; extras-ooxmlimport/tdf125038c). Headers and
          footers, their text boxes too, show DOCPROPERTY as the property is when Word prints, Word's error ("Error!
          Unknown document property name.", "Fehler! Unbekannter Name für Dokument-Eigenschaft.") where the package
          has none of that name or it is empty (docx/local/dpp-*: custom and core properties, a missing one, an empty
          subject; extras-odfexport/tdf151100 71.9 → 100 %). Word keeps the saved results of the others and so does
          the layout: document properties (AUTHOR, TITLE, DOCPROPERTY in the body: dpp-body-*), formulas, FILENAME,
          FILESIZE, NUMWORDS, NUMCHARS, USERNAME, DOCVARIABLE, MERGEFIELD, QUOTE, CREATEDATE. Texts Word words in the
          language of its user interface follow the reader's culture, German as measured with docx/local/fielderrors
          (REF and PAGEREF to a missing bookmark, STYLEREF without such a paragraph, SEQ without a name, \p "oben",
          "unten", "Seite n"), else English; Word sets error texts in bold in every mode (fielderrors, -14, -12 in
          modes 15, 14 and 12) where the field's text would not be bold, and regular where it would (docx/local/eb-15,
          -14, -12: bold from a paragraph style, a character style or direct formatting makes the error regular, a
          bold paragraph and character style that cancel each other leave it bold;
          docx/external/libreoffice/writerfilter-dmapper/tdf158360 84.6 → 99.6 %, extras-ooxmlexport/tdf64531 89.4 →
          96.6 %), in the font and size of the separate character's run, not of the instruction's, the begin's, the
          saved result's or the mark's (docx/local/ef-15, ef-14: only a separate run in Arial 14 prints the error in
          Arial 14; extras-ooxmlexport/fdo78910 82.3 → 99.4 %); a field without an instruction shows nothing. A field Word computes shows its result
          also where the document saved none (no separate character; tdf154478: a PAGEREF of a missing bookmark inside
          a table of contents shows the error text). PAGE, NUMPAGES and PAGEREF print in the format of their
          instruction's first run, not of the saved result, which they keep only with \* MERGEFORMAT
          (docx/local/fldfmt: of a bold begin, an italic instruction, a red 16 pt saved result and a 9 pt end Word
          prints the number italic 12 pt; docx/external/libreoffice/writerfilter-dmapper/tdf158360 75.1 → 83.6 %). A
          simple field (w:fldSimple) has no instruction runs: PAGE, NUMPAGES, SEQ, DATE, PAGEREF, SECTION and STYLEREF
          print in the paragraph style's format, in the saved result's only with \* MERGEFORMAT, their errors in the
          style's bold (docx/local/fsf-15, fsf-12, fsf2-*, fsf5-15: a saved result italic 16 pt red prints plain 10 pt,
          with MERGEFORMAT italic 16 pt red, in the body and in headers); REF keeps its bookmark's format
          (extras-ooxmlimport/tdf133647_unicode: Calibri Light). Instruction text after the separate character
          (w:instrText in the result) prints as result text (libreoffice/uibase-uno/cond-field-cached-value: a
          DOCVARIABLE's saved "Sunday", 26.1 → 100 % with the IF rule above). A field whose end character is not in its
          story (only in a text box's) prints its instruction and its result as text (extras-ooxmlimport/
          tdf152200-bad_fldChar_end: " FORMTEXT " and five spaces, 67.8 → 100 %, found by agent BK). A STYLEREF with MERGEFORMAT that comes out empty on a
          page of its header, also on the way where an empty heading ending a section stood at a page's top before the
          next section took the page, prints in the style's format on every page (docx/local/fsf4-b, fsf4-d, tdh-g;
          extras-ooxmlexport/tdf170602_exportContext); a header's STYLEREF before the first paragraph of its style
          finds that one (fsf4-c).
          Fields that set or ask for a bookmark (SET, ASK) print no result
          (docx/external/libreoffice/extras-ooxmlexport/fdo76163: "Praun et al. 2001" saved as a SET's result, 57.4 →
          97.3 %). STYLEREF finds the Normal style by its name in Word's user interface, "Standard" in German Word,
          not by "Normal"; NOTEREF and REF without a bookmark's name print Word's error "Fehler! Es wurde kein
          Textmarkenname vergeben."; GOTOBUTTON shows its text after the bookmark's name as MACROBUTTON does
          (docx/external/libreoffice/extras-ooxmlexport/Unsupportedtextfields 71.4 → 95.8 %; extras-uiwriter/tdf164620
          80.8 → 85.2 %). Without a picture PRINTDATE and SAVEDATE show the short date and the long time of the
          field's language, to the minute (docx/external/libreoffice/extras-ooxmlexport/tdf148380_printField:
          "12/10/2026 11:21:00" in en-GB, "3:34:00 PM" printed at 15:34:25, 74.1 → 91.6 %; tdf142464_ampm 82.7 → 100
          %, fixed-date-field 84.2 → 96.9 %). A locked field (w:fldLock) keeps its saved result (tdf148380_fldLocked
          82.1 → 89.1 %). A backslash in a date picture takes the character after it as it is, and a switch written
          against its argument's quote (\@"MMMM d") still takes it (extras-uiwriter/tdf164620: "Wednesday 14 October
          2026" and "14/10/2026 15:36:19 PM", 85.9 → 95.1 %; tdf148380_modifiedField 89.2 → 94.0 %,
          pandoc/text_in_shape_format 91.1 → 94.7 %). EQ fields show their instruction laid out: its text in the
          formats of the instruction's runs, \s\up n and \s\do n raising and lowering their argument n points like
          w:position, \o of one argument that argument, \* switches nothing; a fraction (\f) of other than two
