# Word (DOCX) feature catalog, level 2.
#
# Curated by hand. `dotnet run --project tools/SpecTools -- features` checks every element reference against the
# format catalog (level 1), measures coverage and writes docx.md and docx.json next to this file.
#
# Per feature: see pptx.yaml. Status describes the Word pipeline; features shared with PowerPoint (DrawingML, charts,
# SmartArt, math, VML) name the pptx feature whose implementation they reuse.

document: docx
title: Word (DOCX)
description: >-
  Rendering target: one HTML document per Word document with fixed-size pages, laid out and paginated by our own
  engine the way Word lays the document out for printing. Paragraph text is measured and broken into lines by our
  own text engine and emitted as positioned glyph runs; drawings, charts and SmartArt go through the DrawingML
  renderer shared with PowerPoint. The reference is Word's own PDF export of the document.

universe:
  roots: [w:document, w:styles, w:numbering, w:settings, w:fonts, w:footnotes, w:endnotes, w:comments, w:hdr, w:ftr,
          w:webSettings, w:glossaryDocument, w:recipients, w:txbxContent,
          pic:pic, lc:lockedCanvas,
          a:theme, a:themeOverride,
          c:chartSpace, c:userShapes, c:chart, cx:chartSpace, cx:chart, cs:chartStyle, cs:colorStyle,
          dgm:dataModel, dgm:layoutDef, dgm:styleDef, dgm:colorsDef, dgm:relIds, dsp:drawing,
          m:oMathPara, m:oMath, b:Sources,
          ap:Properties, op:Properties, cp:coreProperties, ct:Types, pr:Relationships, ds:datastoreItem]
  namespaces: [w14, w15, w16cei, w16cex, w16cid, w16cur, w16se, woe, wp, wp14, wp15, wpc, wpg, wps,
               a14, a15, a16, a1611, a3danim, aanim, aclsh, adec, ahyp, aif, am3d, ask, asl, asvg, msink, oac,
               pic14, thm15,
               c14, c15, c16, c16ac, c16r2, c16r3, cdr14, cs, cx, dgm14, dgm1611, dgm1612, dsp,
               v, o, w10]
  exclude: [p, p14, p15, x, xvml, xdr, pvml]

areas:

  - id: package
    title: Package and compatibility
    description: ZIP container, relationships, markup compatibility and metadata.
    features:
      - id: package.opc
        title: Package, content types and relationships
        elements: [ct:Types, ct:Default, ct:Override, pr:Relationships, pr:Relationship]
        priority: P0
        difficulty: 1
        status: done
        strategy: >-
          As pptx `package.opc` (done): parts are found through relationships, never by path. Word's main part is the
          officeDocument relationship of the package; styles, numbering, settings, fonts, notes, comments, headers and
          footers hang off it.
        office: >-
          Shared with pptx: the main part is the package's officeDocument relationship; styles, settings, theme,
          numbering, font table, notes, headers and footers are found through its relationships, pictures and charts
          through those of the part that refers to them; nothing is found by its path.

      - id: package.mce
        title: Markup compatibility and extension lists
        description: mc:AlternateContent, mc:Ignorable and the extLst/ext mechanism every newer feature uses.
        elements: [a:extLst, a:ext, c:extLst, c:ext, cx:extLst, cx:ext, cs:extLst, dgm:extLst, dsp:extLst, a14:extLst,
                   a3danim:extLst, aanim:extLst, am3d:extLst, ask:extLst, asl:extLst, oac:extLst,
                   pic14:extLst, thm15:extLst, cdr14:extLst, w14:extLst, wp:extLst, wpc:extLst, wpg:extLst,
                   wps:extLst, w16cei:extLst, w16cex:extLst, w16cur:ext]
        priority: P0
        difficulty: 2
        status: done
        strategy: >-
          As pptx `package.mce` (done): take the first mc:Choice whose Requires prefixes we implement, else
          mc:Fallback. Word writes its 2010 drawing objects (wps, wpg, wpc) in mc:Choice with a VML w:pict in
          mc:Fallback, so implementing the Choice side makes the VML path the exception.
        office: >-
          Shared with pptx: every part is read with mc:AlternateContent resolved, the first mc:Choice whose required
          namespaces the engine implements, else mc:Fallback. Word's 2010 shapes, groups, canvases and drawing
          extensions (wps, wpg, wpc, wp14) take the Choice, so VML is only read where a document has nothing else;
          ignorable elements and extension lists the engine does not know are skipped.

      - id: package.compatibility
        title: Compatibility leftovers
        description: Properties Office keeps for older versions or for converted VML content.
        elements: [a14:hiddenFill, a14:hiddenLine, a14:hiddenEffects, a14:hiddenScene3d, a14:hiddenSp3d,
                   a14:compatExt, a14:shadowObscured, a14:useLocalDpi, a14:cameraTool]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered, as pptx `package.compatibility`.
        office: >-
          As pptx: the hidden fills, lines, effects and 3D settings of a14 and the other compatibility extensions sit
          in extension lists and draw nothing.

      - id: package.encryption
        title: Encrypted and write-protected files
        priority: P2
        difficulty: 2
        status: done
        strategy: >-
          The decryption of pptx `package.encryption` (done, [MS-OFFCRYPTO] agile and standard encryption) applies
          unchanged: a password-protected document is a compound file with an EncryptedPackage stream. Editing
          restrictions (w:documentProtection, w:writeProtection) only matter to an editor.
        office: >-
          The decryption shared with pptx ([MS-OFFCRYPTO] agile and standard) opens password-protected documents: one
          Word encrypted converts with its password, without one or with a wrong one the converter throws a
          PasswordException saying which (Fidelity convert --password). Editing restrictions only matter to an editor.

      - id: package.properties
        title: Document properties
        namespaces: [ap, op, cp, vt]
        priority: P3
        difficulty: 1
        status: done
        strategy: Metadata only; title, author and language go into the HTML head. DOCPROPERTY fields read them.
        office: >-
          Title, author, description, keywords and dates of docProps/core.xml go into the HTML head (shared with
          pptx), the language from dc:language or the document defaults' w:lang; the file name is the title where the
          properties have none.

      - id: package.customXml
        title: Custom XML parts and schema library
        elements: [sl:schemaLibrary, sl:schema]
        namespaces: [ds]
        priority: P2
        difficulty: 1
        status: done
        strategy: Data only; content controls bound to a custom XML part read their values from it (sdt.dataBinding).
        office: >-
          Custom XML parts are data: content controls bound to them show their nodes' values (sdt.dataBinding); the
          schema library draws nothing.

      - id: package.ids
        title: Object ids, document ids and revision save ids
        elements: [a16:creationId, a16:predDERef, a16:cxnDERefs, a16:colId, a16:rowId, w14:docId, w15:docId,
                   w:rsids, w:rsidRoot, w:rsid]
        namespaces: [oac]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered; ids for co-authoring and merging.
        office: >-
          Revision save ids, document ids and DrawingML creation and row ids draw nothing.

  - id: document
    title: Document structure
    features:
      - id: document.body
        title: Document and body
        elements: [w:document, w:body]
        priority: P0
        difficulty: 1
        status: done
        strategy: >-
          The body's block content (paragraphs, tables, content controls, custom XML, section properties) flows
          through the layout engine into pages; the last w:sectPr of the body describes the last section.
        office: >-
          The body's paragraphs, tables, content controls and custom XML flow through the layout into pages; each
          section's w:sectPr in the last paragraph of the section, the body's own w:sectPr for the last section. A
          damaged document with several w:body elements shows them all, one after the other
          (docx/external/poi/MultipleBodyBug).

      - id: document.background
        title: Page background
        elements: [w:background, w:displayBackgroundShape, v:background, a15:backgroundPr]
        priority: P2
        difficulty: 2
        status: done
        strategy: >-
          Color, gradient, texture or picture behind every page (w:background with its VML fill). Whether Word's PDF
          export includes it must be measured before it is drawn.
        office: >-
          Word prints the page color whether or not w:displayBackgroundShape is set: w:background's color (theme
          colors with tint and shade) or the fill of its v:background, behind everything on each page
          (docx/local/misc-nothing, misc-nobg), as its PDF draws it (measured with Word's own presets,
          docx/local/bgpreset-*, and docx/local/ bggrad-*). A linear gradient lies over a tile of 1025 × 769 of Word's
          0.12 pt dots from the page's corner and turns back at the tile's end: at the angles 0 and 180 and at
          negative multiples of 45 (Word's presets write 0, -90, -45 and -135) a gradient between both colors spans a
          tile of 512 × 384 dots, as does one out and back at those diagonals; negative angles turn the gradient
          round, at any focus but 0, ±50 and 100 % Word applies the focus twice; colors blend as on shapes. Radial
          gradients repeat a tile of 1025 × 769 dots, Word's "from corner" presets (o:fill gradientCenter) one of 512
          × 384. Textures tile at the picture's size; a picture over the page Word prints as tiles of its pixels at
          0.12 pt each; a pattern as its 8 × 8 bitmap, a point a bit, white in the fill color and black in color2.
          Known deviations: Word's PDF draws a gradient between two colors with the method linear or none in steps of
          half its length, flat between them; a texture of 300 dpi tiles 0.12 pt larger in Word.

      - id: document.altChunk
        title: Imported content (altChunk)
        description: A part in another format (HTML, RTF, plain text, another DOCX) that Word converts when it opens the document.
        elements: [w:altChunk, w:altChunkPr, w:matchSrc]
        priority: P2
        difficulty: 4
        status: done
        strategy: >-
          DOCX chunks are merged as WordprocessingML; plain text becomes paragraphs. HTML and RTF chunks need an
          import of their own; until then their text is shown without formatting.
        office: >-
          Chunks are converted as Word converts them when it opens the document (compared with the WordprocessingML
          Word writes when it saves such a document again): a WordprocessingML package's body in the document's
          formatting, plain text a paragraph per line in Courier New 10.5 pt without spacing, HTML through an import
          of our own: headings in bold Times New Roman 24 to 7.5 pt, paragraphs in 12 pt with 14 pt auto spacing
          unless the page's style sheet gives margins (p{margin:0}), list items with Symbol bullets or numbers in the
          document's font, tables with a pixel of cell spacing (none with cellspacing="0"), outset frames and cells in
          Word's two grays, the padding of cellpadding, widths in pixels, cells centered and in the document's own
          spacing and font, header cells bold and centered (docx/local/altchunk, altchunk-tables); CSS borders
          (border: 1px solid black) single lines of that width on the table and its cells, collapsed borders without
          cell spacing, CSS cell widths as cell and column widths (docx/external/tika/testAltChunkHTML). A web archive
          (MHTML, message/rfc822) gives its HTML part (testAltChunkMHT). RTF through an
          import of our own: Word reads the RTF into a document of its own and pastes it with the destination's
          styles, so a paragraph whose style the document has (by name) takes it and keeps as direct formatting only
          what differs from the RTF's own definition of that style, and a style the document lacks comes along with
          all its formatting; the RTF's styles start from its defaults (\*\defchp, \*\defpap, else the default font,
          12 pt and no spacing), without a stylesheet the paragraphs are in Word's own Normal (Aptos 12 pt, 8 pt
          after, 1.16 lines); character formatting lasts until \plain or the end of its group, paragraph formatting
          until \pard; fonts by their charset's code page, Unicode with its fallback; list labels from \listtext and
          \pntext; fields with their instructions and results; PNG, JPEG, EMF and WMF pictures; tables from their
          rows' cell boundaries, gaps, paddings, borders, shading and merges (docx/local/altchunk-rtf, altchunk-rtf2:
          Word's own RTF among them, lines within 0.3 pt). Known deviations: an RTF chunk's nested tables are
          flattened, its footnotes, comments and drawn shapes left out; after an HTML list Word gives the first cell
          of a following table no space after; a web archive's pictures are left out.

      - id: document.subDoc
        title: Subdocuments (master documents)
        elements: [w:subDoc]
        priority: P3
        difficulty: 2
        status: done
        strategy: Collapsed subdocuments show as their link; expanded ones are already part of the body.
        office: >-
          A collapsed subdocument prints as a paragraph of the default style showing the subdocument's path,
          underlined in the hyperlink color (the Hyperlink style where the document has one, else the theme's) and
          linking to it; expanded subdocuments are part of the body (docx/local/subdoc 99.7 %).

      - id: document.glossary
        title: Building blocks (glossary document)
        elements: [w:glossaryDocument, w:docParts, w:docPart, w:docPartBody, w:docPartPr, w:behaviors, w:behavior,
                   w:category, w:description, w:gallery, w:guid, w:types, w:type, w:name]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered; the glossary holds AutoText and building blocks, and placeholder texts of content controls.
        office: >-
          The glossary document (AutoText, building blocks, placeholder texts) is not printed; content controls
          already hold the placeholder text they show.

  - id: settings
    title: Document settings
    features:
      - id: settings.compatibility
        title: Compatibility mode and options
        description: >-
          w:compatSetting compatibilityMode (11 = Word 2003, 12 = 2007, 14 = 2010, 15 = 2013 and later) and the
          layout options older documents carry; each switches a layout rule of the engine.
        elements: [w:compat, w:compatSetting, w:alignTablesRowByRow, w:allowSpaceOfSameStyleInTable,
                   w:autoSpaceLikeWord95, w:autofitToFirstFixedWidthCell, w:cachedColBalance, w:convMailMergeEsc,
                   w:displayHangulFixedWidth, w:doNotAutofitConstrainedTables, w:doNotBreakConstrainedForcedTable,
                   w:doNotBreakWrappedTables, w:doNotSnapToGridInCell, w:doNotSuppressIndentation,
                   w:doNotSuppressParagraphBorders, w:doNotUseEastAsianBreakRules, w:doNotUseHTMLParagraphAutoSpacing,
                   w:doNotUseIndentAsNumberingTabStop, w:doNotVertAlignCellWithSp, w:doNotVertAlignInTxbx,
                   w:doNotWrapTextWithPunct, w:footnoteLayoutLikeWW8, w:forgetLastTabAlignment, w:growAutofit,
                   w:hdrShapeDefaults, w:layoutRawTableWidth, w:layoutTableRowsApart, w:lineWrapLikeWord6,
                   w:mwSmallCaps, w:noColumnBalance, w:noExtraLineSpacing, w:noLeading, w:noSpaceRaiseLower,
                   w:noTabHangInd, w:printBodyTextBeforeHeader, w:printColBlack, w:relyOnVML,
                   w:selectFldWithFirstOrLastChar, w:shapeDefaults, w:shapeLayoutLikeWW8, w:showBreaksInFrames,
                   w:spacingInWholePoints, w:splitPgBreakAndParaMark, w:subFontBySize, w:suppressBottomSpacing,
                   w:suppressSpBfAfterPgBrk, w:suppressSpacingAtTopOfPage, w:suppressTopSpacing,
                   w:suppressTopSpacingWP, w:swapBordersFacingPages, w:truncateFontHeightsLikeWP6,
                   w:underlineTabInNumList, w:useAltKinsokuLineBreakRules, w:useAnsiKerningPairs, w:useFELayout,
                   w:useNormalStyleForList, w:usePrinterMetrics, w:useSingleBorderforContiguousCells,
                   w:useWord2002TableStyleRules, w:useWord97LineBreakRules, w:wpJustification, w:wpSpaceWidth,
                   w:wrapTrailSpaces, w:adjustLineHeightInTable, w:applyBreakingRules,
                   w:balanceSingleByteDoubleByteWidth, w:doNotExpandShiftReturn, w:doNotLeaveBackslashAlone,
                   w:spaceForUL, w:ulTrailSpace]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          One switch per option in the layout engine, each measured in Word with a generated document that differs
          only in that option. Mode 15 comes first: it is what current Word writes.
        office: >-
          Word lays a document out in its compatibility mode (w:compatSetting compatibilityMode, 12 without one):
          before mode 15 tables put the first cell's text at the indent, or center their left line on the margin where
          no indent is given at all (measured with docx/local/c2-tblpos in modes 11 to 15), and widen percentage
          widths by the outer cells' margins (table.width); before 14 there are no OpenType features and kerning comes
          from the kern table, every pair of it (docx/local/legkern-*: Times New Roman, Calibri and Arial pairs of
          Latin, Cyrillic, Greek, quotation marks and superscripts, in modes 11 and 12 as w:useAnsiKerningPairs alike;
          run.openType); before 15 the hyphenation zone counts (paragraph.hyphenation). Each
          layout option was measured alone in Word in modes 15 and 12 (docx/local/compat15-* and compat12-*: 65
          options on a document of justified, bordered and spaced paragraphs, lists, tabs, small caps, raised text, a
          table and Japanese text), and those that changed anything again with what their rules depend on, in modes
          15, 14, 12 and 11 (c2- to c7-*); each of them switches its rule in the engine. doNotExpandShiftReturn:
          justified lines that end with a manual line break are not stretched. doNotUseHTMLParagraphAutoSpacing: the
          space after a paragraph and the space before the next add up instead of overlapping, and HTML auto spacing
          takes the paragraphs' own values. doNotLeaveBackslashAlone: a backslash in Japanese text (w:lang w:eastAsia
          ja) shows as a yen sign unless its font is an East Asian one. balanceSingleByteDoubleByteWidth: spaces
          beside spaces or East Asian characters are half the font size wide where the run's East Asian font is one,
          and do not squeeze in justified lines. noExtraLineSpacing: exact lines put their baseline below the font's
          ascent and line gap, at the line's bottom at most. suppressTopSpacing: the first line on a page has its
          baseline 9.6 pt below its top where its height is exact, and loses its at-least height less 9.6 pt above its
          text where it is at least, whatever its font (Arial from 8 to 40 pt, Times New Roman, Calibri). Before Word
          2013 only (modes 11 to 14; Word 2013 and later ignore them): mwSmallCaps sets small capitals in the largest
          Macintosh size (7, 9, 10, 12, 14, 18, 24, 36, 48, 60 or 72 pt) below the text's size, 7 pt at least, in the
          line of the text's size; noLeading drops the line gap Word adds to the fonts' win metrics (11 pt Arial lines
          12.29 pt high); suppressTopSpacingWP makes lines as WordPerfect 5 did: the font size and 2 pt high, fixed-
          pitch fonts without the 2 pt, the descent below the baseline; noSpaceRaiseLower leaves raised and lowered
          text out of the line height; splitPgBreakAndParaMark moves the mark after a page break that ends its
          paragraph to the next page as an empty line, and the floating objects after one that begins it
          (docx/local/breakmark-*); suppressSpacingAtTopOfPage drops the extra of at-least and grid
          spacing above the first line on a page; allowSpaceOfSameStyleInTable turns contextual spacing off in table
          cells; doNotUseIndentAsNumberingTabStop lets the tab after a list number pass the hanging indent for a
          custom stop after it, before Word 2013 only (docx/local/numtabind-*: modes 14, 12, 11). In all modes: doNotBreakWrappedTables keeps floating tables whole (table.floating). Before Word 2013 noColumnBalance leaves the columns above a continuous section break unbalanced (section.columns). Below Word's 0.12 pt device grid and not modeled: suppressBottomSpacing (exact lines one dot lower),
          truncateFontHeightsLikeWP6 (glyphs printed one dot smaller, positions within 0.5 %), useWord97LineBreakRules
          (Latin letters up to 0.15 pt, Japanese lines 0.03 pt higher). Measured and not modeled:
          useAltKinsokuLineBreakRules breaks two of 23 Japanese test paragraphs elsewhere in mode 12. Without effect
          on Word's printed output in modes 15 and 12, on the probes' paragraphs, lists, tabs, tables (autofit wider
          than the page, contextual spacing in cells), Japanese text at 23 widths, two columns, a line grid, footnotes
          and page tops: alignTablesRowByRow, autoSpaceLikeWord95, autofitToFirstFixedWidthCell, convMailMergeEsc,
          displayHangulFixedWidth, doNotAutofitConstrainedTables, doNotBreakConstrainedForcedTable,
          doNotSnapToGridInCell, doNotSuppressIndentation, doNotSuppressParagraphBorders,
          doNotUseEastAsianBreakRules, doNotVertAlignCellWithSp,
          doNotVertAlignInTxbx, doNotWrapTextWithPunct, footnoteLayoutLikeWW8, forgetLastTabAlignment, growAutofit,
          layoutRawTableWidth, layoutTableRowsApart, lineWrapLikeWord6, noTabHangInd,
          printBodyTextBeforeHeader, printColBlack, selectFldWithFirstOrLastChar, shapeLayoutLikeWW8,
          showBreaksInFrames, spaceForUL, spacingInWholePoints, subFontBySize, suppressSpBfAfterPgBrk,
          swapBordersFacingPages, ulTrailSpace, underlineTabInNumList, useAnsiKerningPairs (kerning without w:kern),
          useFELayout, useNormalStyleForList, usePrinterMetrics, useSingleBorderforContiguousCells,
          useWord2002TableStyleRules, wpJustification, wpSpaceWidth, wrapTrailSpaces, adjustLineHeightInTable,
          applyBreakingRules, cachedColBalance, and the compatSettings enableOpenTypeFeatures,
          overrideTableStyleFontSizeAndJustification and doNotFlipMirrorIndents set to 0 in mode 15. Measured along
          the way and fixed in the base layout: a paragraph after a table gets HTML auto spacing; contextual spacing
          compares a table's first paragraph with the paragraph before it and the paragraph after it with the table's
          last, works in cells (a cell's first paragraph follows the cell before or the end of the row before), and
          where it drops a space after, the next space before gives only its excess; a table whose style is not based
          on the default table style has no cell margins of its own; small caps set spaces at the small size and keep
          the line of the text's size. Known deviation: Word before 2010 measures Aptos spaces 0.26 pt wider at 11 pt
          (docx/local/c3-lines12).

      - id: settings.view
        title: View settings
        elements: [w:settings, w:view, w:zoom, w:doNotDisplayPageBoundaries, w:displayHorizontalDrawingGridEvery,
                   w:displayVerticalDrawingGridEvery, w:drawingGridHorizontalOrigin, w:drawingGridHorizontalSpacing,
                   w:drawingGridVerticalOrigin, w:drawingGridVerticalSpacing, w:doNotUseMarginsForDrawingGridOrigin,
                   w:readModeInkLockDown, w:showEnvelope, w:clickAndTypeStyle, w:stylePaneFormatFilter,
                   w:stylePaneSortMethod]
        priority: P3
        difficulty: 1
        status: done
        strategy: Editor state; the printed layout does not depend on it.
        office: >-
          View settings (zoom, drawing grid display, page boundaries) do not change the printed layout.

      - id: settings.protection
        title: Protection and privacy
        elements: [w:documentProtection, w:writeProtection, w:removePersonalInformation, w:removeDateAndTime]
        priority: P3
        difficulty: 1
        status: done
        strategy: Only matters to an editor.
        office: >-
          Document and write protection only matter to an editor; nothing is drawn.

      - id: settings.editor
        title: Editor and save options
        elements: [w:attachedTemplate, w:attachedSchema, w:linkStyles, w:styleLockTheme, w:styleLockQFSet,
                   w:autoFormatOverride, w:documentType, w:summaryLength, w:captions, w:caption, w:autoCaptions,
                   w:autoCaption, w:forceUpgrade, w:smartTagType, w:doNotEmbedSmartTags, w:saveXmlDataOnly,
                   w:saveThroughXslt, w:useXSLTWhenSaving, w:saveInvalidXml, w:ignoreMixedContent,
                   w:alwaysMergeEmptyNamespace, w:doNotValidateAgainstSchema, w:doNotDemarcateInvalidXml,
                   w:savePreviewPicture, w:doNotAutoCompressPictures, w:doNotIncludeSubdocsInStats,
                   w:printPostScriptOverText, w:printFractionalCharacterWidth, w14:defaultImageDpi,
                   w14:discardImageEditingData, w14:conflictMode, w15:chartTrackingRefBased, w15:webExtensionLinked,
                   w15:webExtensionCreated, asl:scriptLink]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered.
        office: >-
          Editor settings (attached template, captions, automatic formatting, scripts) draw nothing, except
          w:linkStyles without an attached template: Word updates the styles from its Normal template on opening
          (style.defaults; docx/local/lsk-1; with a template attached that cannot be found nothing changes, lsk-2).

      - id: settings.web
        title: Web page settings and frames
        elements: [w:webSettings, w:frameset, w:frame, w:framesetSplitbar, w:frameLayout, w:title, w:sourceFileName,
                   w:marW, w:marH, w:scrollbar, w:noResizeAllowed, w:linkedToFile, w:longDesc, w:noBorder,
                   w:flatBorders, w:optimizeForBrowser, w:allowPNG, w:doNotRelyOnCSS, w:doNotSaveAsSingleFile,
                   w:doNotOrganizeInFolder, w:doNotUseLongFileNames, w:pixelsPerInch, w:targetScreenSz,
                   w:saveSmartTagsAsXml, w:encoding]
        priority: P3
        difficulty: 2
        status: done
        strategy: >-
          Options for saving as a web page. Frames pages (w:frameset) show their frames' documents side by side only
          in Web Layout; the printed layout shows the frameset document itself.
        office: >-
          Web page options matter only when saving as a web page; a frames page prints the frameset document itself.

      - id: settings.mailMerge
        title: Mail merge
        elements: [w:mailMerge, w:mainDocumentType, w:linkToQuery, w:dataType, w:connectString, w:query, w:dataSource,
                   w:headerSource, w:doNotSuppressBlankLines, w:destination, w:addressFieldName, w:mailSubject,
                   w:mailAsAttachment, w:viewMergedData, w:activeRecord, w:checkErrors, w:odso, w:udl, w:table, w:src,
                   w:colDelim, w:fHdr, w:fieldMapData, w:column, w:lid, w:dynamicAddress, w:mappedName,
                   w:recipients, w:recipientData, w:active, w:uniqueTag]
        priority: P3
        difficulty: 2
        status: done
        strategy: The data source is external; merge fields show their cached results.
        office: >-
          The data source is external: merge fields show their cached results, as printed without merging.

  - id: style
    title: Styles
    features:
      - id: style.definitions
        title: Paragraph, character, table and numbering styles
        elements: [w:styles, w:style, w:name, w:aliases, w:basedOn, w:next, w:link, w:autoRedefine, w:hidden,
                   w:uiPriority, w:semiHidden, w:unhideWhenUsed, w:qFormat, w:locked, w:personal, w:personalCompose,
                   w:personalReply, w:rsid, w:pStyle, w:rStyle, w:tblStyle]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Resolve properties in the order of ISO/IEC 29500 17.7.2: document defaults, table style, numbering,
          paragraph style, run style, direct formatting, each style through its basedOn chain. Toggle properties
          (b, i, caps, smallCaps, strike, dstrike, vanish, emboss, imprint, outline, shadow) flip along the style
          chain instead of overriding.
        office: >-
          Formatting resolves as ISO/IEC 29500 17.7.2 says: document defaults, table style (with its conditional
          formats), numbering, paragraph style, character style and direct formatting, each style through its basedOn
          chain (cycles cut); toggle properties (b, i, caps, smallCaps, strike, dstrike, vanish, emboss, imprint,
          outline, shadow) flip along the chain (17.7.3); default paragraph, character and table styles apply where
          none is named. The default paragraph and table style is the last one marked w:default; without one marked,
          paragraphs take the paragraph style named Normal (in any case, whatever its id), tables none
          (docx/local/nodefault-*, tdef-*). Word keeps its own Normal Table: a table style of that name shows no
          borders, indent or formatting of its own, its cells 5.4 pt margins left and right (docx/local/tn-*). A
          style without w:styleId has its name for an id, as it is, without w:type it is a paragraph style; styles
          are named by id only (docx/local/styleid: neither the name without its spaces or in another case nor a
          name of a style with an id applies; docx/external/poi/60329, by SQL Server Reporting Services). A built-in
          style defined twice under its name in any case is the later definition, also for paragraphs that name the
          earlier one; custom names keep the first (docx/local/dupst-*: "footnote text" of 20 pt, then "Footnote Text",
          prints a paragraph of the first in Normal's 11 pt; tika/testWORD_various). The other elements are for
          editing and change nothing printed.

      - id: style.defaults
        title: Document defaults
        elements: [w:docDefaults, w:rPrDefault, w:pPrDefault]
        priority: P0
        difficulty: 2
        status: done
        strategy: The base of every property chain; Word's own defaults apply where the part leaves a property out.
        office: >-
          w:rPrDefault and w:pPrDefault are the base of every chain; where they leave a property out Word's own
          defaults hold: Times New Roman 10 pt, single spacing, no space between paragraphs (docx/local/defaults-
          empty, 94.3 %). A document without a styles part gets the defaults of Word's Normal template: the theme's
          minor fonts (asciiTheme, hAnsiTheme and eastAsiaTheme minorHAnsi, cstheme minorBidi) at 12 pt, kerning,
          standard and contextual ligatures, 8 pt after paragraphs, 1.16 lines: without a theme part Aptos, Arabic
          outside right-to-left runs falling back to Arial (docx/local/defaults-none, 91.7 %), with a theme its minor
          Latin font, Calibri or Georgia, right-to-left text in Times New Roman (docx/local/thd-nostyles-georgia,
          thd-nodef-calibri; docx/external/libreoffice/extras-ooxmlexport/tdf108496 82 → 96.9 %, tdf104167 84.8 →
          100 %); so does each of w:rPrDefault and w:pPrDefault a styles part leaves out, also in an empty
          w:docDefaults, in every mode (docx/local/nodefaults-none, -empty, -run, -para, thd-emptydef-georgia,
          thd-ppr-georgia, thd-nodef-georgia-12, -14; thd2-b prints as thd2-c, which names the theme fonts). A document whose styles
          update from the template (w:linkStyles) without one attached takes the template's defaults in the theme's
          minor fonts and its Normal style, which states nothing; its other styles stay, based on them (docx/local/
          lsk-1: Arial 10 pt single in Normal turns to 12 pt at 1.16 lines, a heading keeps 16 pt bold;
          docx/external/libreoffice/extras-ooxmlexport/tdf61000). Theme fonts without a theme part are Word's own
          since 2023, Aptos Display and Aptos (lsk-1).

      - id: style.latent
        title: Latent styles
        elements: [w:latentStyles, w:lsdException]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered; settings of built-in styles a document has not used yet.
        office: >-
          Latent style exceptions describe built-in styles a document has not used; nothing is drawn.

  - id: font
    title: Fonts
    features:
      - id: font.table
        title: Font table and substitution
        elements: [w:fonts, w:font, w:altName, w:charset, w:family, w:panose1, w:pitch, w:sig, w:notTrueType]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Fonts a document names but the machine lacks are replaced the way Word does it, using the font table's
          alternate name, PANOSE, family, pitch and character set; shared with pptx `engine.fonts`.
        office: >-
          A family the machine lacks is replaced as Word replaces it: a family known by the name (Word's own: any
          Futura Century Gothic, any Baskerville Baskerville Old Face, Myriad Pro Segoe UI, New York Times New Roman,
          Gill Sans Light and Helvetica Light the Nova families, docx/local/fontnames-plain; PostScript and other
          platforms' names: ArialMT, TimesNewRomanPSMT, Calibri-Bold, Helvetica, Helvetica Neue, Times, Courier,
          Palatino, Geneva, Lucida Grande, and Windows' font substitutes), then the table's w:altName where a family of
          that very name is installed (an altName of Courier or Arial Unicode MS counts for nothing,
          docx/local/fontnames-alt; RP052-Deleted-Para-Mark 90.3 to 100 % of its lines), then a font for
          the table's character set (symbol: Symbol, Shift JIS: Yu Gothic, Hangul: Malgun Gothic, GB 2312: Microsoft
          YaHei, Big5: PMingLiU, Thai: Browallia New; Arabic and Hebrew by the table's family: roman Sakkal Majalla
          and Times New Roman, modern Tahoma, all others Arial, docx/local/font-sub3), else Cambria for serif fonts
          (w:family roman) and fonts the table does not describe and Calibri for all others, whatever their PANOSE,
          signature, pitch or the theme (docx/local/font-sub 94.4 %, font-sub2 98 %, every line within 0.1 pt).
          Caladea and Carlito stand in where Cambria and Calibri are missing too. Of a family's entries the table's
          last one counts, and a character set of 01 means nothing (docx/local/fontdup: OpenSymbol, first roman, then
          auto, prints in Calibri, as in tdf153526_commentInNumbering). A list number's missing complex script font
          becomes Times New Roman instead (see run.complexScript).

      - id: font.embedded
        title: Embedded fonts
        elements: [w:embedRegular, w:embedBold, w:embedItalic, w:embedBoldItalic, w:embedTrueTypeFonts,
                   w:embedSystemFonts, w:saveSubsetFonts]
        priority: P2
        difficulty: 2
        status: done
        strategy: >-
          Embedded fonts are obfuscated TrueType parts (ISO/IEC 29500 17.8.1: the font key GUID XORed over the first
          32 bytes); decode them and use them for layout and output like installed fonts.
        office: >-
          Fonts the font table embeds (w:embedRegular, Bold, Italic, BoldItalic) are decoded when first used:
          obfuscated fonts have their first 32 bytes XORed with the w:fontKey GUID's bytes read from its end (a
          Gabriola Word embedded decodes to the installed file); they stand behind the installed fonts as in Word and
          are embedded into the HTML when the browser lacks them (a renamed embedded family renders as in Word,
          docx/local/embedded-renamed 97.8 %).

      - id: font.theme
        title: Theme fonts
        description: rFonts asciiTheme, hAnsiTheme, eastAsiaTheme and cstheme refer to the theme's major and minor fonts.
        elements: [w:themeFontLang]
        priority: P0
        difficulty: 2
        status: done
        strategy: >-
          Resolve theme font references against a:fontScheme (theme.fonts); w:themeFontLang picks the script-specific
          entries of the theme for East Asian and complex-script text.
        office: >-
          rFonts asciiTheme, hAnsiTheme, eastAsiaTheme and cstheme take the theme's major or minor font of their
          script. Where the theme's East Asian font is empty, and for complex scripts always (the theme's complex
          script font does not count: docx/local/thd2-c, a minor complex script font of Tahoma prints right-to-left
          text in Times New Roman), the theme's a:font for the script of the language w:themeFontLang names (ja-JP:
          Jpan, zh-CN: Hans, zh-TW: Hant, ko-KR: Hang, ar-SA: Arab, he-IL: Hebr …) is taken, for all complex scripts
          alike (thd2-d: ar-SA's Arial for Hebrew too); without one, East Asian text keeps the run's Latin font and
          complex scripts take Times New Roman, both then falling back by glyph; the runs' own languages do not matter
          (docx/local/tf-de, tf-ja, tf-zh, tf-ko, tf-he, tf-none: the East Asian lines within 0.1 pt).

  - id: run
    title: Runs and character formatting
    features:
      - id: run.basic
        title: Runs, fonts, size and color
        elements: [w:r, w:rPr, w:t, w:rStyle, w:b, w:i, w:sz, w:color, w:rFonts, w:lang]
        priority: P0
        difficulty: 2
        status: done
        strategy: >-
          Each run picks one of its four fonts (ascii, hAnsi, eastAsia, cs) per character by Unicode range and the
          w:hint attribute, then is measured and broken into lines by our text engine (engine.lineLayout).
        office: >-
          Widths are the fonts' advances shaped by HarfBuzz at the nominal size (not rounded to the 600 dpi device);
          GPOS kerning only where w:kern is set and the size reaches its threshold, ligatures and contextual
          alternates only per w14:ligatures and w14:cntxtAlts (measured with docx/generated/text-fonts: positions
          within 0.1 pt per line without kerning). Theme fonts and theme colors resolve through the theme and the
          settings' color scheme mapping. Text of automatic color (w:color auto or none) is black, white on dark
          shading: the run's own, else its paragraph's, else its cell's, where 0.30 red + 0.59 green + 0.11 blue of
          it is below 60 of 255 (docx/local/autocolor: 100 shadings of each kind, C00000 and 006400 white, C80000,
          006600 and 3C3C3C black; highlights, even black, change nothing). Characters the run's font lacks fall back per Unicode range as Word's do
          (Segoe UI Symbol and Emoji, Cambria Math, Nirmala UI, Leelawadee, MS Mincho, …), the line growing with them,
          whole clusters together (engine.fonts, docx/local/fallback).

      - id: run.decoration
        title: Underline, strike, caps, highlight, borders and shading
        elements: [w:u, w:strike, w:dstrike, w:caps, w:smallCaps, w:highlight, w:shd, w:bdr, w:vertAlign, w:emboss,
                   w:imprint, w:outline, w:shadow]
        priority: P0
        difficulty: 2
        status: done
        strategy: >-
          Drawn with the glyph runs as SVG: 18 underline styles with their own color, single and double strike,
          highlight and shading behind the line box, run borders merged across adjacent runs with the same border.
        office: >-
          Measured with docx/local/underlines, ulsizes, ulmixed, supsizes, supsizes2 and raised (Arial, Times New
          Roman, Calibri, Courier New, Segoe UI, Cambria, Aptos from 8 to 72 pt). Word draws on its 600 dpi device: a
          single underline from the font's post underline position, as thick as its underline thickness, both in whole
          0.12 pt dots; double lines half as thick (rounded up), the first from half the position, the second ending
          with the single line or 8 dots below the first; thick lines and the heavy patterns fill from the first
          double line to the second; dotted, dashed, long dashed, dot-dash and dot-dot-dash underlines have fixed
          lengths whatever the size (1.44/1.44, 3.96/1.92, 7.92/3.96, 3.0/0.96/0.96/0.96, 2.16/0.72 pt) from the
          underline's start; waves are 2.4 pt long, crests on the page's 2.4 pt grid, 0.24 pt thin (heavy 0.96 pt),
          within half the double band less 3 dots, wavy double splitting it. Neighbouring runs with the same underline
          share one, at their lowest baseline, its lines averaging theirs by width; superscripts underline alone at
          their own baseline; spaces at a line's end stay bare, tabs not; words leaves out spaces. Strikethrough from
          the OS/2 strikeout position and size, double strikethrough that line moved up and down by its thickness.
          Emboss: gray (#999999) copy in place, black copy 1.92 pt up-left, the text 0.96 pt up-left; imprint the same
          down-right; shadow a #C0C0C0 copy a 24th of the size down-right; outline hollow letters stroked 0.14 pt
          (white over a shadow). Run borders take their lines and space (floored to dots) beside the text in the line,
          neighbouring runs with one border sharing a frame over the font's height. Super- and subscripts take the
          font's OS/2 sizes in whole half-points (Calibri 11 pt: 7 pt; Aptos 12 pt: 7 pt), raised by its superscript
          offset or as far as the line's top allows, lowered by its subscript offset or as far as its bottom allows,
          in half-points, and make no line higher (within half a point where the line decides). Small caps are 80 % of
          the size rounded to half points; highlight and shading (patterns mixed over the fill) cover the line's
          natural box as far as its content goes: tabs too, not the spaces that end the line (docx/local/hlspace: a
          paragraph of highlighted or shaded spaces shows none, "Word" and four spaces only the word, a tab after it
          all of it). Known deviations: double and thick underlines of Arial and Courier New below 12 pt stand up to
          3 dots higher; Garamond from 12 pt takes other super- and subscript sizes.

      - id: run.spacing
        title: Character spacing, scale, kerning and position
        elements: [w:spacing, w:w, w:kern, w:position, w:fitText]
        priority: P1
        difficulty: 2
        status: done
        strategy: Applied in measurement; kerning from the font's kern/GPOS data above the w:kern threshold size.
        office: >-
          Character spacing is added after every cluster, horizontal scale stretches the advances, raised and lowered
          text adds what it reaches beyond the line outside the line spacing multiple (text 3 pt up and 3 pt down
          makes a 1.15 line 6 pt higher, not 6.95 pt; docx/generated/character-formats), and lowered text takes as
          much less of the line's ascent, raised text of its descent (docx/local/lowr-*: 48 pt Arial lowered 12 pt
          beside 12 pt text has the baseline 33 pt below the line's top, 45 pt less 12; text all lowered half a point
          stands as unlowered; tdf99602_charStyleSubscript 41.1 to 96.9 %, tdf143384_tableInFoot_negativeMargins
          33.7 to 99.3 %). Known deviation: where characters align their tops, centers or bottoms (w:textAlignment)
          lowered text keeps its whole ascent; Word lets the font's line gap take up the lowering there (lowr-18:
          12 pt lowered 6 pt make the line 5.6 pt higher). Fit text (w:fitText):
          neighboring runs with one id fit together into the width; wider text is scaled horizontally to it, narrower
          text spreads with equal gaps between its characters, the last ending at the width (docx/local/fittext,
          fittext2). Known deviation: Word also narrows spread characters, to between (n - 1)/n of their width (very
          wide fits) and all of it, and quantizes the scale to its 600 dpi font widths; characters here keep their
          width, each standing within about a point of Word's.

      - id: run.hidden
        title: Hidden text
        elements: [w:vanish, w:specVanish, w:webHidden]
        priority: P1
        difficulty: 2
        status: done
        strategy: Hidden runs take no space in the printed layout unless Word is measured to print them.
        office: >-
          Hidden text (w:vanish, w:specVanish) is left out of Word's PDF export and takes no space; the layout drops
          it the same way. A paragraph whose mark is hidden runs into the next one, the joined paragraph in the
          first's formatting (alignment, space before); one whose text is all hidden too is gone; before a table it
          stays without its space after; a cell's last paragraph stays even when all of it is hidden, the body's goes
          (docx/local/hiddenmark).

      - id: run.complexScript
        title: Right-to-left and complex scripts
        elements: [w:rtl, w:cs, w:bCs, w:iCs, w:szCs, w:bdo, w:dir]
        priority: P1
        difficulty: 4
        status: done
        strategy: >-
          Complex-script runs use their own font, size, bold and italic; reordering and shaping as in pptx
          `text.rtl` (done), with w:bdo and w:dir as explicit embeddings.
        office: >-
          Complex script text takes the w:cs font with w:szCs, w:bCs and w:iCs. Bidirectional levels follow UAX #9
          with the paragraph's direction as the base, neutrals of w:rtl and w:dir runs reading right to left and w:bdo
          forcing its direction; lines are reordered between their tabs, right-to-left pieces reach the browser whole
          from their right end (shaped, mirrored brackets) and justification widens their spaces. Clusters of several
          characters (marks, conjuncts, emoji sequences) are drawn whole. In a left-to-right paragraph a right-to-left
          run is an embedding of its own, reversed as a whole with its neutrals ("abc def!" shows "!abc def";
          docx/local/bidi 94.1 %, every line as in Word; fallback-marks 93.3 %). Which characters are complex script
          follows ECMA-376's two steps as Word takes them: by its block a character is ASCII (Basic Latin and the
          right-to-left scripts: Hebrew, Arabic, Syriac, Thaana, the Arabic presentation forms), East Asian or high
          ANSI (all else, Thai and the Indic scripts too, which fall back from the high ANSI font and never take the
          w:cs font); w:cs and w:rtl then make every character complex script in font, size, bold and italic, Latin
          letters and punctuation too, but in a w:rtl run (not w:cs) numbers keep the font of their block with
          complex script size and bold, Arabic-Indic digits always, digits and % $ unless the run's w:lang w:bidi is
          Hebrew; w:hint="cs" changes nothing (docx/local/rtlslot-a to -p, every line as in Word). A w:rtl or w:cs
          paragraph mark measures its empty line in its w:cs font. A right-to-left paragraph's list number takes the
          rules of a w:rtl run but for its left-to-right letters ("1." beside Arabic: "1" Times New Roman, "."
          Aharoni; "a." "a" in the ASCII font), a left-to-right paragraph's none, whatever the w:rtl of its mark or
          level, and a number's missing w:cs font becomes Times New Roman (docx/local/rtlnum-a to -o). Hebrew text
          set in Times New Roman beside Aharoni lines had made every line taller (docx/external/powertools/
          HC002-Hebrew-01, HC003-Hebrew-02, HC012-Test-07, HC014-RTL-Table-01 from 2–26 % to 100 % of their lines).

      - id: run.content
        title: Breaks, symbols and special characters
        elements: [w:br, w:cr, w:tab, w:sym, w:noBreakHyphen, w:softHyphen, w:lastRenderedPageBreak, w:dayLong,
                   w:dayShort, w:monthLong, w:monthShort, w:yearLong, w:yearShort, w16se:symEx]
        priority: P0
        difficulty: 2
        status: done
        strategy: >-
          Page, column and text-wrapping breaks (with clear) go to the layout engine; w:sym characters are drawn from
          their symbol font (private use area F000-F0FF). w:lastRenderedPageBreak is where Word broke the page when
          it last saved: not rendered, but a free check of our pagination.
        office: >-
          Page and column breaks go to the paginator. One that begins a paragraph comes before it where the rest goes
          on in the next page or column: the number, the space before (what it has more than the space after above it)
          and the text (docx/local/leadbreak-a … -k, breakmark2-*; docx/external/libreoffice/extras-ooxmlexport/
          wDateValueFormat, tdf153964_topMarginAfterBreak15: 52 of 60 pt after a paragraph with 8 pt after). A column
          break always takes the paragraph mark along, which then holds a line of the next column or page, with the
          floating objects anchored to it, also after text; a page break only where text or an inline picture follows
          or w:splitPgBreakAndParaMark says so, which Word 2013 and later ignore (docx/local/breakmark-*, breakmark3-*,
          breakmark4-* in modes 11, 14 and 15; tdf153613_anchoredAfterPgBreak, -2, -3; tdf153592_columnBreaks). Where a
          content control starts before the break, as around a table of contents, the break ends the first line like
          any other and the space before stays behind (leadbreak-j, -m … -q; tdf154478). In table cells page and column
          breaks break nothing at all, the text going on in its line, in text boxes they end the line (docx/local/cb-1
          to cb-5 in modes 14 and 15; fdo68607, table-pagebreak, tdf163178_columnbreakInTable). Text wrapping breaks (and
          w:cr) end the line; with w:clear the next line moves below the floating objects of the side it clears (an
          object on the left half of the column is on the left; docx/local/br-clear 99.8 %). Tabs go to the tab stops; w:sym characters are drawn from their
          symbol font. A line breaking at a soft hyphen shows a hyphen, which has to fit; a no-break hyphen prints the
          font's hyphen kept with the next character; date blocks show today's day, weekday, month, month name and
          year in the run's language, else the regional one (docx/local/run-content 96.6 %). w:lastRenderedPageBreak
          and w16se:symEx (its fallback character is taken) draw nothing of their own. Line feeds and carriage returns
          kept in w:t show as spaces (CR LF as one), tabs as tabs (docx/local/wtcontrol;
          docx/external/libreoffice/extras-uiwriter/tdf134021: table cells ending in a line feed stay one line high).
          Without xml:space="preserve" on the w:t itself or on w:document the spaces, tabs and line ends at the ends
          of its text are dropped and tabs inside show as spaces, the spaces inside and no-break spaces kept;
          xml:space on w:body, the paragraph or the run does not count (docx/local/ws-1 to ws-5;
          docx/external/libreoffice/extras-ooxmlimport/xml_space, tdf124670).

      - id: run.ruby
        title: Ruby (phonetic guides)
        elements: [w:ruby, w:rubyPr, w:rubyAlign, w:hps, w:hpsRaise, w:hpsBaseText, w:lid, w:dirty, w:rt, w:rubyBase]
        priority: P2
        difficulty: 4
        status: done
        strategy: Ruby text set above the base text in its own size, aligned by w:rubyAlign; raises the line height.
        office: >-
          Ruby sets its phonetic text w:hpsRaise above its base, centered, left or right over it or spread over it
          (distributeLetter: the gaps between its letters; distributeSpace: also half a gap at either end); a ruby
          wider than its base spans its own width with the base centered under it; rightVertical runs it down the
          base's right, centered on the base; the line makes room for it (docx/local/ruby: the lines' baselines within
          0.1 pt).

      - id: run.eastAsian
        title: East Asian layout and emphasis marks
        elements: [w:eastAsianLayout, w:em]
        priority: P2
        difficulty: 4
        status: done
        strategy: Combined characters, horizontal-in-vertical text, two lines in one and emphasis marks.
        office: >-
          Emphasis marks (w:em) over every character but spaces, measured at 12 pt: a dot (U+FF0E) or comma (U+3001)
          in the run's font 0.33 em in and 1.01 em above the baseline, a ring (U+02DA, Batang) 0.34 em in and 0.29 em
          above, a dot below (SimSun) 0.3 em in and 0.38 em below. Two lines in one (w:eastAsianLayout w:combine): the
          text's halves in half size above one another, between full-size brackets (docx/local/ruby). Text across the
          line (w:eastAsianLayout w:vert, horizontal in vertical text) is a little line of its own turned a quarter
          counterclockwise against its line, in any text direction (horizontal text too): along the line it takes the
          height of a line across it (a vertical line's in horizontal text, a horizontal one's in vertical text), its
          baseline that line's ascent from where it begins; across the line it is centered on the middle of its font's
          win ascent and descent and makes the line as thick as it is long; w:vertCompress changes nothing in Word's
          printout (docx/local/vertical, vertical2, vertical3: Yu Mincho, MS Mincho, Meiryo, 2 to 6 digits, lines
          within 0.1 to 0.3 pt).

      - id: run.textEffects
        title: Text effects (Word 2010)
        description: Glow, shadow, reflection, outline, gradient fill and 3D formats on text.
        elements: [w14:glow, w14:shadow, w14:reflection, w14:textOutline, w14:textFill, w14:scene3d, w14:props3d,
                   w14:alpha, w14:bevel, w14:bevelB, w14:bevelT, w14:camera, w14:contourClr, w14:extrusionClr,
                   w14:fillToRect, w14:gradFill, w14:gs, w14:gsLst, w14:hueMod, w14:lightRig, w14:lin, w14:lum,
                   w14:lumMod, w14:lumOff, w14:miter, w14:noFill, w14:path, w14:prstDash, w14:rot, w14:round,
                   w14:sat, w14:satMod, w14:satOff, w14:schemeClr, w14:shade, w14:solidFill, w14:srgbClr, w14:tint]
        priority: P1
        difficulty: 3
        status: done
        strategy: >-
          Word's copy of the DrawingML text effects in the w14 namespace; map them onto the shared effect renderer
          (pptx `text.fillOutline`, `text.effects` and `text.threeD`, done).
        office: >-
          w14:glow, w14:shadow and w14:reflection are drawn by the effect filter shared with PowerPoint (sized with
          the font; text reflects about its baseline), w14:textOutline as a stroke, w14:textFill as a solid, gradient
          or no fill. A color's w14:alpha is its transparency, not its opacity as a:alpha (docx/local/w14alpha,
          w14shadow: fills, outlines and shadows of w14:alpha 20000, 50000 and 80000 print at 80, 50 and 20 % opacity;
          docx/external/libreoffice/writerfilter-dmapper/tdf152884_Char_Transparency 11.3 → 100 %,
          semi-transparent-text 73.3 → 100 %). The line makes room for the effects outside its spacing: a glow 0.778 of its radius, a shadow
          1.046 of its blur plus or minus its vertical offset, both at (size / 78)^0.695, a reflection size × (0.944
          end − 0.21) and 0.0566 size per point of its distance (docx/local/text-effects*, Arial 12 to 96 pt, lines
          within 0.3 pt; docx/generated/shapes-effects 99.1 %). 3D text (w14:props3d with a bevel, depth or contour,
          w14:scene3d) Word draws as pictures of its lit glyphs; here it is PowerPoint's 3D text (pptx text.threeD) in
          the run's place, its baseline on the run's, under the run's light rig and always facing the viewer (a
          perspective camera draws as the front view in Word too); the glyphs' counters are holes the bevel runs into
          (docx/local/text-3d: bevels, depth with a contour, metal, perspective, 78 %). Known deviations: Word's bevels
          are smoother at sharp corners and lit somewhat differently; a document draws its first 400 characters of 12 pt
          (fewer of larger ones) of 3D text as bodies, the rest flat, as each 48 pt character takes 85 to 420 KB of
          markup (docx/external/libreoffice/writerfilter-dmapper/fdo78333-1-minimized: a page of it ran out of memory).

      - id: run.openType
        title: OpenType features
        elements: [w14:ligatures, w14:numForm, w14:numSpacing, w14:stylisticSets, w14:styleSet, w14:cntxtAlts]
        priority: P2
        difficulty: 3
        status: done
        strategy: >-
          OpenType features of the shaper (HarfBuzz, as in pptx `text.runs`): liga, clig, hlig and dlig by the ligature
          setting, lnum or onum, pnum or tnum, ss01 to ss20 and calt.
        office: >-
          The run's OpenType features go to the shaper and to the browser: liga and clig by w14:ligatures (standard),
          calt by w14:ligatures (contextual) or w14:cntxtAlts, hlig and dlig, lnum or onum by w14:numForm, pnum or
          tnum by w14:numSpacing, ss01 to ss20 by w14:stylisticSets (docx/local/opentype: all 63 lines within 0.1 pt,
          every glyph Word's, Gabriola's contextual swashes included). The browser shapes every character that has a
          position of its own alone, so words with ligatures or contextual glyphs reach it whole with dx shifts, the
          other words keep the position of every character. Arabic script takes the font's own kerning, ligatures and
          contextual forms whatever w:kern and w14:ligatures say (Persian in Traditional Arabic is as wide as shaped
          with them, with w:kern and without, 445 against 465 pt over 34 words, "تم" in its ligature; the Latin
          letters of a w:rtl run stay unkerned: docx/local/csfeat-a, -b, -d), and its letters do not join across a
          bidirectional control, which ends Word's shaping run (Persian words with a right-to-left mark after their
          prefix, 29 of 30 as wide as shaped apart). The browser, which shapes right-to-left text whole, does the same.
          docx/external/libreoffice/extras-uiwriter/tdf104649 and powertools/RP/RP051-Arabic then break 95 % of their
          lines as Word does (65 and 54 % before).

      - id: run.animated
        title: Animated text
        elements: [w:effect]
        priority: P3
        difficulty: 1
        status: done
        strategy: Screen-only effects of old Word versions (blinking, marching ants); not printed.
        office: >-
          Animated text (w:effect) prints as plain text, as in Word (docx/local/misc-nothing).

  - id: paragraph
    title: Paragraphs
    features:
      - id: paragraph.basic
        title: Paragraphs, alignment and indentation
        elements: [w:p, w:pPr, w:pStyle, w:jc, w:ind, w:mirrorIndents]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Left, right, first-line and hanging indents (mirrored on even pages with w:mirrorIndents); alignment left,
          center, right, justified, distributed and the Arabic kashida variants.
        office: >-
          Justified lines may squeeze the spaces between their words to take one more word: where the spaces shrink
          less than half as much as the spaces of the line without the word would stretch, and by less than a quarter
          (docx/local/compress3: 225 lines of random words alike; compress, compress2: a Russian line taken at 23.6 %,
          not at 25.9 %; jc-compress: ten Courier New words fit a column 12 pt narrower than they are, not 13 pt);
          left, centered and right aligned lines take no word that does not fit (docx/local/jc-left). Centered and
          right aligned lines are laid out as left aligned, tabs and list numbers with them, and move as a whole by
          the room left before the paragraph's own right edge, also where a stop took the line past it
          (docx/local/numcenter: "a", a tab and "b" centered, a number with its tab, every line within 0.1 pt;
          tdf135774_numberingShading 9.8 to 99.9 %, tdf95213 57.2 to 95.3 %; DA034-HeaderFooter: a centered footer
          whose right tab takes its text past the margin stays put). The last line of a justified
          paragraph keeps its natural spacing unless it was squeezed. Mirrored indents (w:mirrorIndents) trade the
          left and right indent on pages with even numbers, the lines breaking as on odd pages (docx/local/mirror:
          every line as in Word). Medium and high kashida justification lengthen every Arabic word by two or three
          kashidas at one joining place, chosen by the Arabic justification priorities (after seen or sad, before a
          final teh marbuta, heh or dal, before a final alef, tah, lam or kaf, before a medial beh, before a final
          waw, ain, qaf or feh, before another final letter), and justify with them (docx/local/kashida). Known
          deviations: low kashida justification widens spaces where Word inserts single kashidas; lines with kashidas
          break up to a word differently.

      - id: paragraph.spacing
        title: Line and paragraph spacing
        elements: [w:spacing, w:contextualSpacing]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Line spacing auto (multiples of the font's single line height), exact and at least; spacing before and
          after, auto spacing of HTML paragraphs, contextual spacing between paragraphs of the same style. How Word
          derives single line height from the font tables is measured, not assumed.
        office: >-
          A single line is the font's hhea ascender, descender and line gap; the baseline lies the larger of the line
          gaps (hhea against OS/2 win, as DirectWrite does; OS/2 typo metrics where USE_TYPO_METRICS is set) plus the
          ascent below the line's top. Fonts for East Asian code pages (OS/2 ulCodePageRange1 bits 17 to 21) are 1.3
          times their win ascent and descent high, the extra half above and half below, their line gap ignored
          (docx/local/ea-lines: MS Gothic, MS Mincho, Yu Gothic, SimSun, Malgun Gothic, Microsoft YaHei). Auto spacing
          multiplies the line and puts the extra below the text; below single spacing the line loses its share above
          the baseline and below it alike (docx/local/linemult-120 to -192, in modes 12, 14 and 15: Arial, Times New
          Roman, Calibri, Cambria and Traditional Arabic at 0.5 to 0.8 within 0.13 pt; negative values do not
          count), exact spacing puts the baseline at 80 % of the height
          whatever the font, at least spacing puts the extra above (measured with 14 fonts, docx/local/lm-*). The
          space between paragraphs is the larger of the space after the one and before the next (docx/generated/text-
          basic, as ISO/IEC 29500 17.3.1.33 says); contextual spacing drops both between paragraphs of the same style.
          HTML auto spacing (14 pt) in table cells lies between a cell's blocks, after a nested table too, none at the
          cell's top or bottom (docx/local/autospace-cells-15, -14).

      - id: paragraph.pagination
        title: Keep with next, keep lines together, widow control, page break before
        elements: [w:keepNext, w:keepLines, w:widowControl, w:pageBreakBefore]
        priority: P0
        difficulty: 4
        status: done
        strategy: Constraints for the page breaker (engine.pagination).
        office: >-
          At the top of a page the space before is kept on the document's first page, after a section break only what
          it has more than the space after the section's last paragraph, and dropped after page and column breaks,
          page break before and natural breaks (docx/local/sp-pagetop); before Word 2013 a page break before keeps it
          (docx/local/sptm-11, -12, -14; python-docx/sty-known-styles 33.3 → 100 % of the lines). The extra space of auto line spacing below the
          last line may hang past the bottom margin (a line whose text ends 0.4 pt above the margin stays,
          docx/generated/headers-footers). Keep with next, keep lines together and widow control move whole paragraphs
          or two lines (docx/generated/breaks). A paragraph that does not fit and cannot break where it stands (a line
          or two, too few lines for widow control, its lines kept together) takes the paragraphs kept with it before
          it to the next page, back to one that can break and give its last lines or one that is not kept with the
          next; reaching the top of the page, they stay and the chain breaks where it must. So a chain begun below
          other text moves to the next page even when it is taller than a page, and lines kept together move although
          they need more than a page (docx/local/kc1 … kc12). The columns of a section that begins below other text
          count as below other text: a chain that does not fit moves on column by column, to the next page
          (docx/local/kcs-2-*, kcs-3-*). A first line that ends in a page or column break needs
          no second line with it, a paragraph that ends with one ends its chain (docx/external/libreoffice/
          extras-ooxmlexport/testPageref: a page break kept with the next paragraph through its style makes no empty
          page); an empty paragraph that holds a continuous section break and takes no room ends a chain too, as one
          that always fits (docx/local/keepsect-k1 to -k4: a heading kept with it stays at the bottom of the page, with
          "x" in the paragraph or without the break it goes on), and a line of nothing but such a break stays on its page, past the bottom too
          (docx/external/libreoffice/extras-ooxmlexport/FDO77715: no empty pages before headings that begin with a
          column break). Tables take part: a row whose first cell's first paragraph is kept with the next one carries
          the chain on to the next row or block and does not break for it, its other cells and paragraphs do not count;
          the first row of the chain that is not kept needs only to begin on the page, all of it where it may not
          split (or has a height at least that does not fit), so a paragraph kept with a table goes along with a first
          row that cannot begin below it. A chain that begins at a row inside a table moves to the next column or page
          the same way (docx/local/tk1 … tk13, tkr-a … tkr-h; docx/external/libreoffice/extras-ooxmlexport/
          tdf104061_tableSectionColumns: a heading row goes on with a row of 173 pt at least).

      - id: paragraph.borders
        title: Paragraph borders and shading
        elements: [w:pBdr, w:top, w:bottom, w:left, w:right, w:between, w:bar, w:shd]
        priority: P1
        difficulty: 3
        status: done
        strategy: >-
          Consecutive paragraphs with identical borders share one box with w:between lines; borders sit outside the
          text by their w:space. Shading fills the box, patterns included.
        office: >-
          Paragraphs with the same borders and indents form one box, whatever their shading (docx/local/bordergroup-*;
          without borders the same shading): the top line above the first, the bottom
          line below the last, the between line between them with its space above and below it; each line and its
          space take room in the paragraph, the space before and after lie outside the box. The shading reaches 1.4 pt
          left and 1.55 pt right of the text (vertically just its lines), the side lines stand their space outside it
          (measured with docx/local/pbdr, all lines within 0.15 pt); the text's left edge is the first line's where it
          hangs, its number's too, and paragraphs of the same left indent but other first lines have boxes of their
          own (docx/local/pbh-*: hanging 360 to 1080 twips, numbered, borders and shading alone, modes 14 and 15,
          within 0.05 pt; poi/52288, checkboxes, libreoffice/extras-ooxmlexport/tdf153964_numberingAfterBreak14). Double and thin-and-thick lines are drawn in their
          strokes as table borders are (a thin-thick top line 3 pt above 0.75 pt, docx/external/poi/FancyFoot);
          headers and footers draw their paragraphs' borders and shading too, and table cells and text boxes, where the
          lines take room alike (docx/external/libreoffice/extras-layout/fdo48718-1: bordered paragraphs in a cell, the
          rows below 3 pt lower each).

      - id: paragraph.tabs
        title: Tab stops
        elements: [w:tabs, w:tab, w:ptab, w:defaultTabStop, w:decimalSymbol]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Left, center, right, decimal and bar tabs with leaders, cleared style tabs, default tab interval;
          absolute position tabs (w:ptab) relative to the margins or indents.
        office: >-
          Leaders repeat their character at its advance rounded to Word's 600 dpi device (dots of Aptos 12 pt every
          3.48 pt), on a grid from the page's left edge, every one that fits between the tab's start and end. Bar tabs
          draw a line through the line and the space after the paragraph. Decimal stops align on the decimal separator
          of the regional settings Word runs with, whatever w:decimalSymbol or the text's language say (docx/local/
          dect-*: with a German comma "1,234.5" aligns on its comma, "1.5" and "12.5" end at the stop, within 0.07 pt;
          powertools/HC024, HC025). A custom stop at or past the right indent holds: from
          Word 2013 on where it is not past the column's or the cell's edge, the rest of the line then reaching up to
          that edge and justified to it where it wraps (not where it ends in a line break, docx/local/jz-a to jz-d),
          the line not breaking next to such tabs (a word that does not fit after them breaks inside where it has no
          other place); before Word 2013 also past the edge, the line then reaching
          22 in into the column (docx/local/tov-a to tov-i, tovc-1 to tovc-12, tv-a to tv-d in modes 15, 14 and 12;
          docx/external/libreoffice/extras-ooxmlexport/tdf77417, extras-ooxmlimport/
          tdf156078_rightTabOutsideParaRightIndent). Default stops past the indent do not hold, except on a line an
          earlier stop took further. From Word 2013 on a left stop past the column's edge moves the tab to the next
          line, where it fills the line; centered, right and decimal stops past it align at the indent, or at the edge
          where an earlier stop took the line there (docx/generated/tabs, docx/local/tab-rules, tab-break). Centered
          and decimal text that would reach past the line's end ends there (tv-c, tv-d). A tab goes to the next line together with the word
          after it where that word does not fit after it (docx/local/lw-6 to lw-10; engine.lineLayout). An absolute position tab (w:ptab) aligns what follows
          it at the left edge, the middle or the right edge of the margins or indents, as a stop of that alignment
          there would (docx/external/poi/ThreeColHead, ThreeColFoot: within 0.1 pt).

      - id: paragraph.frames
        title: Text frames and drop caps
        elements: [w:framePr, w:suppressOverlap]
        priority: P2
        difficulty: 4
        status: done
        strategy: >-
          Paragraphs with w:framePr are positioned like floating objects and text wraps around them; drop caps are
          frames of one large letter spanning w:lines lines.
        office: >-
          Consecutive paragraphs with the same w:framePr form a frame that takes no room in the text: w:w wide or as
          wide as its content, at w:x or aligned (w:xAlign) in its column, the margin or the page, w:y below the next
          paragraph's top, the margin or the page, its first paragraph's space before inside it above its lines
          (docx/local/fb-*: 6 and 12 pt before take its text and the text below it as much lower; fdo78904_fileHang);
          the paragraphs' borders frame it, all the way down where w:h makes it higher than its content, its last
          paragraph's space after inside them (docx/external/libreoffice/extras-ooxmlexport/tdf131420, tdf133702,
          tdf133924: within 0.1 pt); text wraps around it with its
          borders, w:hSpace and w:vSpace kept free (not beside it with notBeside, over it with none). A drop cap is a
          frame of its letter at the start of the next paragraph, whose lines go around it; a margin drop cap stands
          left of the column (docx/local/frames: every line as in Word). Frames in headers and footers stand alike,
          taking no room in their story (docx/external/libreoffice/extras-ooxmlexport/tdf168017: a page number framed
          centered 1 twip below the next paragraph's top stands on that paragraph's line). A paragraph's w:framePr
          overrides its style's attribute by attribute (special_styles), w:x and w:xAlign as one position and w:y and
          w:yAlign as another (docx/local/framepos: a paragraph's w:x of the page, 0 too, over its style's xAlign right
          of the margin; tdf112446_frameStyle), one without any w: attribute makes no frame
          (docx/local/fe-5, fg-7; tdf133457). w:y and w:yAlign count from the margin without w:vAnchor (fd-1, fd-3,
          fd-5); a frame without a vertical position (w:y 0, no w:yAlign or inline) stands at its paragraph before mode
          15 whatever its anchor and on its anchor's top from mode 15 (ff-*, fg-*, fh-*; core-ooxml-pass/fdo81491). The
          body's text goes around frames standing on the page, also lines above them and around those of headers
          (special_styles: an envelope address at the page's bottom; fh-1). Lines above a frame standing with the text
          that it reaches with its w:vSpace go below it (notBeside), the frame keeping its place, and a next frame
          follows them (fi-2, fi-3, fj-2; tdf105035_framePrB: a title and an author line framed with vSpace 187;
          tdf164500_framePrBeforeTable); the last paragraph's space after stands in the frame (fk-*). Before mode 15
          Word draws a frame's inline shapes and groups (VML and DrawingML, not pictures) at the frame's left edge and
          as far below the page's top as the frame stands below where its paragraph would stand in the text, wherever
          they stand in its lines, the text where it belongs (docx/local/framepg-*, frin-*, frio-*: a rectangle after
          "Framed " in a frame at page y 49.8 pt, the first paragraph below a top margin of 27 pt, at 22.75 pt, after a
          13.8 pt line at 8.95 pt, in a frame without a position at the page's top; FDO78590, Tdf147485: a letterhead
          logo 27 pt above its frame, within 0.05 pt).

      - id: paragraph.eastAsian
        title: East Asian line breaking and character grid
        elements: [w:kinsoku, w:wordWrap, w:overflowPunct, w:topLinePunct, w:autoSpaceDE, w:autoSpaceDN,
                   w:textAlignment, w:snapToGrid, w:adjustRightInd, w:characterSpacingControl, w:noLineBreaksAfter,
                   w:noLineBreaksBefore, w:strictFirstAndLastChars, w:noPunctuationKerning]
        priority: P1
        difficulty: 4
        status: done
        strategy: >-
          Kinsoku (characters that may not start or end a line, custom lists in settings), hanging punctuation,
          automatic spacing between Asian and Latin text and digits, punctuation compression, and snapping to the
          section's document grid (section.docGrid).
        office: >-
          Kinsoku (w:kinsoku) with Word's characters per East Asian language of the paragraph's first East Asian
          character, measured with docx/local/kinsoku-chars* (154 candidates each where it would begin and where it
          would end a line): Japanese standard !%),.:;?]}¢°’”‰′″℃、。々〉》」』】〕゛゜ゝゞ・ヽヾ！％），．：；？］｝｡｣､･ﾞﾟ￠ may not begin a
          line and $([\{£¥‘“〈《「『【〔＄（［｛｢￡￥ not end one, w:strictFirstAndLastChars adds the small kana and ー; Simplified
          and Traditional Chinese have their own lists, Korean none, other languages take the Japanese ones. A
          document's own lists (w:noLineBreaksBefore, w:noLineBreaksAfter for a w:lang) replace both of Word's, a
          missing one by none (kinsoku-custom*); Word looks them up as written in code point order, as it writes them.
          East Asian punctuation and full-width forms break like ideographs (a line may end between 。 and 「, ea-
          adjust). Punctuation that may not begin a line hangs past the end instead where w:overflowPunct lets it (on
          by default): before Word 2013 in every paragraph, from then on in justified ones; Japanese ,.’”、。」』】），．］｝｡､,
          Chinese more (kinsoku-chars12-*, -both, -distribute); the line before it fills its width. Only paragraphs
          with East Asian text or an East Asian language for it hang punctuation: a comma after Latin words goes down
          with its word (hangcomma-*; docx/external/poi/bug65649), before Word 2013 with ja-JP as the East Asian
          language it hangs (c3-lines12-*; docx/external/libreoffice/core-ooxml-pass/fdo63164-1), from Word 2013 on the
          language alone does not do (hangcomma-h4, -h7; extras-ooxmlexport/tdf163894). w:wordWrap off
          breaks Latin words anywhere (ea-opts). w:topLinePunct sets an East Asian opening bracket that begins a line
          half its width further left (toplinepunct15/12). In kerned runs (w:kern) an East Asian comma, period or
          closing bracket before another one or an opening bracket loses half its width unless w:noPunctuationKerning
          (ea-punctkern). The automatic space between East Asian and Latin text (w:autoSpaceDE, w:autoSpaceDN, on by
          default) exists only where the document's default East Asian font (w:docDefaults, through the theme) is an
          East Asian one (ea-auto-*: MS Mincho, SimSun, Yu Gothic yes whatever the language; Arial, none, a style's or
          the paragraph mark's no): a quarter of the East Asian character's size after East Asian text, half the Latin
          font's average character width (OS/2) after Latin text (ea-autospace2: Arial, Times New Roman, Calibri,
          Courier New, Segoe UI beside four East Asian fonts within 0.1 pt), none at a line's end. Justified lines
          with East Asian text (where that default font is one) share their free width equally among the gaps after
          and before every East Asian character and after every space, a space 0.45 of its width more and the
          automatic space at an East Asian/Latin boundary once more; distributed lines among all characters where the
          paragraph has East Asian text or the document such a font, else among their spaces (cjk-justify-lines, cjk-
          justify15/12, cjk-justify-western, docx/generated/paragraph-alignment). Before Word 2013 justified lines do
          not squeeze their spaces for one more word. East Asian fonts are their win ascent and descent high and 15 %
          of that more above and below, each rounded to the font's units (ea-pitch: nine fonts at 10.5, 12 and 16 pt
          within 0.003 em). w:textAlignment top, center and bottom align a line's characters by their fonts' win
          ascents and descents (ec-none); punctuation compression (w:characterSpacingControl) and w:adjustRightInd
          changed nothing in Word's printout (ec-*, ea-adjust). Known deviation: custom kinsoku lists not in code
          point order lose different characters in Word than here.

      - id: paragraph.bidi
        title: Right-to-left paragraphs and text direction
        elements: [w:bidi, w:textDirection]
        priority: P1
        difficulty: 4
        status: done
        strategy: Right-to-left paragraphs mirror indents and alignment; vertical text direction in frames and cells.
        office: >-
          A right-to-left paragraph (w:bidi) is laid out from its start edge and mirrored: w:left and w:start indent
          the right side, left and start alignment align right, tab stops count from the right margin and trailing
          spaces hang past the left one (docx/local/bidi: single and justified lines, indents, first line indent,
          tabs, mixed text, numbers and brackets as in Word). Vertical text (w:textDirection) of a section is laid out
          on the page turned a quarter, its header, footer and page border upright (docx/local/vertical, vertical2):
          tbRl runs the lines down from the right margin with East Asian characters upright, btLr the same with all
          text turned, tbRlV and tbLrV from the left margin with East Asian characters upright, lrTbV keeps lines
          across and lays East Asian characters on their side; a section with another direction begins a new page.
          Upright characters are turned a quarter counterclockwise against their line about the middle of their em box
          (half an em above the BASE table's ideographic baseline, else the middle of the win metrics) in their
          vertical forms (OpenType vert). Vertical lines are 1/32 of their size thicker than horizontal ones (1.3
          times that for East Asian fonts), half above and half below the text (docx/local/vertical3, vertical4: Yu
          Mincho, MS Mincho, Meiryo, Yu Gothic and Arial at 8 to 28 pt, single and 1.5 lines; exact and at least
          spacing keep their heights); lines that stack from the left keep the extra of their spacing on the side the
          next line follows. Table cells are table.cells, text boxes drawing.textBoxes, frames paragraph.frames. Known
          deviation: floating drawings on pages of vertical text stand upright where their middles turn to.

      - id: paragraph.hyphenation
        title: Hyphenation
        elements: [w:autoHyphenation, w:consecutiveHyphenLimit, w:hyphenationZone, w:doNotHyphenateCaps,
                   w:suppressAutoHyphens]
        priority: P1
        difficulty: 4
        status: done
        strategy: >-
          Automatic hyphenation per language with our own pattern-based hyphenator; which word breaks Word chooses
          with its proofing dictionaries is measured on generated documents. Soft and non-breaking hyphens are run
          content (run.content).
        office: >-
          Automatic hyphenation (w:autoHyphenation) by Liang's algorithm with the hyph-utf8 patterns of German
          (reformed spelling) and American and British English, by the language of each word (w:lang, else the
          document's culture), at least 2 letters before and 2 (German) or 3 (English) after a break;
          w:suppressAutoHyphens turns it off for a paragraph, w:doNotHyphenateCaps for words in capitals,
          w:consecutiveHyphenLimit limits the lines in a row that end with a hyphen. As Word breaks (measured with
          docx/local/hyph-a to -d and hyph-fit, every line as in Word): the word that does not fit breaks at its last
          place where its part and a hyphen fit; justified lines may squeeze their spaces by 23 % for it (Word takes
          21.9 %, not 25.2 %); other lines break so only where they would end more than the hyphenation zone short:
          0.25 in from Word 2013 on whatever w:hyphenationZone says (zones of 0, 0.25 and 1 in break alike),
          w:hyphenationZone in older compatibility modes; a word longer than a line breaks at its last fitting place;
          a line ending with a hyphen does not end a column or page. Known deviations: Word's own dictionaries may
          allow other places than the patterns (it leaves un-characteristically whole); other languages are not
          hyphenated.

      - id: paragraph.outline
        title: Outline levels and collapsed headings
        elements: [w:outlineLvl, w15:collapsed]
        priority: P2
        difficulty: 1
        status: done
        strategy: Feeds TOC fields and the navigation pane; collapsed headings are expanded in the printed layout.
        office: >-
          Outline levels feed TOC fields and draw nothing (docx/local/misc-nothing); collapsed headings
          (w15:collapsed) are laid out expanded, untested in Word.

      - id: paragraph.htmlDivs
        title: HTML divisions
        description: Paragraphs of documents that came from HTML refer to nested divisions with margins and borders.
        elements: [w:divId, w:divs, w:div, w:divsChild, w:divBdr, w:bodyDiv, w:blockQuote, w:marLeft, w:marRight,
                   w:marTop, w:marBottom]
        priority: P2
        difficulty: 3
        status: done
        strategy: Division margins add to the paragraph indents and spacing; division borders are drawn around their paragraphs.
        office: >-
          Paragraphs of HTML divisions (w:divId) take the margins of their division and the divisions around it as
          indents; bordered divisions frame their paragraphs like paragraph borders at the division's indents, their
          top and bottom lines with their space before the first and after the last paragraph. HTML auto spacing
          (w:beforeAutospacing, w:afterAutospacing) is 14 pt, none before the document's first paragraph or after a
          table (docx/local/html-divs, a page Word converted from HTML: 97.5 %, every line as in Word).

  - id: numbering
    title: Lists and numbering
    features:
      - id: numbering.definitions
        title: Numbering definitions and number formats
        elements: [w:numbering, w:abstractNum, w:abstractNumId, w:num, w:lvl, w:lvlOverride, w:startOverride, w:start,
                   w:lvlText, w:lvlJc, w:numFmt, w:suff, w:lvlRestart, w:isLgl, w:multiLevelType, w:nsid, w:tmpl,
                   w:numStyleLink, w:styleLink, w:numIdMacAtCleanup, w:legacy]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Level text with %1..%9 placeholders, about 60 number formats (decimal, roman, letters, ordinal and cardinal
          text, East Asian, Hebrew, Arabic, Thai, Hindi ...), legal numbering, suffix tab, space or nothing, number
          alignment, the level's run and paragraph properties.
        office: >-
          Level texts with %1 to %9, about 60 number formats (decimal, roman, letters repeated after z, ordinals and
          number words, full-width, enclosed, Chinese, Japanese and Korean counting, Hebrew, Arabic, Thai, Hindi,
          Russian), legal numbering, suffix tab, space or nothing, numbers aligned left, centered or right at the
          first line's indent (docx/local/num-rules). Number words and ordinals follow the paragraph's language
          (English, German, French, Russian; words only below a million); letters repeat up to thirty times, then
          start over; Chinese counting goes digit by digit from 100 (○ for zero); the heavenly stems turn decimal
          after ten; Word 2010's custom formats pad with zeros (docx/external/powertools/LIR001 … LIR020 and
          docx/local/numwords2-*: every number exactly as Word writes it). The tab after a number takes the left
          indent as its stop also where the number ends right at it (an empty number, one right-aligned at the
          indent), leaving the text there; custom and default stops count only after its place, as for other tabs
          (docx/local/emptylabel, tabzero, tabzero2; docx/external/libreoffice/extras-ooxmlexport/tdf153042_largeTab).
          The level's indents and tabs override the paragraph style's (a level indented 360 twips puts a List
          Paragraph, whose style says 720, at 360; docx/generated/lists); where the numbering comes from the paragraph
          style itself, the style's override the level's attribute by attribute (a style's left 1080 with a level's
          left 1620 and hanging 360 makes left 1080, hanging 360; docx/local/styleind-A … -H). The number is drawn in
          the paragraph mark's formatting with the level's run properties over it, but for the mark's shading: a mark
          shaded directly, through its style or in a pattern leaves the number and its tab or space white, only the
          level's own w:shd shades them, while the mark's highlight is theirs (docx/local/labelshd; docx/external/
          libreoffice/extras-tiledrendering/tdf114799_shd, tdf114799_highlight); only its ascent counts in the line
          height, not its descent (a 16 pt number before 12 pt text makes the line 17.52 pt high), and beside nothing
          but drawings the line has no descent at all (docx/local/lt-8, lt-10: a bullet beside a 40 pt shape makes the
          line 40 pt high). A level without w:start counts from 0, where letters and roman numbers show nothing
          (docx/local/ns-*: "0.", "1.", "2." in modes 12 to 15, ".", "A.", "B."; docx/external/libreoffice/
          extras-ooxmlexport/tdf132754). Picture bullets are numbering.pictureBullets.

      - id: numbering.counting
        title: List counters
        elements: [w:numPr, w:ilvl, w:numId]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Counters run per abstract numbering through the whole document (headers, footers and notes keep their own
          state), restart by w:lvlRestart, w:startOverride and numbering instances; measured against Word because the
          specification leaves gaps.
        office: >-
          Instances of one abstract definition count together; an instance with a start override restarts the shared
          counter where it is first used, and the other instances go on from there (5, 6, then 7); a deeper level used
          before a higher one shows the higher one's start and counts from it (7.1.1. then 7.2.); w:lvlRestart 0 never
          restarts; paragraphs numbered through their style continue the same counters (docx/local/num-rules). A
          paragraph of nothing but a section break takes no number and counts for none, in modes 14 and 15 (docx/local/
          sn-1 to sn-6: items 1, 2, an empty numbered section end, then 3; docx/external/libreoffice/extras-ooxmlexport/
          section_break_numbering, tdf170602_exportContext).

      - id: numbering.pictureBullets
        title: Picture bullets
        elements: [w:numPicBullet, w:lvlPicBulletId]
        priority: P2
        difficulty: 3
        status: done
        strategy: The bullet is the picture of w:numPicBullet (VML or DrawingML), sized to the paragraph's font.
        office: >-
          A level with w:lvlPicBulletId shows the picture of its w:numPicBullet (VML or DrawingML) where the number
          would stand, on the baseline, 0.996 × size − 1.97 pt high (from 8 to 48 pt: 6 to 45.85 pt) and as wide as
          its aspect ratio makes it; the tab after it goes on from its end (picture bullet probes Word made, 94 %).

  - id: section
    title: Sections and pages
    features:
      - id: section.page
        title: Page size, margins and section breaks
        elements: [w:sectPr, w:type, w:pgSz, w:pgMar, w:vAlign, w:rtlGutter, w:mirrorMargins, w:gutterAtTop,
                   w:formProt]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Every section starts on a new page, an even or odd page (inserting a blank page) or continues on the same
          page; orientation, margins with gutter, mirrored margins and vertical alignment of the page content.
        office: >-
          Sections start on a new page, continue, or start on an odd or even page; odd and even mean the page numbers,
          not the sheets: an odd page section after a page numbered 1 leaves a blank page even when the restart put
          that page on the second sheet (docx/local/hf-oddpage). With different odd and even headers or mirrored
          margins any section whose first number has the parity of the page before gets a blank page before it
          (docx/local/hf-restart-*). A section on a new page right after a page break begins on the page the break
          began while that holds nothing, an empty paragraph holding the break taking no line there (docx/local/pbs-*:
          no empty page between, also before a landscape section or after a break that ends a paragraph with text; of
          two page breaks one page stays empty; docx/external/poi/bug65649). Before Word 2013 a page break in the
          paragraph that ends a section goes unseen where the next section goes on on the same page (docx/local/pb14*,
          pb12*: "A", a page break holding a continuous section break and "B" on one page, in mode 15 on two;
          docx/external/libreoffice/extras-uiwriter/tdf131963), unless w:splitPgBreakAndParaMark moves the mark and
          the section break after it (pbsp14*, pbsp12*). Blank pages have no header or footer,
          count in NUMPAGES but not in SECTIONPAGES.
          Vertical alignment centers the text from the top margin, with the space before its first paragraph, to the
          space after its last (docx/generated/page-setup, page 4; docx/local/va-1 to va-5 in modes 12 to 15), an empty
          paragraph that only ends the section left out (vb-1 to vb-3); justified (both) it spreads the room left
          evenly between the paragraphs (va-6; extras-ooxmlexport/tdf36117_verticalAdjustment). Known deviation: with
          a frame on the page Word centers otherwise (tdf36117, page 5). Section form protection (w:formProt) only guards
          editing and shows nothing; pages keep their sizes in the HTML whatever a browser can print. What the
          document leaves out comes from Word's Normal template, which depends on the region (measured on German
          Word, docx/local/nosect*): without w:sectPr A4, with one but without w:pgSz Letter; missing margins 2.5 cm,
          the bottom 2 cm, header and footer 0.5 in; regions measuring in inches get Letter and 1 inch.

      - id: section.columns
        title: Columns
        elements: [w:cols, w:col]
        priority: P1
        difficulty: 4
        status: done
        strategy: Equal or individual column widths with separator lines; a continuous section break balances the columns above it.
        office: >-
          An empty paragraph holding a section break after other text of its section takes no room before a
          continuous section (docx/local/colsect-*: no line, no space, in balanced columns too); alone in its section or
          before a new page it is a line as any other. All columns of a continuous section begin below the space after
          the paragraph above it; its first paragraph adds what its space before has more (docx/local/colsp-*). A continuous section break balances the columns above it (before
          Word 2013 not with w:noColumnBalance, docx/local/colsect-h, -i) by height in whole lines: the columns are as
          high as the least multiple of the section's least line height that holds all lines, each filled as far as that
          height lets it with widow, keep-with-next and keep-together rules (a height at which they cannot hold is not
          taken: the last two lines of a paragraph stand together in the first of three columns, docx/local/kcs-3-4);
          the first column holds the space before its
          first paragraph, a column's last line needs its text but not the extra space of multiple line spacing below it,
          nor the space after its paragraph (docx/local/cb-*, cbx-*, cbs-*: ten 13.6 pt lines below 13.5 pt go 5/5, below
          13.6 pt 4/6; cbp-*: four paragraphs of four lines with A after move two lines once the first column passes the
          least multiple of 13.6 pt that holds the second with them, at 27.2 to 57.6 pt before for A = 0 to 24 pt;
          cbq-*: 1.16 lines in multiples of 15.75 pt; cbr*-*: one 27.2 pt line or lines of 20.4 pt keep the 13.6 pt
          grid; docx/generated/page-setup: a heading and 60 lines go 31/30 as the 0.3 pt that moving two lines would
          save stay within one multiple of 16.97 pt, 4 pt would not, docx/local/ps-h*). The columns end below the space after
          their last paragraph; the next section's first paragraph keeps what its space before has more. Separator
          lines are 0.75 pt wide in the middle of the gap, from the columns' top to the bottom of the longest column.
          Columns of different widths (w:equalWidth 0): a paragraph that goes on in another column breaks its rest anew
          at that column's width, in balanced columns too, the balance trying each height with the text flowing anew
          (docx/local/uc-1 to uc-8: 90 and 400 words in columns of 132 and 264 pt, either first; docx/external/
          libreoffice/extras-ooxmlexport/fdo77812, tdf166553_paraStyleAfterBreak, docx/external/openxml-sdk/complex0).

      - id: section.pageBorders
        title: Page borders
        elements: [w:pgBorders, w:top, w:bottom, w:left, w:right, w:alignBordersAndEdges, w:bordersDoNotSurroundHeader,
                   w:bordersDoNotSurroundFooter]
        priority: P2
        difficulty: 3
        status: done
        strategy: >-
          Line borders and the 165 art borders of the format catalog, measured from the page edge or the text,
          on all pages, the first page or all but the first.
        office: >-
          Line borders as Word prints them: from the page's edge a side's outer edge stands its space from the edge,
          from the text its inner edge its space outside the margins and around a header and footer the page has
          (w:bordersDoNotSurroundHeader, w:bordersDoNotSurroundFooter); on all pages, the first or all but the first;
          in front of or behind the text. Lines and gaps are floored to Word's 0.12 pt device dots; double, triple and
          thin-thick lines with white gaps (thin lines 0.75 pt, gaps 0.75 pt, half the width or the width) nest at the
          corners; dotted and dashed lines run between filled corners; embossed and engraved lines in three shades;
          shadows as black bands of the lines' width (docx/generated/page-borders, docx/local/pgb-a, pgb-b, pgb-c:
          line styles 85 to 99.9 %). Waves and stroked dash-dots, pictures in Word, are drawn as lines. Art borders:
          with an art on any side Word draws every side there is with the art and color of the last side at the size
          of the first art (w:sz in points), nothing when the last side has a line; a square tile in each corner,
          which ends a side at the page's edge where the side it meets is left out, and between the corners as many
          tiles as fit of the picture's length in whole device dots plus one, stretched to the side dot by dot (the
          first tiles a dot shorter). The ten basic art borders (black and white dots, dashes and squares, thin, wide
          inline, midline and outline lines) are drawn from their measured geometry, the bottom's and right's tiles as
          Word's own (docx/local/pgb-art2 99.3 %, pgb-art3 99.4 %, sizes 10 to 31 pt). Known deviation: Word's other
          155 art borders are pictures of its own (apples, hearts, trees ...) and are left out.

      - id: section.lineNumbers
        title: Line numbers
        elements: [w:lnNumType, w:suppressLineNumbers]
        priority: P2
        difficulty: 3
        status: done
        strategy: Numbers in the left margin per line, restarting per page, section or never, every n-th line.
        office: >-
          Body lines of numbered sections count, empty ones too, except those of paragraphs with
          w:suppressLineNumbers, tables, notes, headers and footers; the first line has w:start + 1; the count starts
          again on every page (newPage, the default), in every section (newSection) or never (continuous); every
          w:countBy-th number shows, right-aligned w:distance (0.25 in by default) left of its column on the line's
          baseline, in the Line Number style rather than the paragraph's formatting (docx/local/line-numbers 97.8 %).

      - id: section.pageNumbers
        title: Page numbering
        elements: [w:pgNumType, w:pgNum]
        priority: P0
        difficulty: 2
        status: done
        strategy: Number format and restart per section, chapter numbers from heading styles; PAGE fields read them.
        office: >-
          PAGE shows the page number in the section's format (w:pgNumType/@fmt) unless the field's own \* switch names
          one; w:pgNumType/@start restarts the count at the section's first page (docx/local/hf-parity). With chapter
          numbers (w:chapStyle) the number of the last heading of that level on the page or before it, in its level's
          format alone (Chapter B shows B), stands before it with the separator of w:chapSep (hyphen, period, colon,
          em dash, en dash; docx/local/chapter: a page ending one chapter and starting the next shows the next's).

      - id: section.docGrid
        title: Document grid
        elements: [w:docGrid]
        priority: P1
        difficulty: 4
        status: done
        strategy: >-
          Line pitch (lines snap to the grid) and character pitch, the default of East Asian templates; changes the
          line height of every paragraph that snaps to the grid.
        office: >-
          A line grid (w:docGrid type lines, linesAndChars, snapToChars) makes every line of auto spacing in
          paragraphs that snap to it as many whole pitches high as its natural height needs, times its spacing factor,
          the extra half above and half below; exact spacing and w:snapToGrid off keep their heights; headers and
          footers do not snap (docx/local/docgrid: 18 and 15 pt grids with Arial 10 to 30 pt, every line within 0.13
          pt). What ruby and raised text reach beyond a line counts in its natural height there, the whole standing in
          the middle of its pitches (docx/local/rg-*: 11 pt MS Mincho with ruby 10 pt up takes two 18 pt pitches,
          ruby 5 pt up one; poi/61470, tika/testWORD_phonetic 63.2 to 78.1 %). A character grid adds w:charSpace /
          4096 pt to every character (East Asian lines exact, Latin within 0.03 pt a character).

      - id: section.printing
        title: Printer and book fold settings
        elements: [w:paperSrc, w:printerSettings, w:bookFoldPrinting, w:bookFoldPrintingSheets, w:bookFoldRevPrinting,
                   w:printTwoOnOne]
        priority: P3
        difficulty: 2
        status: done
        strategy: Printer trays are ignored; book fold and two pages per sheet change the page geometry and are measured.
        office: >-
          Paper trays and printer settings are ignored. Book fold and two pages per sheet already halve the paper in
          w:pgSz; with w:printTwoOnOne odd pages swap their top and bottom margins, book fold keeps them
          (docx/local/print-twoonone and print-bookfold: every line as in Word).

  - id: headerFooter
    title: Headers and footers
    features:
      - id: headerFooter.parts
        title: Headers and footers
        elements: [w:hdr, w:ftr, w:headerReference, w:footerReference, w:titlePg, w:evenAndOddHeaders]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          First, even and default headers per section, inherited from the previous section when missing; laid out by
          the same engine at w:header/w:footer distance. A header taller than the top margin pushes the body down.
        office: >-
          The header starts w:header below the page's top edge with the space before its first paragraph; the footer
          ends w:footer above the bottom edge with the space after its last. A header reaching below the top margin
          pushes the body down to its end including that space after, a footer reaching above the bottom margin moves
          the body's end up (docx/local/hf-tall, hf-short). The first page of a section with a title page has the
          first header, also the page a continuous section begins at the top of, not the one after a page where it
          has lines (docx/local/hfc-0t, hfc-2t; a page's header is its top's section's), even page numbers the even header when the settings ask for different odd and even headers; a
          section without a header of a type inherits the previous section's, and a type no section gives is an empty
          header; a reference of a type Word does not know is the default one where no default reference is given
          (poi/60293: type="odd" with odd and even headers, 75.0 → 100 % of the lines). Word's footers stand 0.14 pt lower than the footer distance says (its 600 dpi device grid), which
          the layout does not copy. Floating tables of headers and footers stand as in the body and take no room in
          the story; those anchored to its text make it reach as far as they do, the paragraph they are anchored to
          going below them where they begin above it, the story's other text over them; the body's text goes around
          those anchored to the page, and a table of the body below one that leaves it less than half its width
          beside it (docx/external/libreoffice/extras-ooxmlexport/tdf149089, tdf162746, poi/PageSpecificHeadFoot,
          core-header_footer/tdf79639, writerfilter-dmapper/floating-table-header, core-unocore/tdf108272-1-minimal).

  - id: note
    title: Footnotes and endnotes
    features:
      - id: note.footnotes
        title: Footnotes
        elements: [w:footnotes, w:footnote, w:footnoteReference, w:footnoteRef, w:footnotePr, w:separator,
                   w:continuationSeparator, w:pos, w:numStart, w:numRestart, w:numFmt, w15:footnoteColumns]
        priority: P1
        difficulty: 4
        status: done
        strategy: >-
          Footnotes go to the bottom of the page of their reference (or below the text), continue on the next page
          with the continuation separator when they do not fit, and take space from the body (engine.pagination).
        office: >-
          Footnotes are numbered by the order of their references in the format, from the start and with the restarts
          of the section of the reference (w:footnotePr in w:sectPr, else the settings'; decimal by default, counting
          on through the sections; eachSect starts each section anew, eachPage each page, numbered from a second
          layout), their marks drawn in the reference style. A line with references needs room for their notes; where
          the last note does not fit but shows a line, it stays and the note continues on the next page under the
          separator, before that page's own notes, the page taking no more text (Word prints its continuation
          separator as the separator; docx/local/fnpages-a, -d). Lines no page break may come between (those of a
          paragraph keeping its lines together, the first two and the last two under widow control, the last line of
          a paragraph kept with the next and that one's first) make room only for the notes before them: a keep chain
          fills the page as without its own notes, which show what fits below the text, the first that does not fit
          with the lines that do, and go on to the next page, whole notes before its own; such lines whose notes do
          not show (all but the last whole, the last with a line) go to the next page with them unless they begin
          their page, as a chain that cannot break (docx/local/fnkeep-*: 31 cases with Word's pages and note lines;
          known deviation: a chain going on at the top of a page that begins with notes from the page before, which
          Word leaves to those notes alone). Notes left after the last page of text fill pages of their own. The
          notes stand at the bottom of the page, ending at
          the bottom margin, under the separator (144 pt long, its font's strikeout stroke on whole device dots: Aptos
          12 pt 4.3 pt above the baseline and 0.6 pt thick, Times New Roman 10 pt 2.5 and 0.5 pt, Calibri 11 pt 2.8 and
          0.8 pt; docx/generated/notes, docx/local/fbn-*, docx/external/libreoffice/extras-ooxmlexport/tdf90810short); a
          section whose own w:footnotePr puts them beneath the text has them follow its last line (the settings' alone
          do not; docx/local/fnpages-f, -g); pages of several columns spread whole notes into columns of their own
          width, each column taking notes until it holds its share of their height, under one separator at the left,
          every column of text ending above them (docx/local/fnpages-h). Notes of table cells need room with their
          row. Measured with docx/generated/notes and docx/local/fnpages-a to -h: all lines within 0.2 pt but the note
          marks, whose superscripts stand within half a point (run.decoration). Above notes a paragraph's last line
          needs its whole height and the paragraph's space after, from Word 2013 on (docx/local/fbn-*, fbm-*, fbo-*: a
          line of 24.15 pt with 10 pt after fits where 34.15 pt are left above the notes, not 33 pt; without notes 16.1
          pt do, as before Word 2013 with them; docx/external/libreoffice/extras-ooxmlexport/tdf90810short). A note
          without paragraphs takes the room of an empty one, space after included (docx/local/fnempty-*;
          powertools/WC/WC064-Footnote); a separator's paragraphs stand at single spacing without space before or
          after, whatever they and the defaults say (docx/local/fsep-*: the separator 16.2 pt above the note's
          baseline with before 12, after 0, 10 and 20 pt or double spacing; pandoc/golden/notes).

      - id: note.endnotes
        title: Endnotes
        elements: [w:endnotes, w:endnote, w:endnoteReference, w:endnoteRef, w:endnotePr, w:noEndnote]
        priority: P1
        difficulty: 3
        status: done
        strategy: Collected at the end of the section or the document.
        office: >-
          Endnotes follow the document's last paragraph under their separator, in the order of their references, or,
          where the settings put them at the end of sections (w:endnotePr/w:pos sectEnd), follow the text of each
          section's last paragraph, an empty section-break paragraph taking no line before them, unless the section
          has w:noEndnote (then the next section takes them). Their marks follow the format and start of the section
          of the reference, lower roman by default, counting on through the sections (docx/generated/notes,
          docx/local/fnpages-c, -e).

  - id: table
    title: Tables
    features:
      - id: table.structure
        title: Rows, cells, merged cells and nested tables
        elements: [w:tbl, w:tblPr, w:tblGrid, w:gridCol, w:tr, w:trPr, w:tc, w:tcPr, w:tblPrEx, w:gridSpan, w:vMerge,
                   w:hMerge, w:gridBefore, w:gridAfter, w:wBefore, w:wAfter, w:hidden, w:bidiVisual]
        priority: P0
        difficulty: 3
        status: done
        strategy: Grid columns, horizontal spans, vertical merges, rows that skip grid columns, right-to-left tables.
        office: >-
          Grid columns, horizontal spans, vertical merges (a merged cell taller than its rows makes the last one
          higher; where its rows go to different pages its lines, as laid out from the cell's top whatever its
          alignment, stay with the row they end in, those of rows on the next page go on at the top of its first row,
          from Word 2013 on a paragraph that widow control keeps together whole, and the merge's last row there grows to
          hold them: docx/local/vmb*-*, docx/external/poi/bug65649, docx/external/libreoffice/extras-layout/tdf152298;
          known deviation: Word aligns what stays on the first page within its rows there), rows that skip grid
          columns (no lines where no cell is), nested tables, right-to-left tables (the
          first column at the right, the table at the right margin); tables that follow each other directly are joined
          with one line between, an inside line: the first's last row's cell bottoms or inside line against the
          second's first row's cell tops or inside line, neither table's own bottom and top lines (docx/local/tbl-geom,
          tbl-features, tjn-a … tjn-i; docx/external/libreoffice/extras-ooxmlexport/tdf104061_tableSectionColumns).
          Rows with exceptions (w:tblPrEx) have their own table borders, side by side over the table's; between two
          rows each cell brings its own row's inside line, resolved by weight with the other's (docx/local/rowex: a
          row whose inside lines are red and double has them above and below it; docx/external/powertools/RP/
          RP033-Table-Prop-Ex-Change). Horizontal merges of old documents (w:hMerge): a
          cell that continues a merge widens the cell before it, which keeps its content (the continuing cells' does
          not show) and takes the right border of the last (docx/local/hmerge, 99.8 %). A cell's empty last paragraph
          after a nested table takes no room, whatever its spacing and mark (docx/local/nestedend-12, -14, -15).
          What a cell holds is cut at its inside, between its side lines and from below the row's top line to its
          bottom: paragraph borders past the lines or below a row of exact height do not show (docx/external/
          libreoffice/core-layout/para-border-in-cell-clip: Word's clip from the left line's inner edge to the right
          one's; the cut of text is not modeled).

      - id: table.width
        title: Table and column widths (autofit)
        elements: [w:tblW, w:tcW, w:tblLayout, w:tblInd, w:jc, w:tblCellSpacing, w:tblCellMar, w:tcMar, w:top, w:bottom,
                   w:left, w:right, w:start, w:end, w:noWrap, w:tcFitText]
        priority: P0
        difficulty: 5
        status: done
        strategy: >-
          Fixed layout uses the grid; autofit layout computes column widths from the content's minimum and maximum
          widths like Word, which the specification does not describe: measured with generated tables
          (engine.tableLayout).
        office: >-
          Fixed tables use the grid; autofit tables are recomputed as Word does (measured with docx/local/tbl-autofit
          in Courier New, ten cases within 0.15 pt): each column's minimum (its widest unbreakable content) and
          maximum (its content unwrapped, at most 22 inches) with the cells' margins, where narrower than half the
          line beside them that half (docx/local/cellborder), inline pictures with their width;
          a preferred cell width fixes its column; where the maxima fit the columns take them (stretched in proportion
          to them for a wider table width), where the minima fit each gets its minimum and a share of the rest in
          proportion to max - min; where preferred widths do not fit, columns whose contents need more keep their
          minimum and the others give up what is missing in proportion to how much they prefer over their contents'
          minimum (docx/local/tblpic table B, tblpic2, overpref-O1 to -O4 within 0.2 pt: cells preferring 221 pt each
          on 451 pt beside words of 12, 48 and 30 pt take 143.6, 157.1 and 150.3 pt); where cells prefer percentages
          that fit and only columns whose contents need more make the table too wide, the others give up what is
          missing in equal shares (docx/local/t65649-table: four columns of 18 to 38 % give up 1.6 pt each to one of
          6.5 % whose word needs 6.4 pt more; poi/bug65649); a paragraph's negative left indent shrinks its column's
          minimum, a negative right one does not (docx/local/negind); where the contents' own minima do not fit either, those shrink in proportion, preferred widths
          aside (tblpic3 G: pictures of 200, 200 and 100 pt take 180, 180 and 91 pt; docx/external/powertools/WC/
          WC023-Table-4-Row-Image-Before keeps three equal columns although each holds a picture wider than a third);
          a table narrower than its contents' minima grows to them, up to the width available, before they shrink;
          one that prefers more than is available keeps them whole, however wide it becomes, in modes 14 and 15 alike
          (docx/local/tblover-14, -15: pictures of 200 and 250 pt make a table preferring 400 pt 450 pt wide, of 300
          and 250 pt 468 pt, the width between the margins; 700 pt of pictures in one preferring 500 pt; docx/external/
          poi/bug59058: 553.5 pt of spacer pictures in a centered table preferring 552.75 pt); cells preferring more
          than the table give way to its width (tblover T13 to T15);
          widths before and after rows do not widen columns. Cells over several columns widen them where they are too
          narrow together, the narrower spans first: what is missing goes to the columns nothing has given a width yet
          (in proportion to the grid's widths), else to those without a preferred width of their own in proportion to
          their widths, else to the span's last column (docx/local/so-1 to so-10, gw-1 to gw-16: a 300 pt cell over a
          15 pt column and two of 250 pt together makes them 17.2 and 282.8 pt, wherever it stands; over columns
          preferring 100 and 50 pt 100 and 200 pt; a cell over all columns of a table of percentages leaves them theirs;
          rows that contradict each other take the widest; docx/external/libreoffice/extras-ooxmlexport/
          wDateValueFormat, fdo78883). Where the minima shrink, a cell over several columns keeps its contents' minimum,
          its last column taking it from the others (tdf123705: "n/m" stays on one line). Word 2013
          tables start their grid at the indent and move it right by half the left border; older compatibility modes
          put the first cell's text at the indent and let an autofit table as wide as its column end its last cell's
          text at the column's right edge, the cell's margin and the line's middle beyond it (docx/local/tw-12-*,
          tw-14-*, tw-15-*: margins of 0.5 and 8.5 pt reach as far past the right margin, in mode 15 nothing; docx/
          external/libreoffice/core-ooxml-pass/fdo78904_fileHang: 440.7 pt between 432 pt margins); tables nested in
          cells stand as from Word 2013 on in every mode, their left line at the outer cell's text, 100 % as wide as
          that text, tblInd from there, unlike those of text boxes (docx/local/nz-11 to nz-14b; core-text/
          floattable-anchor-height, core-text/fly-minimal-wrap). A nested table needs of its outer column its content
          and the width it prefers itself, not what its cells prefer: wider ones it gives up in the cell (np-1 to np-4,
          np-7: a nested cell of 400 pt or three of 150 pt in an outer cell preferring 200 pt leave the outer columns
          theirs; core-layout/floattable-nested-rowspan, tika/testWORD). Known deviations: a nested table of fixed
          layout Word narrows to its cell (np-5), ours keeps its grid; for a nested table preferring more than the
          outer table leaves it Word widens the outer table past its own preferred width (np-6). Cells of tables without any table style (the document has no
          default table style either) have left and right margins of 0.5 pt (docx/local/tblnostyle-12, -14, -15).
          A percentage width is of the column's width, whatever the indent (docx/local/tpi-1 to tpi-6: 100 % indented
          -15.9 or 36 pt is 450.8 pt wide, ending as far before or past the right margin, in modes 14 and 15;
          docx/external/poi/bug65649).
          A fixed table with a width of its own scales its grid to it, whatever its cells say; a width in points lies
          between the outer lines' middles (with cell spacing too), a percentage between their outer edges, before
          Word 2013 between the middles and wider by the outer cells' margins (docx/local/tblwidth-15, -14,
          tblwidth2-15, -14).

      - id: table.rows
        title: Row height, splitting and header rows
        elements: [w:trHeight, w:cantSplit, w:tblHeader]
        priority: P0
        difficulty: 4
        status: done
        strategy: Exact and minimum row heights; rows split across pages unless w:cantSplit; header rows repeat on every page.
        office: >-
          A row is its top line and its content; at-least heights count without the line, exact ones with it. A row's
          cells all take its largest top and bottom margins; an at-least height lies between them, an exact one holds
          the top line and margin and the bottom margin comes below it, in every mode (docx/local/rowmar-11 to -15,
          -12c, -15c: rows of 30 pt at least with margins of 5 and 3 pt and 0.25 pt lines are 38.25 pt apart, rows of
          exactly 30 pt 33 pt; beside a cell with 5 pt at the top and one with 10 pt at the bottom a cell without
          margins puts its text 5 pt down; docx/external/poi/60329). A row
          fits where it and the line that closes the table below it fit (docx/local/tblbottom-*). Rows that do not
          fit split at a line of each cell, a paragraph's last line fitting with its space after, before Word 2013 with
          its cell's bottom margin too (rowmar-11, -12, -14: a line ending 5 pt above the cut over a 10 pt margin goes
          on); header rows, rows of
          exact height, rows that may not split (w:cantSplit), rows whose at-least height does not fit and rows with a
          cell whose first line does not fit move on whole (a picture line that fits without its space after too, and
          from Word 2013 on a paragraph that widow control keeps whole: two lines on each side of the cut or none,
          docx/local/rs3-*); the
          rest of a split row ends below its last paragraph's space after, at least its at-least height, and cells
          aligned to the middle or bottom align again in each part, the first down to its tallest content (tblsplit-*,
          docx/local/rowsplit-*, rowsplit2-*: 13 cases within 0.1 pt); a row of a nested table goes on whole where its
          at-least height does not fit, as the table's own rows do (docx/external/libreoffice/writerfilter-dmapper/
          floattable-nested: an inner row of 85 pt with one line moves to the next page); content that the cut divides goes on at the top
          of the rest, whatever its cell's alignment (docx/local/vs-1 to vs-10: of two centered or bottom-aligned
          lines with one row line on the page the second stands at the next page's top; docx/external/poi/bug65649); a
          nested row cut in two goes on below its line and its cell's top margin again (docx/local/sr-1 to sr-5: 6.15 pt
          further down than a row of the table itself; core-text/floattable-anchor-height). Header rows go with the first row to the next page where it does not fit below them
          (all of it where it may not split, else a line), repeat after every break where the next row fits below
          them and stay off where it does not, which still pushes what follows the table to the next page; a row that
          may not split splits at the top of a page that cannot hold it (tblhdr-*). Where the table breaks the line
          below the page's last row closes it (docx/local/tbl-autofit, tbl-features), and the part on the next page or
          in the next column begins with the table's top line where no header rows stand above it, after a cut in a row
          and between rows, also of floating tables (docx/local/cb-1 to cb-7: a 3 pt outer top line over the continued
          row of a table whose inside lines are 1 pt or none; core-unocore/floattable-split).

      - id: table.borders
        title: Table and cell borders and shading
        elements: [w:tblBorders, w:tcBorders, w:insideH, w:insideV, w:tl2br, w:tr2bl, w:top, w:bottom, w:left, w:right,
                   w:start, w:end, w:shd]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Conflicting borders of adjacent cells are resolved by the rules of ISO/IEC 29500 17.4.66 (weight, style,
          color); with cell spacing every cell keeps its own border. Diagonal borders, shading patterns.
        office: >-
          Every vertical line is centered on its grid line (moved right by half the table's left border); text starts
          the larger of the margin and half the line after it, below the whole top line and the top margin (a 3 pt
          inside line of a table with 0.5 pt outside lines is centered 0.25 pt right of its grid line; docx/local/tbl-
          geom). Where two cells meet each side brings its own border, else the table's, nothing where it is nil or
          none, so the other side's line shows and takes its room (docx/local/nilborder-*, rowborder-*: 21 cases within
          0.1 pt); a line between rows that only the cells above bring with their bottom borders lies in the row's top
          margin and takes room only as far as it is wider (docx/local/cellhlines, cellhlines2: 0.5 pt over margins of
          2.75 pt none, 3 pt 0.25 pt, 0.5 pt over none 0.5 pt; docx/external/libreoffice/core-layout/rtl-table); the
          two are resolved by MS-OI29500 17.4.66: weight (eighths of a point times the style number,
          dotted and dashed 1), style, darker color, a table's thick inside line over a cell's thin own one too; at the
          table's edge a cell's own border wins over the table's. Double lines take three times
          their width, triple five; thin-and-thick lines lie top to bottom and left to right on every side, small gaps
          and thin lines 0.75 pt, medium ones half the width, large gaps the width beside 1.5 pt and 0.75 pt lines
          (docx/local/tblcompound-24, -12, as page borders); dotted and dashed lines are dashed strokes; diagonal
          lines; with cell spacing every cell has its own frame, the cells twice the spacing apart, its content aligned
          vertically as without spacing, a cell merged down framing its rows and the gaps between them and counting in
          the last of them (docx/external/poi/bug57031: a SAS table's two-line heading over two header rows of one line), and an autofit table its text fills as wide as the page with all frames
          (docx/external/poi/bib-chernigovka.netdo.ru_download_docs_17459); a part that goes on on the next page
          begins below its frame's top line and the spacing (docx/local/sb-*: 4.5, 2.9 and 1.5 pt). Shading patterns
          are mixed to a flat color.

      - id: table.styles
        title: Table styles and conditional formatting
        elements: [w:tblStyle, w:tblStylePr, w:tblStyleRowBandSize, w:tblStyleColBandSize, w:tblLook, w:cnfStyle,
                   w:defaultTableStyle]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Whole table, banded rows and columns, first and last row and column and the four corner cells, applied in
          Word's order and switched by w:tblLook.
        office: >-
          The table style along its basedOn chain under the table's own properties; conditional formats in Word's
          order (whole table, column bands, row bands, first and last row, first and last column, corner cells),
          switched by w:tblLook, bands skipping the first and last row and column; a conditional format's borders
          apply at its region's edges, its inside lines inside the region; the style's paragraph and run properties
          sit above the document defaults and under the paragraph style (docx/generated/tables); the row properties of
          the formats of whole rows (w:trPr) under the row's own, so a first-row format's w:tblHeader repeats the first
          row where w:tblLook asks for first-row formatting (docx/local/hc-1, hc-0; docx/external/libreoffice/
          core-ooxml-pass/fdo78904_fileHang). The first-row format
          covers the first row and the header rows (w:tblHeader) right after it, one region for borders; with it off,
          bands still skip the header rows from the top; the last-row format applies to the last row unless it is a
          first row, also to a table's only row, the last column's alike; w:cnfStyle does not count
          (docx/local/hdrstyle, hdrstyle2 … 5).

      - id: table.floating
        title: Floating tables
        elements: [w:tblpPr, w:tblOverlap]
        priority: P1
        difficulty: 4
        status: done
        strategy: Positioned like a frame; text wraps around it (engine.floats).
        office: >-
          Tables with w:tblpPr take no room in the text: their outer left edge stands w:tblpX from their column, the
          margin or the page (or aligns by w:tblpXSpec; before Word 2013 their first cell's text stands there, as at an
          indent: docx/external/libreoffice/core-layout/floattable-compat14, -compat14-body, -compat14-nosplit in modes
          14 and 12, extras-ooxmlexport/fdo68607), their top w:tblpY below the next paragraph's top above its
          space before (docx/local/floatanchor-*), the margin or the page (or aligns by w:tblpYSpec), the margin
          without w:vertAnchor; one without a vertical position (tblpY 0, no tblpYSpec or inline) stands at its
          paragraph before Word 2013 whatever its anchor, at its anchor's top from then on (docx/local/ta-*, tb-*;
          core-layout/floattable-deleted-anchor, writerfilter-dmapper/floattable-header); text wraps
          around them on both sides, their distances kept free (docx/local/float-tables 91.3 %: a column-aligned table
          exactly as in Word). The paragraph after the table adds all its space before to the space after the one
          before it. A table taller than the rest of the page goes on at the top of the next page's body at the same
          place across, its rows split at a line of each cell as in the text (in Word 2013 and before alike), header
          rows repeated, the line below the last row of a page closing each part; the paragraph after it begins at the
          top of its last page (docx/local/floatsplit-*: anchored to the text exactly as in Word; docx/external/
          libreoffice/core-layout/floattable-3pages, floattable-rowsplit, fdo68607 over 8 pages); one anchored to the
          text whose first row does not fit goes to the next page with its paragraph and stands where it would at it,
          also above the top margin (docx/local/fn-1, fn-2, fn-4; core-layout/floattable-next-leaf-in-section). Before Word 2013 a
          table anchored to the page or the margin breaks on its first page where it would at the paragraph after it,
          as many lines down, so past the bottom margin or above it (floatsplit-14p-*, floattable-compat14, docx/
          external/libreoffice/core-doc/floating-table-dummy-text); w:doNotBreakWrappedTables keeps tables whole
          (writerfilter-dmapper/do-not-break-wrapped-tables). Drawings anchored in its cells stand as in other tables
          (extras-ooxmlexport/fdo68607: a title text box above the table; extras-layout/tdf116256). In a table cell a
          floating table stands in the cell's text area (tblpX from its left, the margin as the text, the page from the
          cell's left edge, tblpXSpec right at its right), tblpY below the next paragraph's top or the content's top,
          not above the cell, and the cell's text after it wraps around it; the cell is as high as it reaches (docx/
          local/nf-1 to nf-7, ng-1, ng-2 in modes 12 and 15; core-layout/floattable-del-empty, extras-layout/
          tdf170477, writerfilter-dmapper/floattable-nested-layout); without vertAnchor tblpY counts from the content's
          top, and one without a vertical position not anchored to the text stands in the text as other tables there,
          the text below it (docx/local/nh-*, ni-* in modes 14 and 15); in notes it stays in the text
          (writerfilter-dmapper/floattable-footnote-redline). A table with w:tblOverlap never moves off a floating
          table before it on the page that it would overlap: right of it where it fits in its horizontal anchor's span,
          both distances kept, else below it, its distance left then counting from its place (docx/local/tc-5, td-*;
          core-objectpositioning/floattable-tbl-overlap). Known deviations: a
          table centered on the margin stands about 5 pt further right in Word; of two floating tables after each other
          in a cell Word sets the second below the first before Word 2013, beside it from then on (docx/local/ng-3 to
          ng-5), ours at its paragraph; a line centered beside a floating table centers in its segment in Word (nf-4); tables anchored to the page that do
          not fit, which Word 2013 begins on the next page (docx/local/floatsplit-15p-*); the compatibility setting allowTextAfterFloatingTableBreak (text after
          the table beside its first part; docx/external/libreoffice/writerfilter-dmapper/floattable-wrap-on-all-pages).

      - id: table.cells
        title: Cell alignment, text direction and header cells
        elements: [w:vAlign, w:textDirection, w:hideMark, w:headers, w:header]
        priority: P1
        difficulty: 3
        status: done
        strategy: Vertical alignment, rotated text in cells, cells whose end mark takes no height.
        office: >-
          Vertical alignment; rotated text (tbRl starts at the cell's top right and runs down, btLr at its bottom left
          and runs up; rotated columns are as wide as their lines; docx/local/tbl-features); tbRlV and tbLrV run down
          like tbRl with East Asian characters upright, tbLrV's lines from the left, lrTbV keeps lines across with
          East Asian characters on their side; vertical lines are thicker (paragraph.bidi; docx/local/vertical2,
          vertical5); rotated lines take their text's length from the row, centered or right aligned along the length
          the row gives them (powertools/HC008-Test-03: "notes" centered in a btLr cell keeps its row 72 pt high,
          73.3 → 100 % of the lines); w:noWrap keeps a cell unwrapped in autofit; w:hideMark lets an empty cell take no height. Fit
          text of cells (w:tcFitText) changes nothing in Word's printout: text too long for its cell wraps as in any
          other cell (docx/local/fittext).

      - id: table.accessibility
        title: Table title and description
        elements: [w:tblCaption, w:tblDescription]
        priority: P3
        difficulty: 1
        status: done
        strategy: Alt text of the table in the HTML output.
        office: >-
          A table's caption and description label an invisible element (role img, aria-label "caption: description")
          over the part of the table each page holds.

  - id: field
    title: Fields, hyperlinks and bookmarks
    features:
      - id: field.structure
        title: Simple and complex fields
        elements: [w:fldSimple, w:fldChar, w:instrText, w:delInstrText, w:fldData]
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Show the cached result between the separate and end field characters, nested fields included; which fields
          Word recomputes when it prints (PAGE, NUMPAGES ...) is measured (field.evaluation).
        office: >-
          Field instructions are hidden, results between the separate and end characters show, nested fields included
          (a field inside another's instruction is part of the instruction). The results of PAGE, NUMPAGES and
          SECTIONPAGES are computed after pagination (field.evaluation); others keep their saved result.

      - id: field.evaluation
        title: Field evaluation
        description: >-
          The 72 field codes of the format catalog (field-codes.md): page and section numbers, references, sequences,
          dates, document properties, formulas, IF, TOC and index entries.
        elements: [w:docVars, w:docVar, w:updateFields, w:listSeparator]
        priority: P1
        difficulty: 4
        status: done
        strategy: >-
          Page-dependent fields (PAGE, NUMPAGES, SECTIONPAGES, PAGEREF, STYLEREF in headers) are computed after
          pagination; others keep their cached result unless Word is measured to update them.
        office: >-
          Measured with docx/local/fields, a document whose fields saved wrong results, printed by Word: Word computes
          PAGE, NUMPAGES, SECTIONPAGES, PAGEREF (the bookmark's page in its section's format; \p above, below or on
          page n), REF (the bookmark's text, its paragraph's number), STYLEREF (in a header or footer the first
          paragraph of the style on its page, \l the last, else the last before it; in the body the nearest before the
          field; a heading level or a built-in heading's name in Word's languages; of a character style the text of
          the first or last runs in it, docx/external/libreoffice/extras-ooxmlexport/tdf163894_from_top: a
          dictionary's headers; a header measured for its page's text sees that page's paragraphs of the layout
          before), NOTEREF (the mark of the note in the bookmark, with \f raised as that mark; to a missing bookmark
          Word's error in the instruction's format, bold in every mode, whatever MERGEFORMAT says: docx/local/nref-*,
          powertools/RP043, RP044-Rejected 50 → 100 % of the lines), LISTNUM (in the list of its name, an abstract
          definition's w:name, else Word's default list 1) a) i) (1) (a) (i) 1. a. i. of that name, OutlineDefault and
          LegalDefault too; without a name in the list of the last numbered paragraph, else the default list; at \l's
          level, else one deeper than a LISTNUM before it in its paragraph, else the last one's level without a name
          and the first with one; \s its number; counting with the list's paragraphs: docx/local/lnum-*, powertools/
          RP026 ×3 50 → 100 %, HC048, libreoffice/extras-ooxmlexport/tdf89731), MACROBUTTON without a result (its
          display text, the instruction after the macro's name, in the formats of its runs: powertools/
          DB-HeadersFooters-Dest/Fax, Letter, libreoffice/extras-ooxmlexport/Unsupportedtextfields), SEQ (\c, , \h,
          \s), SECTION, IF
          (numbers or text, wildcards), SYMBOL, DATE, TIME and PRINTDATE (when it prints, in the \@ picture or the
          language's short date and time) and SAVEDATE (when the document was saved), all in the field's language
          (w:lang), not the computer's: its names, its short date and time and its AM and PM as Word has them, none in
          most European languages, upper case in English, the Gregorian calendar in all (docx/local/datelang: 18
          languages on a German Windows); the page-dependent ones come
          from a layout before. PAGE, NUMPAGES and SECTIONPAGES of headers and footers carry the number format
          switches (roman, ROMAN, alphabetic, ALPHABETIC, Arabic, ArabicDash, Ordinal, CardText, OrdText, Hex) and
          about 60 ST_NumberFormat formats; NUMPAGES counts blank pages (docx/local/hf-parity). Word keeps the saved
          results of the others and so does the layout: document properties (AUTHOR, TITLE, DOCPROPERTY), formulas,
          FILENAME, FILESIZE, NUMWORDS, NUMCHARS, USERNAME, DOCVARIABLE, MERGEFIELD, QUOTE, CREATEDATE. Texts Word
          words in the language of its user interface follow the reader's culture, German as measured with
          docx/local/fielderrors (REF and PAGEREF to a missing bookmark, STYLEREF without such a paragraph, SEQ
          without a name, \p "oben", "unten", "Seite n"), else English; Word sets error texts in bold before Word
          2013 (fielderrors-14, -12); a field without an instruction shows nothing. A field Word computes shows its
          result also where the document saved none (no separate character; tdf154478: a PAGEREF of a missing
          bookmark inside a table of contents shows the error text). PAGE, NUMPAGES and PAGEREF print in the format of
          their instruction's first run, not of the saved result, which they keep only with \* MERGEFORMAT
          (docx/local/fldfmt: of a bold begin, an italic instruction, a red 16 pt saved result and a 9 pt end Word
          prints the number italic 12 pt; docx/external/libreoffice/writerfilter-dmapper/tdf158360 75.1 → 83.6 %).
          Known deviation: LISTNUM keeps its saved result.

      - id: field.hyperlinks
        title: Hyperlinks
        elements: [w:hyperlink, a:hlinkClick, a:hlinkHover, a:hlinkMouseOver, a:snd, ahyp:hlinkClr]
        priority: P0
        difficulty: 2
        status: done
        strategy: HTML links on the text and on drawings (as pptx `interactivity.hyperlinks`, done); bookmarks become anchors.
        office: >-
          w:hyperlink (external targets through the relationship, bookmarks through w:anchor) and HYPERLINK fields
          (with \l) make the text a link in the HTML. A table of contents' w:hyperlink entries print as if their runs
          had no character style where it is the Hyperlink style, with or without TOC \h: their direct formatting and
          other character styles show, the style's color, underline, bold and size do not; outside w:hyperlink, outside
          the TOC field and in a HYPERLINK field's result the style shows (docx/local/toclink, toclink-2; 38 documents
          better, among them docx/external/libreoffice/extras-ooxmlexport/fdo78654 52.7 → 92.2 %, powertools/
          HC022-Table-Of-Contents 66.8 → 90.4 %).

      - id: field.bookmarks
        title: Bookmarks
        elements: [w:bookmarkStart, w:bookmarkEnd]
        priority: P1
        difficulty: 1
        status: done
        strategy: HTML anchors; REF and PAGEREF fields and hyperlinks refer to them.
        office: >-
          Bookmarks become HTML anchors where their paragraph begins on its page. A bookmark between paragraphs (as
          before the first paragraph of a content control) starts at the next paragraph and ends after the one before
          (docx/external/libreoffice/extras-ooxmlexport/tdf154478: PAGEREF finds the table of contents heading).

      - id: field.forms
        title: Legacy form fields
        elements: [w:ffData, w:name, w:enabled, w:calcOnExit, w:entryMacro, w:exitMacro, w:helpText, w:statusText,
                   w:checkBox, w:size, w:sizeAuto, w:default, w:checked, w:ddList, w:result, w:listEntry, w:textInput,
                   w:type, w:maxLength, w:format, w:label, w:doNotShadeFormData, w:formsDesign, w:printFormsData,
                   w:saveFormsData]
        priority: P2
        difficulty: 3
        status: done
        strategy: Text fields show their result, check boxes a box in their size (checked or not), drop-downs the selected entry.
        office: >-
          Text inputs show their result, drop-downs their chosen entry (w:result, else w:default). A check box is a
          character of the run's font at its size (w:size, else the font size): its advance the font's line height, a
          square 2.28 pt smaller, 1.08 pt in from its left and above its bottom, in 0.48 pt lines, crossed when
          checked (docx/local/form-boxes: Arial 8 to 36 pt, fixed sizes; docx/generated/form-fields 94.1 %).

      - id: field.citations
        title: Citations and bibliography
        namespaces: [b]
        priority: P3
        difficulty: 2
        status: done
        strategy: CITATION and BIBLIOGRAPHY fields show their cached results; the sources part is data.
        office: >-
          CITATION and BIBLIOGRAPHY fields (and their content controls) show their cached results; the sources part is
          data.

  - id: sdt
    title: Content controls and custom markup
    features:
      - id: sdt.structure
        title: Content controls
        elements: [w:sdt, w:sdtPr, w:sdtContent, w:sdtEndPr, w:alias, w:tag, w:id, w:lock, w:placeholder,
                   w:showingPlcHdr, w:temporary, w:tabIndex, w:docPart, w:alwaysShowPlaceholderText, w15:appearance,
                   w15:color]
        priority: P0
        difficulty: 2
        status: done
        strategy: Block, row, cell and inline content controls render their content; frames and tags are screen-only.
        office: >-
          Block, row, cell and inline content controls render their content; their frames, tags and titles are screen-
          only (docx/generated/content-controls 94.2 %).

      - id: sdt.types
        title: Content control types
        elements: [w:text, w:richText, w:comboBox, w:dropDownList, w:listItem, w:date, w:dateFormat, w:calendar,
                   w:storeMappedDataAs, w:picture, w:equation, w:group, w:citation, w:bibliography, w:docPartObj,
                   w:docPartList, w:docPartGallery, w:docPartCategory, w:docPartUnique, w14:checkbox, w14:checked,
                   w14:checkedState, w14:uncheckedState, w14:entityPicker, w15:repeatingSection,
                   w15:repeatingSectionItem, w15:doNotAllowInsertDeleteSection, w15:sectionTitle]
        priority: P1
        difficulty: 2
        status: done
        strategy: The content is already in the document; check boxes show the symbol of their state.
        office: >-
          Every type prints the content Word stored: the check box's symbol, the chosen list entry, the date as
          formatted, the picture or its placeholder picture, each item of a repeating section; placeholders show their
          placeholder text in its style (docx/generated/content-controls 94.2 %).

      - id: sdt.dataBinding
        title: Data binding
        elements: [w:dataBinding, w15:dataBinding]
        priority: P2
        difficulty: 3
        status: done
        strategy: >-
          Bound content controls take their text from the custom XML part (XPath); whether Word refreshes the
          document's text from the part when it opens is measured.
        office: >-
          Word refreshes bound controls from their data when it opens a document, and so do we: the XPath of
          w:dataBinding (with its prefix mappings) selects a node of the custom XML part with the store item id, or of
          the core or extended properties; text controls show its value, date controls its date in their w:dateFormat
          and w:lid, list controls the matching entry's display text; a missing node keeps the stored text
          (docx/local/binding 98.8 %, every line as in Word). A picture control (w:picture) binds its picture and
          keeps the one it stores (docx/external/libreoffice/extras-ooxmlexport/sdt-picture-databinding 75.5 to
          100 %: a node of base64 data printed as text before). An empty node leaves a control showing its
          placeholder (w:showingPlcHdr) as it is, one without it empty (docx/local/bindempty; poi/60316).

      - id: sdt.customXml
        title: Custom XML markup and smart tags
        elements: [w:customXml, w:customXmlPr, w:attr, w:smartTag, w:smartTagPr, w:showXMLTags]
        priority: P2
        difficulty: 1
        status: done
        strategy: Transparent containers; their content renders as if they were not there.
        office: >-
          Custom XML elements and smart tags are transparent: their runs, paragraphs, tables, rows and cells render as
          if they were not there.

  - id: review
    title: Comments, revisions and proofing
    features:
      - id: review.comments
        title: Comments
        elements: [w:comments, w:comment, w:commentRangeStart, w:commentRangeEnd, w:commentReference,
                   w:annotationRef, w15:commentsEx, w15:commentEx, w15:people, w15:person, w15:presenceInfo]
        namespaces: [w16cid, w16cex, w16cei]
        priority: P2
        difficulty: 3
        status: done
        strategy: >-
          Shown next to the pages (not on them) with their ranges highlighted; whether and how Word's PDF export
          includes comments is measured.
        office: >-
          Without markup Word prints nothing of comments, and neither do we by default: ranges, references and the
          comments part are skipped (docx/generated/revisions). With markup (the converter's markup option, as Word
          prints with markup: docx/local/markup-a, markup-d, markup-e, markup-f, markup-revisions; 84 to 98 %) a
          comment's range is shaded in its author's color at lightness 0.92 between thin brackets of the color, and
          its balloon stands in a gray pane (F2F2F2) 0.1 in right of the text, 3.6 in wide: 23.76 pt into the pane,
          232.97 pt wide, as high as its text with 2.3 pt above and 1.8 pt below, in the shade of the range with an
          outline of 0.48 pt in the author's color, stacked 1.15 pt apart in the order of their places, at their
          line's top where there is room; a dotted line runs from the range's end along the line's bottom to the pane
          and on to 6 pt below the balloon's top. The balloon says "Commented [initials and number]:" in bold Segoe UI
          9 pt, then the comment's text in its own fonts at 9 pt; a reply (w15:commentEx paraIdParent) has its own
          balloon labeled with "R" and the number it answers and no shading of its own; a resolved comment (done) is
          paler (range and balloon at lightness 0.98, outline and line at 0.875, text BFBFBF). Authors take Word's
          eight colors (D13438, 0078D4, 5C2E91, 498205, CC3595, 7160E8, 038387, 6D5700) in the order they appear (Word
          goes on counting over the documents of a session). The page with its pane is made smaller to fit the paper
          Word picks (a standard paper of the page's size within 10 pt, else A4 where the page fits, else Letter), at
          its top left in the middle of its height. Balloons speak German where the culture is German (measured), else
          English. Known deviation: the scale differs from Word's by up to 0.1 % (Word's pane width rounds).

      - id: review.revisions
        title: Tracked changes
        elements: [w:ins, w:del, w:moveFrom, w:moveTo, w:moveFromRangeStart, w:moveFromRangeEnd, w:moveToRangeStart,
                   w:moveToRangeEnd, w:delText, w:rPrChange, w:pPrChange, w:sectPrChange, w:tblPrChange,
                   w:tblPrExChange, w:trPrChange, w:tcPrChange, w:tblGridChange, w:cellIns, w:cellDel, w:cellMerge,
                   w:numberingChange, w:customXml*Range*, w14:conflictIns, w14:conflictDel, w14:customXmlConflict*,
                   w:trackRevisions, w:revisionView, w:doNotTrackMoves, w:doNotTrackFormatting]
        priority: P1
        difficulty: 3
        status: done
        strategy: >-
          Render the document with all changes accepted (final view); a markup view with colored insertions,
          struck deletions and change bars follows Word's simple and all markup views.
        office: >-
          Printed as Word exports without markup by default: insertions and moved-to text stay, deletions and moved-
          from text are left out, deleted table rows (w:trPr/w:del) disappear, a table of nothing but deleted rows with
          them, a paragraph whose mark is deleted or moved away (w:moveFrom) joins the next, also across such a table,
          across the marks of ranges between them (moveFromRangeEnd, bookmarks, comments) and across the edges of
          content controls not bound to data (RP018-MoveFrom-MoveTo-CC 20 → 100 % of the lines, libreoffice/
          core-docnode/tdf150086 and extras-ooxmlexport/tdf150166 0 → 100 %), and keeps its own
          formatting and number (docx/external/powertools/RA001-Tracked-Revisions-01, -02, RP001-* 23.9 → 100 % of the
          lines; RP015-MoveFrom-MoveTo, FA-RevTracking/014-MovedParagraph, tdf104797, tdf123460, tdf149711 54 to 97 %
          of the pixels); formatting changes show the new formatting
          (docx/generated/revisions 91.8 %). With markup (the converter's markup option, Word's "All Markup" with
          comments and formatting in balloons; docx/local/markup-a, markup-b, markup-c, markup-revisions) insertions
          are underlined and deletions struck through in their author's color, moved text dark green (2C6234), struck
          through twice where it was and underlined twice where it is; deleted rows and paragraph marks stay; a change
          bar 0.75 pt wide stands half an inch left of the text beside every line with a change, over neighboring
          changed lines and the space between them; formatting changes of runs, paragraphs and tables get balloons
          ("Formatted:" with what the properties now have that they did not: font, size, bold, italic, underline,
          strikethrough, color, caps, position, highlight, hidden, spacing; alignment, indents, spacing, line spacing,
          keep options; 37 cases word for word as Word's German user interface says them), joined by a dotted line
          from a small triangle at the run's start or at the text's right edge. Without balloons the page keeps its
          size. Known deviation: only the all markup view with Word's default balloons; English balloon texts follow
          Word's terms but were not measured.

      - id: review.permissions
        title: Editing permissions
        elements: [w:permStart, w:permEnd]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered.
        office: >-
          Editable ranges print as gray (#7f7f7f) brackets: a 0.24 pt bar from 0.38 pt below the line's top to 0.22 pt
          above its bottom with 0.6 pt ticks at both ends, opening before the range's first character and closing
          after its last (docx/local/misc-nothing).

      - id: review.proofing
        title: Proofing state
        elements: [w:proofErr, w:noProof, w:proofState, w:hideSpellingErrors, w:hideGrammaticalErrors,
                   w:activeWritingStyle]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered; spelling marks are screen-only.
        office: >-
          Spelling and grammar states and proofing settings draw nothing; Word's squiggles are screen-only
          (docx/local/misc-nothing).

  - id: drawing
    title: Drawing objects in text
    description: How DrawingML objects sit in the text flow; what they draw is the shared DrawingML renderer.
    features:
      - id: drawing.inline
        title: Inline objects
        elements: [w:drawing, wp:inline, wp:extent, wp:effectExtent, wp:docPr, wp:cNvGraphicFramePr]
        priority: P0
        difficulty: 3
        status: done
        strategy: An inline object is one box on the line, standing on the baseline, its effect extent added around it.
        office: >-
          Pictures, shapes, groups, canvases, charts and SmartArt are converted to PresentationML and drawn by the
          slide renderer with the document's theme and color mapping. An inline drawing's box (its extent with the
          effect extents) stands on the baseline as all ascent; the extra of multiple line spacing comes from the
          fonts (a 90 pt picture beside 12 pt Aptos at 1.16 lines makes the line 90 + 3.38 + 2.32 pt high, a picture
          alone 160.5 + 2.32 pt; docx/generated/drawings); a picture alone smaller than its paragraph mark's line
          takes that line's whole height (docx/local/smallpic-single, -115). In modes 11 and 12 (and without a mode)
          Word draws a shape's or a group's extent its effect extent's left and top once more in, the line keeping its
          room, pictures not (docx/local/effx-*: 9 pt left put a shape 18 pt in, from mode 14 on 9 pt; pe-*). A group
          holding a text box that does not wrap (wrap none, as WordArt's) gets its effect extents anew, whatever the
          document says: none left and above, on the right and below its widest outline and 0.05 pt, at least
          0.49 pt (docx/local/ge-*, gh-*; Tdf147485: 9 pt stored on both sides, drawn at its line's start); with text
          boxes that wrap the stored extents hold (tdf149546).

      - id: drawing.anchor
        title: Floating objects and their position
        elements: [wp:anchor, wp:simplePos, wp:positionH, wp:positionV, wp:posOffset, wp:align, wp14:pctPosHOffset,
                   wp14:pctPosVOffset, wp14:sizeRelH, wp14:sizeRelV, wp14:pctWidth, wp14:pctHeight]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Positioned relative to page, margin, column, paragraph, line or character, by offset or alignment, sized
          relative to the page or margins; behind or in front of text, stacked by relativeHeight, kept inside table
          cells with layoutInCell.
        office: >-
          Floating drawings stand at their offset from, or aligned in, the frame wp:positionH and wp:positionV name,
          at a percentage of it, or at wp:simplePos; behind or in front of the text by behindDoc and relativeHeight
          (docx/generated/drawings). The paragraph's top lies above its own space before (below the space after the
          paragraph before), the line's is that of the line holding the anchor (docx/local/anchor-rules, within 0.05
          pt); an anchor in a part of the paragraph in a later column or page counts from that part and its column
          (extras-layout/shape-anchored-in-follow: a rectangle anchored at the end of a paragraph that goes on in the
          next page's second column stands there; extras-ooxmlexport/tdf153613_anchoredAfterPgBreak6); relative to the character counts from the start of the character before the anchor (docx/local/anchor-
          char, within 0.01 pt). In table cells the column and margin across are the cell's text area, the page and
          its margins the cell inside its line, down the page and margins the cell's content, whether layoutInCell is
          set or not (docx/local/cell-anchor). Sizes relative to the page or its margins (wp14:sizeRelH,
          wp14:sizeRelV) apply to shapes as they are and to pictures only both together, scaled evenly to fit
          (docx/local/size-rel-shape, size-rel), each less the effect extents across it (docx/local/relsz-*: 40 % of a
          451.3 pt margin with 1.8 pt of effect extent on the right is 178.7 pt wide, with 1 pt all round 178.5; a
          picture fits into what is left). Alignment places the drawing with its effect extent (wp:effectExtent),
          with or without an effect to fill it, each side where its alignment meets it, across the page and the
          margins (docx/local/sa-d1, sa-d2, sb-*, sc-*: 80 pt left and 36 pt above take a shape centered at the page's
          top 40 pt right and 36 pt down), relatively sized ones too (relsz-3, -4, -5, -7); an offset places the
          extent, but the effect extent in a direction the drawing is sized relative to the page or margins
          (relsz-2, -6, -9 to -11; powertools/WC/WC065-Textbox, DB-GlossaryDocuments/FooterContent-built).

      - id: drawing.wrap
        title: Text wrapping around objects
        elements: [wp:wrapNone, wp:wrapSquare, wp:wrapTight, wp:wrapThrough, wp:wrapTopAndBottom, wp:wrapPolygon,
                   wp:start, wp:lineTo]
        priority: P0
        difficulty: 5
        status: done
        strategy: Square, tight and through wrapping along the wrap polygon, top and bottom, with wrap distances (engine.floats).
        office: >-
          Square wrapping keeps the box with the effect extents and the wrap distances free, top and bottom the whole
          width; tight and through wrapping keep free what of the wrap polygon (21600ths of the extent) lies beside
          each line's text, from its ascent to its descent, with the left and right distances; text goes to both
          sides, the left or right one or the larger (wrapText). Objects push every line of their page, also above
          their anchor (docx/generated/wrapping, docx/generated/wrap-types: all lines within 0.2 pt).

      - id: drawing.shapes
        title: Word shapes
        elements: [wps:wsp, wps:cNvPr, wps:cNvSpPr, wps:cNvCnPr, wps:spPr, wps:style, wps:bodyPr, wp:wsp, wp:cNvPr,
                   wp:cNvSpPr, wp:cNvCnPr, wp:spPr, wp:style, wp:bodyPr]
        priority: P0
        difficulty: 3
        status: done
        strategy: Geometry, fill, line and effects through the shared DrawingML renderer (shape, fill, line and effect areas).
        office: >-
          Word 2010 shapes (wps:wsp) with their style references are drawn as PowerPoint draws DrawingML shapes; the
          Word drawing namespaces are chosen over their VML fallbacks.

      - id: drawing.textBoxes
        title: Text boxes
        elements: [wps:txbx, wps:linkedTxbx, wp:txbx, wp:linkedTxbx, wp:txbxContent, w:txbxContent,
                   w:textboxTightWrap]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          The content is WordprocessingML laid out by our engine inside the shape's text rectangle (bodyPr insets,
          anchoring, rotation, autofit); linked text boxes continue the text from one box to the next.
        office: >-
          A shape's text box content is laid out like body text in the shape's rectangle less the insets of
          wps:bodyPr, measured from the geometry's text rectangle and from the outline's inner edge (half the outline
          further in: 3 pt with a 6 pt outline), at its top, middle or bottom (docx/generated/textboxes). Vertical
          text turns every line a quarter, the insets staying with the shape's sides: vert and eaVert run the lines
          down, the first at the right; vert270 runs them up, the first at the left; mongolianVert and wordArtVert run
          them down, the first at the left; eaVert, mongolianVert and the WordArt kinds set East Asian characters
          upright; vertical lines are thicker (paragraph.bidi; docx/local/vertical6). Linked text boxes (wps:txbx id,
          wps:linkedTxbx id and seq) show the lines of the story that do not fit the boxes before them. A shape that
          resizes to fit (a:spAutoFit) is as high as its text and insets; a box that does not wrap (wrap none) keeps
          its lines whole and widens to the longest (docx/local/textboxes: every case as in Word, 96.7 %). WordArt, a
          text box whose body has a text warp (a:prstTxWarp other than textNoShape), bends its runs as PowerPoint does
          (pptx text.warp), in their fonts, sizes, fills, outlines and effects, into the shape less the body's insets,
          whatever the outline (docx/local/wordartbox: an H in textPlain fills its shape to insets of 0, 7.2 and 3.6 or
          20 pt, 99.8 %; docx/external/libreoffice/tdf152840_WordArt_non_accent_color 30.2 → 98.2 %,
          tdf125885_WordArt3 27.1 → 96.2 %, tdf152896_WordArt_color_darken 9.2 → 95.7 %). A box's empty last
          paragraph after a table takes its line and space after, where a cell's takes none (docx/local/tbxtbl-a, -b,
          -d; powertools/WC/WC050-Table-in-Text-Box). A floating box that resizes to its text (a:spAutoFit) takes
          its text's height where the text around it wraps and where it reaches past the page, not its saved or
          relative height (powertools/DB-GlossaryDocuments/HeaderContent-built, FooterContent-built, DB010-Template:
          boxes saved 69.85 and 110.55 pt high around 52.9 and 33.4 pt of text, 17.6–38.9 → 100 % of the lines;
          openxml-sdk/Complex01). Known deviation: linked boxes of different widths keep the first box's line breaks.

      - id: drawing.groups
        title: Groups
        elements: [wpg:wgp, wpg:cNvGrpSpPr, wpg:grpSpPr, wpg:grpSp, wpg:cNvPr, wpg:cNvFrPr, wpg:graphicFrame, wpg:xfrm,
                   wpg:extLst, wp:wgp, wp:grpSp, wp:grpSpPr, wp:cNvGrpSpPr, wp:cNvFrPr, wp:graphicFrame, wp:xfrm]
        priority: P1
        difficulty: 3
        status: done
        strategy: Child transforms as pptx `shape.group` (done); children may be pictures, shapes, text boxes and graphic frames.
        office: >-
          Groups (wpg:wgp) map their children's space (a:chOff, a:chExt) onto their box, nested groups (wpg:grpSp)
          again; the text boxes of grouped shapes are laid out in their shapes' places and turn with them
          (docx/local/groups: a stretched group, a nested group with a turned star and a text box, 100 %). A group
          without a:chOff and a:chExt maps its children 1:1 from 0 0, so that the offsets of nested groups add up
          (docx/external/libreoffice/extras-ooxmlexport/dml-groupshape-childposition 80.8 → 100 %).

      - id: drawing.canvas
        title: Drawing canvas
        elements: [wpc:wpc, wpc:bg, wpc:whole, wpc:graphicFrame, wp:wpc, wp:bg, wp:whole, lc:lockedCanvas]
        priority: P2
        difficulty: 3
        status: done
        strategy: A canvas is a group with its own background and outline.
        office: >-
          Canvases (wpc:wpc) are drawn as a group in their own coordinates over their background and outline (wpc:bg,
          wpc:whole); their shapes' text boxes and connectors as in groups (docx/local/groups, 100 %).

      - id: drawing.ink
        title: Ink
        elements: [w14:contentPart, w14:nvContentPartPr, w14:cNvPr, w14:cNvContentPartPr, w14:xfrm, w:contentPart,
                   wp:contentPart, wp:nvContentPartPr, wp:cNvContentPartPr]
        priority: P3
        difficulty: 4
        status: done
        strategy: Ink content parts drawn as in pptx `picture.ink` (done).
        office: >-
          Word writes ink (w14:contentPart, wpi) with a picture of it as fallback, which is drawn; ink without one is
          drawn from its InkML part by the ink renderer shared with pptx picture.ink (docx/local/ink 99.9 %).

      - id: drawing.onlineVideo
        title: Online video
        elements: [wp15:webVideoPr, woe:oembed]
        priority: P3
        difficulty: 2
        status: done
        strategy: The poster picture with a link to the video; the printed layout shows the poster only.
        office: >-
          An online video prints as its poster picture (pictures link to their a:hlinkClick on wp:docPr, where Word
          keeps a picture's hyperlink).

  - id: theme
    title: Themes and styles
    features:
      - id: theme.colors
        title: Theme color scheme
        elements: [a:theme, a:themeElements, a:clrScheme, a:dk1, a:lt1, a:dk2, a:lt2, a:accent?, a:hlink, a:folHlink,
                   w:clrSchemeMapping]
        priority: P0
        difficulty: 1
        status: done
        strategy: Shared DrawingML renderer, as pptx `theme.colors` (done).
        office: >-
          Word drawings reach the renderer shared with PowerPoint as their PresentationML counterparts (wps:wsp as
          p:sp, pic:pic as p:pic, wpg as p:grpSp, charts and diagrams as p:graphicFrame) with the document's theme and
          w:clrSchemeMapping; drawn as pptx theme.colors (done). Scheme colors through the theme and
          w:clrSchemeMapping; Verified against Word with docx/generated/graphics (95.1 %; the rest Windows' PDF
          renderer ignoring Chrome's soft masks).

      - id: theme.fonts
        title: Theme fonts
        elements: [a:fontScheme, a:majorFont, a:minorFont, a:font]
        priority: P0
        difficulty: 2
        status: done
        strategy: Shared DrawingML renderer, as pptx `theme.fonts` (done).
        office: >-
          Word drawings reach the renderer shared with PowerPoint as their PresentationML counterparts (wps:wsp as
          p:sp, pic:pic as p:pic, wpg as p:grpSp, charts and diagrams as p:graphicFrame) with the document's theme and
          w:clrSchemeMapping; drawn as pptx theme.fonts (done). The major and minor fonts of charts and SmartArt;
          Verified against Word with docx/generated/charts, charts-more, charts-more2 and charts-more3 (88 to 98 %).

      - id: theme.formatScheme
        title: Theme formats (style matrix)
        elements: [a:fmtScheme, a:fillStyleLst, a:lnStyleLst, a:effectStyleLst, a:effectStyle, a:bgFillStyleLst]
        priority: P0
        difficulty: 2
        status: done
        strategy: Shared DrawingML renderer, as pptx `theme.formatScheme` (done).
        office: >-
          Word drawings reach the renderer shared with PowerPoint as their PresentationML counterparts (wps:wsp as
          p:sp, pic:pic as p:pic, wpg as p:grpSp, charts and diagrams as p:graphicFrame) with the document's theme and
          w:clrSchemeMapping; drawn as pptx theme.formatScheme (done). The fill, line and effect styles of Word's
          default shapes; Verified against Word with docx/generated/graphics (95.1 %; the rest Windows' PDF renderer
          ignoring Chrome's soft masks).

      - id: theme.styleRefs
        title: Shape style references
        elements: [a:style, a:lnRef, a:fillRef, a:effectRef, a:fontRef, pic14:style]
        priority: P0
        difficulty: 2
        status: done
        strategy: Shared DrawingML renderer, as pptx `theme.styleRefs` (done).
        office: >-
          Word drawings reach the renderer shared with PowerPoint as their PresentationML counterparts (wps:wsp as
          p:sp, pic:pic as p:pic, wpg as p:grpSp, charts and diagrams as p:graphicFrame) with the document's theme and
          w:clrSchemeMapping; drawn as pptx theme.styleRefs (done). wps:style with lnRef, fillRef, effectRef and
          fontRef; Verified against Word with docx/generated/graphics (95.1 %; the rest Windows' PDF renderer ignoring
          Chrome's soft masks).

      - id: theme.override
        title: Theme overrides
        elements: [a:themeOverride]
        priority: P2
        difficulty: 1
        status: done
        strategy: Shared DrawingML renderer, as pptx `theme.override` (done).
        office: >-
          Word drawings reach the renderer shared with PowerPoint as their PresentationML counterparts (wps:wsp as
          p:sp, pic:pic as p:pic, wpg as p:grpSp, charts and diagrams as p:graphicFrame) with the document's theme and
          w:clrSchemeMapping; drawn as pptx theme.override (done). Theme overrides of chart parts (a:themeOverride).

      - id: theme.editorData
        title: Object defaults, extra and custom colors
        elements: [a:objectDefaults, a:spDef, a:lnDef, a:txDef, a:extraClrSchemeLst, a:extraClrScheme, a:custClrLst,
                   a:custClr, a:clrMap, thm15:themeFamily]
        priority: P3
        difficulty: 1
        status: done
        strategy: Shared DrawingML renderer, as pptx `theme.editorData` (done).
        office: >-
          Word drawings reach the renderer shared with PowerPoint as their PresentationML counterparts (wps:wsp as
          p:sp, pic:pic as p:pic, wpg as p:grpSp, charts and diagrams as p:graphicFrame) with the document's theme and
          w:clrSchemeMapping; drawn as pptx theme.editorData (done). Nothing to draw: object defaults and extra color
          schemes only serve editing.

  - id: color
    title: Colors
    features:
      - id: color.models
        title: Color models
        elements: [a:srgbClr, a:schemeClr, a:sysClr, a:prstClr, a:hslClr, a:scrgbClr]
        priority: P0
        difficulty: 1
        status: done
        strategy: Shared DrawingML renderer, as pptx `color.models` (done).
        office: >-
          Word drawings reach the renderer shared with PowerPoint as their PresentationML counterparts (wps:wsp as
          p:sp, pic:pic as p:pic, wpg as p:grpSp, charts and diagrams as p:graphicFrame) with the document's theme and
          w:clrSchemeMapping; drawn as pptx color.models (done). Verified against Word with docx/generated/graphics
          (95.1 %; the rest Windows' PDF renderer ignoring Chrome's soft masks); Verified against Word with
          docx/generated/pictures (99.6 %). A run's w:themeColor wins over its w:val, which Word may have written for
          another theme; w:themeShade multiplies the color's HSL lightness by its share of 255, w:themeTint takes it to
          L·t + 1 − t (docx/local/thc-plain: 14 cases exact to one step; pandoc/golden/links: Hyperlink 4F81BD with
          accent1 156082 prints 156082). Shading colors may be named (w:fill="orange" fills FFA500), anything else
          not six hex digits is none (powertools/HC032-Named-Color).

