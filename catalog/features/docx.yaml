        status: todo
        strategy: Shared DrawingML renderer, as pptx `theme.styleRefs` (done).

      - id: theme.override
        title: Theme overrides
        elements: [a:themeOverride]
        priority: P2
        difficulty: 1
        status: todo
        strategy: Shared DrawingML renderer, as pptx `theme.override` (done).

      - id: theme.editorData
        title: Object defaults, extra and custom colors
        elements: [a:objectDefaults, a:spDef, a:lnDef, a:txDef, a:extraClrSchemeLst, a:extraClrScheme, a:custClrLst,
                   a:custClr, a:clrMap, thm15:themeFamily]
        priority: P3
        difficulty: 1
        status: todo
        strategy: Shared DrawingML renderer, as pptx `theme.editorData` (done).

  - id: color
    title: Colors
    features:
      - id: color.models
        title: Color models
        elements: [a:srgbClr, a:schemeClr, a:sysClr, a:prstClr, a:hslClr, a:scrgbClr]
        priority: P0
        difficulty: 1
        status: todo
        strategy: Shared DrawingML renderer, as pptx `color.models` (done).

