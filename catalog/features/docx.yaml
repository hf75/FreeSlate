      - id: table.cells
        title: Cell alignment, text direction and header cells
        elements: [w:vAlign, w:textDirection, w:hideMark, w:headers, w:header]
        priority: P1
        difficulty: 3
        status: done
        strategy: Vertical alignment, rotated text in cells, cells whose end mark takes no height.
        office: >-
          Vertical alignment; rotated text (tbRl starts at the cell's top right and runs down, btLr at its bottom left
          and runs up; rotated columns are as wide as their lines; docx/local/tbl-features); tbRlV and tbLrV run down
          like tbRl with East Asian characters upright, tbLrV's lines from the left, lrTbV keeps lines across with
          East Asian characters on their side; vertical lines are thicker (paragraph.bidi; docx/local/vertical2,
          vertical5); rotated lines break along the length the row gives them, its height from its other cells or its
          own height, which the rotated text does not change, words longer broken (docx/local/rcw-*: "this is rotated
          by 270 degrees" in btLr and tbRl cells of rows at least or exactly 56.7 pt high in four lines, in a row of
          20 pt or one line beside a plain cell in pieces like "rota" and "ted"; docx/external/libreoffice/
          extras-ooxmlexport/cell-btlr 65.3 → 97.3 %, tblr-height 70.4 → 93.3 %, table-btlr-center 78.2 → 97.7 %), a
          row of nothing but rotated cells and without a height as long as their text; centered or right aligned along
          the length the row gives them (powertools/HC008-Test-03: "notes" centered in a btLr cell keeps its row 72 pt
          high, 73.3 → 100 % of the lines); w:noWrap keeps a cell unwrapped in autofit; w:hideMark lets an empty cell
          take no height. Fit text of cells (w:tcFitText) changes nothing in Word's printout: text too long for its
          cell wraps as in any other cell (docx/local/fittext). A cell's own shading (w:tcPr/w:shd) replaces its row's
          and its table's, even where it paints nothing
          (docx/external/libreoffice/extras-ooxmlexport/table-black_fill: cells of fill auto in a table shaded black
          stay white, 8.2 → 100 %). Of an empty cell whose end mark is hidden only the mark, its last paragraph, takes
          no height; its other empty paragraphs keep their lines
          (docx/external/libreoffice/extras-ooxmlexport/tdf123104: four empty 9 pt paragraphs three lines high, five
          centered as four). A hidden end mark after a line break takes no line of its own either
          (docx/external/libreoffice/extras-ooxmlexport/fdo76316: cells ending in w:br, their 13.8 pt mark lines gone,
          71.4 → 89.5 %). Cells of turned text (btLr, tbRl) align their lines across the cell by w:vAlign, right for
          btLr and left for tbRl, in the room the cell's width leaves beside the lines and its side lines, its margins
          not counted (docx/local/rcv-*: 20, 40 and 80 pt cells of one and two lines of Calibri 11, each 13.78 pt
          across, within 0.07 pt).

      - id: table.accessibility
        title: Table title and description
