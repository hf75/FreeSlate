      - id: drawing.wrap
        title: Text wrapping around objects
        elements: [wp:wrapNone, wp:wrapSquare, wp:wrapTight, wp:wrapThrough, wp:wrapTopAndBottom, wp:wrapPolygon,
                   wp:start, wp:lineTo]
        priority: P0
        difficulty: 5
        status: done
        strategy: >-
          Square, tight and through wrapping along the wrap polygon, top and bottom, with wrap distances
          (engine.floats); a drawing's extent, effect extents, distances, wrapping and wrap polygon are read in one
          place for the page's floats, the drawings in cells, the margins that hold drawings and the alignment.
        office: >-
          Square wrapping keeps the box with the effect extents and the wrap distances free, top and bottom the whole
          width; tight and through wrapping keep free what of the wrap polygon (21600ths of the extent, turned with the
          shape about the extent's centre: writerfilter-dmapper/tdf143208_wrapTight, a moon turned by 90 degrees,
          80.5 → 99.9 %; extras-ooxmlimport/tdf143219_ContourWrap_rotate 78.6 → 99.8 %) lies beside each line's text, from its ascent to its descent, with the left and right distances, the line's band widened by the
          distances above and below (extras-ooxmlexport/tdf143219ContourWrap_glow_rotate: wrapped through 8.95 pt
          above and 9 pt below, 74.0 → 82.5 %, the rest its glow); text goes to both
          sides, the left or right one or the larger (wrapText); before Word 2013 an object wrapped "left" that
          leaves no room left of it has the lines beside it on its right, one wrapped "right" at the right edge none
          on its left (docx/local/wsd-14, wsd2-14; from Word 2013 on both below them, wsd-15;
          docx/external/libreoffice/extras-odfexport/tdf130314). Objects push every line of their page, also above
          their anchor (docx/generated/wrapping, docx/generated/wrap-types: all lines within 0.2 pt). A line that a
          floating table on the page pushes past its bottom moves on, though no text stands above it
          (docx/external/libreoffice/extras-layout/floattable-footer-object-nofit: the pages as Word's). A line
          indented past its column's edge stays so beside floating objects
          (docx/external/libreoffice/extras-ooxmlimport/tdf117843: a header's line 7.1 pt into the margin beside text
          boxes wrapped square). Lines broken beside floating objects on one page break anew where the paragraph goes
          on in a column without them (docx/external/libreoffice/extras-ooxmlexport/tdf154703_framePrWrapSpacing: the
          lines a frame narrowed at the bottom of page 1 run across page 2, 69.0 → 90.8 %; special_styles 58.0 → 95.6
          %). A floating drawing that may not overlap the drawings placed before it, or that one of them may not
          overlap (wp:anchor allowOverlap 0), moves right of the one it overlaps where it fits across the page, else
          below it; drawings behind the text without wrapping take no part (docx/local/aov-*: a 200 pt rectangle over
          half of one before it right of that one, wrapped or not, placed from the page or its paragraph, whichever of
          the two forbids it, in either order; aov2-wide: of 400 pt below it; aov2-marg: past the margin up to the
          page's edge; docx/external/libreoffice/extras-layout/tdf124600 65.1 → 97.2 %, extras-ooxmlexport/tdf124600b
          62.8 → 99.0 %: a header's second text box below the first; tdf120760_ZOrderInHeader: a background picture
          behind a header's band stays); the text of its paragraph goes around it where it then stands (aov-para,
          aov-swap, aov-one 90.8 to 97.8 → 100 %). Before Word 2013 one that moves with its paragraph or line first goes
          its own height down: still beside the one it overlaps and then past the body's bottom it stands there right of
          that one, else below that one where it fits on the page, else right of it as low as the page lets it
          (docx/local/aoy-*-14, aoy-*-12, aoz-*: a rectangle 112.82 pt wide centred on the column 14.2 pt below its
          paragraph over one of 63.21 x 94.39 pt centred on the margin, of 64 and 68 pt below it, of 72 to 92 pt right of
          it its own height down, of 96 to 110 pt below it, of 120 pt right of it at the page's bottom; that one 70 to 130
          pt high, both 30 pt down, the bottom margin 2 cm less, in a paragraph of its own, first of the two; from the
          page right only, aoy-page-14; extras-ooxmlexport/tdf134114_allowOverlap 64.8 → 94.3 %). Known deviations: past two drawings
          Word puts a third below the first at its left edge (aov2-three), here right of the second or below it; before
          Word 2013 without text beside the one it overlaps Word leaves it its own height down there (aoz-short).

      - id: drawing.shapes
        title: Word shapes
        elements: [wps:wsp, wps:cNvPr, wps:cNvSpPr, wps:cNvCnPr, wps:spPr, wps:style, wps:bodyPr, wp:wsp, wp:cNvPr,
                   wp:cNvSpPr, wp:cNvCnPr, wp:spPr, wp:style, wp:bodyPr]
        priority: P0
        difficulty: 3
        status: done
        strategy: Geometry, fill, line and effects through the shared DrawingML renderer (shape, fill, line and effect areas).
        office: >-
          Word 2010 shapes (wps:wsp) with their style references are drawn as PowerPoint draws DrawingML shapes; the
          Word drawing namespaces are chosen over their VML fallbacks.

      - id: drawing.textBoxes
        title: Text boxes
        elements: [wps:txbx, wps:linkedTxbx, wp:txbx, wp:linkedTxbx, wp:txbxContent, w:txbxContent,
                   w:textboxTightWrap]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          The content is WordprocessingML laid out by our engine inside the shape's text rectangle (bodyPr insets,
          anchoring, rotation, autofit); linked text boxes continue the text from one box to the next.
        office: >-
          A shape's text box content is laid out like body text in the shape's rectangle less the insets of
          wps:bodyPr, measured from the geometry's text rectangle and from the outline's inner edge (half the outline
          further in: 3 pt with a 6 pt outline), at its top, middle or bottom (docx/generated/textboxes); a turned
          shape turns its text with it unless wps:bodyPr stands it upright or the shape is flipped (libreoffice/
          extras-ooxmlexport/TextFrameRotation: a VML text box turned by −90° reads upwards;
          core-exportdata-ooxml-pass/ sdt-in-shape-with-textbox: one turned by 180° and flipped keeps its page number
          upright). Vertical text turns every line a quarter, the insets staying with the shape's sides: vert and
          eaVert run the lines down, the first at the right; vert270 runs them up, the first at the left;
          mongolianVert and wordArtVert run them down, the first at the left; eaVert, mongolianVert and the WordArt
          kinds set East Asian characters upright; vertical lines are thicker (paragraph.bidi; docx/local/vertical6).
          Linked text boxes (wps:txbx id, wps:linkedTxbx id and seq) show the story's text that does not fit the
          boxes before them, laid out again at their own width, in the chain's order whatever order their layers draw
          them in (docx/local/lke-sp: the rest of a paragraph broken in a box 15.2 pt wide as one line of a tab and a
          picture in the next, 135.6 pt wide; lke-txt: "e one" of a word broken there). A box keeps its first line
          however far it reaches past its room (lkb-1-*: a first line 0.5 to 5 pt taller than the room stays, lkb-2-*:
          the second line 0.5 pt past the bottom inset goes on), unless it has no room at all inside its insets and
          outline: then no box shows that line (lkc-*: 0.55 pt keeps "Line one", 0.5 pt loses it; lkd-*: a picture's
          line alike); the chain's last box shows all the rest past its room (lkf-1: three lines in a box for one).
          VML text boxes chain by their links (v:textbox style mso-next-textbox:#id): the first box of a chain holds
          the story, the boxes its links lead to continue it in the links' order, whatever theirs in the document; a
          box linked to itself or to none ends its chain (LibreOffice's extras-ooxmlexport/tdf87348_linkedTextboxes:
          four chains of two to five boxes, followers before their first box in the document, 66.2 → 98.8 %).
          LibreOffice's extras-layout/tdf152983-1-min: a footer's chain, its first box 3.55 pt high with 7.2 pt insets,
          its picture a line down the second box, drawn first, 81.8 → 92.2 %. Also as shapes of a group
          (docx/external/libreoffice/extras-ooxmlexport/tdf73499: "textboxes!" in a group's second shape, 79.9 → 97.5
          %). A shape that resizes to fit (a:spAutoFit) is as high as its text and insets; a box that
          does not wrap (wrap none) keeps its lines whole and becomes as wide as the longest and its insets, narrower
          or wider than it was, whether or not it fits its height (docx/local/textboxes: every case as in Word, 96.7
          %; vws-*: "Hi" in a box 114 pt wide 9.4 pt wide, a line of 132.1 pt 132.1 pt wide, an ellipse 140 pt wide
          50.4 pt around "Hi", its text rectangle's insets those of its first size; VML's mso-wrap-style:none alike,
          LibreOffice's extras-layout/shape-anchored-in-follow 85.7 → 88.9 %, extras-ooxmlimport/n758883 95.2 → 100
          %), measured where it begins, and aligns them in its own width
          (docx/external/libreoffice/extras-ooxmlexport/ testWordArtWithinDraingtool: WordArt right aligned in such a
          box 5.6 → 88.3 %, tdf80526_word_wrap 7.1 → 93.9 %, tika/testWORD_2006ml 87.1 → 91.3 %), aligned as it then
          is (LibreOffice's core-doc/text-box-word-wrap: a header box saved 34.95 pt wide, 103.1 pt with its text, at
          the page's right edge). WordArt, a text box
          whose body has a text warp (a:prstTxWarp other than textNoShape), bends its runs as PowerPoint does (pptx
          text.warp), in their fonts, sizes, fills, outlines and effects, into the shape less the body's insets and
          half the shape's own outline, drawn or not (its a:ln or its theme line), whatever the text's outline
          (docx/local/wordartbox: an H in textPlain fills its shape to insets of 0, 7.2 and 3.6 or 20 pt, 99.8 %;
          wal-*: 1 and 3 pt in from shape outlines of 2 and 6 pt, with or without fill, a theme line's alike;
          docx/external/libreoffice/tdf152840_WordArt_non_accent_color 30.2 → 98.2 %, tdf125885_WordArt3 27.1 → 96.2 %,
          tdf152896_WordArt_color_darken 9.2 → 95.7 %). Its lines stand as far apart as Word lays them out, unrounded:
          Word's own line height for the paragraph's line spacing and its space before and after (docx/local/wap-1:
          Arial 20 pt single, at 1.15 and 1.5 lines, exactly and at least 30 pt, with 10 pt after the first or before
          the second paragraph, within 0.2 pt; tdf125885_WordArt 89.5 → 99.6 %); text converted from old WordArt
          (bodyPr fromWordArt) keeps the slide renderer's lines and whole-pixel baselines its warps were measured
          with (docx/local/vwa-*; extras-ooxmlexport/Tdf147485). Each glyph contour of an outline starts at its
          topmost on-curve point, the leftmost of equals, taken before the warp, where Word starts the outline's
          dashes (docx/local/wad-*: O, A, H, S and a heart whose lobes are equally high; wae-slant, wae-wave;
          tdf125885_WordArt2 80.7 → 100 %). Shadows and glow lie behind a copy of the bent glyphs, the glyphs
          unfiltered on top, as a page's runs (a filtered path prints as a picture; extras-ooxmlexport/fdo80897:
          hollow WordArt with a shadow, 89.9 → 92.6 %). A box's empty last paragraph
          after a table takes its line and space after, where a cell's takes none (docx/local/tbxtbl-a, -b, -d;
          powertools/WC/WC050-Table-in-Text-Box). The shading of a box's last paragraph reaches down to its bottom
          inset where the text with its space after leaves room below it (docx/local/grr-h, grr-k, grr-l, grr-n; not
          before another paragraph, grr-i, grr-o; extras-ooxmlexport/testWPGZOrder: a paragraph whose space after
          passes the bottom keeps its shading). In a DrawingML group (wpg) Word's PDF holds a box's shading and borders
          (of tables, cells and paragraphs) as a bitmap of 200 dpi with an alpha channel over the box's width between
          its top and bottom insets, the text over it as text, so thin lines come out gray and soft: we draw them into
          such a bitmap too (docx/local/grr-a to grr-t: text boxes and rectangles with text, outlined, nested, without a
          fill; a box alone and a VML group's box none, extras-ooxmlexport/tdf164065; tdf66039 39.3 → 99.6 %,
          testWPGZOrder 94.6 → 99.6 %). A floating box that resizes to its text (a:spAutoFit) takes its
          text's height where the text around it wraps and where it reaches past the page, not its saved or relative
          height (powertools/DB-GlossaryDocuments/HeaderContent-built, FooterContent-built, DB010-Template: boxes
          saved 69.85 and 110.55 pt high around 52.9 and 33.4 pt of text, 17.6–38.9 → 100 % of the lines;
          openxml-sdk/Complex01). Text of automatic color in a shape's text box takes the color of the shape's style
          (wps:style/a:fontRef), where no paragraph or run shading stands behind it; a color of the run, its styles or
          the document defaults wins, highlighting does not count (docx/local/fref-colors, -colors14, -normal,
          -defaults: lt1, FF0000 and accent2, of color auto too;
          docx/external/libreoffice/extras-ooxmlimport/tdf153791-shd_overrides_fontRef 77.7 → 99.8 %). The text keeps
          half the outline's width from the shape's edges, drawn or not: a:ln's width, else that of the theme's line
          its style refers to (a:lnRef; docx/local/fref-inset: theme lines of 1, 1.5 and 2 pt, unfilled ones too,
          a:ln's own 0.5 pt over the theme's; docx/external/libreoffice/core-exportdata-ooxml-pass/textframe-in-shape,
          35.8 → 100 % with its table's widths). Vertical text that fits its shape (a:spAutoFit) makes the shape as
          wide as its lines are thick, insets and outline beside them, its height and left edge kept
          (docx/external/libreoffice/extras-ooxmlimport/tdf124754: two lines down a box 40 % of the margin wide, 38.8
          pt wide in Word, 59.7 → 92.1 %). Text taller than its box begins at its top, whatever its anchor
          (docx/external/libreoffice/extras-ooxmlexport/tdf131922_LanguageInGroupShape: five lines centered in a box
          for four, 74.4 → 96.0 %; tdf113258 87.0 → 99.9 %, fdo83057 70.7 → 99.7 %). Vertical text that fits its box
          is laid out with vertical lines for its width (core-layout/textbox-autogrow-vertical: twelve lines of the
          vertical pitch, 73.0 → 97.3 %; extras-ooxmlimport/tdf124754 92.1 → 96.0 %). WordArt of text boxes is kerned
          only from its runs' w:kern size on (extras-ooxmlexport/fdo80897 73.0 → 89.9 %). Known deviation: linked
          boxes of different widths keep the first box's line breaks.

      - id: drawing.groups
        title: Groups
        elements: [wpg:wgp, wpg:cNvGrpSpPr, wpg:grpSpPr, wpg:grpSp, wpg:cNvPr, wpg:cNvFrPr, wpg:graphicFrame, wpg:xfrm,
                   wpg:extLst, wp:wgp, wp:grpSp, wp:grpSpPr, wp:cNvGrpSpPr, wp:cNvFrPr, wp:graphicFrame, wp:xfrm]
        priority: P1
        difficulty: 3
        status: done
        strategy: Child transforms as pptx `shape.group` (done); children may be pictures, shapes, text boxes and graphic frames.
        office: >-
          Groups (wpg:wgp) map their children's space (a:chOff, a:chExt) onto their box, nested groups (wpg:grpSp)
          again; the text boxes of grouped shapes are laid out in their shapes' places and turn with them
          (docx/local/groups: a stretched group, a nested group with a turned star and a text box, 100 %). A group
          without a:chOff and a:chExt maps its children 1:1 from 0 0, so that the offsets of nested groups add up
          (docx/external/libreoffice/extras-ooxmlexport/dml-groupshape-childposition 80.8 → 100 %). A grouped text
          box that resizes to its text (a:spAutoFit) is as high as its text and insets, its top kept
          (extras-ooxmlexport/groupshape-theme-font: a box saved 127.3 pt high fits its text, 66.45 pt). Graphic
          frames in groups and canvases (wpg:graphicFrame, wpc:graphicFrame: charts) stand in their group's
          coordinates (docx/external/libreoffice/extras-ooxmlimport/tdf124398 3.6 → 97.3 %,
          extras-ooxmlexport/tdf124398_groupshapeChart 38.3 → 91.7 %). A group's own effects (its wpg:grpSpPr's
          a:effectLst) work on all of it: a glow grows from the union of its shapes, behind them all (LibreOffice's
          tdf156902_GlowOnGroup: a 36 pt glow around a triangle with an oval inside it, 57.8 → 100 %; docx/local/
          ggl-group: two rectangles 12 pt apart glow as each with the glow would but for the gap's corners, 55.3 →
          100 %). PowerPoint draws none (pptx shape.group).

      - id: drawing.canvas
        title: Drawing canvas
        elements: [wpc:wpc, wpc:bg, wpc:whole, wpc:graphicFrame, wp:wpc, wp:bg, wp:whole, lc:lockedCanvas]
        priority: P2
        difficulty: 3
        status: done
        strategy: A canvas is a group with its own background and outline.
        office: >-
          Canvases (wpc:wpc) are drawn as a group in their own coordinates over their background and outline (wpc:bg,
          wpc:whole); their shapes' text boxes and connectors as in groups (docx/local/groups, 100 %).

      - id: drawing.ink
        title: Ink
        elements: [w14:contentPart, w14:nvContentPartPr, w14:cNvPr, w14:cNvContentPartPr, w14:xfrm, w:contentPart,
                   wp:contentPart, wp:nvContentPartPr, wp:cNvContentPartPr]
        priority: P3
        difficulty: 4
        status: done
        strategy: Ink content parts drawn as in pptx `picture.ink` (done).
        office: >-
          Word writes ink (w14:contentPart, wpi) with a picture of it as fallback, which is drawn; ink without one is
          drawn from its InkML part by the ink renderer shared with pptx picture.ink (docx/local/ink 99.9 %).

      - id: drawing.onlineVideo
        title: Online video
        elements: [wp15:webVideoPr, woe:oembed]
        priority: P3
        difficulty: 2
        status: done
        strategy: The poster picture with a link to the video; the printed layout shows the poster only.
        office: >-
          An online video prints as its poster picture (pictures link to their a:hlinkClick on wp:docPr, where Word
          keeps a picture's hyperlink).

  - id: theme
    title: Themes and styles
    features:
      - id: theme.colors
        title: Theme color scheme
        elements: [a:theme, a:themeElements, a:clrScheme, a:dk1, a:lt1, a:dk2, a:lt2, a:accent?, a:hlink, a:folHlink,
                   w:clrSchemeMapping]
        priority: P0
        difficulty: 1
        status: done
        strategy: Shared DrawingML renderer, as pptx `theme.colors` (done).
        office: >-
          Word drawings reach the renderer shared with PowerPoint as their PresentationML counterparts (wps:wsp as
          p:sp, pic:pic as p:pic, wpg as p:grpSp, charts and diagrams as p:graphicFrame) with the document's theme and
          w:clrSchemeMapping; drawn as pptx theme.colors (done). Scheme colors through the theme and
          w:clrSchemeMapping; Verified against Word with docx/generated/graphics (95.1 %; the rest Windows' PDF
          renderer ignoring Chrome's soft masks). A document without a theme part takes Word's own theme of 2023, its
          colors (accent1 156082 …) and format scheme as Word writes them into new documents
          (LibreOffice's extras-odfexport/tdf168980: a text box outlined in accent1 prints 156082).

      - id: theme.fonts
        title: Theme fonts
        elements: [a:fontScheme, a:majorFont, a:minorFont, a:font]
        priority: P0
        difficulty: 2
        status: done
        strategy: Shared DrawingML renderer, as pptx `theme.fonts` (done).
        office: >-
          Word drawings reach the renderer shared with PowerPoint as their PresentationML counterparts (wps:wsp as
          p:sp, pic:pic as p:pic, wpg as p:grpSp, charts and diagrams as p:graphicFrame) with the document's theme and
          w:clrSchemeMapping; drawn as pptx theme.fonts (done). The major and minor fonts of charts and SmartArt;
          Verified against Word with docx/generated/charts, charts-more, charts-more2 and charts-more3 (88 to 98 %).

      - id: theme.formatScheme
        title: Theme formats (style matrix)
