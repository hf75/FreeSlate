  - id: math
    title: Equations (Office Math)
    features:
      - id: math.equations
        title: Equations
        description: Inline equations (m:oMath in a paragraph) and display equations (m:oMathPara).
        elements: [w:oMath, a14:m]
        namespaces: [m]
        priority: P1
        difficulty: 4
        status: done
        strategy: >-
          The OMML layout of pptx `text.math` (done) with Word's paragraph context: display equations take their
          own lines and justification, inline equations sit on the text baseline, long display equations break at
          operators.
        office: >-
          Equations are laid out by the OMML engine of pptx text.math with the runs' w:rPr: an m:oMath stands in the
          line on its baseline with its ascent and descent; the display equations of an m:oMathPara take lines of
          their own, broken before the binary and relation operators of their top level where they are too wide (the
          next lines indented by m:wrapIndent) and placed by m:jc: centered as a group, centered, left or right
          (docx/generated/equations, equation by equation within 0.3 pt of Word's lines but the limit with its
          fraction). A line's height is the equation's ascent and descent and the spacing's extra of the text fonts,
          the paragraph mark's where the equation stands alone (docx/local/eq-shaded). Word differs from PowerPoint in
          two rules: delimiters grow to the content's height less the shortfall, not twice its reach from the axis
          (docx/local/ppt-math: PowerPoint's own probe equations in Word), and a function's name keeps a thin space
          before an opening delimiter; both draw the hyphen-minus as the minus sign and ∇ and ∂ in italic. Glyphs are
          drawn as outlines under transparent selectable text.

      - id: math.settings
        title: Document math settings
        elements: [m:mathPr, m:mathFont, m:brkBin, m:brkBinSub, m:smallFrac, m:dispDef, m:lMargin, m:rMargin, m:defJc,
                   m:preSp, m:postSp, m:interSp, m:intraSp, m:wrapIndent, m:wrapRight, m:intLim, m:naryLim]
        priority: P1
        difficulty: 3
        status: partial
        strategy: Defaults for all equations of the document (math font, break rules, margins, limits placement).
        office: >-
          m:mathFont (a font with a MATH table, else Cambria Math), m:defJc, m:wrapIndent, m:wrapRight, m:intLim and
          m:naryLim apply to all equations of the document; m:brkBin before (the default) where display equations
          break. Still open: m:brkBin after and repeat, m:brkBinSub, m:smallFrac, and the display spacing and margins
          that apply without m:dispDef (m:lMargin, m:rMargin, m:preSp, m:postSp, m:interSp, m:intraSp).

  - id: vml
    title: Legacy VML content
    features:
      - id: vml.shapes
        title: VML shapes, text boxes and WordArt
        elements: [w:pict, w10:wrap, w10:anchorlock, w10:bordertop, w10:borderleft, w10:borderbottom, w10:borderright]
        namespaces: [v, o]
        priority: P1
        difficulty: 4
        status: partial
        strategy: >-
          The VML renderer of pptx `legacy.vml` (done), positioned in the text flow by the style attribute
          (mso-position-*) and w10:wrap; VML text boxes hold WordprocessingML like wps text boxes.
        office: >-
          VML shapes (w:pict) are converted to Word drawings: rectangles, rounded rectangles, ovals, lines, preset
          shapes by o:spt, paths as custom geometries, fills (solid, gradient, picture), strokes (color, weight, dash,
          arrows), pictures (v:imagedata with crop), text boxes (v:textbox with its insets), placed by the style
          attribute (position, margins, mso-position-*, rotation, flip, z-index) and w10:wrap (docx/local/vml-shapes).
          A rounded rectangle's text stands inside its corners, as the DrawingML text rectangle says. Still open:
          groups (v:group), shadows, more fill types.

      - id: vml.ole
        title: Embedded objects and controls
        elements: [w:object, w:objectEmbed, w:objectLink, w:control, w:movie, o:OLEObject, a15:objectPr,
                   a15:signatureLine]
        priority: P1
        difficulty: 3
        status: partial
        strategy: >-
          OLE objects, ActiveX controls and signature lines show their preview picture (often EMF or WMF, see
          picture.metafiles), as pptx `picture.ole` (done).
        office: >-
          Embedded objects (w:object) show the picture of their VML shape like any VML picture. Still open: ActiveX
          controls, signature lines.

      - id: vml.watermarks
        title: Watermarks
        description: Text or picture watermarks are VML shapes in the header, centered on the page behind the text.
        elements: [v:shape, v:textpath, v:imagedata]
        priority: P1
        difficulty: 3
        status: done
        strategy: Text watermarks are VML WordArt (v:textpath) scaled to their box; picture watermarks are washed-out pictures.
        office: >-
          WordArt (v:textpath) is drawn as text stretched over the shape like a textPlain warp, filled with the
          shape's fill; VML fits the font's em box to the shape, so the shape shrinks to the capitals' share of it
          about its turned center (docx/local/vml-watermark, the watermark of a header placed relative to the
          margins). Picture watermarks are VML pictures.

  - id: engine
    title: Layout engine (cross-cutting)
    description: Features without elements of their own that decide the fidelity of everything else.
    features:
      - id: engine.output
        title: HTML output
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          One self-contained HTML file: fixed-size page boxes with absolutely positioned glyph runs, SVG for
          drawings, embedded fonts and pictures; print CSS keeps one page per sheet.
        office: >-
          One self-contained HTML file: a fixed-size section per page with a named @page per paper size (printed,
          every page keeps its size), text as SVG text at our positions in the fonts we measured with (fonts the
          browser cannot find by name, such as Office cloud fonts, embedded), drawings, charts, SmartArt and equations
          as SVG, pictures embedded, bookmarks as anchors and hyperlinks as links.

      - id: engine.pagination
        title: Pagination
        priority: P0
        difficulty: 5
        status: done
        strategy: >-
          Page breaking with widow and orphan control, keep with next, keep lines together, page and column breaks,
          table rows that split or repeat, footnotes that share the page with their references, section breaks of
          all types and continuous sections with balanced columns.
        office: >-
          Pages, columns, sections, headers and footers and the paragraph keep rules match Word's line positions
          within 0.1 pt on the generated documents (word-lines); tables break between rows and split rows at lines,
          repeat their header rows, keep rows that may not split and rows whose paragraphs keep with the next
          (docx/local/tblpages: 229 lines, mean 0.06 pt); footnotes share the page with their references and continue
          on the next (note.footnotes); floating objects stay on their anchor's page (engine.floats).

      - id: engine.lineLayout
        title: Line layout
        priority: P0
        difficulty: 5
        status: partial
        strategy: >-
          The text engine of pptx `engine.textLayout` (done) extended by Word's rules: line height from the font's
          metrics and line spacing, tabs, justification, East Asian grid and kinsoku, hyphenation, inline objects,
          lines shortened by floating objects.
        office: >-
          Lines break at UAX #14 opportunities with Word's kinsoku; a word longer than the line breaks between
          characters; trailing spaces hang past the end. Glyphs are drawn as browser text at positions from our
          layout; Word's PDF and ours go through the same rasterizer, so equal positions give equal pixels. Still
          open: hyphenation, East Asian grid and compression rules.

      - id: engine.floats
        title: Floating objects and text wrapping
        priority: P0
        difficulty: 5
        status: done
        strategy: >-
          Anchored objects, frames and floating tables are placed first, then lines are broken into the space
          around them; objects anchored in later text may move earlier lines, so layout iterates until stable.
        office: >-
          Floating drawings are placed on their anchor's page and the page is laid out again around them until it is
          stable (at most four runs); lines are broken into the segments beside the objects, words that do not fit a
          segment continue in the next one, lines with no room move down below the object (docx/generated/wrapping,
          wrap-types). Text frames and drop caps (paragraph.frames) and floating tables (table.floating) take part in
          the same exclusions.

      - id: engine.tableLayout
        title: Table layout
        priority: P0
        difficulty: 5
        status: done
        strategy: Word's autofit algorithm, measured against generated tables, and rows that span pages.
        office: >-
          Word's autofit: each column's minimum and maximum width with margins (the maximum capped at 1584 pt);
          preferred widths fixed; the maxima when they fit, else the minima and the rest in proportion to max - min,
          else the content minima shrunk; fixed layout by the grid; rows that split across pages unless cantSplit,
          repeated header rows, nested tables (docx/local/tbl-autofit 92/92 lines, docx/generated/tables 44/44).

      - id: engine.fonts
        title: Font resolution and fallback
        priority: P0
        difficulty: 4
        status: done
        strategy: As pptx `engine.fonts` (done) with Word's font substitution (font.table).
        office: >-
          Installed, embedded and Office cloud fonts (Aptos) as in pptx, with Word's own substitution of missing
          families (font.table) and theme fonts (font.theme). A character the run's font lacks is measured and drawn
          in the font Word falls back to, by range: emoji Segoe UI Emoji (also before U+FE0F); symbols, dingbats,
          arrows and Braille Segoe UI Symbol; letterlike and mathematical symbols, technical symbols and enclosed
          numbers Cambria Math (enclosed letters then MS Gothic or MS Mincho); geometric shapes Arial; Thai, Lao and
          Khmer Leelawadee UI; Indic scripts Nirmala UI; Georgian Sylfaen; Ethiopic Ebrima; Cherokee Gadugi; Syriac
          Segoe UI Historic; Tibetan Microsoft Himalaya; Myanmar Myanmar Text; Hangul Malgun Gothic or Batang beside
          serif and East Asian fonts; Chinese characters and kana MS Mincho, then PMingLiU or Microsoft JhengHei.
          Lines grow with the fallback's metrics as in Word; spaces and format characters stay in the run's font,
          marks with their base (docx/local/fallback-arial 96.1 %, fallback-calibri 95.7 %, fallback-times 97 %, every
          line within 0.1 pt). Color emoji are Chrome's (COLRv1 shading) where Word draws them flat.

      - id: engine.fidelity
        title: Fidelity measurement
        priority: P0
        difficulty: 3
        status: done
        strategy: >-
          Word (COM) exports every reference document to PDF; its pages are rasterized and compared with our pages
          like the PowerPoint references, on documents Word generates by COM and on external test documents.
        office: >-
          Word (COM) exports every reference document to PDF; Chrome prints our HTML to PDF and the same rasterizer
          (Windows.Data.Pdf) renders both, page by page at 96 dpi, for the pixel and SSIM scores; pdf-text and word-
          lines compare Word's PDF layout with ours line by line and glyph by glyph. 29 documents generated by Word
          through COM (docx/generated, 92.6 % overall) and local probes for each measured rule. The rasterizer ignores
          the soft masks Chrome writes (reflections, soft edges), which MuPDF shows.
