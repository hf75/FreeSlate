          sizes, not its text's (vps-wa-plain, vps-wa-4: 2 and 4 pt off; extras-ooxmlexport/fdo78663 91.6 → 95.5 %). Word 97 borders (w10:bordertop, borderleft, borderbottom, borderright) frame the
          shape outside, width/8 pt each floored to Word's 0.12 pt dots, double lines three times that, dotted and
