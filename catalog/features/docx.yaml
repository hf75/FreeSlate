          F × F / round(F), as if the content were first put into the frame's whole pixels (docx/local/emq-*: bars at
          known places in MM_ANISOTROPIC and MM_TEXT, frames of 66 to 823 pixels on three reference devices, shown at
          up to three times their size, within 0.1 pixel; EMF+ dual files and the grid with an ExtTextOutW alike;
          extras-ooxmlexport/tdf122563 89.8 → 91.1 %, EmbeddedExcelChart and fdo81381 → 100 %, tdf133035 93.9 → 99.9
          %; PowerPoint keeps the frame as measured). Known deviation: tika/testWORD_embedded_pdf, a bitmap filling 80 %
          of its frame, maps as F in Word (97.7 % here);
