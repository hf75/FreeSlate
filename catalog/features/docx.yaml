      - id: field.hyperlinks
        title: Hyperlinks
        elements: [w:hyperlink, a:hlinkClick, a:hlinkHover, a:hlinkMouseOver, a:snd, ahyp:hlinkClr]
        priority: P0
        difficulty: 2
        status: done
        strategy: HTML links on the text and on drawings (as pptx `interactivity.hyperlinks`, done); bookmarks become anchors.
        office: >-
          w:hyperlink (external targets through the relationship, bookmarks through w:anchor) and HYPERLINK fields
          (with \l) make the text a link in the HTML. A table of contents' w:hyperlink entries print as if their runs
          had no character style where it is the Hyperlink style, with or without TOC \h: their direct formatting and
          other character styles show, the style's color, underline, bold and size do not; outside w:hyperlink, outside
          the TOC field and in a HYPERLINK field's result outside it the style shows (docx/local/toclink, toclink-2; 38
          documents better, among them docx/external/libreoffice/extras-ooxmlexport/fdo78654 52.7 → 92.2 %, powertools/
          HC022-Table-Of-Contents 66.8 → 90.4 %); entries that are HYPERLINK fields in the TOC field's result print
          alike (docx/local/toch-15: plain with the Hyperlink style, blue and underlined with direct formatting;
          extras-ooxmlexport/tdf150166 83.8 → 99.9 %, core-docnode/tdf150086 86.6 → 98.3 %).

      - id: field.bookmarks
        title: Bookmarks
        elements: [w:bookmarkStart, w:bookmarkEnd]
        priority: P1
        difficulty: 1
        status: done
        strategy: HTML anchors; REF and PAGEREF fields and hyperlinks refer to them.
        office: >-
          Bookmarks become HTML anchors where their paragraph begins on its page. A bookmark between paragraphs (as
          before the first paragraph of a content control) starts at the next paragraph and ends after the one before
          (docx/external/libreoffice/extras-ooxmlexport/tdf154478: PAGEREF finds the table of contents heading).

      - id: field.forms
        title: Legacy form fields
        elements: [w:ffData, w:name, w:enabled, w:calcOnExit, w:entryMacro, w:exitMacro, w:helpText, w:statusText,
                   w:checkBox, w:size, w:sizeAuto, w:default, w:checked, w:ddList, w:result, w:listEntry, w:textInput,
                   w:type, w:maxLength, w:format, w:label, w:doNotShadeFormData, w:formsDesign, w:printFormsData,
                   w:saveFormsData]
        priority: P2
        difficulty: 3
        status: done
        strategy: Text fields show their result, check boxes a box in their size (checked or not), drop-downs the selected entry.
        office: >-
          Text inputs show their result, drop-downs their chosen entry (w:result, else w:default); text inputs of the
          current date or time (w:type currentDate, currentTime) show it as Word prints in their w:format, not their
          saved result nor a date field nested in their instruction, and a field nested in another's instruction
          shows nothing of its own (Word's PDF of docx/external/libreoffice/extras-ww8export/
          tdf79435_legacyInputFields: "10/12/2026 11:42:42 AM" for currentDate in M/d/yyyy h:mm:ss am/pm, "12-Oct-26"
          for currentTime in d-MMM-yy, 88.4 → 100 %; extras-ooxmlexport/tdf125038_conditionalText3 94.3 → 100 %,
          tdf81345: no page number of an IF's instruction in the footer). A check box is a
          character of the run's font at its size (w:size, else the font size): its advance the font's line height, a
          square 2.28 pt smaller, 1.08 pt in from its left and above its bottom, in 0.48 pt lines, crossed when
          checked (docx/local/form-boxes: Arial 8 to 36 pt, fixed sizes; docx/generated/form-fields 94.1 %).

      - id: field.citations
        title: Citations and bibliography
        namespaces: [b]
        priority: P3
        difficulty: 2
        status: done
        strategy: CITATION and BIBLIOGRAPHY fields show their cached results; the sources part is data.
        office: >-
          CITATION and BIBLIOGRAPHY fields (and their content controls) show their cached results; the sources part is
          data.

  - id: sdt
    title: Content controls and custom markup
    features:
      - id: sdt.structure
        title: Content controls
        elements: [w:sdt, w:sdtPr, w:sdtContent, w:sdtEndPr, w:alias, w:tag, w:id, w:lock, w:placeholder,
                   w:showingPlcHdr, w:temporary, w:tabIndex, w:docPart, w:alwaysShowPlaceholderText, w15:appearance,
                   w15:color]
        priority: P0
        difficulty: 2
        status: done
        strategy: Block, row, cell and inline content controls render their content; frames and tags are screen-only.
        office: >-
          Block, row, cell and inline content controls render their content; their frames, tags and titles are screen-
          only (docx/generated/content-controls 94.2 %). Every control showing its placeholder (w:showingPlcHdr) shows
          the content of the first such control of the same docPart in the document, a block control's paragraphs in
          later block controls and its first paragraph's runs in inline ones, a block control after an inline one its
          own (docx/local/sph-*: three controls of different text all show the first's, in one paragraph or three,
          plain or rich text; controls not showing their placeholder, of another docPart or of none keep theirs;
          docx/external/poi/55966 71.2 → 97.4 %).

      - id: sdt.types
        title: Content control types
        elements: [w:text, w:richText, w:comboBox, w:dropDownList, w:listItem, w:date, w:dateFormat, w:calendar,
                   w:storeMappedDataAs, w:picture, w:equation, w:group, w:citation, w:bibliography, w:docPartObj,
                   w:docPartList, w:docPartGallery, w:docPartCategory, w:docPartUnique, w14:checkbox, w14:checked,
                   w14:checkedState, w14:uncheckedState, w14:entityPicker, w15:repeatingSection,
                   w15:repeatingSectionItem, w15:doNotAllowInsertDeleteSection, w15:sectionTitle]
        priority: P1
        difficulty: 2
        status: done
        strategy: The content is already in the document; check boxes show the symbol of their state.
        office: >-
          Every type prints the content Word stored: the check box's symbol, the chosen list entry, the date as
          formatted, the picture or its placeholder picture, each item of a repeating section; placeholders show their
          placeholder text in its style (docx/generated/content-controls 94.2 %).

      - id: sdt.dataBinding
        title: Data binding
        elements: [w:dataBinding, w15:dataBinding]
        priority: P2
        difficulty: 3
        status: done
        strategy: >-
          Bound content controls take their text from the custom XML part (XPath); whether Word refreshes the
          document's text from the part when it opens is measured.
        office: >-
          Word refreshes bound controls from their data when it opens a document, and so do we: the XPath of
          w:dataBinding (with its prefix mappings) selects a node of the custom XML part with the store item id, or of
          the core or extended properties; text controls show its value, date controls its date in their w:dateFormat
          and w:lid, list controls the matching entry's display text; a missing node keeps the stored text
          (docx/local/binding 98.8 %, every line as in Word). A binding without a store item id takes the first
          custom XML part, in the order of the document's relationships, in which the node exists (Word's PDF of
          docx/external/libreoffice/extras-ooxmlexport/tdf147724: item2, listed before item1, 87.0 → 100 %); a prefix
          the mappings do not declare, ns0, ns1 …, names the part's namespaces in their order, ns0 its root's
          (tdf151912: /ns0:BlogPostInfo/ns0:PostTitle without w:prefixMappings, 54.8 → 100 %). A picture control
          (w:picture) binds its picture and
          keeps the one it stores (docx/external/libreoffice/extras-ooxmlexport/sdt-picture-databinding 75.5 to 100 %:
          a node of base64 data printed as text before). An empty node leaves a control showing its placeholder
          (w:showingPlcHdr) as it is, a plain text control without it five spaces in its paragraph style's format
          (docx/local/bindempty: seven spaces to the line's end; poi/60316; extras-ooxmlexport/sdt-2-run: 12.6 pt of
          Calibri 11 before text of 22 pt, 54.4 → 82.2 %); a value that takes the place of the placeholder a control
          showed leaves the placeholder's formatting (the Placeholder Text style of its stored run) behind, in the
          control's own format (writerfilter-dmapper/content-control-data-binding-color: "ABC" in black, not red, 77.0 →
          100 %); one with a placeholder
          building block of the glossary (w:placeholder w:docPart) that block's text (Word's PDF of LibreOffice's
          extras-ooxmlexport/fdo67013: a header's control bound to an empty title prints "[Type the document title]",
          83.5 → 99.9 %). A bound control around
          table cells shows its node's value in its first cell's first paragraph, in its first run's formatting
          (docx/external/libreoffice/extras-ooxmlexport/paragraph-sdt: the document's title from its core properties,
          41.7 → 94.5 %). Word supplies the cover page properties (store item {55AF091B-3C7A-41E3-B477-F2FDAA23CFDA})
          where the package has none, their values empty: a control bound to them shows nothing, one showing its
          placeholder keeps it (docx/external/libreoffice/extras-ooxmlexport/sdt-header: a header's date control bound
          to PublishDate, 72.8 → 100 %; dkvert, wpg-nested). Line feeds in a node break the line in a plain text
          control of several lines (w:text w:multiLine), elsewhere they are dropped, no space in their place
          (tdf81507: a description of four lines bound four times, 65.4 → 98.6 %).

      - id: sdt.customXml
        title: Custom XML markup and smart tags
        elements: [w:customXml, w:customXmlPr, w:attr, w:smartTag, w:smartTagPr, w:showXMLTags]
        priority: P2
        difficulty: 1
        status: done
        strategy: Transparent containers; their content renders as if they were not there.
        office: >-
          Custom XML elements and smart tags are transparent: their runs, paragraphs, tables, rows and cells render as
          if they were not there.

  - id: review
    title: Comments, revisions and proofing
    features:
      - id: review.comments
        title: Comments
        elements: [w:comments, w:comment, w:commentRangeStart, w:commentRangeEnd, w:commentReference,
                   w:annotationRef, w15:commentsEx, w15:commentEx, w15:people, w15:person, w15:presenceInfo]
        namespaces: [w16cid, w16cex, w16cei]
        priority: P2
        difficulty: 3
        status: done
        strategy: >-
          Shown next to the pages (not on them) with their ranges highlighted; whether and how Word's PDF export
          includes comments is measured.
        office: >-
          Without markup Word prints nothing of comments, and neither do we by default: ranges, references and the
          comments part are skipped (docx/generated/revisions). With markup (the converter's markup option, as Word
          prints with markup: docx/local/markup-a, markup-d, markup-e, markup-f, markup-revisions; 84 to 98 %) a
          comment's range is shaded in its author's color at lightness 0.92 between thin brackets of the color, and
          its balloon stands in a gray pane (F2F2F2) 0.1 in right of the text, 3.6 in wide: 23.76 pt into the pane,
          232.97 pt wide, as high as its text with 2.3 pt above and 1.8 pt below, in the shade of the range with an
          outline of 0.48 pt in the author's color, stacked 1.15 pt apart in the order of their places, at their
          line's top where there is room; a dotted line runs from the range's end along the line's bottom to the pane
          and on to 6 pt below the balloon's top. The balloon says "Commented [initials and number]:" in bold Segoe UI
          9 pt, then the comment's text in its own fonts at 9 pt; a reply (w15:commentEx paraIdParent) has its own
          balloon labeled with "R" and the number it answers and no shading of its own; a resolved comment (done) is
          paler (range and balloon at lightness 0.98, outline and line at 0.875, text BFBFBF). Authors take Word's
          eight colors (D13438, 0078D4, 5C2E91, 498205, CC3595, 7160E8, 038387, 6D5700) in the order they appear (Word
          goes on counting over the documents of a session). The page with its pane is made smaller to fit the paper
          Word picks (a standard paper of the page's size within 10 pt, else A4 where the page fits, else Letter), at
          its top left in the middle of its height. Balloons speak German where the culture is German (measured), else
          English. Known deviation: the scale differs from Word's by up to 0.1 % (Word's pane width rounds).

      - id: review.revisions
        title: Tracked changes
        elements: [w:ins, w:del, w:moveFrom, w:moveTo, w:moveFromRangeStart, w:moveFromRangeEnd, w:moveToRangeStart,
                   w:moveToRangeEnd, w:delText, w:rPrChange, w:pPrChange, w:sectPrChange, w:tblPrChange,
                   w:tblPrExChange, w:trPrChange, w:tcPrChange, w:tblGridChange, w:cellIns, w:cellDel, w:cellMerge,
                   w:numberingChange, w:customXml*Range*, w14:conflictIns, w14:conflictDel, w14:customXmlConflict*,
                   w:trackRevisions, w:revisionView, w:doNotTrackMoves, w:doNotTrackFormatting]
        priority: P1
        difficulty: 3
        status: done
        strategy: >-
          Render the document with all changes accepted (final view); a markup view with colored insertions,
          struck deletions and change bars follows Word's simple and all markup views.
        office: >-
          Printed as Word exports without markup by default: insertions and moved-to text stay, deletions and moved-
          from text are left out, though deleted text still counts in the widths of autofit tables (Word's PDF of
          extras-ooxmlexport/testTrackChangesDeletedTableCell: its columns where the deleted "ABCD" puts them in the
          markup view, 89.4 → 99.5 %), deleted table rows (w:trPr/w:del) disappear, a table of nothing but deleted rows
          with them, a paragraph whose mark is deleted or moved away (w:moveFrom) joins the next, also across such a
          table, across the marks of ranges between them (moveFromRangeEnd, bookmarks, comments) and across the edges
          of content controls not bound to data (RP018-MoveFrom-MoveTo-CC 20 → 100 % of the lines, libreoffice/
          core-docnode/tdf150086 and extras-ooxmlexport/tdf150166 0 → 100 %); the joined paragraph keeps the next
          one's formatting and number, the text before it taking that paragraph's style with its runs' own formatting
          and character styles (docx/local/dm-a, -b, -c: a Times New Roman 14 style's text before a Normal paragraph
          in Calibri 11, bold where its runs are, and the other way round; dm-d, -e: the next one's space before;
          none where that one has contextual spacing, whatever the styles, dmk-f to dmk-k: after 3.5 pt after the gap
          is 3.5 pt, the joined paragraph's 18 pt and the first's 24 pt before gone; extras-uiwriter/tdf125916 56.9 →
          95.4 %; extras-ooxmlexport/tdf125894 79.0 → 100 %; docx/external/powertools/RA001-Tracked-Revisions-01, -02, RP001-*
          23.9 → 100 % of the lines;
          RP015-MoveFrom-MoveTo, FA-RevTracking/014-MovedParagraph, tdf104797, tdf123460, tdf149711 54 to 97 % of the
          pixels); formatting changes show the new formatting (docx/generated/revisions 91.8 %). With markup (the
          converter's markup option, Word's "All Markup" with comments and formatting in balloons;
          docx/local/markup-a, markup-b, markup-c, markup-revisions) insertions are underlined and deletions struck
          through in their author's color, moved text dark green (2C6234), struck through twice where it was and
          underlined twice where it is; deleted rows and paragraph marks stay; a change bar 0.75 pt wide stands half
          an inch left of the text beside every line with a change, over neighboring changed lines and the space
          between them; formatting changes of runs, paragraphs and tables get balloons ("Formatted:" with what the
          properties now have that they did not: font, size, bold, italic, underline, strikethrough, color, caps,
          position, highlight, hidden, spacing; alignment, indents, spacing, line spacing, keep options; 37 cases word
          for word as Word's German user interface says them), joined by a dotted line from a small triangle at the
          run's start or at the text's right edge. Without balloons the page keeps its size. Printed without markup, a
          table cell's last paragraph whose mark is gone joins the cell's end, which has the document defaults' and
          the table style's paragraph properties, not the paragraph's style or its own; in a row's last cell it joins
          the row's end, which has the document defaults' alone; the mark's own run properties stay (docx/local/cmv-*:
          the row 22.9 pt high, 8 pt after and lines of 259 from the defaults, not the table style's single lines, the
          Normal style's 20 pt after or the paragraph's 30 pt; a lost mark in the first cell alone 13.9 pt;
          docx/external/libreoffice/extras-ooxmlexport/TC-table-Separate-Move 71.1 → 100 %, TC-table-DnD-move twice
          56.0 → 100 %, TC-table-rowDND 58.7 → 100 %, TC-table-rowDND-front 86.7 → 100 %), also inside content
          controls (tdf157011_ins_del_empty_cols: Google Docs' paragraphs each in a w:sdt, 58.3 → 100 %). Known
          deviation: only the
          all markup view with Word's default balloons; English balloon texts follow Word's terms but were not
          measured.

      - id: review.permissions
        title: Editing permissions
        elements: [w:permStart, w:permEnd]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered.
        office: >-
          Editable ranges print as gray (#7f7f7f) brackets: a 0.24 pt bar from 0.38 pt below the line's top to 0.22 pt
          above its bottom with 0.6 pt ticks at both ends, opening before the range's first character and closing
          after its last (docx/local/misc-nothing).

      - id: review.proofing
        title: Proofing state
        elements: [w:proofErr, w:noProof, w:proofState, w:hideSpellingErrors, w:hideGrammaticalErrors,
                   w:activeWritingStyle]
        priority: P3
        difficulty: 1
        status: done
        strategy: Not rendered; spelling marks are screen-only.
        office: >-
          Spelling and grammar states and proofing settings draw nothing; Word's squiggles are screen-only
          (docx/local/misc-nothing).

  - id: drawing
    title: Drawing objects in text
    description: How DrawingML objects sit in the text flow; what they draw is the shared DrawingML renderer.
    features:
      - id: drawing.inline
        title: Inline objects
        elements: [w:drawing, wp:inline, wp:extent, wp:effectExtent, wp:docPr, wp:cNvGraphicFramePr]
        priority: P0
        difficulty: 3
        status: done
        strategy: An inline object is one box on the line, standing on the baseline, its effect extent added around it.
        office: >-
          Pictures, shapes, groups, canvases, charts and SmartArt are converted to PresentationML and drawn by the
          slide renderer with the document's theme and color mapping. An inline drawing's box (its extent with the
          effect extents) stands on the baseline as all ascent, from Word 2010 on with its extent's sides swapped where
          it is turned by 45 degrees up to 135 or 225 up to 315, turned about that box's middle (docx/local/ri-*: a
          100 x 60 pt rectangle at 45 to 120 and 250 degrees 60 pt wide and 100 pt high, at 0, 30 and 135 degrees not;
          LibreOffice's extras-ooxmlexport/tdf103001 29.5 → 96.4 %; Word 2007's documents hold the turned bounds in
          their effect extents, extras-ooxmlimport/tdf143475_rotatedWord2007imageInline); the extra of multiple line spacing comes from the
          fonts (a 90 pt picture beside 12 pt Aptos at 1.16 lines makes the line 90 + 3.38 + 2.32 pt high, a picture
          alone 160.5 + 2.32 pt; docx/generated/drawings); a picture alone smaller than its paragraph mark's line
          takes that line's whole height (docx/local/smallpic-single, -115); before Word 2013 a line of drawings without
          the paragraph mark is as high as they are, without spacing's extra, one a line break ends with the break's
          font as text has (docx/local/dl-a14 to dl-d14: a 470 by 2 pt rectangle too wide for the line between 36 pt
          words makes a line 2 pt high; one of 40 by 20 pt between line breaks a line of the 36 pt font; in mode 15
          the mark's line; LibreOffice's extras-ooxmlexport/128197_compat14 53.4 → 98.4 %). In modes 11 and 12 (and without a mode)
          Word draws a shape's or a group's extent its effect extent's left and top once more in, the line keeping its
          room, pictures not (docx/local/effx-*: 9 pt left put a shape 18 pt in, from mode 14 on 9 pt; pe-*). A group
          holding a text box that does not wrap (wrap none, as WordArt's) gets its effect extents anew, whatever the
          document says: none left and above, on the right and below its widest outline and 0.05 pt, at least
          0.49 pt (docx/local/ge-*, gh-*; Tdf147485: 9 pt stored on both sides, drawn at its line's start); with text
          boxes that wrap the stored extents hold (tdf149546). Before Word 2013 the paragraph mark after a field's
          result wider than its line (a complex or simple field's, a hyperlink's, an OLE object, which is an EMBED
          field) goes to a line of its own, after a drawing alone it stands past the line's end (docx/local/owf-11,
          owf-12, owf-14: a rectangle 456.3 pt wide in a 451.3 pt column; owf-15 and wio-*: the mark beside it; Apache
          POI's WordWithAttachments: an OLE object 468 pt wide in a 467.75 pt column, not one 467.75 pt wide, 82.4 →
          90.9 %).

      - id: drawing.anchor
        title: Floating objects and their position
        elements: [wp:anchor, wp:simplePos, wp:positionH, wp:positionV, wp:posOffset, wp:align, wp14:pctPosHOffset,
                   wp14:pctPosVOffset, wp14:sizeRelH, wp14:sizeRelV, wp14:pctWidth, wp14:pctHeight]
        priority: P0
        difficulty: 4
        status: done
        strategy: >-
          Positioned relative to page, margin, column, paragraph, line or character, by offset or alignment, sized
          relative to the page or margins; behind or in front of text, stacked by relativeHeight, kept inside table
          cells with layoutInCell. Each anchor keeps one frame of what it stands from: its paragraph's part in the
          column or page, its line's top before floating objects pushed the line down, its place across.
        office: >-
          Floating drawings stand at their offset from, or aligned in, the frame wp:positionH and wp:positionV name,
          at a percentage of it, or at wp:simplePos (before Word 2013 one aligned left or right on the page stands in
          the margin beside the text, its right edge at the left margin or its left edge at the right margin, as far as
          the page lets it, whatever its effect extent: docx/local/pgr-14, pgr2-12-*, pgr2-14-*, rectangles of 30 to
          100 pt and right margins of 70.85 and 36 pt; on the page from Word 2013 on, pgr-15, pgr2-15-*;
          extras-ooxmlexport/tdf113183 81.3 → 99.9 %; a footer's drawing placed from the bottom margin counts it from
          the footer's top where the footer reaches above the margin: docx/local/fbq-6-none, a rule 20 pt below the
          top of a footer of six lines over a margin of 56.7 pt, fbq-1-none 20 pt below the margin's top under one
          line; such a drawing that text goes around pushes the footer's own lines where the footer then reaches above
          the margin, from the footer's top: extras-layout/tdf164905, the footer's text below a rule wrapped square
          across its width 20.25 pt down, the footer 64.8 pt high, 83.3 → 96.1 %; known deviation: Word wraps three
          lines beside fbq-6-square's rule, two here, and one beside fbq-1-square's rule below the margin's top, none
          here); behind or in front of the text by behindDoc and relativeHeight
          (docx/generated/drawings), taken through the part in document order: a relativeHeight of 0 or 1, or of
          0x1E000000 and more, counts as unset and stands above every drawing before it, at 0x0F000000 at least, equal
          ones the later on top (docx/local/zo-a to zo-g, modes 12 and 15: 0x05000000, 0, 0x06000000 put the unset one
          on top, 0x10000000, 0, 0x0F000005 the unset one above 0x10000000, 0 above 0x0EFFFFFF, 0x1E000000 below
          0x1DFFFFFE; LibreOffice's extras-ooxmlexport/tdf159158_zOrder_*), also in parts with VML shapes, which keep
          their z-index; but where one of them has 0, or two shapes of the part stand at the same height, all VML
          shapes stand above all DrawingML drawings, by their z-index among themselves (rule found by agent BB, fitting
          all of zo-a to zo-x: z-index 5 under 0x0F000000 alone, over it beside another of 5 or after an unset height;
          z-index 0 over it, zo-r, zo-s; extras-ooxmlexport/tdf159158_zOrder_zIndexWins 86.4 → 97.8 %). The paragraph's top lies above its own space before (below the space
          after the paragraph before), the line's is that of the line holding the anchor (docx/local/anchor-rules,
          within 0.05 pt); an anchor in a part of the paragraph in a later column or page counts from that part and
          its column (extras-layout/shape-anchored-in-follow: a rectangle anchored at the end of a paragraph that goes
          on in the next page's second column stands there; extras-ooxmlexport/tdf153613_anchoredAfterPgBreak6), and
          one anchored after a page or column break of its paragraph takes no room beside the paragraph's first lines
          (tdf153613_anchoredAfterPgBreak6: a picture wrapped square after "x" and a page break, "x" at the first
          page's top, 85.3 → 100 %), nor does one whose line goes on in another column or page
          (shape-anchored-in-follow: the first column's lines go straight on past the rectangle's 81 pt below the
          paragraph's top, 88.9 → 98.7 %);
          relative to the character counts from the start of the character before the anchor (docx/local/anchor- char,
          within 0.01 pt). In table cells the column and margin across are the cell's text area, the page and its
          margins the cell inside its line, down the page and margins the cell's content, whether layoutInCell is set
          or not (docx/local/cell-anchor). Sizes relative to the page or its margins (wp14:sizeRelH, wp14:sizeRelV)
          apply to shapes as they are and to pictures only both together, scaled evenly to fit
          (docx/local/size-rel-shape, size-rel), each less the effect extents across it (docx/local/relsz-*: 40 % of a
          451.3 pt margin with 1.8 pt of effect extent on the right is 178.7 pt wide, with 1 pt all round 178.5; a
          picture fits into what is left), groups and canvases too, which draw their content as much larger as their
          own extent (a:xfrm a:ext) is than the anchor's (docx/local/gr-*: 50 % of the page with 1.2 pt of effect
          extent right and below 296.45 × 251.35 pt, centered as their share, in modes 14 and 15; LibreOffice's
          extras-ooxmlimport/groupshape-relsize: an own extent of 730.1 pt over 719.9 drawn 765.4 pt high;
          extras-layout/tdf69648, core-ooxml-pass/fdo69616 87.6 → 100 %). Inside is the left or the top of the area on odd pages and the right or the
          bottom on even ones, outside the other side, whichever margin the area is (docx/local/vio-*: relative to the
          top and the bottom margin, the margin and the page; libreoffice/core-objectpositioning/inside-outside-vert-
          align 4.6 → 100 %; known deviation: relative to the page Word keeps 18 pt from the page's edge, ours none).
          Before Word 2013 an alignment in the column counts from the paragraph's indents, centering not, and a drawing
          so aligned and placed down by an offset stands its effect extent lower (by agent AG: LibreOffice's
          extras-ooxmlexport/tdf160049_anchorMargin14, mode 14: left aligned at a left indent of 1701 twips, right
          aligned at a right indent of 1134, each 1.5 pt lower, offsets across not; tdf160049_anchorMargin2,
          tdf160077_layoutInCell). Alignment places the drawing with its effect extent (wp:effectExtent), with or without an effect to fill it,
          each side where its alignment meets it, across the page and the margins (docx/local/sa-d1, sa-d2, sb-*,
          sc-*: 80 pt left and 36 pt above take a shape centered at the page's top 40 pt right and 36 pt down),
          relatively sized ones too (relsz-3, -4, -5, -7); an offset places the extent, but the effect extent in a
          direction the drawing is sized relative to the page or margins (relsz-2, -6, -9 to -11;
          powertools/WC/WC065-Textbox, DB-GlossaryDocuments/FooterContent-built). A simple position (wp:simplePos) may
          be a universal measure (docx/external/libreoffice/extras-ooxmlexport/tdf166201_simplePosCM: 10cm 5cm, 8.1 →
          100 %). From Word 2013 on a drawing that text goes around, placed from its paragraph or line, stays between
          the margins with its effect extents, behind the text too: above the top margin it begins there, past the
          bottom margin it ends there, the top margin winning; before, and unwrapped, it stands where it is placed
          (docx/local/wrm-15, wrm-behind, wrm-14, wrm-none, wrm-mid: 20 pt above the first paragraph;
