          Word drawings reach the renderer shared with PowerPoint as their PresentationML counterparts (wps:wsp as
          p:sp, pic:pic as p:pic, wpg as p:grpSp, charts and diagrams as p:graphicFrame) with the document's theme and
          w:clrSchemeMapping; drawn as pptx smartart.data (done). Verified against Word with docx/generated/smartart
          (95.1 %, seven layout families with text).

      - id: smartart.layout
        title: SmartArt layout engine
        elements: [dgm:layoutDef, dgm:layoutNode, dgm:alg, dgm:param, dgm:shape, dgm:adjLst, dgm:adj, dgm:presOf,
                   dgm:constrLst, dgm:constr, dgm:ruleLst, dgm:rule, dgm:varLst, dgm:forEach, dgm:choose, dgm:if,
                   dgm:else, dgm:sampData, dgm:styleData, dgm:clrData, dgm:catLst, dgm:cat, dgm:title, dgm:desc]
        priority: P3
        difficulty: 5
        status: done
        strategy: Shared DrawingML renderer, as pptx `smartart.layout` (done).
        office: >-
          Word drawings reach the renderer shared with PowerPoint as their PresentationML counterparts (wps:wsp as
          p:sp, pic:pic as p:pic, wpg as p:grpSp, charts and diagrams as p:graphicFrame) with the document's theme and
