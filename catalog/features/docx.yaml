                   w:saveFormsData]
        priority: P2
        difficulty: 3
        status: done
        strategy: Text fields show their result, check boxes a box in their size (checked or not), drop-downs the selected entry.
        office: >-
          Text inputs show their result, drop-downs their chosen entry (w:result, else w:default). A check box is a
          character of the run's font at its size (w:size, else the font size): its advance the font's line height, a
          square 2.28 pt smaller, 1.08 pt in from its left and above its bottom, in 0.48 pt lines, crossed when
          checked (docx/local/form-boxes: Arial 8 to 36 pt, fixed sizes; docx/generated/form-fields 94.1 %).

